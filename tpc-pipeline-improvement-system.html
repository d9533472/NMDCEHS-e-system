<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPC 海管工程 改善單管理系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   ECO-TECH THEME  ·  TPC 海管工程 改善單管理系統
   深海環保科技視覺 / 視差捲動 / 玻璃擬態 / 類型分色
   ══════════════════════════════════════════════════════════════ */
:root {
  /* ── 底層 ── */
  --bg-primary: #050d16;
  --bg-secondary: #0a1622;
  --bg-deep: #030810;
  --bg-card: rgba(13, 29, 43, 0.72);
  --bg-card-solid: #0d1d2b;
  --bg-card-hover: rgba(20, 44, 62, 0.85);
  --bg-input: rgba(6, 20, 32, 0.85);
  --border: rgba(94, 174, 200, 0.18);
  --border-strong: rgba(94, 174, 200, 0.35);
  --border-focus: #22d3ee;

  /* ── 文字 ── */
  --text-primary: #e4f4f6;
  --text-secondary: #9fc3d2;
  --text-muted: #6b93a8;

  /* ── 主色 ── */
  --accent-blue: #22d3ee;
  --accent-blue-dim: rgba(34, 211, 238, 0.12);
  --accent-orange: #fbbf24;
  --accent-orange-dim: rgba(251, 191, 36, 0.12);
  --accent-red: #fb7185;
  --accent-red-dim: rgba(251, 113, 133, 0.12);
  --accent-green: #34d399;
  --accent-green-dim: rgba(52, 211, 153, 0.12);
  --accent-cyan: #22d3ee;
  --accent-teal: #2dd4bf;
  --accent-purple: #a78bfa;

  /* ── 單別分色（WM / NCR / PN）── */
  --wm-color: #22d3ee;      /* 青 — 環保稽查單 */
  --wm-glow: rgba(34, 211, 238, 0.55);
  --ncr-color: #fbbf24;     /* 琥珀 — 不符合事項 */
  --ncr-glow: rgba(251, 191, 36, 0.55);
  --pn-color: #fb7185;      /* 玫瑰 — 罰單 */
  --pn-glow: rgba(251, 113, 133, 0.55);

  --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  --shadow-glow: 0 0 0 1px var(--border-strong), 0 12px 40px rgba(0, 0, 0, 0.5);
  --radius: 14px;
  --radius-sm: 9px;
  --ease: cubic-bezier(.16,.84,.44,1);
}

* { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior:smooth; }

body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family:'Noto Sans TC', sans-serif;
  font-size:14px; min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

::-webkit-scrollbar { width:9px; height:9px; }
::-webkit-scrollbar-track { background:var(--bg-deep); }
::-webkit-scrollbar-thumb {
  background:linear-gradient(180deg, #22d3ee, #34d399);
  border-radius:99px; border:2px solid var(--bg-deep);
}
::selection { background:rgba(34,211,238,.3); color:#fff; }

/* ══════════ 視差背景層 ══════════ */
.fx-bg { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% 0%, #0a2030 0%, #050d16 45%, #030810 100%);
}
/* 科技網格 — 隨捲動做視差位移 */
.fx-grid {
  position:absolute; inset:-20% -10%;
  background-image:
    linear-gradient(rgba(34,211,238,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,211,238,.055) 1px, transparent 1px);
  background-size:56px 56px;
  transform: translate3d(0, calc(var(--sy, 0) * -0.12px), 0);
  mask-image: radial-gradient(80% 60% at 50% 30%, #000 30%, transparent 100%);
  -webkit-mask-image: radial-gradient(80% 60% at 50% 30%, #000 30%, transparent 100%);
}
/* 極光團塊 — 不同速度製造深度差 */
.fx-blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:.5; will-change:transform; }
.fx-blob.b1 {
  width:620px; height:620px; top:-160px; left:-120px;
  background:radial-gradient(circle, rgba(16,185,129,.55), transparent 68%);
  transform: translate3d(0, calc(var(--sy,0) * 0.16px), 0);
  animation: drift1 22s ease-in-out infinite;
}
.fx-blob.b2 {
  width:560px; height:560px; top:180px; right:-140px;
  background:radial-gradient(circle, rgba(34,211,238,.5), transparent 68%);
  transform: translate3d(0, calc(var(--sy,0) * 0.28px), 0);
  animation: drift2 26s ease-in-out infinite;
}
.fx-blob.b3 {
  width:520px; height:520px; bottom:-180px; left:35%;
  background:radial-gradient(circle, rgba(59,130,246,.4), transparent 70%);
  transform: translate3d(0, calc(var(--sy,0) * -0.1px), 0);
  animation: drift3 30s ease-in-out infinite;
}
@keyframes drift1 { 0%,100%{margin:0 0} 50%{margin:60px 40px} }
@keyframes drift2 { 0%,100%{margin:0 0} 50%{margin:-70px -50px} }
@keyframes drift3 { 0%,100%{margin:0 0} 50%{margin:40px -60px} }
/* 掃描線 */
.fx-scan {
  position:absolute; inset:0; opacity:.35;
  background:repeating-linear-gradient(180deg, transparent 0 3px, rgba(0,0,0,.22) 3px 4px);
}

/* ══════════ LAYOUT ══════════ */
.app-shell { position:relative; z-index:1; display:flex; flex-direction:column; min-height:100vh; }

.topbar {
  background:linear-gradient(135deg, rgba(6,20,32,.92), rgba(10,32,48,.86));
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid var(--border);
  padding:0 24px; display:flex; align-items:center; gap:16px;
  position:sticky; top:0; z-index:100; min-height:64px;
}
/* 頂部流動光條 */
.topbar::after {
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg, transparent, #22d3ee, #34d399, #22d3ee, transparent);
  background-size:200% 100%;
  animation: flowline 6s linear infinite;
}
@keyframes flowline { to { background-position:200% 0; } }

.topbar-icon {
  width:40px; height:40px; border-radius:12px;
  background:linear-gradient(135deg, #34d399, #22d3ee 55%, #3b82f6);
  display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;
  box-shadow:0 0 24px rgba(34,211,238,.5), inset 0 0 12px rgba(255,255,255,.25);
  animation: breathe 4s ease-in-out infinite;
}
@keyframes breathe {
  0%,100% { box-shadow:0 0 20px rgba(34,211,238,.4), inset 0 0 12px rgba(255,255,255,.2); }
  50%     { box-shadow:0 0 34px rgba(52,211,153,.65), inset 0 0 16px rgba(255,255,255,.35); }
}
.topbar-title {
  font-size:15px; font-weight:900; line-height:1.3; letter-spacing:.3px;
  background:linear-gradient(90deg, #e4f4f6, #7dd3fc, #6ee7b7, #e4f4f6);
  background-size:200% 100%;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  animation: shimmer 7s linear infinite;
}
@keyframes shimmer { to { background-position:200% 0; } }
.topbar-sub { font-size:10px; color:#5eead4; font-family:'JetBrains Mono',monospace; letter-spacing:1.2px; text-transform:uppercase; opacity:.75; }
.topbar-divider { width:1px; height:34px; background:linear-gradient(180deg, transparent, var(--border-strong), transparent); flex-shrink:0; }
.topbar-project { flex:1; min-width:0; }
.topbar-project-name { font-size:12px; color:#7dd3fc; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar-project-client { font-size:11px; color:var(--text-muted); }

.sync-status {
  display:flex; align-items:center; gap:8px; margin-left:auto; flex-shrink:0;
  background:rgba(6,20,32,.6); border:1px solid var(--border);
  padding:6px 12px; border-radius:99px;
}
.sync-dot { width:8px; height:8px; border-radius:50%; background:var(--text-muted); flex-shrink:0; }
.sync-dot.ok { background:var(--accent-green); box-shadow:0 0 10px var(--accent-green); animation:pulse 2s infinite; }
.sync-dot.busy { background:var(--accent-orange); box-shadow:0 0 10px var(--accent-orange); animation:blink .5s infinite; }
.sync-dot.error { background:var(--accent-red); box-shadow:0 0 10px var(--accent-red); }
.sync-text { font-size:11px; color:var(--text-secondary); font-family:'JetBrains Mono',monospace; white-space:nowrap; }
@keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.45; transform:scale(.82)} }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ══════════ NAV ══════════ */
.nav {
  display:flex; gap:6px; padding:10px 24px;
  background:rgba(5,13,22,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border); overflow-x:auto;
  position:sticky; top:64px; z-index:99;
}
.nav-btn {
  padding:10px 20px; font-size:13px; font-weight:700; cursor:pointer;
  border:1px solid transparent; background:transparent; color:var(--text-muted);
  border-radius:99px; transition:all .3s var(--ease); white-space:nowrap;
  display:flex; align-items:center; gap:7px; position:relative; overflow:hidden;
}
.nav-btn::before {
  content:''; position:absolute; inset:0; border-radius:99px;
  background:linear-gradient(135deg, rgba(34,211,238,.16), rgba(52,211,153,.1));
  opacity:0; transition:opacity .3s;
}
.nav-btn:hover { color:var(--text-primary); border-color:var(--border); transform:translateY(-1px); }
.nav-btn:hover::before { opacity:1; }
.nav-btn.active {
  color:#052e2b; border-color:transparent;
  background:linear-gradient(135deg, #22d3ee, #34d399);
  box-shadow:0 4px 20px rgba(34,211,238,.4);
}
.nav-btn.active::before { opacity:0; }
.nav-btn > * { position:relative; z-index:1; }
.nav-badge {
  background:linear-gradient(135deg, #fb7185, #f43f5e); color:#fff;
  font-size:10px; font-weight:800; border-radius:99px; padding:1px 7px; min-width:18px; text-align:center;
  box-shadow:0 0 12px rgba(251,113,133,.6);
}

.content { flex:1; padding:28px 24px 60px; max-width:1600px; margin:0 auto; width:100%; }

/* ══════════ 分頁轉場 ══════════ */
.tab-pane { animation: tabIn .55s var(--ease) both; }
@keyframes tabIn {
  from { opacity:0; transform:translateY(24px) scale(.985); filter:blur(6px); }
  to   { opacity:1; transform:none; filter:blur(0); }
}

/* ══════════ 捲動揭示 ══════════ */
.reveal { opacity:0; transform:translateY(38px); transition:opacity .8s var(--ease), transform .8s var(--ease); will-change:opacity, transform; }
.reveal.in { opacity:1; transform:none; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity:1 !important; transform:none !important; }
  .fx-blob, .topbar-icon, .topbar-title, .topbar::after { animation:none !important; }
}

/* ══════════ SETUP OVERLAY ══════════ */
.setup-overlay {
  position:fixed; inset:0; z-index:500;
  background:radial-gradient(120% 90% at 50% 0%, #0a2030, #030810);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.setup-card {
  background:var(--bg-card); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border-strong); border-radius:20px;
  padding:40px; width:100%; max-width:560px;
  box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 60px rgba(34,211,238,.12);
}
.setup-logo { font-size:52px; text-align:center; margin-bottom:16px; filter:drop-shadow(0 0 20px rgba(34,211,238,.6)); }
.setup-title { font-size:21px; font-weight:900; text-align:center; color:var(--text-primary); margin-bottom:6px; }
.setup-sub { font-size:13px; color:var(--text-muted); text-align:center; margin-bottom:32px; }
.setup-label { font-size:11px; color:var(--accent-cyan); text-transform:uppercase; letter-spacing:1px; font-weight:800; margin-bottom:8px; }
.setup-input {
  width:100%; background:var(--bg-input); border:1px solid var(--border);
  color:var(--text-primary); border-radius:var(--radius-sm); padding:12px 14px;
  font-size:13px; font-family:'JetBrains Mono',monospace; margin-bottom:16px; transition:all .25s;
}
.setup-input:focus { outline:none; border-color:var(--border-focus); box-shadow:0 0 0 3px rgba(34,211,238,.15); }
.setup-steps { background:rgba(6,20,32,.6); border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px; font-size:12px; color:var(--text-secondary); line-height:1.9; margin-bottom:24px; }
.setup-steps ol { padding-left:18px; }
.setup-steps li { margin-bottom:2px; }
.setup-steps code { background:rgba(34,211,238,.1); padding:1px 6px; border-radius:4px; font-size:11px; color:var(--accent-cyan); font-family:'JetBrains Mono',monospace; }

/* ══════════ GLOBAL LOADING ══════════ */
.g-loading {
  position:fixed; inset:0; background:rgba(3,8,16,.82); z-index:400;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.g-loading-spinner {
  width:52px; height:52px; border:3px solid rgba(34,211,238,.15);
  border-top-color:var(--accent-cyan); border-right-color:var(--accent-green);
  border-radius:50%; animation:spin .9s cubic-bezier(.6,.1,.4,.9) infinite;
  box-shadow:0 0 30px rgba(34,211,238,.35);
}
@keyframes spin { to { transform:rotate(360deg); } }
.g-loading-text { font-size:14px; color:var(--text-secondary); letter-spacing:.5px; }

/* ══════════ 玻璃卡片通用 ══════════ */
.kpi-card, .chart-card, .item-card, .filter-bar, .table-wrap, .settings-section {
  background:var(--bg-card);
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  border:1px solid var(--border);
}

/* ══════════ KPI ══════════ */
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:24px; }
.kpi-card {
  border-radius:var(--radius); padding:22px 20px; position:relative; overflow:hidden;
  transition:transform .4s var(--ease), box-shadow .4s var(--ease), border-color .4s var(--ease);
}
/* 掠過的光澤 */
.kpi-card::after {
  content:''; position:absolute; top:0; left:-120%; width:80%; height:100%;
  background:linear-gradient(105deg, transparent, rgba(255,255,255,.09), transparent);
  transition:left .8s var(--ease); pointer-events:none;
}
.kpi-card:hover::after { left:130%; }
.kpi-card:hover {
  transform:translateY(-6px) scale(1.015);
  border-color:var(--border-strong);
  box-shadow:0 18px 46px rgba(0,0,0,.5), 0 0 26px rgba(34,211,238,.16);
}
.kpi-stripe { position:absolute; top:0; left:0; right:0; height:3px; border-radius:0; box-shadow:0 0 14px currentColor; }
.kpi-label { font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; font-weight:700; display:flex; align-items:center; gap:6px; }
.kpi-value {
  font-family:'Orbitron','JetBrains Mono',monospace; font-size:38px; font-weight:800; line-height:1;
  letter-spacing:-1px; text-shadow:0 0 26px currentColor;
}
.kpi-sub { font-size:12px; color:var(--text-secondary); margin-top:8px; }

/* ══════════ 環保圖示 ══════════ */
.eco-ico { width:20px; height:20px; flex-shrink:0; display:inline-block; vertical-align:-4px; }
.eco-ico-lg { width:26px; height:26px; }
.ico-chip {
  width:38px; height:38px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center;
  flex-shrink:0; position:relative;
  background:linear-gradient(135deg, rgba(34,211,238,.16), rgba(52,211,153,.08));
  border:1px solid var(--border-strong);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}
.ico-chip::before {
  content:''; position:absolute; inset:-1px; border-radius:12px; padding:1px;
  background:linear-gradient(135deg, currentColor, transparent 60%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; opacity:.55;
}

/* ══════════ CHARTS ══════════ */
.chart-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
@media(max-width:900px){.chart-grid{grid-template-columns:1fr;} .dash-two-col{grid-template-columns:1fr !important;}}
.chart-card { border-radius:var(--radius); padding:22px; transition:border-color .4s, box-shadow .4s; }
.chart-card:hover { border-color:var(--border-strong); box-shadow:0 14px 40px rgba(0,0,0,.4); }
.chart-title {
  font-size:12px; font-weight:800; color:var(--accent-cyan); text-transform:uppercase;
  letter-spacing:1.2px; margin-bottom:18px; display:flex; align-items:center; gap:8px;
}
.chart-title::after { content:''; flex:1; height:1px; background:linear-gradient(90deg, var(--border-strong), transparent); }
.chart-wrap { position:relative; height:220px; }

/* ══════════ ITEM DASH ══════════ */
.item-dash { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:24px; }
.item-card {
  border-radius:12px; padding:16px; position:relative; overflow:hidden;
  transition:transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s;
}
.item-card:hover { transform:translateY(-4px); box-shadow:0 14px 34px rgba(0,0,0,.45); border-color:var(--border-strong); }
.item-card-bar { position:absolute; top:0; left:0; right:0; height:3px; box-shadow:0 0 12px currentColor; }
.item-card-id {
  font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:800; padding:2px 8px; border-radius:99px;
  background:rgba(34,211,238,.14); color:var(--accent-cyan); display:inline-block; margin-bottom:6px;
  border:1px solid rgba(34,211,238,.28);
}
.item-card-name { font-size:12px; font-weight:700; color:var(--text-primary); margin-bottom:12px; }
.item-card-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.item-stat { text-align:center; }
.item-stat-val { font-family:'Orbitron','JetBrains Mono',monospace; font-size:20px; font-weight:800; line-height:1; }
.item-stat-label { font-size:10px; color:var(--text-muted); margin-top:3px; }
.item-close-bar { margin-top:10px; background:rgba(255,255,255,.07); border-radius:99px; height:6px; overflow:hidden; }
.item-close-fill { height:100%; border-radius:99px; transition:width 1.1s var(--ease); box-shadow:0 0 10px currentColor; }

/* ══════════ FILTER BAR ══════════ */
.filter-bar { border-radius:var(--radius); padding:16px 20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:20px; }
.filter-group { display:flex; align-items:center; gap:8px; }
.filter-label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; white-space:nowrap; }
.filter-bar select, .filter-bar input[type=text] {
  background:var(--bg-input); border:1px solid var(--border); color:var(--text-primary);
  border-radius:var(--radius-sm); padding:7px 11px; font-size:12px; font-family:inherit; min-width:100px;
  transition:all .25s;
}
.filter-bar select:focus, .filter-bar input:focus { outline:none; border-color:var(--border-focus); box-shadow:0 0 0 3px rgba(34,211,238,.15); }
.filter-bar select option { background:#0d1d2b; color:#e4f4f6; }
.filter-spacer { flex:1; }

/* ══════════ BUTTONS ══════════ */
.btn {
  display:inline-flex; align-items:center; gap:7px; padding:9px 18px; border-radius:99px;
  font-size:12px; font-weight:800; font-family:inherit; cursor:pointer; border:1px solid transparent;
  transition:all .3s var(--ease); position:relative; overflow:hidden;
}
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn-primary {
  background:linear-gradient(135deg, #22d3ee, #34d399); color:#04262a;
  box-shadow:0 4px 18px rgba(34,211,238,.32);
}
.btn-primary:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 8px 26px rgba(34,211,238,.5); filter:brightness(1.08); }
.btn-secondary { background:rgba(255,255,255,.05); border-color:var(--border); color:var(--text-secondary); }
.btn-secondary:hover:not(:disabled) { border-color:var(--accent-cyan); color:var(--accent-cyan); background:rgba(34,211,238,.1); transform:translateY(-2px); }
.btn-danger { background:var(--accent-red-dim); border-color:rgba(251,113,133,.35); color:var(--accent-red); }
.btn-danger:hover:not(:disabled) { background:var(--accent-red); color:#2a0710; box-shadow:0 6px 22px rgba(251,113,133,.45); transform:translateY(-2px); }

// ─── XHR 工具（避免 mobile Safari fetch redirect 問題）──────────
function xhrGet(url) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 20000;
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) {
        try { res(JSON.parse(x.responseText)); }
        catch(e) { rej(new Error('JSON 解析失敗')); }
      } else { rej(new Error('HTTP ' + x.status)); }
    };
    x.onerror = () => rej(new Error('網路錯誤'));
    x.ontimeout = () => rej(new Error('請求逾時'));
    x.send();
  });
}
function xhrPost(url, data) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('POST', url, true);
    x.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
    x.timeout = 30000;
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) {
        try { res(JSON.parse(x.responseText)); }
        catch(e) { rej(new Error('JSON 解析失敗')); }
      } else { rej(new Error('HTTP ' + x.status)); }
    };
    x.onerror = () => rej(new Error('網路錯誤'));
    x.ontimeout = () => rej(new Error('請求逾時（30s）'));
    x.send(JSON.stringify(data));
  });
}

function getNextNum(records, type) {
  const prefix = { WM:'WM', NCR:'NCR', PN:'PN' }[type] || type;
  const nums = records.filter(r => r.type === type).map(r => {
    const m = String(r.number||'').match(/(\d+)$/);
    return m ? parseInt(m[1]) : 0;
  });
  const next = nums.length ? Math.max(...nums) + 1 : 1;
  return `${prefix}-${String(next).padStart(3,'0')}`;
}

/* 捲動視差：把 window.scrollY 寫進 CSS 變數 --sy，背景層據此位移 */
function useScrollFx() {
  useEffect(() => {
    let raf = 0;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        document.documentElement.style.setProperty('--sy', String(window.scrollY));
        raf = 0;
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => { window.removeEventListener('scroll', onScroll); if (raf) cancelAnimationFrame(raf); };
  }, []);
}

/* 捲動揭示：對容器內的區塊逐一加上淡入上升，錯開時間差 */
function useReveal(containerRef, deps) {
  useEffect(() => {
    const root = containerRef.current;
    if (!root || !('IntersectionObserver' in window)) return;
    // 往下鑽到第一個有多個子區塊的節點
    let host = root;
    let guard = 0;
    while (host.children.length === 1 && host.firstElementChild.children.length > 1 && guard++ < 4) {
      host = host.firstElementChild;
    }
    const kids = Array.from(host.children);
    if (!kids.length) return;
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.04, rootMargin: '0px 0px -30px 0px' });
    kids.forEach((k, i) => {
      if (k.dataset.rv) return;          // 已處理過的區塊不再重播，避免資料更新時整頁閃動
      k.dataset.rv = '1';
      k.classList.add('reveal');
      k.style.transitionDelay = Math.min(i * 75, 450) + 'ms';
      io.observe(k);
    });
    return () => io.disconnect();
  }, deps);
}

/* 數字滾動動畫：支援 12 / "85%" / "NT$1,234" 這幾種寫法 */
function AnimNum({ value, style, className }) {
  const parsed = (() => {
    if (typeof value === 'number' && isFinite(value)) return { pre:'', num:value, post:'', dec:0 };
    const m = String(value).match(/^([^\d-]*)(-?[\d,]*\.?\d+)(.*)$/);
    if (!m) return null;
    const raw = m[2].replace(/,/g, '');
    const n = parseFloat(raw);
    if (!isFinite(n)) return null;
    const dot = raw.indexOf('.');
    return { pre:m[1], num:n, post:m[3], dec: dot < 0 ? 0 : raw.length - dot - 1, grouped: m[2].indexOf(',') >= 0 };
  })();

  const [shown, setShown] = useState(parsed ? 0 : null);

  useEffect(() => {
    if (!parsed) return;
    const target = parsed.num;
    const dur = 850;
    let raf = 0, t0 = null;
    const tick = t => {
      if (t0 === null) t0 = t;
      const p = Math.min((t - t0) / dur, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      setShown(target * eased);
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [parsed && parsed.num]);

  if (!parsed) return <span className={className} style={style}>{value}</span>;
  const v = parsed.dec > 0 ? Number(shown).toFixed(parsed.dec) : String(Math.round(shown));
  const out = parsed.grouped ? Number(v).toLocaleString() : v;
  return <span className={className} style={style}>{parsed.pre}{out}{parsed.post}</span>;
}

// ─── DRIVE SECTION ────────────────────────────────────────────
function DriveSection({ form, setForm, gasUrl }) {
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);
  const folderName = `${form.date || '日期'} ${form.number || '編號'}`;

  const getOrCreate = async () => {
    if (!gasUrl) { alert('未設定 GAS 網址'); return null; }
    setBusy(true);
    try {
      const res = await xhrPost(gasUrl, {
        action: 'getFolderUrl',
        type: form.type,
        date: form.date,
        number: form.number,
      });
      if (!res.ok) throw new Error(res.error || '無法取得資料夾');
      setForm(f => ({ ...f, driveFolderUrl: res.url, driveFolderId: res.folderId }));
      return res;
    } catch(e) { alert('Drive 錯誤：' + e.message); return null; }
    finally { setBusy(false); }
  };

  const openFolder = async () => {
    if (form.driveFolderUrl) { window.open(form.driveFolderUrl, '_blank'); return; }
    // 先開空視窗（必須在 async await 之前，否則 iOS 會擋 popup）
    const win = window.open('', '_blank');
    const res = await getOrCreate();
    if (res && win) { win.location.href = res.url; }
    else if (win) { win.close(); }
  };

  const handleFileSelect = async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    setBusy(true);
    try {
      let folderId = form.driveFolderId;
      if (!folderId) {
        const res = await getOrCreate();
        if (!res) return;
        folderId = res.folderId;
      }
      for (const file of files) {
        const dataUrl = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.onerror = rej;
          r.readAsDataURL(file);
        });
        const up = await xhrPost(gasUrl, { action:'uploadFile', folderId, fileName: file.name, dataUrl });
        if (!up.ok) throw new Error(up.error || '上傳失敗：' + file.name);
      }
      alert(`✅ 已上傳 ${files.length} 個檔案至 Drive`);
    } catch(e) { alert('上傳失敗：' + e.message); }
    finally { setBusy(false); if(e.target) e.target.value = ''; }
  };

  return (
    <div className="form-group full">
      <label>Drive 附件資料夾</label>
      <div style={{background:'var(--bg-primary)',border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',padding:'12px 14px'}}>
        <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:10,display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontFamily:'JetBrains Mono,monospace'}}>📁 {folderName}</span>
          {form.driveFolderUrl
            ? <span style={{color:'var(--accent-green)',fontSize:11,fontWeight:700}}>● 已建立</span>
            : <span style={{color:'var(--text-muted)',fontSize:11}}>● 尚未建立</span>
          }
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button type="button" className="btn btn-secondary btn-sm" disabled={busy}
            onClick={async()=>{ const res = await getOrCreate(); if(res) alert(`✅ 資料夾已建立：${res.name}`); }}>
            {busy ? '⏳ 處理中...' : '📁 建立資料夾'}
          </button>
          <button type="button" className="btn btn-secondary btn-sm" disabled={busy}
            onClick={() => fileRef.current && fileRef.current.click()}>
            {busy ? '⏳ 處理中...' : '⬆️ 上傳檔案至資料夾'}
          </button>
          <button type="button" className="btn btn-secondary btn-sm" disabled={busy} onClick={openFolder}>
            📂 開啟資料夾
          </button>
        </div>
        <input ref={fileRef} type="file" multiple style={{display:'none'}} onChange={handleFileSelect} />
      </div>
    </div>
  );
}

          }}>

function DonutChart({ data, title }) {
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, {
      type:'doughnut',
      data:{ labels:data.map(d=>d.label), datasets:[{ data:data.map(d=>d.value), backgroundColor:data.map(d=>d.color), borderWidth:0, hoverOffset:4 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{ legend:{ position:window.innerWidth<=640?'bottom':'right', labels:{ color:'#9fc3d2', font:{size:11}, padding:8, boxWidth:10 } } } }
    });
    return () => chartRef.current && chartRef.current.destroy();
  }, [data]);
  return <div className="chart-card"><div className="chart-title">{title}</div><div className="chart-wrap"><canvas ref={ref}></canvas></div></div>;
}

// ─── PRESENTATION PIE CHART（簡報用缺失分類圓餅圖）────────────
function ItemPieChart({ records, itemOptions, onFilterClick }) {
  const ref = useRef(null);
  const chartRef = useRef(null);

  const COLORS = [
    '#3b82f6','#fbbf24','#10b981','#8b5cf6',
    '#fb7185','#22d3ee','#f97316','#ec4899',
  ];

  const itemMap = {};
  records.forEach(r => {
    const defs = (r.defects && r.defects.length>0) ? r.defects : [{item: r.item||1}];
    defs.forEach(d => {
      const k = String(d.item || 1);
      itemMap[k] = (itemMap[k] || 0) + 1;
    });
  });
  const total = records.reduce((s,r)=>s+((r.defects&&r.defects.length>0)?r.defects.length:1),0);
  const data = Object.entries(itemMap)
    .sort((a,b) => b[1] - a[1])
    .map(([k, v], i) => ({
      key: k,
      label: itemOptions[k] || `項目${k}`,
      value: v,
      pct: total ? Math.round(v / total * 100) : 0,
      color: COLORS[i % COLORS.length],
    }));

  useEffect(() => {
    if (!ref.current || data.length === 0) return;
    if (chartRef.current) chartRef.current.destroy();
    // 自訂 plugin：在每個 slice 上畫名稱 + 百分比
    const labelPlugin = {
      id: 'sliceLabels',
      afterDraw(chart) {
        const { ctx, data: cd } = chart;
        const ds = chart.getDatasetMeta(0);
        ds.data.forEach((arc, i) => {
          const pct = Math.round(cd.datasets[0].data[i] / total * 100);
          if (pct < 5) return; // 太小不顯示
          const { x, y, startAngle, endAngle, outerRadius, innerRadius } = arc.getProps(['x','y','startAngle','endAngle','outerRadius','innerRadius']);
          const mid = (startAngle + endAngle) / 2;
          const r = (outerRadius + (innerRadius || 0)) / 2 + outerRadius * 0.18;
          const lx = x + Math.cos(mid) * r;
          const ly = y + Math.sin(mid) * r;
          const label = cd.labels[i];
          const shortLabel = label.length > 6 ? label.slice(0,6) : label;
          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = 'rgba(0,0,0,0.4)';
          ctx.shadowBlur = 3;
          ctx.font = 'bold 11px Noto Sans TC, sans-serif';
          ctx.fillText(shortLabel, lx, ly - 7);
          ctx.font = 'bold 12px JetBrains Mono, monospace';
          ctx.fillText(pct + '%', lx, ly + 7);
          ctx.restore();
        });
      }
    };

    chartRef.current = new Chart(ref.current, {
      type: 'pie',
      plugins: [labelPlugin],
      data: {
        labels: data.map(d => d.label),
        datasets: [{
          data: data.map(d => d.value),
          backgroundColor: data.map(d => d.color),
          borderColor: 'rgba(5,13,22,0.85)',
          borderWidth: 3,
          hoverOffset: 10,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ` ${ctx.label}：${ctx.parsed} 件 (${Math.round(ctx.parsed/total*100)}%)`
            },
            backgroundColor: 'rgba(8,22,34,0.95)',
            titleColor: '#e4f4f6',
            bodyColor: '#9fc3d2',
            borderColor: 'rgba(94,174,200,0.28)',
            borderWidth: 1,
            padding: 10,
            titleFont: { size: 12, weight: 'bold' },
            bodyFont: { size: 11 },
          }
        },
        animation: { animateRotate: true, duration: 800 }
      }
    });
    return () => chartRef.current && chartRef.current.destroy();
  }, [records.length, JSON.stringify(itemOptions)]);

  if (data.length === 0) return null;

  return (
    <div style={{
      background:'linear-gradient(160deg, rgba(13,29,43,.78), rgba(8,20,31,.85))', backdropFilter:'blur(16px) saturate(150%)', WebkitBackdropFilter:'blur(16px) saturate(150%)', borderRadius:16, padding:'28px 32px',
      boxShadow:'0 4px 32px rgba(0,0,0,0.12)', marginBottom:24,
      border:'1px solid rgba(94,174,200,0.28)',
    }}>
      {/* 標題 */}
      <div style={{marginBottom:16}}>
        <div style={{fontSize:18,fontWeight:900,color:'#e4f4f6',letterSpacing:'-0.3px'}}>
          環境缺失分類統計
        </div>
      </div>

      {/* 圓餅圖置中 */}
      <div style={{display:'flex',justifyContent:'center',marginBottom:16}}>
        <div style={{width:300,height:300,position:'relative'}}>
          <canvas ref={ref}></canvas>
        </div>
      </div>

      {/* 圖例：兩欄 */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px 12px'}}>
        {data.map((d,i) => (
          <div key={d.key}
            onClick={() => onFilterClick && onFilterClick({item:d.key})}
            style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',padding:'4px 6px',borderRadius:6,border:'1px solid rgba(94,174,200,0.28)',background:'rgba(255,255,255,0.04)',transition:'all .15s'}}
            onMouseEnter={e=>{e.currentTarget.style.background='rgba(34,211,238,0.14)';e.currentTarget.style.borderColor=d.color;}}
            onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,255,255,0.04)';e.currentTarget.style.borderColor='rgba(94,174,200,0.28)';}}
          >
            <div style={{width:10,height:10,borderRadius:3,background:d.color,flexShrink:0}}></div>
            <div style={{flex:1,fontSize:13,fontWeight:700,color:'#e4f4f6',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.label}</div>
            <div style={{fontSize:10,color:d.color,fontWeight:600,whiteSpace:'nowrap'}}>{d.value}件</div>
            <div style={{fontSize:10,color:'#6b93a8',fontWeight:600,marginLeft:2,whiteSpace:'nowrap'}}>{d.pct}%</div>
          </div>
        ))}
      </div>


    </div>
  );
}

function DashboardTab({ records, itemOptions, onFilterClick, onExport }) {
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [quickPeriod, setQuickPeriod] = useState('all');

  // 快速週期計算
  const applyQuick = (period) => {
    const now = new Date();
    const fmt = d => d.toISOString().slice(0,10);
    setQuickPeriod(period);
    if (period === 'all') { setDateFrom(''); setDateTo(''); return; }
    if (period === 'thisweek') {
      const dw = now.getDay(); const diff = dw===0?-6:1-dw;
      const mon = new Date(now); mon.setDate(now.getDate()+diff);
      const sun = new Date(mon); sun.setDate(mon.getDate()+6);
      setDateFrom(fmt(mon)); setDateTo(fmt(sun)); return;
    }
    if (period === 'lastweek') {
      const dw = now.getDay(); const diff = dw===0?-6:1-dw;
      const mon = new Date(now); mon.setDate(now.getDate()+diff-7);
      const sun = new Date(mon); sun.setDate(mon.getDate()+6);
      setDateFrom(fmt(mon)); setDateTo(fmt(sun)); return;
    }
    if (period === 'thismonth') {
      setDateFrom(fmt(new Date(now.getFullYear(), now.getMonth(), 1)));
      setDateTo(fmt(new Date(now.getFullYear(), now.getMonth()+1, 0))); return;
    }
    if (period === 'lastmonth') {
      setDateFrom(fmt(new Date(now.getFullYear(), now.getMonth()-1, 1)));
      setDateTo(fmt(new Date(now.getFullYear(), now.getMonth(), 0))); return;
    }
    if (period === 'last30') {
      const d = new Date(now); d.setDate(now.getDate()-30);
      setDateFrom(fmt(d)); setDateTo(fmt(now)); return;
    }
    if (period === 'last90') {
      const d = new Date(now); d.setDate(now.getDate()-90);
      setDateFrom(fmt(d)); setDateTo(fmt(now)); return;
    }
  };

  // 篩選後的紀錄
  const filteredRecs = records.filter(r =>
    (!dateFrom || r.date >= dateFrom) &&
    (!dateTo   || r.date <= dateTo)
  );
  const useFiltered = dateFrom || dateTo;
  const activeRecs = useFiltered ? filteredRecs : records;

  const total = activeRecs.length;
  const open = activeRecs.filter(r=>r.status==='Open').length;
  const closed = activeRecs.filter(r=>r.status==='Closed').length;
  const totalDefects = activeRecs.reduce((s,r)=>s+((r.defects&&r.defects.length>0)?r.defects.length:1),0);
  const closeRate = totalDefects ? Math.round(activeRecs.filter(r=>r.status==='Closed').reduce((s,r)=>s+((r.defects&&r.defects.length>0)?r.defects.length:1),0)/totalDefects*100) : 0;
  const pnTotal = activeRecs.filter(r=>r.type==='PN').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  const todayStr = today();
  const in3days = new Date(); in3days.setDate(in3days.getDate()+3);
  const in3Str = in3days.toISOString().slice(0,10);
  const in7days = new Date(); in7days.setDate(in7days.getDate()+7);
  const in7Str = in7days.toISOString().slice(0,10);
  // 本週：週一～週日（用本地時間避免 UTC+8 時差問題）
  const nowD = new Date();
  const localFmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const dow = nowD.getDay(); // 0=日,1=一...6=六
  const diffMon = dow === 0 ? -6 : 1 - dow;
  const weekMon = new Date(nowD); weekMon.setDate(nowD.getDate() + diffMon);
  const weekSun = new Date(weekMon); weekSun.setDate(weekMon.getDate() + 6);
  const weekMonStr = localFmt(weekMon);
  const weekSunStr = localFmt(weekSun);
  const thisWeekRecs = records.filter(r => r.date && r.date >= weekMonStr && r.date <= weekSunStr);
  const overdueRecs  = records.filter(r=>r.status==='Open' && r.deadline && r.deadline!=='-' && r.deadline < todayStr);
  const near3Recs    = records.filter(r=>r.status==='Open' && r.deadline && r.deadline!=='-' && r.deadline >= todayStr && r.deadline <= in3Str);
  const near7Recs    = records.filter(r=>r.status==='Open' && r.deadline && r.deadline!=='-' && r.deadline >= todayStr && r.deadline <= in7Str);
  const nearDueRecs  = near7Recs;

  const typeData = [
    { label:'WM 走動管理', value:activeRecs.filter(r=>r.type==='WM').length, color:'rgba(34,211,238,.85)' },
    { label:'NCR 改善通知', value:activeRecs.filter(r=>r.type==='NCR').length, color:'rgba(251,191,36,.8)' },
    { label:'PN 罰單', value:activeRecs.filter(r=>r.type==='PN').length, color:'rgba(251,113,133,.8)' },
  ].filter(d=>d.value>0);

  const areaMap = {};
  activeRecs.forEach(r=>{ if(r.area){ if(!areaMap[r.area])areaMap[r.area]={open:0,closed:0}; areaMap[r.area][r.status==='Open'?'open':'closed']++; }});
  const areaData = Object.entries(areaMap).map(([label,v])=>({label,...v}));

  // 統計以缺失條數為單位（每條 defect 算一筆）
  const itemMap = {};
  activeRecs.forEach(r=>{
    const defs = (r.defects && r.defects.length>0) ? r.defects : [{item: r.item||1, description: r.description||''}];
    defs.forEach(d=>{
      const k=String(d.item||1);
      if(!itemMap[k])itemMap[k]={total:0,open:0,closed:0};
      itemMap[k].total++;
      if(r.status==='Open') itemMap[k].open++; else itemMap[k].closed++;
    });
  });
  const iColors = ['#0ea5e9','#fbbf24','#10b981','#8b5cf6','#fb7185','#22d3ee','#f97316','#ec4899','#84cc16','#6366f1','#14b8a6','#94a3b8'];

  const clickStyle = { cursor:'pointer' };
  const KpiCard = ({label,value,sub,color,filter,icon}) => (
    <div className="kpi-card" style={filter?{...clickStyle}:{}} onClick={filter?()=>onFilterClick(filter):undefined}

          {sub && <div className="kpi-sub">{sub}</div>}
        </div>
        {icon && <IcoChip name={icon} color={color} />}
      </div>
    </div>
  );

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title"><IcoChip name="chart" size={22} />總覽儀表板</div>
          <div className="page-sub">{PROJECT.name}</div>
        </div>
        <button className="btn btn-secondary" onClick={onExport} title="匯出 KPI 總結圖片"><EcoIcon name="download" size={15} />匯出總結</button>
        <button className="btn btn-primary" onClick={()=>onFilterClick({_newrecord:true})}><EcoIcon name="plus" size={15} />新增紀錄</button>
      </div>
      {/* 日期篩選列 */}
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'14px 20px',marginBottom:20,display:'flex',flexWrap:'wrap',gap:10,alignItems:'center'}}>
        <span style={{fontSize:12,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px'}}>篩選期間</span>
        {[
          {id:'all',    label:'全部'},
          {id:'thisweek', label:'本週'},
          {id:'lastweek', label:'上週'},
          {id:'thismonth',label:'本月'},
          {id:'lastmonth',label:'上月'},
          {id:'last30',  label:'近30天'},
          {id:'last90',  label:'近90天'},
        ].map(p=>(
          <button key={p.id} onClick={()=>applyQuick(p.id)}
            className={`period-pill${quickPeriod===p.id?' on':''}`}>

        {useFiltered && <span style={{fontSize:12,color:'var(--accent-blue)',fontWeight:700}}>共 {filteredRecs.length} 筆</span>}
      </div>
      {/* ─── 匯出區域 ─── */}

// ─── PHOTO SYSTEM BUTTON ──────────────────────────────────────
function PhotoBtn({ record }) {
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState(0);
  const [msg, setMsg] = useState('');

  const handleClick = async () => {
    // 先開空視窗，並立刻寫入等待畫面（iOS 要求同步）
    const win = window.open('', '_blank');
    if (win) {
      win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>載入中...</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f1d30;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif}.box{background:#1e3a5f;border-radius:16px;padding:36px 40px;text-align:center;color:#fff;width:min(320px,88vw)}.icon{font-size:40px;margin-bottom:16px}.title{font-size:17px;font-weight:700;margin-bottom:20px}.bar-wrap{background:rgba(255,255,255,.15);border-radius:99px;height:8px;overflow:hidden;margin-bottom:14px}.bar{height:100%;background:linear-gradient(90deg,#38bdf8,#34d399);border-radius:99px;animation:grow 20s ease-out forwards}@keyframes grow{0%{width:5%}40%{width:40%}70%{width:70%}90%{width:88%}100%{width:93%}}.sub{font-size:12px;opacity:.65;margin-top:8px}</style></head><body><div class="box"><div class="icon">📷</div><div class="title">正在連結改善照片系統...</div><div class="bar-wrap"><div class="bar"></div></div><div>請稍候，GAS 首次連線約需 10~20 秒</div><div class="sub">連結完成後將自動跳轉</div></div></body></html>`);
      win.document.close();
    }
    if (!PHOTO_GAS_URL) {
      if (win) win.location.href = PHOTO_SYSTEM_URL + '#label=' + encodeURIComponent(record.number);
      return;
    }
    setBusy(true); setProgress(10); setMsg('連線照片系統中...');
    try {
      await new Promise(r=>setTimeout(r,300));
      setProgress(30); setMsg('查詢改善單紀錄...');
      const indexRes = await xhrGet(PHOTO_GAS_URL + '?action=index');
      const recs = (indexRes.ok && indexRes.data && indexRes.data.records) ? indexRes.data.records : [];
      const exists = recs.some(r => r.label === record.number);
      setProgress(65);
      if (!exists) {
        setMsg('建立新紀錄中...');
        const desc = (record.defects && record.defects.length > 0)
          ? record.defects.map(d => d.description).join('\n')
          : (record.description || '');
        await xhrPost(PHOTO_GAS_URL, {
          action: 'saveRecord',
          record: { id: Date.now(), label: record.number, date: record.date||'', beforeDesc: desc, duringDesc: '', afterDesc: '', remark: '' },
          header: null
        });
        setProgress(90); setMsg('紀錄建立完成，即將開啟...');
      } else {
        setProgress(90); setMsg('即將開啟照片系統...');
      }
      await new Promise(r=>setTimeout(r,400));
      setProgress(100);
      if (win) win.location.href = PHOTO_SYSTEM_URL + '#label=' + encodeURIComponent(record.number);
      else window.open(PHOTO_SYSTEM_URL + '#label=' + encodeURIComponent(record.number), '_blank');
    } catch(e) {
      if (win) win.close();
      alert('照片系統連線失敗：' + e.message);
    } finally {
      setTimeout(()=>{ setBusy(false); setProgress(0); setMsg(''); }, 600);
    }
  };

  return (<>
    {busy && (
      <div style={{position:'fixed',inset:0,background:'rgba(15,37,64,.82)',zIndex:9999,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16}}>
        <div style={{background:'var(--bg-card)',borderRadius:16,padding:'28px 36px',width:'min(340px,88vw)',boxShadow:'0 8px 40px rgba(0,0,0,.4)',display:'flex',flexDirection:'column',gap:14,alignItems:'center'}}>
          <div style={{fontSize:28}}>📷</div>
          <div style={{fontSize:15,fontWeight:700,color:'var(--text-primary)',textAlign:'center'}}>開啟改善照片系統</div>
          <div style={{width:'100%',background:'var(--bg-input)',borderRadius:99,height:8,overflow:'hidden'}}>
            <div style={{height:'100%',borderRadius:99,background:'linear-gradient(90deg,var(--accent-blue),var(--accent-green))',width:`${progress}%`,transition:'width .4s ease'}}></div>
          </div>
          <div style={{fontSize:13,color:'var(--text-secondary)',textAlign:'center'}}>{msg}</div>
          <div style={{fontSize:11,color:'var(--text-muted)',textAlign:'center'}}>GAS 首次連線約需 10~20 秒，請稍候...</div>
        </div>
      </div>
    )}
    <button className="btn btn-secondary btn-sm btn-icon" title="開啟改善照片系統" disabled={busy} onClick={handleClick}>
      {busy ? '⏳' : '📷'}
    </button>
  </>);
}

// ─── RECORDS TAB ──────────────────────────────────────────────
function RecordsTab({ records, config, onAdd, onEdit, onDelete, onRefresh, saving, gasUrl, connected, activeFilter }) {
  const { itemOptions, areaOptions, unitOptions } = config;
  const [filters, setFilters] = useState({ type:'', area:'', unit:'', status:'', item:'', search:'', _overdue:false, _neardue:false, _thisweek:false });
  const [sort, setSort] = useState({ key:'date', dir:'desc' });
  const [showModal, setShowModal] = useState(false);
  const [editRec, setEditRec] = useState(null);
  const [mode, setMode] = useState('add');
  const setF = (k,v) => setFilters(f=>({...f,[k]:v}));

  // 從儀表板點擊卡片帶入篩選
  useEffect(() => {
    if (activeFilter) {
      if (activeFilter._newrecord) {
        setMode('add'); setEditRec(null); setShowModal(true);
        return;
      }
      setFilters(f => ({
        ...f,
        type: activeFilter.type || f.type,
        status: activeFilter.status || f.status,
        item: activeFilter.item || f.item,
        _overdue: activeFilter._overdue || false,
        _neardue: activeFilter._neardue || false,
        _thisweek: activeFilter._thisweek || false,
      }));
    }
  }, [activeFilter]);

  const filtered = records.filter(r=>
    (!filters.type || r.type===filters.type) &&
    (!filters.area || r.area===filters.area) &&
    (!filters.unit || r.unit===filters.unit) &&
    (!filters.status || r.status===filters.status) &&
    (!filters.item || (r.defects&&r.defects.length>0 ? r.defects.some(d=>String(d.item)===filters.item) : String(r.item)===filters.item)) &&
    (!filters._overdue || (r.status==='Open' && r.deadline && r.deadline!=='-' && r.deadline < today())) &&
    (!filters._neardue || (r.status==='Open' && r.deadline && r.deadline!=='-' && r.deadline >= today() && r.deadline <= (()=>{const d=new Date();d.setDate(d.getDate()+7);return d.toISOString().slice(0,10);})())) &&
    (!filters._thisweek || (()=>{ const n=new Date(); const dw=n.getDay(); const diff=dw===0?-6:1-dw; const mon=new Date(n); mon.setDate(n.getDate()+diff); const sun=new Date(mon); sun.setDate(mon.getDate()+6); const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; return r.date>=fmt(mon)&&r.date<=fmt(sun); })()) &&
    (!filters.search || [r.number,r.description,r.issuer,r.refNumber,...(r.defects||[]).map(d=>d.description)].join(' ').toLowerCase().includes(filters.search.toLowerCase()))
  ).sort((a,b)=>{
    let va=a[sort.key]||'', vb=b[sort.key]||'';
    if(sort.key==='amount'){va=parseFloat(va)||0; vb=parseFloat(vb)||0;}
    return sort.dir==='asc' ? (va>vb?1:-1) : (va<vb?1:-1);
  });

  const toggleSort = k => setSort(s=>({key:k, dir:s.key===k&&s.dir==='asc'?'desc':'asc'}));
  const SortIcon = ({k}) => <span className={`sort-icon${sort.key===k?' active':''}`}>{sort.key===k?(sort.dir==='asc'?'▲':'▼'):'↕'}</span>;

  const openCnt = filtered.filter(r=>r.status==='Open').length;
  const td = today();

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title"><IcoChip name="list" size={22} />紀錄管理
            {filters._overdue && <span style={{marginLeft:10,fontSize:13,background:'rgba(251,113,133,.1)',color:'#fb7185',border:'1px solid rgba(251,113,133,.3)',borderRadius:20,padding:'2px 12px',fontWeight:600}}><EcoIcon name="alert" size={15} />逾期未結</span>}
            {filters._neardue && <span style={{marginLeft:10,fontSize:13,background:'rgba(251,191,36,.1)',color:'#fbbf24',border:'1px solid rgba(251,191,36,.3)',borderRadius:20,padding:'2px 12px',fontWeight:600}}><EcoIcon name="clock" size={15} />即將到期</span>}
            {filters._thisweek && <span style={{marginLeft:10,fontSize:13,background:'rgba(139,92,246,.1)',color:'var(--accent-purple)',border:'1px solid rgba(139,92,246,.3)',borderRadius:20,padding:'2px 12px',fontWeight:600}}>📅 本週新增</span>}
          </div>
          <div className="page-sub">共 {filtered.length} 筆 | Open: {openCnt} | Closed: {filtered.length - openCnt}</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-secondary" onClick={onRefresh} disabled={saving}>🔄 重新整理</button>
          <button className="btn btn-secondary" onClick={()=>window.open(PHOTO_SYSTEM_URL,'_blank')} title="開啟改善照片表產生器">📷 照片系統</button>
          <button className="btn btn-primary" onClick={()=>{setMode('add');setEditRec(null);setShowModal(true);}}><EcoIcon name="plus" size={15} />新增紀錄</button>
        </div>
      </div>

      <div className="filter-bar">
        <div className="filter-group"><span className="filter-label">類型</span>
          <select value={filters.type} onChange={e=>setF('type',e.target.value)}>
            <option value="">全部</option><option value="WM">WM</option><option value="NCR">NCR</option><option value="PN">PN</option>
          </select>

          <select value={filters.area} onChange={e=>setF('area',e.target.value)}>
            <option value="">全部</option>{areaOptions.map(a=><option key={a}>{a}</option>)}
          </select>
        </div>
        <div className="filter-group"><span className="filter-label">單位</span>
          <select value={filters.unit} onChange={e=>setF('unit',e.target.value)}>
            <option value="">全部</option>{unitOptions.map(u=><option key={u}>{u}</option>)}
          </select>
        </div>
        <div className="filter-group"><span className="filter-label">狀態</span>
          <select value={filters.status} onChange={e=>setF('status',e.target.value)}>

        <div className="filter-spacer"></div>
        <input type="text" value={filters.search} onChange={e=>setF('search',e.target.value)} placeholder="🔍 搜尋..." style={{minWidth:160}} />
      </div>

      <div className="table-wrap">
        <div className="table-head t-cols">
          {[['type','類型'],['number','編號'],['date','缺失日期'],['unit','單位'],['issuer','開單人'],['area','工區'],['item','缺失項目'],['description','缺失說明'],['refNumber','業主改善單編號'],['deadline','關單期限'],['submitDate','關單日期'],['status','狀態']].map(([k,l])=>(

        </div>
        {filtered.length===0
          ? <div className="empty-state"><div className="empty-icon"><EcoIcon name="search" size={48} /></div><div className="empty-text">無符合條件的紀錄</div></div>
          : filtered.map(r=>(
            <div key={r.id} className={`table-row t-cols row-${(r.type||"").toLowerCase()}`}>
              {/* ── 電腦版：表格欄位 ── */}
              <div className="table-cell desktop-only"><span className={`badge badge-${r.type.toLowerCase()}`}>{r.type}</span></div>
              <div className="table-cell desktop-only" style={{fontFamily:'JetBrains Mono,monospace',fontSize:11}}>{r.number}</div>
              <div className="table-cell hm desktop-only" style={{fontSize:11}}>{fmtDate(r.date)}</div>
              <div className="table-cell hm desktop-only">{r.unit}</div>
              <div className="table-cell hm desktop-only">{r.issuer}</div>
              <div className="table-cell hm desktop-only" style={{fontSize:11}}>{r.area}</div>
              <div className="table-cell hm desktop-only" style={{fontSize:11}}>
                {(r.defects&&r.defects.length>0)?r.defects.map(d=>itemOptions[d.item]||d.item).join('、'):(itemOptions[r.item]||'')}
              </div>
              <div className="table-cell hm desktop-only" style={{fontSize:11}}>
                {(r.defects&&r.defects.length>0)?<><span style={{fontFamily:'JetBrains Mono,monospace',fontSize:10,background:'var(--accent-blue-dim)',color:'var(--accent-blue)',borderRadius:4,padding:'1px 5px',marginRight:4}}>{r.defects.length}條</span>{r.defects[0].description}{r.defects.length>1?'...':''}</>:r.description}
              </div>
              <div className="table-cell hm desktop-only" style={{fontSize:11}}>{r.refNumber||'—'}</div>
              <div className="table-cell hm desktop-only" style={{fontSize:11, color: r.deadline&&r.status==='Open'&&r.deadline<td?'var(--accent-red)':''}}>{fmtDate(r.deadline)}</div>
              <div className="table-cell hm desktop-only" style={{fontSize:11,color:r.submitDate?'var(--accent-green)':''}}>{r.submitDate&&r.submitDate!=='-'?fmtDate(r.submitDate):'—'}</div>
              <div className="table-cell desktop-only"><span className={`badge badge-${r.status.toLowerCase()}`}>{r.status}</span></div>
              <div className="table-cell desktop-only" style={{display:'flex',gap:4}}>
                <button className="btn btn-secondary btn-sm btn-icon" onClick={()=>{setMode('edit');setEditRec(r);setShowModal(true);}}>✏️</button>
                <PhotoBtn record={r} />
                <button className="btn btn-secondary btn-sm btn-icon" title="Drive 資料夾" onClick={async()=>{
                if (r.driveFolderUrl) { window.open(r.driveFolderUrl,'_blank'); return; }
                const win = window.open('', '_blank');
                try {
                  const res = await xhrPost(gasUrl, {action:'getFolderUrl', type:r.type, date:r.date, number:r.number});
                  if (res.ok) { if(win) win.location.href = res.url; onEdit({...r, driveFolderUrl:res.url, driveFolderId:res.folderId}); }
                  else { if(win) win.close(); alert('Drive 錯誤：' + res.error); }
                } catch(e) { if(win) win.close(); alert('Drive 錯誤：' + e.message); }
              }}>📁</button>
                <button className="btn btn-danger btn-sm btn-icon" onClick={()=>{if(confirm(`確定刪除 ${r.number}？`))onDelete(r.id);}}>🗑</button>
              </div>

              {/* ── 手機版：美化卡片 ── */}
              <div className="mobile-card" style={{flexDirection:'column',gap:0}}>
                {/* 卡片頂部色條 + 標題列 */}
                <div style={{
                  background: r.type==='NCR'?'linear-gradient(135deg,#fcd34d,#fbbf24)':r.type==='PN'?'linear-gradient(135deg,#991b1b,#fb7185)':'linear-gradient(135deg,#075985,#0ea5e9)',
                  padding:'10px 14px',display:'flex',alignItems:'center',gap:8,borderRadius:'var(--radius) var(--radius) 0 0'
                }}>
                  <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:14,fontWeight:900,color:'#fff',flex:1,letterSpacing:1}}>{r.number}</span>
                  <span style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.85)',background:'rgba(255,255,255,.18)',borderRadius:20,padding:'2px 10px'}}>
                    {r.type==='WM'?'走動管理':r.type==='NCR'?'改善通知':'罰單'}
                  </span>
                  <span style={{fontSize:11,fontWeight:700,color:r.status==='Closed'?'#6ee7b7':'#fca5a5',background:'rgba(0,0,0,.25)',borderRadius:20,padding:'2px 10px'}}>
                    {r.status}
                  </span>
                </div>

                {/* 卡片主體 */}
                <div style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:10,background:'var(--bg-card)',borderRadius:'0 0 var(--radius) var(--radius)',border:'1px solid var(--border)',borderTop:'none'}}>

                  {/* 操作按鈕 */}
                  <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
                    <button className="btn btn-secondary btn-sm" style={{fontSize:12,padding:'5px 12px'}} onClick={()=>{setMode('edit');setEditRec(r);setShowModal(true);}}>✏️ 編輯</button>
                    <PhotoBtn record={r} />
                    <button className="btn btn-secondary btn-sm btn-icon" title="Drive" onClick={async()=>{
                      if (r.driveFolderUrl) { window.open(r.driveFolderUrl,'_blank'); return; }
                      const win = window.open('', '_blank');
                      try {
                        const res = await xhrPost(gasUrl, {action:'getFolderUrl', type:r.type, date:r.date, number:r.number});
                        if (res.ok) { if(win) win.location.href = res.url; onEdit({...r, driveFolderUrl:res.url, driveFolderId:res.folderId}); }
                        else { if(win) win.close(); alert('Drive 錯誤：' + res.error); }
                      } catch(e) { if(win) win.close(); alert('Drive 錯誤：' + e.message); }
                    }}>📁</button>
                    <button className="btn btn-danger btn-sm btn-icon" onClick={()=>{if(confirm(`確定刪除 ${r.number}？`))onDelete(r.id);}}>🗑</button>
                  </div>

                  {/* 資訊 2欄 */}
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 16px'}}>
                    {[
                      ['缺失日期', fmtDate(r.date), ''],
                      ['工區', r.area||'—', ''],
                      ['單位', r.unit||'—', ''],
                      ['開單人', r.issuer||'—', ''],
                      ['關單期限', fmtDate(r.deadline)||'—', r.deadline&&r.status==='Open'&&r.deadline<td?'var(--accent-red)':''],
                      ['關單日期', r.submitDate&&r.submitDate!=='-'?fmtDate(r.submitDate):'—', r.submitDate&&r.submitDate!=='-'?'var(--accent-green)':''],
                    ].map(([label,val,color])=>(
                      <div key={label}>
                        <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.5,marginBottom:2}}>{label}</div>
                        <div style={{fontSize:13,color:color||'var(--text-primary)',fontWeight:500}}>{val}</div>
                      </div>
                    ))}
                    <div style={{gridColumn:'1/-1'}}>
                      <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.5,marginBottom:2}}>業主改善單編號</div>
                      <div style={{fontSize:13,color:'var(--text-primary)',fontWeight:500}}>{r.refNumber||'—'}</div>
                    </div>
                  </div>

                  {/* 缺失條目 */}
                  {(r.defects&&r.defects.length>0) && (
                    <div style={{borderTop:'1px solid var(--border)',paddingTop:10}}>
                      <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.5,marginBottom:6}}>缺失條目</div>
                      {r.defects.map((d,i)=>(
                        <div key={i} style={{marginBottom:i<r.defects.length-1?8:0,paddingLeft:8,borderLeft:'3px solid var(--accent-blue)'}}>
                          <div style={{fontSize:10,fontWeight:700,color:'var(--accent-blue)',marginBottom:2}}>{i+1}. {itemOptions[d.item]||d.item}</div>
                          <div style={{fontSize:12,color:'var(--text-primary)',wordBreak:'break-word',whiteSpace:'pre-wrap',lineHeight:1.5}}>{d.description}</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          ))
        }
      </div>

      {showModal && (
        <RecordModal
          record={editRec} mode={mode} records={records} config={config} saving={saving} gasUrl={gasUrl}
          onSave={form => { if(mode==='add') onAdd(form); else onEdit(form); setShowModal(false); }}
          onClose={()=>!saving && setShowModal(false)}
        />
      )}
    </div>
  );
}

// ─── SETTINGS TAB ─────────────────────────────────────────────
function SettingsTab({ config, gasUrl, onSaveConfig, onDisconnect, syncState, lastSync, onRefresh, saving }) {
  const [editItems, setEditItems] = useState(JSON.stringify(config.itemOptions, null, 2));
  const [editAreas, setEditAreas] = useState(config.areaOptions.join('\n'));
  const [editUnits, setEditUnits] = useState(config.unitOptions.join('\n'));
  const [editPeople, setEditPeople] = useState((config.peopleOptions||DEFAULT_PEOPLE).join('\n'));

  const saveConfig = () => {
    try {
      const itemOptions = JSON.parse(editItems);
      const areaOptions = editAreas.split('\n').map(s=>s.trim()).filter(Boolean);
      const unitOptions = editUnits.split('\n').map(s=>s.trim()).filter(Boolean);
      const peopleOptions = editPeople.split('\n').map(s=>s.trim()).filter(Boolean);
      onSaveConfig({ itemOptions, areaOptions, unitOptions, peopleOptions });
    } catch(e) { alert('項目格式錯誤：' + e.message); }
  };

  return (
    <div>
      <div className="page-header">
        <div><div className="page-title"><IcoChip name="gear" size={22} />系統設定</div><div className="page-sub">選項與雲端設定</div></div>
      </div>

      <div className="settings-section">
        <div className="settings-title">☁️ 雲端連線狀態</div>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
          <div className={`sync-dot ${syncState}`} style={{width:10,height:10}}></div>
          <span style={{fontSize:12,color:'var(--text-secondary)',fontFamily:'JetBrains Mono,monospace',wordBreak:'break-all'}}>{gasUrl}</span>
        </div>
        {lastSync && <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:16}}>上次同步：{lastSync}</div>}
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <button className="btn btn-secondary" onClick={onRefresh} disabled={saving}>🔄 重新從雲端載入</button>
          <button className="btn btn-danger btn-sm" onClick={()=>{ if(confirm('確定要斷線？將會清除連線設定，需重新輸入 GAS 網址。')) { sessionStorage.removeItem(SS_KEY); onDisconnect(); } }}>🔌 斷線重設</button>
        </div>
      </div>

      <div className="settings-section">
        <div className="settings-title">📋 環保項目（JSON 格式）</div>
        <div className="settings-row">
          <label>項目清單（數字索引：名稱）</label>
          <textarea value={editItems} onChange={e=>setEditItems(e.target.value)} rows={14} style={{resize:'vertical'}} />
        </div>
      </div>
      <div className="settings-section">
        <div className="settings-title">📍 工區設定（每行一個）</div>
        <div className="settings-row">
          <textarea value={editAreas} onChange={e=>setEditAreas(e.target.value)} rows={5} style={{resize:'vertical'}} />
        </div>
      </div>
      <div className="settings-section">
        <div className="settings-title">🏢 單位設定（每行一個）</div>
        <div className="settings-row">
          <textarea value={editUnits} onChange={e=>setEditUnits(e.target.value)} rows={4} style={{resize:'vertical'}} />
        </div>
      </div>
      <div className="settings-section">
        <div className="settings-title">👤 人員清單（每行一人，開單人 &amp; 關單人共用）</div>
        <div className="settings-row">
          <textarea value={editPeople} onChange={e=>setEditPeople(e.target.value)} rows={10} style={{resize:'vertical'}} placeholder="每行一個人名..." />
        </div>
        <div style={{fontSize:11,color:'var(--text-muted)',marginTop:6}}>
          新增或修改後按下方「儲存設定至雲端」即生效，表單中的下拉選單會同步更新。
        </div>
      </div>
      <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
        <button className="btn btn-primary" onClick={saveConfig} disabled={saving}>
          {saving ? '⏳ 儲存中...' : '☁️ 儲存設定至雲端'}
        </button>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────
function App() {
  // ── 連線狀態 ──────────────────────────────────────────────
  const [gasUrl, setGasUrl] = useState(GAS_URL);
  const [connected, setConnected] = useState(false);

  // ── 純雲端資料（不存 localStorage）────────────────────────
  const [records, setRecords] = useState([]);
  const [config, setConfig] = useState({
    itemOptions: DEFAULT_ITEMS,
    areaOptions: DEFAULT_AREAS,
    unitOptions: DEFAULT_UNITS,
    peopleOptions: DEFAULT_PEOPLE,
  });

  // ── UI 狀態 ───────────────────────────────────────────────
  const [tab, setTab] = useState('dashboard');
  const [activeFilter, setActiveFilter] = useState(null);
  const [loading, setLoading] = useState(false);
  const [loadingMsg, setLoadingMsg] = useState('');
  const [saving, setSaving] = useState(false);
  const [syncState, setSyncState] = useState('idle'); // idle | ok | busy | error
  const [lastSync, setLastSync] = useState('');
  const [toasts, setToasts] = useState([]);

  // ── 視覺特效（視差 / 捲動揭示）─────────────────────────────
  const paneRef = useRef(null);
  useScrollFx();
  useReveal(paneRef, [tab, records.length]);

  const toast = useCallback((msg, type='success') => {
    const id = genId();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }, []);

  // ── 雲端載入 ──────────────────────────────────────────────
  // ── 資料格式轉換（舊格式相容）────────────────────────────
  const normalizeRecords = (recs) => recs.map(r => {
    let rec = {...r};
    if (!rec.defects || rec.defects.length === 0)
      rec.defects = [{ item: rec.item || 1, description: rec.description || '' }];
    rec.status = (rec.submitDate && rec.submitDate !== '' && rec.submitDate !== '-') ? 'Closed' : 'Open';
    return rec;
  });

  const loadFromCloud = useCallback(async (url) => {
    setLoading(true); setLoadingMsg('從雲端載入資料...');
    try {
      const data = await xhrGet((url||gasUrl) + '?action=index');
      let cloudRecords = normalizeRecords(data.records || []);
      const cfg = {
        itemOptions:  (data.config?.itemOptions  || data.itemOptions)  || DEFAULT_ITEMS,
        areaOptions:  (data.config?.areaOptions  || data.areaOptions)  || DEFAULT_AREAS,
        unitOptions:  (data.config?.unitOptions  || data.unitOptions)  || DEFAULT_UNITS,
        peopleOptions:(data.config?.peopleOptions|| data.peopleOptions)|| DEFAULT_PEOPLE,
      };
      if (cloudRecords.length === 0) {
        setLoadingMsg('首次連線，正在遷移資料至 Drive...');
        let seedRecs = SEED_RECORDS;
        try {
          const oldData = await xhrGet((url||gasUrl) + '?action=read');
          if (oldData.records && oldData.records.length > 0)
            seedRecs = normalizeRecords(oldData.records);
        } catch(e) {}
        setLoadingMsg(`一次性遷移 ${seedRecs.length} 筆，請稍候（約 30 秒）...`);
        await xhrPost((url||gasUrl), { action:'migrateAll', records: seedRecs, config: cfg });
        cloudRecords = seedRecs;
      }
      setRecords(cloudRecords);
      setConfig(cfg);
      setLastSync(new Date().toLocaleString('zh-TW'));
      setSyncState('ok'); setConnected(true);
    } catch(e) {
      setSyncState('error');
      toast('載入失敗：' + e.message, 'error');
      throw e;
    } finally { setLoading(false); }
  }, [gasUrl, toast]);

  // ── 初始載入 ─────────────────────────────────────────────
  useEffect(() => {
    if (gasUrl) loadFromCloud(gasUrl).catch(() => {});
  }, []);

  // ── 連線回調 ──────────────────────────────────────────────
  const handleConnect = async (url) => {
    setGasUrl(url);
    await loadFromCloud(url);
  };

  // ── 寫單筆到 Drive ────────────────────────────────────────
  const saveRecordToDrive = async (record) => {
    setSaving(true); setSyncState('busy');
    try {
      const res = await xhrPost(gasUrl, { action:'saveRecord', record });
      if (!res.success) throw new Error(res.error || '儲存失敗');
      setLastSync(new Date().toLocaleString('zh-TW'));
      setSyncState('ok');
    } catch(e) {
      setSyncState('error');
      toast('雲端儲存失敗：' + e.message, 'error');
      throw e;
    } finally { setSaving(false); }
  };

  // ── CRUD ──────────────────────────────────────────────────
  const addRecord = async (form) => {
    try {
      await saveRecordToDrive(form);
      setRecords(prev => [...prev, form]);
      toast('紀錄已新增並儲存至雲端');
    } catch {}
  };

  const editRecord = async (form) => {
    try {
      await saveRecordToDrive(form);
      setRecords(prev => prev.map(r => r.id===form.id ? form : r));
      toast('紀錄已更新');
    } catch {}
  };

  const deleteRecord = async (id) => {
    const target = records.find(r => r.id === id);
    try {
      if (target && target.driveFolderId) {
        const deleteDate = new Date().toISOString().slice(0,10);
        await xhrPost(gasUrl, {
          action: 'archiveAndDeleteFolder',
          folderId: target.driveFolderId,
          archiveName: `Deleted @ ${deleteDate} _ ${target.number}`,
          type: target.type,
        });
      }
      setSaving(true); setSyncState('busy');
      const res = await xhrPost(gasUrl, { action:'deleteRecord', id });
      if (!res.success) throw new Error(res.error || '刪除失敗');
      setRecords(prev => prev.filter(r => r.id !== id));
      setLastSync(new Date().toLocaleString('zh-TW'));
      setSyncState('ok');
      toast('紀錄已刪除');
    } catch(e) {
      setSyncState('error');
      toast('刪除失敗：' + e.message, 'error');
    } finally { setSaving(false); }
  };

  const saveConfig = async (newConfig) => {
    try {
      setSaving(true); setSyncState('busy');
      const res = await xhrPost(gasUrl, { action:'saveConfig', config: newConfig });
      if (!res.success) throw new Error(res.error || '儲存失敗');
      setConfig(newConfig);
      setLastSync(new Date().toLocaleString('zh-TW'));
      setSyncState('ok');
      toast('設定已儲存至雲端');
    } catch(e) {
      setSyncState('error');
      toast('設定儲存失敗：' + e.message, 'error');
    } finally { setSaving(false); }
  };

  const handleDisconnect = () => {
    setGasUrl('');
    setConnected(false);
    setRecords([]);
    setSyncState('idle');
  };

  // ── 未連線 → 顯示設定畫面 ─────────────────────────────────
  if (!gasUrl || (!connected && !loading)) {
    return (
      <>
        <SetupScreen onConnect={handleConnect} />
        {loading && (
          <div className="g-loading">
            <div className="g-loading-spinner"></div>
            <div className="g-loading-text">{loadingMsg}</div>
          </div>
        )}
      </>
    );
  }

  const openCnt = records.filter(r=>r.status==='Open').length;

  return (
    <>
    {/* ── 視差背景層：科技網格 + 極光團塊 + 掃描線 ── */}
    <div className="fx-bg" aria-hidden="true">
      <div className="fx-grid"></div>
      <div className="fx-blob b1"></div>
      <div className="fx-blob b2"></div>
      <div className="fx-blob b3"></div>
      <div className="fx-scan"></div>
    </div>

    <div className="app-shell">
      {/* Global Loading */}
      {loading && (
        <div className="g-loading">
          <div className="g-loading-spinner"></div>
          <div className="g-loading-text">{loadingMsg}</div>
        </div>
      )}

      {/* Topbar */}
      <div className="topbar">
        <div className="topbar-icon" style={{color:'#04262a'}}><EcoIcon name="waves" size={20} /></div>
        <div>
          <div className="topbar-title">{PROJECT.shortName}</div>
          <div className="topbar-sub">EHS Improvement Order System</div>
        </div>
        <div className="topbar-divider"></div>
        <div className="topbar-project">
          <div className="topbar-project-name">{PROJECT.name}</div>
          <div className="topbar-project-client">業主：{PROJECT.client}</div>
        </div>
        <div className="sync-status">
          <div className={`sync-dot ${syncState}`}></div>
          <span className="sync-text">
            {syncState==='ok'?'已同步':syncState==='busy'?'同步中':syncState==='error'?'失敗':'—'}
          </span>
        </div>
      </div>

      {/* Nav */}
      <nav className="nav">
        {[
          {id:'dashboard', label:<><EcoIcon name="chart" size={16} />儀表板</>},
          {id:'records', label:<><EcoIcon name="list" size={16} />紀錄管理</>, badge: openCnt>0 ? openCnt : null},
          {id:'settings', label:<><EcoIcon name="gear" size={16} />設定</>},
        ].map(n=>(
          <button key={n.id} className={`nav-btn${tab===n.id?' active':''}`} onClick={()=>setTab(n.id)}>
            {n.label}
            {n.badge && <span className="nav-badge">{n.badge}</span>}
          </button>
        ))}
      </nav>

      {/* Content */}
      <div className="content">
      <div className="tab-pane" key={tab} ref={paneRef}>
        {tab==='dashboard' && <DashboardTab records={records} itemOptions={config.itemOptions} onFilterClick={filter=>{ if(filter._newrecord){ setTab('records'); setActiveFilter({_newrecord:true, _ts:Date.now()}); } else { setActiveFilter({...filter, _ts: Date.now()}); setTab('records'); } }} onExport={()=>{
          // 動態載入 html2canvas 並截取 KPI 區塊
          const el = document.getElementById('kpi-export-area');
          if (!el) { alert('找不到匯出區域'); return; }
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
          script.onload = () => {
            html2canvas(el, { scale: 2, backgroundColor: '#071726', useCORS: true }).then(canvas => {
              const a = document.createElement('a');
              const date = new Date().toISOString().slice(0,10);
              a.download = `TPC海管工程_KPI總結_${date}.png`;
              a.href = canvas.toDataURL('image/png');
              a.click();
            });
          };
          if (window.html2canvas) {
            html2canvas(el, { scale: 2, backgroundColor: '#071726', useCORS: true }).then(canvas => {
              const a = document.createElement('a');
              const date = new Date().toISOString().slice(0,10);
              a.download = `TPC海管工程_KPI總結_${date}.png`;
              a.href = canvas.toDataURL('image/png');
              a.click();
            });
          } else {
            document.head.appendChild(script);
          }
        }} />}
        {tab==='records' && (
          <RecordsTab
            records={records} config={config} saving={saving} gasUrl={gasUrl} connected={connected}
            activeFilter={activeFilter}
            onAdd={addRecord} onEdit={editRecord} onDelete={deleteRecord}
            onRefresh={() => loadFromCloud()}
          />
        )}
        {tab==='settings' && (
          <SettingsTab
            config={config} gasUrl={gasUrl}
            onSaveConfig={saveConfig} onDisconnect={handleDisconnect}
            onRefresh={() => loadFromCloud()} syncState={syncState}
            lastSync={lastSync} saving={saving}
          />
        )}
      </div>
      </div>

      <ToastContainer toasts={toasts} />
    </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
