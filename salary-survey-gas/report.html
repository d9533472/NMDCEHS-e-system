<!-- 職安人員薪資調查 — 分析報告儀表板 -->
<!--
  資料全部來自 apiStats()（CACHE_KEY = salary_stats_v2）：
    intake / profile / multi / salary.overall / overtime / leave / analysis / micro
  固定區塊用後端算好的數字；交叉熱力圖與自訂條件篩選是「任意子集合」，
  改用 micro（逐列匿名編碼資料）在瀏覽器裡現算 —— micro 裡只有分組級距與薪資數字，
  沒有聯絡資訊、沒有自填文字、沒有時間戳，單獨一列無法對應到任何人。

  注意：google.script.run 回傳時會把物件裡的 null 吃掉變成 undefined，
  判空一律用 Number(v) > 0 或自己的 n，不要用 x.median !== null。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1b2b; --ink-2:#2a4259; --ink-3:#64798c; --ink-4:#93a6b6;
  --line:#e2e9f0; --line-2:#eff4f8; --bg:#f4f7fa; --card:#fff;
  --brand:#0e7a53; --brand-2:#13946a; --brand-dk:#0a5c3e;
  --brand-soft:#e8f5ef; --brand-line:#bfe0d1;
  --gold:#b8862b; --gold-soft:#fdf5e3; --gold-line:#ecd9a8;
  --warm:#c0486b; --warm-soft:#fdeef2; --warm-line:#f0ccd8;
  --r:18px; --sh:0 2px 4px rgba(11,27,43,.04),0 12px 32px -8px rgba(11,27,43,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  font-size:14.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px 80px}
.hero{position:relative;overflow:hidden;color:#fff;padding:42px 0 54px;
  background:
    radial-gradient(900px 340px at 86% -15%, rgba(19,148,106,.42), transparent 62%),
    radial-gradient(600px 280px at 4% 115%, rgba(31,88,130,.42), transparent 60%),
    linear-gradient(152deg,#13304c 0%,#0a1c2e 62%,#07131f 100%)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(80% 110% at 50% 0%,#000,transparent 72%);
  mask-image:radial-gradient(80% 110% at 50% 0%,#000,transparent 72%)}
.hero .wrap{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:#7fd6ad;margin-bottom:11px}
.eyebrow::before{content:"";width:22px;height:2px;background:#7fd6ad;border-radius:2px}
.hero h1{margin:0 0 7px;font-size:32px;font-weight:900;letter-spacing:-.01em}
.hero .sub{opacity:.72;font-size:13.5px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:10px;margin-top:20px}
.meta>div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(6px);border-radius:13px;padding:11px 15px}
.meta .k{font-size:11.5px;opacity:.72}
.meta .v{font-size:19px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:24px 26px;margin:18px 0}
.card:first-of-type{margin-top:-34px;position:relative;z-index:2}
h2.sec{margin:38px 0 6px;font-size:21px;font-weight:900;letter-spacing:-.01em;
  padding-left:14px;border-left:4px solid var(--brand)}
h3{margin:24px 0 9px;font-size:15.5px;font-weight:700;color:var(--ink-2)}
h3:first-child{margin-top:0}
h4{margin:0 0 4px;font-size:14.5px;font-weight:700;color:var(--ink)}
.lead{color:var(--ink-3);font-size:13px;margin:0 0 14px;line-height:1.7}
.hint{color:var(--ink-3);font-size:12px;margin:9px 0 0;line-height:1.65}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:right}
th{background:var(--line-2);font-weight:600;text-align:center;color:var(--ink-3);font-size:12.5px}
td:first-child,th:first-child{text-align:left}
td.tl{text-align:left}                      /* 文字欄位：數字才靠右，句子靠右會很難讀 */
tbody tr:hover{background:#fafcfe}
.tnum{font-variant-numeric:tabular-nums}
.small{color:var(--ink-3);font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw table{min-width:430px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:20px 24px}
.grid2.wide{grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr))}

/* ── 執行摘要 ── */
.sum{display:grid;gap:11px}
.sum>div{display:flex;gap:11px;background:#fafcfd;border:1px solid var(--line);
  border-radius:13px;padding:13px 16px;font-size:13.5px;line-height:1.8}
.sum>div::before{content:counter(s);counter-increment:s;flex:0 0 22px;height:22px;
  background:var(--brand);color:#fff;border-radius:7px;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-top:3px}
.sum{counter-reset:s}

/* ── 逐項重點 ── */
.bd{display:grid;gap:9px}
.bd-row{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 15px}
.bd-h{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.bd-h b{font-size:14px;color:var(--ink)}
.bd-h em{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.04em;
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.bd-h em.hi{background:var(--brand-soft);color:var(--brand-dk);border:1px solid var(--brand-line)}
.bd-h em.mid{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-line)}
.bd-h em.lo{background:var(--line-2);color:var(--ink-3);border:1px solid var(--line)}
.bd-t{font-size:13px;line-height:1.75;color:var(--ink-2)}
@media(max-width:560px){.bd-h{flex-wrap:wrap;gap:6px}}

/* ── 回收長條 ── */
.trend{display:flex;align-items:flex-end;gap:3px;height:82px;margin-top:4px;
  border-bottom:1px solid var(--line)}
.trend>div{flex:1;position:relative;display:flex;flex-direction:column;
  justify-content:flex-end;align-items:center;height:100%}
.trend i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--brand-2);min-height:2px}
.trend i.z{background:var(--line)}
.trend b{font-size:10px;font-weight:800;color:var(--brand-dk);line-height:1.2}
.trend-x{display:flex;gap:3px;margin-top:5px}
.trend-x>div{flex:1;text-align:center;font-size:9.5px;color:var(--ink-4);
  font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:16px}
.kpi>div{border:1px solid var(--line);border-radius:13px;padding:10px 14px;background:#fafcfd}
.kpi .k{font-size:11.5px;color:var(--ink-3)}
.kpi .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.35}
.kpi .v em{font-style:normal;font-size:12px;font-weight:700;color:var(--ink-3)}

/* ── 100% 堆疊長條（有順序的維度）── */
.st{margin-bottom:17px}
.st-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:13px;font-weight:800;color:var(--ink-2);margin-bottom:6px}
.st-h em{font-style:normal;font-weight:700;font-size:11px;color:var(--ink-4);
  font-variant-numeric:tabular-nums}
.st-bar{display:flex;gap:2px;height:26px}
.st-bar i{display:block;min-width:2px;border-radius:3px}
.st-bar i:first-child{border-radius:6px 3px 3px 6px}
.st-bar i:last-child{border-radius:3px 6px 6px 3px}
.st-lg{display:flex;flex-wrap:wrap;gap:3px 13px;margin-top:7px}
.st-lg span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2)}
.st-lg b{flex:0 0 auto;width:10px;height:10px;border-radius:3px}
.st-lg em{font-style:normal;color:var(--ink-4);font-weight:700;font-variant-numeric:tabular-nums}

/* ── 排名長條（無順序的維度、複選題、驅動因子）── */
/* 左欄要夾住：複選題的「ISO 45001 職業安全衛生管理系統」這種長標籤會把長條擠到剩一點點 */
.rk{display:grid;grid-template-columns:minmax(78px,168px) 1fr;gap:5px 10px;align-items:center}
.rk>div:nth-child(odd){font-size:12.5px;font-weight:700;color:var(--ink-2);text-align:right;
  line-height:1.3}
.rk>div:nth-child(odd) em{font-style:normal;display:block;font-size:10.5px;
  color:var(--ink-4);font-weight:700;font-variant-numeric:tabular-nums}
.rb{position:relative;background:var(--line-2);border-radius:7px;height:24px;overflow:hidden}
.rb i{position:absolute;inset:0 auto 0 0;border-radius:7px;
  background:linear-gradient(90deg,var(--brand-2),var(--brand))}
.rb b{position:absolute;top:0;bottom:0;display:flex;align-items:center;white-space:nowrap;
  font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
.rk.thin .rb{height:20px}
.rk .low .rb i{background:var(--ink-4);opacity:.45}
.rk .low{opacity:.72}

/* ── 箱型圖式橫條 ── */
.box{border:1px solid var(--line);border-radius:13px;padding:13px 15px;background:#fafcfd;
  margin-bottom:12px}
.box-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:13px;font-weight:800;margin-bottom:10px;color:var(--ink-2)}
.box-h em{font-style:normal;font-weight:700;color:var(--brand-dk);
  font-variant-numeric:tabular-nums;font-size:12px}
.bxw{margin:0 13px}
.bx{position:relative;height:30px}
.bx u{position:absolute;left:0;right:0;top:14px;height:2px;background:var(--ink-4);
  border-radius:2px;text-decoration:none}
.bx s{position:absolute;top:8px;width:2px;height:14px;background:var(--ink-4);
  border-radius:2px;text-decoration:none}
.bx q{position:absolute;top:5px;height:20px;border-radius:5px;quotes:none;
  background:var(--brand-soft);border:1.5px solid var(--brand-line)}
.bx q::before,.bx q::after{content:""}
.bx o{position:absolute;top:1px;width:3px;height:28px;border-radius:2px;background:var(--brand-dk)}
.bx i{position:absolute;top:11px;width:10px;height:10px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 0 2px #fff}
.bx b{position:absolute;top:5px;font-size:17px;font-weight:900;line-height:1;color:var(--ink-4)}
.bx b.lo{left:-11px} .bx b.hi{right:-11px}
.bx-med{position:relative;height:17px;font-size:11.5px;font-variant-numeric:tabular-nums}
.bx-med span{position:absolute;bottom:0;transform:translateX(-50%);white-space:nowrap;
  font-weight:800;color:var(--brand-dk)}
.bx-x{position:relative;height:16px;margin-top:3px;font-size:10.5px;color:var(--ink-4);
  font-variant-numeric:tabular-nums;font-weight:700}
.bx-x span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.bx-med span.l,.bx-x span.l{transform:none}
.bx-med span.r,.bx-x span.r{transform:translateX(-100%)}
.bx-n{margin:9px 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.5}
/* ── 箱型圖怎麼看：每一列左邊是真的記號、右邊是白話解釋 ── */
.bxk{margin:14px 0 20px;padding:14px 16px;background:var(--line-2);border-radius:12px}
.bxk h4{margin:0 0 11px;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.bxk-row{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;
  padding:6px 0;border-top:1px solid var(--line)}
.bxk-row:first-of-type{border-top:0}
.bxk-ic{position:relative;height:22px}
.bxk-ic .q{position:absolute;left:4px;right:4px;top:2px;height:18px;border-radius:5px;
  background:var(--brand-soft);border:1.5px solid var(--brand-line)}
.bxk-ic .o{position:absolute;left:24px;top:0;width:3px;height:22px;border-radius:2px;
  background:var(--brand-dk)}
.bxk-ic .i{position:absolute;left:21px;top:6px;width:10px;height:10px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 0 2px #fff}
.bxk-ic .u{position:absolute;left:4px;right:4px;top:10px;height:2px;border-radius:2px;
  background:var(--ink-4)}
.bxk-ic .s{position:absolute;top:4px;width:2px;height:14px;border-radius:2px;background:var(--ink-4)}
.bxk-ic .s.a{left:4px} .bxk-ic .s.b{right:4px}
.bxk-ic .ar{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;color:var(--ink-4);line-height:1}
.bxk-tx{font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.bxk-tx b{color:var(--ink)}
.bxk-tx span{color:var(--ink-3)}

/* ── 溢酬：以 0 為中心的雙向長條 ── */
.pm{border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:14px;background:#fff}
.pm-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pm-h .vd{font-size:11px;font-weight:800;border-radius:7px;padding:2px 9px;letter-spacing:.04em}
.vd.solid{background:var(--brand-soft);color:var(--brand-dk);border:1px solid var(--brand-line)}
.vd.mild{background:var(--gold-soft);color:#8a6516;border:1px solid var(--gold-line)}
.vd.flat{background:var(--line-2);color:var(--ink-3);border:1px solid var(--line)}
.vd.reverse{background:var(--warm-soft);color:#9c2f4e;border:1px solid var(--warm-line)}
.vd.thin{background:var(--line-2);color:var(--ink-4);border:1px solid var(--line)}
.dv{position:relative;height:21px;background:var(--line-2);border-radius:7px;margin:5px 0}
.dv::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;
  background:var(--ink-4);opacity:.5}
.dv i{position:absolute;top:0;bottom:0;border-radius:5px}
.dv i.p{background:linear-gradient(90deg,var(--brand-2),var(--brand))}
.dv i.n{background:linear-gradient(270deg,#d4718c,var(--warm))}
.dv em{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-style:normal;
  font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.dv-lb{display:flex;gap:8px;font-size:11px;color:var(--ink-4);font-weight:700}
.dv-lb span:first-child{flex:0 0 72px;text-align:right;color:var(--ink-3)}
.pm details{margin-top:9px}
.pm summary{font-size:12px;color:var(--brand-dk);cursor:pointer;font-weight:700}
.pm details table{margin-top:8px;font-size:12.5px}

/* ── 熱力圖 ── */
.ctl{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
.ctl label{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.ctl select{font:inherit;font-size:13px;font-weight:700;color:var(--ink-2);background:#fff;
  border:1.5px solid var(--line);border-radius:10px;padding:7px 10px}
.ctl select:focus{outline:none;border-color:var(--brand)}
.hm{overflow-x:auto;margin:0 -3px}
.hm table{border-collapse:separate;border-spacing:3px;font-size:11.5px;
  font-variant-numeric:tabular-nums;width:auto;min-width:100%}
.hm th{font-size:10.5px;color:var(--ink-3);font-weight:800;padding:2px 5px;white-space:nowrap;
  background:none;border:0}
.hm th.rh{text-align:right;max-width:120px;white-space:normal;line-height:1.3}
.hm td{border:0;border-radius:7px;padding:6px 8px;text-align:center;min-width:62px;
  background:var(--line-2);color:var(--ink-2)}
.hm td b{display:block;font-size:12.5px;font-weight:800}
.hm td i{font-style:normal;font-size:9.5px;opacity:.8}
.hm td.v{color:#fff} .hm td.v.lo{color:var(--ink)}
.hm td.na{color:var(--ink-4)}
.hm td.few{outline:1.5px dashed var(--ink-4);outline-offset:-1.5px}
.hm-lg{display:flex;align-items:center;gap:6px;margin:0 0 9px;
  font-size:11px;color:var(--ink-3);font-weight:700}
.hm-lg i{flex:0 0 118px;height:8px;border-radius:5px;
  background:linear-gradient(90deg,rgba(14,122,83,.1),rgba(14,122,83,.92))}
.hm-lg em{font-style:normal;font-weight:700;color:var(--ink-4)}

/* ── 自訂條件 ── */
.fl{display:grid;gap:7px}
.fl-row{display:grid;grid-template-columns:minmax(74px,88px) 1fr;gap:4px 10px;align-items:start;
  padding:5px 0;border-top:1px solid var(--line-2)}
.fl-row:first-child{border-top:0}
.fl-row>.n{font-size:12px;font-weight:800;color:var(--ink-2);text-align:right;line-height:1.5;padding-top:3px}
.fl-row>.n em{font-style:normal;display:block;font-size:10px;font-weight:700;color:var(--ink-4)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;
  font:inherit;font-size:11.5px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:.12s;
  font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--brand-line);background:var(--brand-soft)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip em{font-style:normal;opacity:.6;margin-left:4px;font-weight:700}
.fl-res{margin-top:16px;border:1px solid var(--brand-line);border-radius:14px;
  background:var(--brand-soft);padding:15px 17px}
.fl-res .n{font-size:13px;font-weight:800;color:var(--brand-dk);margin-bottom:11px;
  font-variant-numeric:tabular-nums}
.fl-res .box{background:#fff}
.fl-res .locked{font-size:13px;color:#8a6516;background:var(--gold-soft);
  border:1px solid var(--gold-line);border-radius:11px;padding:12px 14px;line-height:1.7}

.notes{list-style:decimal;padding-left:22px;margin:8px 0 0;font-size:13px;color:var(--ink-2)}
.notes li{margin:6px 0;line-height:1.75}
.cav{display:grid;gap:9px}
.cav>div{display:flex;gap:10px;font-size:13px;line-height:1.8;color:var(--ink-2);
  background:#fafcfd;border:1px solid var(--line);border-radius:12px;padding:12px 15px}
.cav>div::before{content:"※";flex:0 0 auto;color:var(--gold);font-weight:900}
.empty{text-align:center;padding:58px 24px;color:var(--ink-3);max-width:560px;margin:0 auto}
.empty h2{color:var(--ink);font-size:22px;font-weight:900;margin:0 0 10px}
.empty p{margin:0 0 12px;line-height:1.75}
.empty .gauge{height:11px;border-radius:99px;background:var(--line-2);overflow:hidden;margin:20px 0 10px}
.empty .gauge .gfill{height:100%;border-radius:99px;
  background:linear-gradient(90deg,#ffc94d,var(--brand-2))}
.empty .cnt{font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.empty .cnt b{font-size:22px;font-weight:900;color:var(--brand-dk)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:1.5px solid var(--line);background:#fff;color:var(--ink-2);border-radius:12px;
  padding:10px 18px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;
  text-decoration:none;display:inline-block;transition:.15s}
.btn:hover{border-color:var(--brand);color:var(--brand-dk);background:var(--brand-soft)}
.btn.p{background:linear-gradient(145deg,var(--brand-2),var(--brand));color:#fff;border-color:transparent;
  box-shadow:0 2px 6px rgba(14,122,83,.26),0 10px 24px -8px rgba(14,122,83,.45)}
.btn.p:hover{background:linear-gradient(145deg,var(--brand),var(--brand-dk));color:#fff}
.btn.s{padding:6px 13px;font-size:12.5px;border-radius:10px}

/* ── 怎麼用這份報告談薪水 ── */
.cta{display:flex;flex-wrap:wrap;gap:13px;align-items:center;margin-top:22px}

<script>
var BOOT = <?!= BOOT ?>;
var ST = BOOT.stats;

var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = function (s) {

var fmt = function (n) {

};
// 綠色單色階（有順序的維度、熱力圖都用這一條，深淺＝大小）
var RAMP = ['#d7ece2', '#aedcc8', '#7cc4a7', '#4caa86', '#229067', '#0e7a53', '#0a5c3e'];
var NEUTRAL = '#9aa7b1';     // 「其他」「未填」不是真的分類，固定給中性灰
// 後端 profile 的 ord 只代表「有指定排序」，不代表有高低（工作區域、工作型態都有 ord）。
// 色階＝大小，所以只有真的能排高低的維度才畫成堆疊色階，其餘一律用單色排名長條。
var ORDINAL_KEYS = ['yrs_band', 'age_band', 'education', 'osh_license_top', 'company_size',
  'job_title', 'subordinates', 'lang_level', 'raise_last_year', 'satisfaction', 'job_seeking'];
/* 數字壓在色塊上時，淺色階要用深字、深色階才用白字，否則 RAMP 前兩階白字看不見 */
function inkOn(hex) {
  var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
  if (!m) return '#fff';
  var v = parseInt(m[1], 16);
  var L = 0.2126 * (v >> 16 & 255) + 0.7152 * (v >> 8 & 255) + 0.0722 * (v & 255);
  return L > 150 ? '#13304c' : '#fff';
}

function rampAt(i, n) {
  if (n <= 1) return RAMP[4];
  var t = i / (n - 1);
  return RAMP[Math.round(t * (RAMP.length - 1))];
}

// 空集合的統計值在後端是 null，經 google.script.run 會變 undefined，
// 所以一律用 n 或 Number(v) > 0 判斷，不要比對 null
function has(s) { return s && Number(s.n) > 0; }
function pctl(s, p) {
  if (!s.length) return null;
  if (s.length === 1) return s[0];
  var idx = (s.length - 1) * (p / 100), lo = Math.floor(idx), hi = Math.ceil(idx);
  return lo === hi ? s[lo] : s[lo] + (s[hi] - s[lo]) * (idx - lo);

// 與後端 _numericStat 同一套算法（線性內插百分位），前端算子集合時用
function nstat(arr) {
  if (!arr.length) return { n: 0 };
  var s = arr.slice().sort(function (a, b) { return a - b; });
  var sum = 0;
  s.forEach(function (x) { sum += x; });
  return {

    median: Math.round(pctl(s, 50)), p25: Math.round(pctl(s, 25)), p75: Math.round(pctl(s, 75)),

  };
}


// ══════════════════════════════════
// micro：逐列匿名資料（交叉熱力圖、自訂條件篩選用）
// ══════════════════════════════════
var MI = null;
var METRICS = [
  { k: 'a',  label: '全年本業總收入', hour: false },
  { k: 'm',  label: '月薪',           hour: false },
  { k: 'b',  label: '年終獎金',       hour: false },

];
function metricOf(k) {
  for (var i = 0; i < METRICS.length; i++) if (METRICS[i].k === k) return METRICS[i];
  return METRICS[0];
}
function mv(k, v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return metricOf(k).hour ? (fmt(v) + ' 小時') : wan(v);
}
function micro() {
  if (MI) return MI;
  var m = (ST && ST.micro) || null;
  if (!m || !m.dims || !m.dims.length || !m.rows) return null;
  var nd = m.dims.length;
  var cell = function (x) { return (x === '' || x === undefined) ? null : Number(x); };
  var out = [];
  String(m.rows).split(';').forEach(function (line) {
    if (!line) return;
    var p = line.split(',');
    if (p.length < nd + 4) return;
    var c = [];
    for (var j = 0; j < nd; j++) c.push(Number(p[j]));
    out.push({ c: c, m: cell(p[nd]), b: cell(p[nd + 1]), a: cell(p[nd + 2]), ot: cell(p[nd + 3]) });
  });
  if (!out.length) return null;
  MI = { dims: m.dims, rows: out, minCellN: Number(m.minCellN) > 0 ? Number(m.minCellN) : 5 };
  return MI;
}


// ══════════════════════════════════
// 共用圖形元件
// ══════════════════════════════════
/* 箱型圖式橫條：淺綠盒＝P25～P75，深綠線＝中位數，金點＝平均數 */
function bxBar(s) {
  if (!has(s) || !(Number(s.median) >= 0)) return '<p class="hint" style="margin:0">沒有可用數字。</p>';
  // 鬚線取 Tukey 1.5 倍四分位距：只要有一筆離譜的數字，min~max 刻度就會把整個盒子壓到最左邊
  var iqr = s.p75 - s.p25;
  var lo = s.min, hi = s.max;
  if (iqr > 0) {
    lo = Math.max(s.min, s.p25 - 1.5 * iqr);
    hi = Math.min(s.max, s.p75 + 1.5 * iqr);
  }
  if (!(hi > lo)) { lo = s.min; hi = s.max; }
  var span = (hi - lo) || 1;
  var at = function (v) { return Math.max(0, Math.min(100, (v - lo) / span * 100)); };
  var p25 = at(s.p25), p75 = at(s.p75), med = at(s.median), mean = at(s.mean);
  var outLo = s.min < lo, outHi = s.max > hi;
  var f = arguments.length > 1 ? arguments[1] : wan;
  // 標籤直接錨在自己的記號下方；太靠邊就改成靠邊對齊，免得被切掉
  var tag = function (pos, txt, extra) {
    var cls = pos < 7 ? ' class="l' + (extra || '') + '"'
            : pos > 93 ? ' class="r' + (extra || '') + '"'
            : (extra ? ' class="' + extra + '"' : '');
    return '<span' + cls + ' style="left:' + pos + '%">' + txt + '</span>';
  };
  return '<div class="bxw">' +
    '<div class="bx-med">' + tag(med, '中位 ' + f(s.median)) + '</div>' +
    '<div class="bx" title="n=' + s.n + '　中位數 ' + f(s.median) + '　平均 ' + f(s.mean) +
      '　P25 ' + f(s.p25) + '　P75 ' + f(s.p75) + '">' +
      '<u></u><s style="left:0"></s><s style="right:0"></s>' +
      '<q style="left:' + p25 + '%;width:' + Math.max(1, p75 - p25) + '%"></q>' +
      '<o style="left:calc(' + med + '% - 1.5px)"></o>' +
      '<i style="left:calc(' + mean + '% - 5px)"></i>' +
      (outLo ? '<b class="lo">‹</b>' : '') + (outHi ? '<b class="hi">›</b>' : '') +
    '</div>' +
    '<div class="bx-x">' + tag(0, f(lo)) + tag(p25, 'P25 ' + f(s.p25)) +
      tag(p75, 'P75 ' + f(s.p75)) + tag(100, f(hi)) + '</div>' +
    (outLo || outHi ?
      '<p class="bx-n">' + (outLo && outHi ? '‹ 和 ›' : outLo ? '‹' : '›') +
      ' 代表鬚線外還有極端值沒有畫進來；實際全距 ' + f(s.min) + ' ～ ' + f(s.max) + '。</p>' : '') +
    '</div>';
}
/* 箱型圖的圖例：左欄畫的是圖上真正的記號，右欄講白話，省得讀者自己猜哪條線是什麼 */
function bxKey() {
  var rows = [
    ['<span class="q"></span>',
     '<b>淺綠盒子</b>＝中間一半的人（P25～P75）。' +
     '<span>盒子越窄代表這群人的薪水越集中，越寬代表差距越大。</span>'],
    ['<span class="q" style="opacity:.35"></span><span class="o"></span>',
     '<b>深綠直線</b>＝中位數。<span>把所有人從低排到高，站在正中間那個人的數字；' +

     '這時候看中位數比看平均準。</span>'],
    ['<span class="u"></span><span class="s a"></span><span class="s b"></span>',

  ];
  return '<div class="bxk"><h4>箱型圖怎麼看</h4>' +
    rows.map(function (r) {
      return '<div class="bxk-row"><div class="bxk-ic">' + r[0] + '</div>' +
        '<div class="bxk-tx">' + r[1] + '</div></div>';

function boxOf(title, s, f) {
  return '<div class="box"><div class="box-h"><span>' + esc(title) + '</span>' +
    '<em>n=' + (has(s) ? s.n : 0) + (has(s) ? '　平均 ' + (f || wan)(s.mean) : '') + '</em></div>' +

/* 有順序的維度（年資、學歷、證照等級…）：每個級距自己一列，名稱直接寫在長條左邊。
   原本畫成 100% 堆疊長條，但一條裡擠七八個色塊、名稱全部擠到下面的圖例，
   要讀「碩士占幾成」得先在圖例找顏色、再回頭對色塊，所以改成跟「行業別」同一種排版，
   級距高低改用顏色深淺表示（rampAt），順序就是級距本身的順序，不按人數排。 */
function ordBars(p) {
  var rows = (p.rows || []).filter(function (r) { return r.count > 0; });
  if (!rows.length) return '';
  var real = rows.filter(function (r) { return r.label !== '其他' && r.label !== '未填'; });
  var max = Math.max.apply(null, rows.map(function (r) { return r.pct; })) || 1;
  var n = rows.reduce(function (a, b) { return a + b.count; }, 0);
  return '<div class="st"><div class="st-h"><span>' + esc(p.title) + '</span><em>n=' + n + '</em></div>' +
    '<div class="rk thin">' + rows.map(function (r) {
      var col = (r.label === '其他' || r.label === '未填')
        ? NEUTRAL : rampAt(real.indexOf(r), real.length);
      var w = Math.max(3, r.pct / max * 100), inside = w > 42;
      return '<div>' + esc(r.label) + '<em>n=' + r.count + '</em></div>' +
        '<div><div class="rb" title="' + esc(r.label) + '　' + r.count + ' 人（' +
          r.pct.toFixed(1) + '%）">' +
          '<i style="width:' + w + '%;background:' + col + '"></i>' +
          '<b style="' + (inside ? 'right:auto;left:8px;color:' + inkOn(col)
                                 : 'left:calc(' + w + '% + 8px)') +
          '">' + r.pct.toFixed(1) + '%</b></div></div>';
    }).join('') + '</div>' + blankNote(p) + '</div>';
}

/* 未作答註記：這題沒回答的筆數不進分母，但要讓讀者看得到有多少人沒答 */
function blankNote(p) {
  if (!p || !(p.blank > 0)) return '';
  var base = p.base || ST.total || 0;
  return '<p class="hint">另有 ' + p.blank + ' 筆未作答' +
    (base ? '（占全部 ' + base + ' 筆的 ' + (p.blank / base * 100).toFixed(1) + '%）' : '') +
    '，未計入上面的分母。</p>';
}

/* 排名長條：無順序的維度與複選題，長度＝人數，身份靠文字標籤 */
function rankBars(title, rows, opt) {
  rows = (rows || []).filter(function (r) { return r.count > 0; });
  if (!rows.length) return '';
  opt = opt || {};
  var cut = opt.limit ? rows.slice(0, opt.limit) : rows;
  var max = Math.max.apply(null, cut.map(function (r) { return r.count; })) || 1;
  var body = '<div class="rk thin">' + cut.map(function (r) {
    var w = Math.max(3, r.count / max * 100), inside = w > 42;
    return '<div>' + esc(r.label) + '<em>n=' + r.count + '</em></div>' +
      '<div><div class="rb" title="' + esc(r.label) + '　' + r.count + ' 筆（' + r.pct.toFixed(1) + '%）">' +
        '<i style="width:' + w + '%"></i>' +
        '<b style="' + (inside ? 'right:auto;left:8px;color:#fff' : 'left:calc(' + w + '% + 8px)') + '">' +
        r.pct.toFixed(1) + '%</b></div></div>';
  }).join('') + '</div>';
  return '<div><h3>' + esc(title) + '</h3>' + body +
    (opt.limit && rows.length > opt.limit
      ? '<p class="hint">另有 ' + (rows.length - opt.limit) + ' 項人數更少，未列出。</p>' : '') +
    (opt.dim ? blankNote(opt.dim) : '') +
    '</div>';
}

/* 百分位表：同一組數字的 n／最小／P25／中位／P75／最大 */
function statTable(items, f) {
  f = f || wan;
  var rows = items.filter(function (it) { return has(it[1]); });
  if (!rows.length) return '';
  return '<div class="tw"><table><thead><tr><th>項目</th><th>n</th><th>最小值</th>' +
    '<th>P10</th><th>P25</th><th>中位數</th><th>P75</th><th>P90</th><th>平均</th><th>最大值</th>' +
    '</tr></thead><tbody>' + rows.map(function (it) {
      var s = it[1];
      return '<tr><td>' + esc(it[0]) + '</td><td class="tnum">' + s.n + '</td>' +
        ['min', 'p10', 'p25', 'median', 'p75', 'p90', 'mean', 'max'].map(function (k, i) {
          var v = f(s[k]);
          return '<td class="tnum">' + (k === 'median' ? '<b>' + v + '</b>' : v) + '</td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}

function secSummary(a) {

  return '<div class="card"><h3>執行摘要</h3>' +
    '<p class="lead">以下每一條都是這次回收的資料現場算出來的，講的是「光看表格看不出來的事」。' +
    '兩組人在比較時，都會先把年資拉成差不多再比，免得把「資深」誤當成別的原因。</p>' +

      return '<div><span>' + esc(s) + '</span></div>';

}

/* 逐項重點：每個條件一句話，照影響力由大到小排，讀者可以直接找自己在意的那一項 */
function secByDim(rows) {
  if (!rows || !rows.length) return '';
  var cls = { '影響大': 'hi', '影響中等': 'mid', '影響很小': 'lo' };
  return '<h3 style="margin-top:26px">各項條件分別看</h3>' +
    '<p class="lead">同一個條件裡最高與最低的那一組各是誰、差多少。' +
    '左邊的標籤是這個條件對收入的影響力 —— 「影響很小」代表就算這一項不同，收入也不會差太多。</p>' +
    '<div class="bd">' + rows.map(function (r) {
      return '<div class="bd-row">' +
        '<div class="bd-h"><b>' + esc(r.label) + '</b>' +
          '<em class="' + (cls[r.strength] || 'lo') + '">' + esc(r.strength) + '</em></div>' +
        '<div class="bd-t">' + esc(r.text) + '</div></div>';
    }).join('') + '</div>';
}

/* 「調查回收」整段已從報告拿掉（2026-10-12）：KPI 在頁首已經有、回收趨勢是後台在看的東西。
   函式留著沒刪，要還原只需把 secIntake(ST.intake) 加回 #app 的組裝順序裡。
   注意：異常值處理已改掛在「資料限制與備註」，別跟著一起搬回來，會重複出現兩次。 */
function secIntake(k) {
  if (!k) return '';
  var max = Math.max.apply(null, k.days.map(function (d) { return d.count; })) || 1;
  return '<h2 class="sec">調查回收</h2><div class="card">' +
    '<div class="kpi">' +
      '<div><div class="k">有效樣本</div><div class="v">' + k.valid + ' <em>筆</em></div></div>' +
      '<div><div class="k">已修正異常值</div><div class="v">' + fixN(k) + ' <em>筆</em></div></div>' +
      '<div><div class="k">近 7 天新增</div><div class="v">' + k.weekCount + ' <em>筆</em></div></div>' +
      '<div><div class="k">舊調查匯入</div><div class="v">' + k.legacyN + ' <em>筆</em></div></div>' +
      '<div><div class="k">調查期間</div><div class="v" style="font-size:14px">' +
        esc(k.startRoc) + '<br>～ ' + esc(ST.deadline) + '</div></div>' +
      '<div><div class="k">狀態</div><div class="v" style="font-size:15px">' +
        (k.open ? '進行中' : '已結束') + '</div></div>' +
    '</div>' +
    '<h3>近 21 天回收</h3>' +
    '<div class="trend">' + k.days.map(function (d) {
      var h = Math.round(d.count / max * 62);
      return '<div title="' + esc(d.label) + '　' + d.count + ' 筆">' +
        (d.count ? '<b>' + d.count + '</b>' : '') +
        '<i class="' + (d.count ? '' : 'z') + '" style="height:' + (d.count ? Math.max(3, h) : 2) + 'px"></i></div>';
    }).join('') + '</div>' +
    '<div class="trend-x">' + k.days.map(function (d, i) {
      return '<div>' + (i % 3 === 0 || i === k.days.length - 1 ? esc(d.label) : '') + '</div>';
    }).join('') + '</div>' +
    (k.legacyN ? '<p class="hint">其中 ' + k.legacyN + ' 筆來自「' + esc(k.legacyTag) +
      '」，問的是 2022 年度收入，時間戳不在上面的區間內，會把中位數往下拉。</p>' : '') +
    secFix(k) +
    '</div>';
}

/* 修正了幾筆、依據什麼理由修 —— 數字會動到統計，理由就必須攤在報告上 */
function fixN(k) { return (k && k.fix && k.fix.fixed) || 0; }

function secFix(k) {
  var fx = k && k.fix;
  if (!fx) return '';
  // 「還排除著幾筆」以回覆資料現況為準（k.excluded），不用日誌推算
  var ex = k.excluded || 0;
  if (!fx.fixed && !fx.included && !ex) {
    return '<h3>異常值處理</h3>' +
      '<p class="lead">本次沒有任何一筆被修正或排除，所有數字都是填答者原始填寫的內容。</p>';
  }
  var parts = [];
  if (fx.fixed) parts.push('修正 <b>' + fx.fixed + '</b> 筆');
  if (fx.included) parts.push('人工確認計入 <b>' + fx.included + '</b> 筆');
  if (ex) parts.push('仍排除於統計之外 <b>' + ex + '</b> 筆');
  return '<h3>異常值處理</h3>' +
    '<p class="lead">本次共' + parts.join('、') + '。' +
    '修正只動金額欄位（月薪／年終／年收入／加班時數），不會更動任何分類答案；' +
    '每一筆的原始值、修正後的值與處理時間都留在後台的操作日誌裡，可供查核。' +
    (fx.reasons && fx.reasons.length ? '以下是修正的依據：' : '') + '</p>' +
    (fx.reasons && fx.reasons.length
      ? '<div class="tw"><table><thead><tr><th>判定異常的理由</th><th>筆數</th><th>怎麼修</th></tr></thead><tbody>' +
        fx.reasons.map(function (r) {
          return '<tr><td>' + esc(r.label) + '</td>' +
            '<td class="tnum">' + r.count + '</td>' +
            '<td class="tl">' + esc(r.fix || '') + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : '') +
    (ex
      ? '<p class="hint">被排除的那幾筆，是數字矛盾到無法從其餘欄位推回合理值的，' +
        '整筆不納入任何薪資統計。</p>' : '');
}

function secProfile(prof) {
  if (!prof || !prof.length) return '';
  var isOrd = function (p) {
    if (ORDINAL_KEYS.indexOf(p.key) < 0) return false;
    // 只剩兩格的「級距」畫成色階沒有意義，丟給排名長條
    return (p.rows || []).filter(function (r) { return r.count > 0; }).length >= 3;
  };
  var ord = prof.filter(isOrd);
  var cat = prof.filter(function (p) { return !isOrd(p); });
  var h = '<h2 class="sec">樣本結構</h2>';
  if (ord.length) {
    h += '<div class="card"><h3>有高低順序的條件</h3>' +
      '<p class="lead">顏色由淺到深＝級距由低到高。百分比只算實際回答這題的人（右上角的 n），' +
      '沒作答的另外標在圖下。</p>' +
      '<div class="grid2 wide">' + ord.map(ordBars).join('') + '</div></div>';
  }
  if (cat.length) {
    h += '<div class="card"><h3>沒有高低之分的條件</h3>' +
      '<p class="lead">類別之間沒有高低，所以照人數多寡排。分母同樣只算實際回答這題的人。</p>' +
      '<div class="grid2">' + cat.map(function (p) {
        return rankBars(p.title, p.rows, { limit: 12, dim: p });
      }).join('') + '</div></div>';
  }
  // 整題都沒人作答的維度不會畫出任何圖，獨立列一行，免得整個維度無聲消失
  var none = prof.filter(function (p) { return !(p.answered > 0); });
  if (none.length) {
    h += '<p class="hint">' + none.map(function (p) { return esc(p.title); }).join('、') +
      '：本次全部未作答，未列出。</p>';
  }
  return h;
}

function secMulti(multi) {
  if (!multi || !multi.length) return '';

  if (!any) return '';

function secDrivers(a) {
  var d = (a && a.drivers) || [];
  if (!d.length) return '';
  var max = Math.max.apply(null, d.map(function (x) { return x.eps; })) || 1;
  return '<h2 class="sec">薪資分析</h2><div class="card"><h3>哪些條件真的能解釋收入差異</h3>' +
    '<p class="lead">把每個條件拿來比「對年收入（取對數）的組間變異占比」，並校正組數（ε²）—— ' +
    '條件切得越細本來就越容易看起來有解釋力，校正後才能互相比較。只納入樣本 ≥ ' +
    (a.minCellN || 5) + ' 筆的組別，「其他」「未填」不算一組。</p>' +
    '<div class="rk">' + d.map(function (x) {
      // ε² 是 0（校正後組間差異全被組數吃掉）就不要畫殘條，否則看起來像「有一點解釋力」
      var w = x.eps > 0 ? Math.max(4, x.eps / max * 100) : 0, inside = w > 42;
      return '<div>' + esc(x.label) + '<em>' + x.k + ' 組・n=' + x.n + '</em></div>' +
        '<div><div class="rb" title="η²=' + x.eta + '%　ε²=' + x.eps + '%">' +
          '<i style="width:' + w + '%"></i>' +
          '<b style="' + (inside ? 'left:9px;color:#fff' : 'left:calc(' + w + '% + 9px)') + '">' +
          x.eps + '%</b></div></div>';
    }).join('') + '</div>' +
    '<div class="tw" style="margin-top:16px"><table><thead><tr>' +
      '<th>條件</th><th>解釋力 ε²</th><th>最高組</th><th>中位數</th><th>最低組</th><th>中位數</th><th>高低差</th>' +
      '</tr></thead><tbody>' + d.map(function (x) {
        return '<tr><td>' + esc(x.label) + '</td><td class="tnum">' + x.eps + '%</td>' +
          '<td>' + esc(x.hi.label) + ' <span class="small">n=' + x.hi.n + '</span></td>' +
          '<td class="tnum"><b>' + wan(x.hi.median) + '</b></td>' +
          '<td>' + esc(x.lo.label) + ' <span class="small">n=' + x.lo.n + '</span></td>' +
          '<td class="tnum">' + wan(x.lo.median) + '</td>' +
          '<td class="tnum">' + wan(x.gap) + '（' + sgn(x.gapPct) + '）</td></tr>';
      }).join('') + '</tbody></table></div></div>';
}

function secCurve(a) {
  var c = (a && a.curve) || null;
  if (!c || !c.rows || c.rows.length < 2) return '';
  var max = Math.max.apply(null, c.rows.map(function (r) { return r.annual; })) || 1;
  var stepOf = function (band) {
    for (var i = 0; i < c.steps.length; i++) if (c.steps[i].to === band) return c.steps[i];
    return null;
  };
  return '<div class="card"><h3>年資報酬曲線</h3>' +
    '<p class="lead">各年資帶的年收入中位數，以及跨過下一個級距時的漲幅。' +
    '這是橫斷面資料，不是同一批人的成長軌跡 —— 它說的是「現在這個年資的人大概在哪」。</p>' +
    '<div class="rk">' + c.rows.map(function (r, i) {
      var w = Math.max(6, r.annual / max * 100), inside = w > 42;
      var st = stepOf(r.band);
      return '<div>' + esc(r.band) + '<em>n=' + r.n + '</em></div>' +
        '<div><div class="rb" title="年收入中位數 ' + wan(r.annual) +
          (Number(r.monthly) > 0 ? '　月薪中位數 ' + wan(r.monthly) : '') + '">' +
          '<i style="width:' + w + '%;background:linear-gradient(90deg,' + rampAt(i, c.rows.length) +
          ',' + rampAt(Math.min(i + 1, c.rows.length - 1), c.rows.length) + ')"></i>' +
          '<b style="' + (inside ? 'left:9px;color:#fff' : 'left:calc(' + w + '% + 9px)') + '">' +
          wan(r.annual) + (st ? '　<span style="opacity:.75">' + sgn(st.pct) + '</span>' : '') +
          '</b></div></div>';
    }).join('') + '</div>' +
    (c.fastest && c.slowest && c.fastest.to !== c.slowest.to
      ? '<p class="hint">漲幅最陡的一段是 ' + esc(c.fastest.from) + ' → ' + esc(c.fastest.to) +
        '（' + sgn(c.fastest.pct) + '，' + wan(c.fastest.delta) + '），' +
        '最平的一段是 ' + esc(c.slowest.from) + ' → ' + esc(c.slowest.to) +
        '（' + sgn(c.slowest.pct) + '）。</p>' : '') +
    '</div>';
}

// 後端的 shrink = (1 - adj/raw)：原始差距接近 0 或正負號翻掉時會算出 566%、800% 這種
// 沒有意義的數字，而且話術會變成「大半的領先來自年資」—— 明明根本沒有領先。
// 所以百分比只在「同向而且確實變小」時才講，其餘情況改用文字描述。
function shrinkNote(x) {
  var raw = Number(x.rawPct), adj = Number(x.adjPct);
  if (isNaN(raw) || isNaN(adj)) return '';
  var p = function (s) { return '<p class="hint">' + s + '</p>'; };
  if (Math.abs(raw) < 3 && Math.abs(adj) < 3) {
    return p('原始差距與同年資帶內差距都在 ±3% 以內，這個條件看不出溢酬。');
  }
  if ((raw >= 0) !== (adj >= 0)) {
    return p('控制年資前後方向相反（原始 ' + sgn(raw) + '、同年資帶內 ' + sgn(adj) +
      '）—— 表面上的差距是兩組人年資分布不同造成的，拉平年資後就反過來了，' +
      '兩邊都不大，視為沒有實質差別。');
  }
  if (Math.abs(adj) >= Math.abs(raw)) {
    return p('控制年資後差距反而變大（' + sgn(raw) + ' → ' + sgn(adj) +
      '）—— 原本是年資分布把這個差距壓住了。');
  }
  var shrink = Math.round((1 - adj / raw) * 1000) / 10;
  return p('控制年資後差距縮掉 ' + shrink + '%' +
    (shrink >= 50 ? ' —— 大半的領先其實來自年資分布，不是這個條件本身。' : '。'));
}

function secPremiums(a) {
  var p = (a && a.premiums) || [];
  if (!p.length) return '';
  var VD = { solid: '站得住', mild: '偏弱但仍在', flat: '幾乎沒差', reverse: '反向', thin: '樣本不足' };
  var max = 1;
  p.forEach(function (x) {
    max = Math.max(max, Math.abs(Number(x.rawPct) || 0), Math.abs(Number(x.adjPct) || 0));
  });
  var dvBar = function (label, v) {
    if (v === null || v === undefined || isNaN(v)) {
      return '<div class="dv-lb"><span>' + label + '</span><span>—</span></div>';
    }
    var w = Math.min(50, Math.abs(v) / max * 50);
    var pos = v >= 0;
    return '<div class="dv-lb"><span>' + label + '</span></div>' +
      '<div class="dv" title="' + label + ' ' + sgn(v) + '">' +
        '<i class="' + (pos ? 'p' : 'n') + '" style="left:' + (pos ? 50 : 50 - w) + '%;width:' + w + '%"></i>' +
        '<em style="' + (pos ? 'left:calc(' + (50 + w) + '% + 7px)' : 'right:calc(' + (50 + w) + '% + 7px)') +
        '">' + sgn(v) + '</em></div>';
  };
  return '<div class="card"><h3>控制年資後，還剩多少溢酬</h3>' +
    '<p class="lead">同一個條件直接比，常常只是「資深的人剛好集中在那一組」。' +
    '這裡在每個年資帶內各比一次年收入中位數，再以兩組較小的 n 加權平均（同年資帶內差距）。' +
    '向右綠色＝有溢酬，向左紅色＝反而較低；每段年資帶至少各 3 人才納入。</p>' +
    p.map(function (x) {
      return '<div class="pm"><div class="pm-h"><h4>' + esc(x.label) + '</h4>' +
        '<span class="vd ' + x.verdict + '">' + VD[x.verdict] + '</span></div>' +
        '<p class="lead" style="margin:2px 0 10px">' + esc(x.lead) +

// ══════════════════════════════════
// 交叉熱力圖（micro，瀏覽器現算）
// ══════════════════════════════════
var HM = { r: 0, c: 1, k: 'a' };
function secCross() {
  var M = micro();
  if (!M) return '';
  // 預設：行業別 × 年資（跟後台同一組），找不到就用前兩個維度
  var ix = function (key, def) {
    for (var i = 0; i < M.dims.length; i++) if (M.dims[i].key === key) return i;
    return def;
  };
  HM.r = ix('cat', 0); HM.c = ix('yrs', 1);
  return '<h2 class="sec">交叉分析</h2><div class="card">' +
    '<p class="lead">兩個條件交叉後的中位數。顏色越深代表越高；' +
    '格子樣本不足 ' + M.minCellN + ' 筆就不顯示數字，虛線框代表 n &lt; 10、任何一筆極端值都會明顯移動中位數。' +
    '這一段是在你的瀏覽器裡用逐列匿名資料現算的，所以可以任意換維度。</p>' +
    '<div class="ctl noprint">' +
      '<label>列</label><select id="hmR">' + dimOpts(M, HM.r) + '</select>' +
      '<label>欄</label><select id="hmC">' + dimOpts(M, HM.c) + '</select>' +
      '<label>指標</label><select id="hmK">' + METRICS.map(function (m) {
        return '<option value="' + m.k + '"' + (m.k === HM.k ? ' selected' : '') + '>' +
          esc(m.label) + '</option>';
      }).join('') + '</select>' +
    '</div><div id="hmBox">' + crossBody() + '</div></div>';
}
function dimOpts(M, sel) {
  return M.dims.map(function (d, i) {
    return '<option value="' + i + '"' + (i === sel ? ' selected' : '') + '>' + esc(d.label) + '</option>';
  }).join('');
}
function crossBody() {
  var M = micro();
  if (!M) return '';
  if (HM.r === HM.c) return '<p class="hint">列與欄請選不同的條件。</p>';
  var R = M.dims[HM.r], C = M.dims[HM.c], k = HM.k;
  var bucket = [];
  R.values.forEach(function () {
    var row = [];
    C.values.forEach(function () { row.push([]); });
    bucket.push(row);
  });
  M.rows.forEach(function (r) {
    var v = r[k];
    if (v === null || v === undefined || isNaN(v)) return;
    var a = r.c[HM.r], b = r.c[HM.c];
    if (!(a >= 0) || !(b >= 0)) return;
    bucket[a][b].push(v);
  });
  var cells = bucket.map(function (row) {
    return row.map(function (arr) {
      if (arr.length < M.minCellN) return { n: arr.length, median: null };
      return { n: arr.length, median: Math.round(pctl(arr.slice().sort(function (x, y) { return x - y; }), 50)) };
    });
  });
  // 有數字的列與欄才畫出來，免得整排都是「—」
  var rIdx = [], cIdx = [];
  cells.forEach(function (row, i) {
    if (row.some(function (x) { return x.median !== null; })) rIdx.push(i);
  });
  C.values.forEach(function (v, j) {
    if (cells.some(function (row) { return row[j].median !== null; })) cIdx.push(j);
  });
  if (!rIdx.length || !cIdx.length) {
    return '<p class="hint">這組交叉目前沒有任何格子達到 ' + M.minCellN + ' 筆。換一個條件試試。</p>';
  }
  var vals = [];
  rIdx.forEach(function (i) {
    cIdx.forEach(function (j) { if (cells[i][j].median !== null) vals.push(cells[i][j].median); });
  });
  // 用名次而不是數值比例決定深淺：只要有一格特別高，線性比例會把其餘格子全部壓到最淺的一端
  var uniq = vals.slice().sort(function (a, b) { return a - b; })
    .filter(function (v, i, s) { return i === 0 || v !== s[i - 1]; });
  var alpha = function (v) {
    var t = uniq.length < 2 ? 1 : uniq.indexOf(v) / (uniq.length - 1);
    return Math.round((0.1 + t * 0.82) * 100) / 100;
  };
  var head = '<tr><th></th>' + cIdx.map(function (j) {
    return '<th>' + esc(C.values[j]) + '<br><span style="font-weight:700;opacity:.7">n=' +
      C.counts[j] + '</span></th>';
  }).join('') + '</tr>';
  var body = rIdx.map(function (i) {
    return '<tr><th class="rh">' + esc(R.values[i]) + '<br><span style="font-weight:700;opacity:.7">n=' +
      R.counts[i] + '</span></th>' + cIdx.map(function (j) {
      var x = cells[i][j];
      if (x.median === null) {
        return '<td class="na" title="樣本 ' + x.n + ' 筆，未達 ' + M.minCellN + ' 筆不顯示">' +
          '<b>—</b><i>n=' + x.n + '</i></td>';
      }
      var al = alpha(x.median);
      var cls = 'v' + (al > 0.55 ? '' : ' lo') + (x.n < 10 ? ' few' : '');
      return '<td class="' + cls + '" style="background:rgba(14,122,83,' + al + ')" title="' +
        esc(R.values[i]) + ' × ' + esc(C.values[j]) + '　' + mv(k, x.median) + '（n=' + x.n + '）">' +
        '<b>' + mv(k, x.median) + '</b><i>n=' + x.n + '</i></td>';
    }).join('') + '</tr>';
  }).join('');
  return '<h3 style="margin-top:0">' + esc(R.label) + ' × ' + esc(C.label) + '　' +
    esc(metricOf(k).label) + '中位數</h3>' +
    '<div class="hm-lg"><span>低</span><i></i><span>高</span><em>' +
      mv(k, uniq[0]) + '　→　' + mv(k, uniq[uniq.length - 1]) + '</em></div>' +
    '<div class="hm"><table>' + head + body + '</table></div>';
}

// ══════════════════════════════════
var FL = {};
function secFilter() {
  var M = micro();
  if (!M) return '';
  return '<h2 class="sec">自訂條件</h2><div class="card">' +
    '<p class="lead">勾選條件看那一群人的薪資分布：同一列裡複選＝任一符合即可，不同列之間＝要同時符合。' +
    '一樣在你的瀏覽器裡現算，子集合不足 ' + M.minCellN + ' 筆就不顯示任何數字。' +
    '算的資料只有分組級距與薪資數字，沒有聯絡資訊、自填文字與填答時間，單獨一列無法對應到任何人。</p>' +
    '<div class="fl" id="flBox">' + flRows() + '</div>' +
    '<div class="toolbar noprint" style="margin-top:13px">' +
      '<button class="btn s" data-flreset="1">清除所有條件</button></div>' +
    '<div class="fl-res" id="flRes">' + flBody() + '</div></div>';
}
function flRows() {
  var M = micro();
  return M.dims.map(function (d, i) {
    var sel = FL[i] || [];
    return '<div class="fl-row" data-row="' + i + '">' +
      '<div class="n">' + esc(d.label) +
        '<em>' + (sel.length ? '已選 ' + sel.length + ' 項' : '全部') + '</em></div>' +
      '<div class="chips">' + d.values.map(function (v, j) {
        if (!d.counts[j]) return '';
        return '<button class="chip' + (sel.indexOf(j) >= 0 ? ' on' : '') +
          '" data-fl="' + i + '" data-v="' + j + '">' + esc(v) +
          '<em>' + d.counts[j] + '</em></button>';
      }).join('') + '</div></div>';
  }).join('');
}
function flRowsSel() {
  var M = micro();
  return M.rows.filter(function (r) {
    for (var k in FL) {
      if (!FL.hasOwnProperty(k)) continue;
      var sel = FL[k];
      if (!sel || !sel.length) continue;
      if (sel.indexOf(r.c[Number(k)]) < 0) return false;
    }
    return true;
  });
}
function flLabel() {
  var M = micro(), parts = [];
  M.dims.forEach(function (d, i) {
    var sel = FL[i] || [];
    if (!sel.length) return;
    parts.push(d.label + '＝' + sel.map(function (j) { return d.values[j]; }).join('／'));
  });
  return parts.length ? parts.join('；') : '全部有效樣本';
}
function flBody() {
  var M = micro(), rows = flRowsSel();
  var head = '<div class="n">目前條件：' + esc(flLabel()) + '　→　' + rows.length + ' 筆</div>';
  if (rows.length < M.minCellN) {
    return head + '<div class="locked">這組條件只剩 ' + rows.length + ' 筆，未達 ' + M.minCellN +
      ' 筆，不顯示任何統計數字 —— 樣本太少的數字不只是誤差大，還可能反推出個別填答者。' +
      '請放寬條件。</div>';
  }
  var pick = function (k) {
    return rows.map(function (r) { return r[k]; })
      .filter(function (v) { return v !== null && v !== undefined && !isNaN(v); });
  };
  var m = nstat(pick('m')), an = nstat(pick('a')), b = nstat(pick('b')), ot = nstat(pick('ot'));
  var base = (ST.analysis || {});
  var cmp = function (s, ref, name) {
    if (!has(s) || !(Number(ref) > 0)) return '';
    var dp = Math.round((s.median - ref) / ref * 1000) / 10;
    return '<p class="hint" style="margin:4px 0 0">' + name + '中位數 ' + wan(s.median) +
      '，相對全體（' + wan(ref) + '）' + sgn(dp) + '。</p>';
  };
  return head +
    (has(m) ? boxOf('月薪', m) + cmp(m, base.monthly && base.monthly.median, '月薪') : '') +
    (has(an) ? boxOf('全年本業總收入', an) + cmp(an, base.annual && base.annual.median, '年收入') : '') +
    statTable([['月薪', m], ['年終獎金', b], ['全年本業總收入', an]]) +
    (has(ot) ? statTable([['每月加班時數（小時）', ot]], fmt) : '') +
    '<p class="hint">n 在 10 以下的子集合，任何一筆極端值都會明顯移動中位數，請連著 n 一起看。</p>';
}

// 怎麼用這份報告談薪水

/* 報告讀完最常出現的下一句話是「那我該開多少」。這一段把前面的百分位換成
   可以直接拿去談的東西：先用 micro 找出「同年資同行業」那一格、算出讀者站在哪，
   再給開口區間與講法。全部在瀏覽器裡現算，不另外打後端；找不到 micro 就整段不出現。
   注意：GAS 把頁面放在跨來源 iframe 裡，捲動只能用 scrollIntoView。 */
var NL = String.fromCharCode(10);
var NG = { m: 0, yrs: -1, cat: -1 };

function okNum(v) { return v !== null && v !== undefined && !isNaN(v); }

function ngDim(key) {
  var M = micro();
  if (!M) return -1;
  for (var i = 0; i < M.dims.length; i++) if (M.dims[i].key === key) return i;
  return -1;
}

/* 比較基準由細往粗退：同年資同行業 → 同年資 → 同行業 → 全體。
   第一個達到 MIN_CELL_N 的就用它，並把實際用的基準寫在畫面上 ——
   「這個數字是拿誰來比的」比數字本身更要緊。 */
function ngPeer() {
  var M = micro();
  if (!M) return null;
  var iy = ngDim('yrs'), ic = ngDim('cat');
  var yv = (iy >= 0 && NG.yrs >= 0) ? M.dims[iy].values[NG.yrs] : '';
  var cv = (ic >= 0 && NG.cat >= 0) ? M.dims[ic].values[NG.cat] : '';
  var t = [];
  if (yv && cv) {
    t.push({ label: yv + '、' + cv, basis: '同年資、同行業別', yrs: true, cat: true,
      f: function (r) { return r.c[iy] === NG.yrs && r.c[ic] === NG.cat; } });
  }
  if (yv) {
    t.push({ label: yv + '（不分行業）', basis: '同年資', yrs: true, cat: false,
      f: function (r) { return r.c[iy] === NG.yrs; } });
  }
  if (cv) {
    t.push({ label: cv + '（不分年資）', basis: '同行業別', yrs: false, cat: true,
      f: function (r) { return r.c[ic] === NG.cat; } });
  }
  t.push({ label: '全體有效樣本', basis: '全體', yrs: false, cat: false,
    f: function () { return true; } });

  for (var i = 0; i < t.length; i++) {
    var rows = M.rows.filter(t[i].f);
    var ms = rows.map(function (r) { return r.m; }).filter(okNum);
    if (ms.length < M.minCellN) continue;
    return {
      label: t[i].label, basis: t[i].basis, tier: i, narrowed: i > 0,
      usedYrs: t[i].yrs, usedCat: t[i].cat,
      m: nstat(ms), a: nstat(rows.map(function (r) { return r.a; }).filter(okNum)),
      vals: ms, minCellN: M.minCellN
    };
  }
  return null;
}

/* 下一個年資帶的行情。「再熬一個年資帶值多少」在談判裡很實用：它決定你現在
   值不值得為幾千塊硬碰，也決定主管說「下次再談」的時候，你該要求什麼。
   關鍵是**必須跟上面那一組用同一個基準** —— 上面退成不分行業、這裡卻按行業算，
   兩個數字就不能相減，百分比會是假的。配不出同基準的下一帶就整塊不顯示。 */
function ngNextBand(p) {
  var M = micro();
  if (!M || !p || !p.usedYrs || NG.yrs < 0) return null;
  var iy = ngDim('yrs'), ic = ngDim('cat');
  if (iy < 0) return null;
  var useCat = !!(p.usedCat && ic >= 0 && NG.cat >= 0);
  var vals = M.dims[iy].values;
  for (var j = NG.yrs + 1; j < vals.length; j++) {
    if (!M.dims[iy].counts[j]) continue;
    var band = j;
    var ms = M.rows.filter(function (r) {
      return r.c[iy] === band && (!useCat || r.c[ic] === NG.cat);
    }).map(function (r) { return r.m; }).filter(okNum);
    if (ms.length >= M.minCellN) return { band: vals[band], m: nstat(ms) };
  }
  return null;
}

/* 在這一組裡排第幾 —— 同分的人算一半，免得一堆人填整數 60000 時名次整段跳動 */
function ngRank(arr, v) {
  var lo = 0, eq = 0;
  arr.forEach(function (x) { if (x < v) lo++; else if (x === v) eq++; });
  return Math.max(1, Math.min(99, Math.round((lo + eq / 2) / arr.length * 100)));
}

function ngRail(s, me) {
  var lo = s.p10, hi = s.p90;
  if (!(hi > lo)) return '';
  var at = function (v) { return Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100)); };
  var a25 = at(s.p25), a75 = at(s.p75);
  return '<div class="rail">' +
    '<div class="rail-t">' +
      '<div class="rail-iqr" style="left:' + a25 + '%;width:' + Math.max(0.6, a75 - a25) + '%"></div>' +
      '<div class="rail-med" style="left:' + at(s.median) + '%"></div>' +
      (okNum(me) ? '<div class="rail-me" style="left:' + at(me) + '%">' +
        '<span>你 ' + wan(me) + '</span><i></i></div>' : '') +
    '</div>' +
    '<div class="rail-x"><span>P10 ' + wan(lo) + '</span>' +
      '<span>中位數 ' + wan(s.median) + '</span><span>P90 ' + wan(hi) + '</span></div>' +
    '<div class="rail-lg">淺綠＝中間一半的人（P25 ' + wan(s.p25) + '～P75 ' + wan(s.p75) +
      '）；深綠線＝中位數。尺規兩端是 P10 與 P90，超出範圍的會貼在邊緣。</div>' +
  '</div>';
}

function ngMemo(p, me, rank, askLo, askHi) {
  var L = [];
  L.push('薪資談判備忘 —— 資料來源：' + BOOT.title + '（' + ST.year + ' 年度，有效樣本 ' +
    ST.total + ' 份，' + ST.generatedAt + '）');
  L.push('');
  L.push('【比較基準】' + p.basis + '：' + p.label + '　樣本 n=' + p.m.n);
  L.push('【這一組的月薪】P25 ' + wan(p.m.p25) + '　中位數 ' + wan(p.m.median) +
    '　P75 ' + wan(p.m.p75));
  if (has(p.a)) {
    L.push('【這一組的全年本業總收入】P25 ' + wan(p.a.p25) + '　中位數 ' + wan(p.a.median) +
      '　P75 ' + wan(p.a.p75));
  }
  L.push('【我目前月薪】' + wan(me) + '　位置約第 ' + rank + ' 百分位');
  L.push('');
  L.push('【開口區間】' + wan(askLo) + ' ～ ' + wan(askHi));
  L.push('【底線】' + wan(p.m.median) + '（這一組的中間值）');
  L.push('');
  L.push('【三個支撐理由，開會前自己填完】');
  L.push('1. 行情：' + p.label + '的月薪中間值是 ' + wan(p.m.median) + '，樣本 n=' + p.m.n);
  L.push('2. 成果：（可量化的，例如稽核缺失改善件數、職災與虛驚件數變化、通過的評鑑、避免的罰則）');
  L.push('3. 職責變動：（接新廠區／新增承攬商管理／兼任其他專責／帶教人數）');
  L.push('');
  L.push('【要問清楚的三件事】');
  L.push('· 我現在在公司薪資級距的哪一級，下一級的區間是多少');
  L.push('· 調到下一級需要什麼條件、由誰決定、什麼時候複核');
  L.push('· 這次談不動的話，下一次複核是什麼時候、用什麼指標驗收');
  return L.join(NL);
}

function ngRes() {
  var M = micro();
  if (!M) return '';
  var me = Number(NG.m);
  if (!(me > 0)) {
    return '<p class="me-ask">填入月薪後，這裡會算出你在那一組裡的位置、建議的開口區間，' +
      '還有一份可以複製帶去開會的備忘。數字只留在你的瀏覽器裡，不會送回伺服器、也不會存檔。</p>';
  }
  var p = ngPeer();
  if (!p) {
    return '<p class="me-ask">這組條件的樣本不足 ' + M.minCellN + ' 筆，不顯示任何數字。' +
      '請把行業別或年資改成「不分」再看一次。</p>';
  }
  var rank = ngRank(p.vals, me);
  var em = (ST.analysis && Number(ST.analysis.effMonths) > 0) ? Number(ST.analysis.effMonths) : 12;
  var emT = Math.round(em * 10) / 10;

  // 開口：下半段的人錨在中位數～P75；過了中位數的錨在 P75；已在前 25% 的就別再拿
  // 同組行情當籌碼 —— 那一段要靠職級、證照或換公司，不是「同年資的人領多少」
  var askLo, askHi, verdict;
  if (rank < 50) {
    askLo = p.m.median; askHi = p.m.p75;
    verdict = '你落在這一組的下半段。把開口錨在<b>中位數到 P75</b> 這一段，有行情可以指；' +
      (me < p.m.p25
        ? '而且你目前還低於 P25（' + wan(p.m.p25) + '），這是整份報告裡最該優先處理的落差。'
        : '先把中位數拿到，再談上面那一半。');
  } else if (rank < 75) {
    askLo = p.m.median; askHi = p.m.p75;
    verdict = '你已經在這一組的中位數之上。合理的開口是<b>往 P75（' + wan(p.m.p75) +
      '）靠</b>，再往上就要有對應的條件才站得住。';
  } else {
    askLo = p.m.p75; askHi = p.m.p90;
    verdict = '你已經在這一組的前 25%（P75 = ' + wan(p.m.p75) + '）。' +
      '<b>同組行情能幫你的到這裡為止</b> —— 再往上的籌碼是職級、證照、外語或換公司，' +
      '不是「同年資的人領多少」。';
  }
  var gap = p.m.median - me;
  var nx = ngNextBand(p);

  var tiles =
    '<div class="me-t">' +
      '<div><div class="k">這一組的中位數</div><div class="v">' + wan(p.m.median) +
        '</div><div class="u">月薪　n=' + p.m.n + '</div></div>' +
      '<div><div class="k">這一組的 P75</div><div class="v">' + wan(p.m.p75) +
        '</div><div class="u">前 25% 的門檻</div></div>' +
      '<div class="' + (gap > 0 ? 'dn' : 'up') + '"><div class="k">你與中位數的差</div>' +
        '<div class="v">' + (gap === 0 ? '0' : (gap > 0 ? '-' : '+') + wan(Math.abs(gap))) +
        '</div><div class="u">每月' + (gap > 0 ? '少' : '多') + '　全年約 ' +
        wan(Math.abs(gap) * em) + '</div></div>' +
    '</div>';

  var askBox =
    '<div class="ask"><h5>你的開口區間</h5>' +
      '<div class="big">' + wan(askLo) + ' ～ ' + wan(askHi) + '</div>' +
      '<p>' + verdict + '</p>' +
      '<p>換算全年：這份調查裡最中間的人，年收入大約是 ' + emT +
        ' 個月的月薪，所以月薪每差 1 萬，全年大約差 ' + emT + ' 萬。' +
        '月薪談不動的時候，年終月數與加班費給付方式是同一個議題的另一半。</p></div>';

  var nextBox = '';
  if (nx && Number(nx.m.median) > 0) {
    var up = p.m.median > 0 ? Math.round((nx.m.median - p.m.median) / p.m.median * 1000) / 10 : null;
    nextBox = '<div class="ask next"><h5>再上一個年資帶</h5>' +
      '<div class="big">' + esc(nx.band) + '：' + wan(nx.m.median) +
        (up === null ? '' : '　<span style="font-size:14px;color:var(--ink-3)">' + sgn(up) + '</span>') +
      '</div><p>跟上面同一個基準（' + esc(p.basis) + '）算的。' +
        '就算什麼都不改，年資本身大約也值這麼多。這次談的差距如果遠小於它，不值得硬碰；' +
        '如果遠大於它，那就不是年資問題，更該談。</p></div>';
  }

  return '<p class="me-hit">你的月薪 <b>' + wan(me) + '</b>，在 <b>' + esc(p.label) +
      '</b> 這一組（n=' + p.m.n + '）裡大約排在第 <b>' + rank + '</b> 百分位 —— ' +
      '這組裡約 ' + rank + '% 的人月薪比你低。</p>' +
    '<p class="me-basis">比較基準：' + esc(p.basis) +
      (p.narrowed ? '。<b>你選的條件樣本不足 ' + p.minCellN + ' 筆，已自動放寬到這一層</b>' : '') +
      '。n 越小，中位數越容易被一兩筆極端值推動，引用時要連著 n 一起講。</p>' +
    ngRail(p.m, me) + tiles + askBox + nextBox +
    '<div class="memo"><label for="ngMemo" style="display:block;font-size:12.5px;' +
      'font-weight:700;color:var(--ink-2);margin-bottom:6px">可以直接複製帶去開會的備忘</label>' +
      '<textarea id="ngMemo" spellcheck="false" readonly>' +
      esc(ngMemo(p, me, rank, askLo, askHi)) + '</textarea>' +
      '<div class="toolbar noprint" style="margin-top:9px">' +
        '<button class="btn gold" id="ngCopy">複製這份備忘</button>' +
        '<span class="small" id="ngCopyMsg"></span></div></div>';
}

function ngTool() {
  var M = micro();
  if (!M) return '';
  var iy = ngDim('yrs'), ic = ngDim('cat');
  var opts = function (i, sel, anyLabel) {
    if (i < 0) return '<option value="-1">' + anyLabel + '</option>';
    return '<option value="-1">' + anyLabel + '</option>' +
      M.dims[i].values.map(function (v, j) {
        if (!M.dims[i].counts[j]) return '';
        return '<option value="' + j + '"' + (sel === j ? ' selected' : '') + '>' +
          esc(v) + '（' + M.dims[i].counts[j] + '）</option>';
      }).join('');
  };
  return '<div class="me" id="ngBox">' +
    '<p class="me-h">先算出你站在哪裡</p>' +
    '<p class="me-s">填你自己的三個條件。整份報告裡對談判最有用的不是全體中位數，' +
      '而是「跟你條件相近的那一組」的中位數與 P75。這三個欄位只留在你的瀏覽器裡 ——' +
      '不會送回伺服器、不會存檔，重新整理就沒了。</p>' +
    '<div class="me-in">' +
      '<div><label for="ngM">你目前的月薪</label>' +
        '<input type="number" id="ngM" min="0" step="1000" placeholder="例如 55000"' +
        (NG.m > 0 ? ' value="' + NG.m + '"' : '') + '>' +
        '<em>填新台幣「元」；填 5.5 這種小數字會當成萬元</em></div>' +
      '<div><label for="ngY">你的年資</label><select id="ngY">' +
        opts(iy, NG.yrs, '不分年資') + '</select><em>括號是這一組的人數</em></div>' +
      '<div><label for="ngC">你的行業別</label><select id="ngC">' +
        opts(ic, NG.cat, '不分行業') + '</select><em>樣本不足時會自動放寬</em></div>' +
    '</div>' +
    '<div class="me-r" id="ngRes">' + ngRes() + '</div>' +
  '</div>';
}

function bindNego() {
  var box = $('#ngBox');
  if (!box) return;
  var repaint = function () {
    var r = $('#ngRes');
    if (r) r.innerHTML = ngRes();
  };
  var mi = $('#ngM');
  if (mi) {
    mi.addEventListener('input', function () {
      var v = Number(mi.value);
      // 5.5 這種小數字一律當「萬元」：填薪水的人兩種寫法都會出現
      NG.m = (v > 0 && v < 1000) ? Math.round(v * 10000) : (v > 0 ? Math.round(v) : 0);
      repaint();
    });
  }
  var ys = $('#ngY'), cs = $('#ngC');
  if (ys) ys.addEventListener('change', function () { NG.yrs = Number(ys.value); repaint(); });
  if (cs) cs.addEventListener('change', function () { NG.cat = Number(cs.value); repaint(); });

  // 複製鈕每次重畫都會被換掉，所以把 listener 掛在不重畫的外層
  box.addEventListener('click', function (e) {
    var t = e.target;
    var isCopy = false;
    while (t && t !== box) { if (t.id === 'ngCopy') { isCopy = true; break; } t = t.parentNode; }
    if (!isCopy) return;
    var ta = $('#ngMemo'), msg = $('#ngCopyMsg');
    if (!ta) return;
    var done = function (ok) {
      if (msg) msg.textContent = ok ? '已複製到剪貼簿' : '複製失敗，請直接框選上面的文字複製';
    };
    // GAS 把頁面放在跨來源 iframe，clipboard API 常被擋，所以留 execCommand 當退路
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value)
          .then(function () { done(true); }, function () { done(ngCopyFallback(ta)); });
        return;
      }
    } catch (err) { /* 落到下面的退路 */ }
    done(ngCopyFallback(ta));
  });
}

function ngCopyFallback(ta) {
  try {
    ta.removeAttribute('readonly');
    ta.focus(); ta.select();
    var ok = document.execCommand('copy');
    ta.setAttribute('readonly', 'readonly');
    return !!ok;
  } catch (e) { return false; }
}

function ngScroll() {
  var el = $('#negoTop') || $('#ngBox');
  // 跨來源 iframe 裡 window.scrollTo 動不了外層頁面，只有 scrollIntoView 有效
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  var mi = $('#ngM');
  if (mi) setTimeout(function () { try { mi.focus(); } catch (e) {} }, 420);
}

function ngSteps(a) {
  var M = micro();
  var minN = (M && M.minCellN) || 5;
  var em = (a && Number(a.effMonths) > 0) ? Number(a.effMonths) : null;
  var share = (a && Number(a.bonusShare) > 0) ? Number(a.bonusShare) : null;
  var prem = (a && a.premiums) || [];
  var solid = prem.filter(function (p) { return p.verdict === 'solid'; });
  var washed = prem.filter(function (p) {
    return okNum(p.shrink) && p.shrink !== null && p.shrink >= 50 && p.rawPct >= 8;
  });
  var lad = (a && a.ladder) || [];
  var nm = function (p) { return esc(p.label) + '（同年資帶內 ' + sgn(p.adjPct) + '）'; };
  var S = [];

  S.push({ t: '先確定你是在跟誰比',
    b: '<p>薪水沒有「應該多少」，只有「跟誰比、差多少」。拿全體中位數去談，' +
       '最常見的失敗是把年資差異誤當成待遇差異 —— 年資在這份資料裡是解釋力最高的條件之一' +
       '（見「薪資分析」那一段），不先對齊年資，你引用的數字一句話就被拆掉。</p>' +
       '<ul><li><b>第一順位</b>：同年資、同行業別那一格，也就是上面工具算的那一組。</li>' +
       '<li><b>樣本不足時</b>：退成同年資、不分行業，而且<b>自己主動把 n 講出來</b>。' +
         '「這是 ' + minN + ' 人以上樣本的中間值」比「市場行情」可信得多。</li>' +
       '<li><b>不要用</b>：最高那一格、P90、或某個你認識的人的數字。' +
         '引用極端值，對方只要反問一句樣本數就結束了。</li></ul>' });

  S.push({ t: '把目標錨成區間，不是一個數字',
    b: '<p>開口給單一數字，結果只有兩種：被砍，或者你本來就開低了。給區間，' +
       '而且<b>區間的下緣就是你的底線</b>，談完落在哪裡都還在你算過的範圍內。</p>' +
       '<ul><li><b>開口</b>＝你那一組的中位數到 P75；<b>底線</b>＝中位數。進會議室前先寫下來。</li>' +
       '<li><b>讓對方先報</b>。被追問「你期望多少」時，回區間並附依據，不要回一個數字。</li>' +
       (em ? '<li><b>談年總包，不只是月薪</b>。這份調查裡最中間的人，全年收入大約等於 ' +
         (Math.round(em * 10) / 10) + ' 個月的月薪' +
         (share ? '，約 ' + share + '% 的年收入不是來自月薪' : '') +
         ' —— 月薪卡住的時候，年終月數、加班費給付方式、各種津貼是同一個議題的另一半。</li>' : '') +
       (lad.length ? '<li>「談判參考階梯」那張表按年資帶列出 P25／中位數／P75，就是給這一步用的，' +
         '可以直接把你那一列抄進備忘。</li>' : '') +
       '</ul>' +
       '<div class="say"><b>可以這樣說</b>同年資、同行業別的月薪中間值是 X 萬，前四分之一在 Y 萬以上。' +
       '我希望落在這一段的上半，也就是 X 到 Y 萬之間。</div>' });

  S.push({ t: '準備三種證據，缺一種就會被擋回來',
    b: '<p>只講行情，會得到「公司有制度」；只講努力，會得到「大家都很努力」。' +
       '三種一起上，對方才沒有單一出口。</p>' +
       '<ul><li><b>① 行情</b>：你引用的那一格加上樣本數，一句話講完。</li>' +
       '<li><b>② 成果</b>：可量化的那種 —— 稽核缺失開立與結案件數、職災與虛驚件數的變化、' +
         '通過的評鑑或認證、因為提前發現而沒有發生的停工或罰則、帶教的人數、' +
         '代辦的申報與展延件數。<b>寫成數字</b>，不要寫「協助推動」。</li>' +
       (solid.length
         ? '<li><b>③ 條件加成</b>：這份報告裡<b>控制年資後還站得住</b>的只有這幾項 —— ' +
           solid.slice(0, 4).map(nm).join('、') +
           '。它們是「不必等年資熬上去」就能把薪水拉開的籌碼：手上有就拿出來，' +
           '沒有就當成下一年的目標。</li>'
         : '<li><b>③ 條件加成</b>：證照、外語、職級這類條件，要看「控制年資後，還剩多少溢酬」' +
           '那一段 —— 只有控制年資後還在的才拿來談。</li>') +
       (washed.length
         ? '<li><b>反過來，這幾項別當主力</b>：' + washed.slice(0, 2).map(function (p) {
             return esc(p.label) + '（表面差距 ' + sgn(p.rawPct) +
               '，但只跟年資差不多的人比就縮掉 ' + p.shrink + '%）';
           }).join('、') + '。拿縮掉的差距去談，被追問一次就站不住。</li>'
         : '') +
       '</ul>' });

  S.push({ t: '選時機，時機比話術重要',
    b: '<ul><li><b>年度調薪或考績定案前一到兩個月</b>。定案之後再談，主管手上已經沒有額度，' +
         '就算同意你也只能排到明年。</li>' +
       '<li><b>職責實質變動的那一刻</b>：接下新廠區、新增承攬商管理、兼任消防或環保專責、' +
         '多了一張公司要求的證照、接手評鑑。這是最好談的時機 —— ' +
         '主題是「工作變了」，不是「我想加薪」。</li>' +
       '<li><b>手上有具體 offer 時</b>最有力，但只在你真的願意走的時候用。' +
         '虛張聲勢被叫去談留任條件，就沒有退路了。</li>' +
       '<li>避開：剛發生重大職災或稽核缺失的當口、公司剛宣布凍結人事的那一季。</li></ul>' });

  S.push({ t: '對方的四種標準回應，怎麼接',
    b: '<div class="say q"><b>「公司有薪資制度、有級距。」</b>' +
         '不要辯，把它變成時間表：我現在在哪一級、下一級的區間是多少、要什麼條件才會調級、' +
         '由誰決定、什麼時候複核。問完這五個問題，這場談話就從「能不能加」' +
         '變成「什麼時候加」。</div>' +
       '<div class="say q"><b>「今年預算用完了。」</b>' +
         '接受時間，不接受不談：那我們把條件與金額先寫下來，下一個週期生效，' +
         '中間用什麼指標驗收。至少留下一封 mail。</div>' +
       '<div class="say q"><b>「你的年資還不到。」</b>' +
         '這點在資料上確實站得住，硬拗會失分。把話題移到第 3 步的第二種證據：' +
         '年資我還在累積，但目前負責的範圍與產出已經是哪一級的工作，我希望待遇對齊工作。</div>' +
       '<div class="say q"><b>「外面的調查數字不準。」</b>' +
         '同意它不精準，再把它當區間用：這是自願填答的樣本、不是官方統計，' +
         '所以我引用的是中間段、不是最高段，而且附了樣本數。' +
         '如果公司有自己的薪資調查，我更想看你們用的那一份。</div>' });

  S.push({ t: '談完當天就把結論寫下來',
    b: '<p>口頭答應在三個月後會變成「我記得不是這樣」。當天寄一封信給主管，' +
       '只寫事實、不帶情緒，讓它成為下一次談話的起點。</p>' +
       '<div class="say"><b>當天這樣寄</b>謝謝今天的時間，確認一下我理解的內容：' +
       '① 目前月薪 ___，調整後 ___，生效 ___；' +
       '② 本次未能調整的部分，在 ___ 月複核，屆時看 ___ 指標；' +
       '③ 我接下來會補齊的條件是 ___。如有理解不同，請直接回覆更正。</div>' +
       '<p>沒談成也要寄。半年後你拿著這封信回去，講的就不是「我想加薪」，' +
         '而是「上次說好的指標我達到了」。</p>' });

  return '<h3 style="margin-top:30px">六個步驟</h3><div class="ng">' +
    S.map(function (s, i) {
      return '<div class="ng-s"><div class="no">' + (i + 1) + '</div><div>' +
        '<h4>' + s.t + '</h4>' + s.b + '</div></div>';
    }).join('') + '</div>' +
    '<div class="ng-w"><h4>這份報告不能幫你做的事</h4><ul>' +
    '<li>這是<b>自願填答的網路樣本，不是隨機抽樣</b>。願意花十分鐘填薪資問卷的人，' +
      '本身就不是全體環安衛人員的隨機縮影，不能當官方薪資統計引用。</li>' +
    '<li><b>中位數不等於「我應得」</b>。它只是一半人的位置；你那一組有一半的人就在它之下，' +
      '而且其中很多人的條件跟你並不一樣。</li>' +
    '<li><b>不要謊報現職薪水</b>。勞保級距、資遣或離職證明、前公司的在職資料都查得到，' +
      '一次就把信任用完。</li>' +
    '<li>子集合的 n 接近 ' + minN + ' 的時候，任何一筆極端值都會明顯推動中位數。' +
      '引用時連著 n 一起講，別讓對方替你發現這件事。</li>' +
    '<li>不要把整份報告截圖丟給主管。<b>挑出你引用的那一列</b>就好 —— ' +
      '丟整份只會讓對話變成「討論這份調查可不可信」。</li>' +
    '</ul></div>';
}

function secNegotiate(a) {
  return '<h2 class="sec" id="negoTop">怎麼用這份報告談薪水</h2>' +
    '<div class="card">' +
    '<p class="lead">這一段不是統計，是用法。前面的百分位、溢酬、年資曲線都只是材料，' +
      '真正要回答的是三件事：<b>我現在在哪裡</b>、<b>該開多少</b>、<b>開口之後怎麼接話</b>。' +
      '下面先用你自己的數字算出前兩件，再把第三件拆成六步。</p>' +
    ngTool() +
    (micro() ? '' : '<p class="small">（樣本資料不足，自我定位工具暫時無法使用，' +
      '下面的步驟仍然適用。）</p>') +
    ngSteps(a) +
    '</div>';
}

/* 章節組裝：後台排好的順序存在 BOOT.order，這裡照著叫對應的 sec 函式。
   「薪資分析」是五個函式串成的一塊，當一個章節處理。 */
var SEC = {
  summary:  function (a) { return secSummary(a); },
  negotiate: function (a) { return secNegotiate(a); },
  salary:   function ()  { return secSalary(); },
  cross:    function ()  { return secCross(); },
  profile:  function ()  { return secProfile(ST.profile); },
  multi:    function ()  { return secMulti(ST.multi); },
  analysis: function (a) {
    return secDrivers(a) + secCurve(a) + secPremiums(a) + secSpread(a) + secLadder(a);
  },
  filter:   function ()  { return secFilter(); },
  caveats:  function (a) { return secCaveats(a); }
};
var SEC_FALLBACK = ['summary', 'negotiate', 'salary', 'cross', 'profile', 'multi', 'analysis', 'filter', 'caveats'];

function buildSections(a) {
  var order = (BOOT.order && BOOT.order.length) ? BOOT.order : SEC_FALLBACK;
  var seen = {}, out = [];
  order.forEach(function (k) { if (SEC[k] && !seen[k]) { seen[k] = true; out.push(k); } });
  // 後台設定裡沒提到的章節補在最後，免得改版新增的區塊被舊設定吃掉
  SEC_FALLBACK.forEach(function (k) { if (!seen[k]) out.push(k); });
  return out.map(function (k) { return SEC[k](a); }).join('');
}

function bind() {
  // 同一顆鈕在 hero 與執行摘要工具列各有一個，所以用 data 屬性而不是 id
  Array.prototype.forEach.call(document.querySelectorAll('[data-nego]'), function (b) {
    b.addEventListener('click', ngScroll);
  });
  bindNego();

  var rf = $('#bRefresh');
  if (rf) {
    rf.addEventListener('click', function () {
      rf.disabled = true; rf.textContent = '統計中…';
      google.script.run
        .withSuccessHandler(function (s) { ST = s; MI = null; FL = {}; render(); })
        .withFailureHandler(function (e) {
          rf.disabled = false; rf.textContent = '重新整理統計';
          alert(e && e.message ? e.message : '統計失敗');
        })
        .apiStats(true);
    });
  }
  ['hmR', 'hmC', 'hmK'].forEach(function (id) {
    var el = $('#' + id);
    if (!el) return;
    el.addEventListener('change', function () {
      if (id === 'hmK') HM.k = el.value;
      else {
        var v = Number(el.value);
        var other = (id === 'hmR') ? HM.c : HM.r;
        if (v === other) {   // 兩邊選到同一個維度，就把原本那邊換成對方
          if (id === 'hmR') { HM.c = HM.r; $('#hmC').value = String(HM.c); }
          else { HM.r = HM.c; $('#hmR').value = String(HM.r); }
        }
        if (id === 'hmR') HM.r = v; else HM.c = v;
      }
      $('#hmBox').innerHTML = crossBody();
    });
  });
}

document.addEventListener('click', function (e) {
  if (!e.target.closest) return;
  var chip = e.target.closest('[data-fl]');
  if (chip) {
    var i = Number(chip.getAttribute('data-fl')), j = Number(chip.getAttribute('data-v'));
    var sel = FL[i] || (FL[i] = []);
    var at = sel.indexOf(j);
    if (at >= 0) sel.splice(at, 1); else sel.push(j);
    chip.classList.toggle('on', at < 0);
    var row = chip.closest('.fl-row');
    if (row) {
      var em = row.querySelector('.n em');
      if (em) em.textContent = sel.length ? '已選 ' + sel.length + ' 項' : '全部';
    }
    $('#flRes').innerHTML = flBody();
    return;
  }
  var rs = e.target.closest('[data-flreset]');
  if (rs) {
    FL = {};
    $('#flBox').innerHTML = flRows();
    $('#flRes').innerHTML = flBody();
  }
});

render();
</script>
