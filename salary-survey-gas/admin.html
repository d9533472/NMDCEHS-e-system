<!-- 系統後台（?page=admin）：清除資料、隨機抽獎、刪除紀錄 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1b2b; --ink-2:#2a4259; --ink-3:#64798c; --ink-4:#93a6b6;
  --line:#e2e9f0; --line-2:#eff4f8; --bg:#f4f7fa; --card:#fff;
  --brand:#0e7a53; --brand-2:#13946a; --brand-dk:#0a5c3e;
  --brand-soft:#e8f5ef; --brand-line:#bfe0d1;
  --gold:#b8862b; --gold-soft:#fdf5e3; --gold-line:#ecd9a8;
  --red:#b0341f; --red-soft:#fdeeea; --red-line:#f0c4b8;
  --r:18px; --sh:0 2px 4px rgba(11,27,43,.04),0 12px 32px -8px rgba(11,27,43,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 80px}
.num{font-variant-numeric:tabular-nums}

.hero{position:relative;overflow:hidden;color:#fff;padding:34px 0 48px;
  background:radial-gradient(760px 300px at 86% -20%,rgba(19,148,106,.4),transparent 62%),
    linear-gradient(152deg,#13304c,#07131f)}
.hero .wrap{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:#7fd6ad;margin-bottom:11px;
  background:rgba(127,214,173,.1);border:1px solid rgba(127,214,173,.26);
  border-radius:999px;padding:5px 13px}
.hero h1{margin:0;font-size:27px;font-weight:900;letter-spacing:-.01em}
.hero .sub{opacity:.7;font-size:13.5px;margin-top:5px}
.hazard{position:absolute;left:0;right:0;bottom:0;height:7px;z-index:2;
  background:repeating-linear-gradient(135deg,#ffc94d 0 14px,#13304c 14px 28px);opacity:.9}
.back{position:absolute;top:18px;right:18px;z-index:3;display:inline-flex;align-items:center;gap:7px;
  padding:8px 15px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none;
  color:rgba(255,255,255,.72);background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);transition:.18s}
.back:hover{color:#fff;background:rgba(127,214,173,.2);border-color:rgba(127,214,173,.42)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:24px 26px;margin:18px 0}
.card:first-of-type{margin-top:-30px;position:relative;z-index:3}
h2{margin:0 0 4px;font-size:18px;font-weight:700}
.hint{color:var(--ink-3);font-size:13px;margin:0 0 16px}

label.f{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
input[type=password],input[type=text],input[type=number]{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;
  font:inherit;font-size:15px;background:#fff;color:var(--ink)}
input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(14,122,83,.12)}

.btn{border:0;border-radius:12px;padding:12px 22px;font:inherit;font-size:14.5px;font-weight:700;
  cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px;
  text-decoration:none}
.btn.p{background:linear-gradient(145deg,var(--brand-2),var(--brand));color:#fff;
  box-shadow:0 2px 6px rgba(14,122,83,.26)}
.btn.p:hover{background:linear-gradient(145deg,var(--brand),var(--brand-dk))}
.btn.g{background:#fff;color:var(--ink-2);border:1.5px solid var(--line)}
.btn.g:hover{border-color:#c3d2df;background:#fbfdff}
.btn.d{background:#fff;color:var(--red);border:1.5px solid var(--red-line)}
.btn.d:hover{background:var(--red-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:6px}
.st{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fafcfd}
.st .k{font-size:12px;color:var(--ink-3)}
.st .v{font-size:27px;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--ink)}
.st.ok .v{color:var(--brand-dk)} .st.warn .v{color:var(--red)}

.danger{border:2px solid var(--red-line);background:linear-gradient(170deg,#fef6f3,#fff);
  border-radius:var(--r);padding:18px 20px;margin-top:18px;position:relative;overflow:hidden}
.danger::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
  background:repeating-linear-gradient(135deg,#e07a5f 0 9px,#b0341f 9px 18px)}
.danger h3{margin:0 0 4px 8px;font-size:15.5px;font-weight:900;color:var(--red)}
.danger p{margin:0 0 13px 8px;font-size:13px;color:var(--ink-2)}
.danger .btns{margin-left:8px}

.msg{border-radius:11px;padding:11px 14px;font-size:13.5px;margin-top:14px;line-height:1.65}
.msg.ok{background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--brand-dk)}
.msg.err{background:var(--red-soft);border:1px solid var(--red-line);color:var(--red)}
.hidden{display:none !important}

table{border-collapse:collapse;width:100%;font-size:13px;margin-top:12px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}
th{background:var(--line-2);font-size:12px;color:var(--ink-3);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.out td{background:#fdf6f4;color:var(--red)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}

.win{border:1px solid var(--gold-line);background:var(--gold-soft);border-radius:13px;
  padding:14px 16px;margin-top:12px}
.win ol{margin:0;padding-left:22px}
.win li{margin:7px 0;font-size:14px}
.win .em{font-weight:700}
.win .sub{font-size:12.5px;color:#8a6516}
.lock{max-width:400px;margin:0 auto}
.mode{margin-top:14px;background:var(--brand-soft);border:1px solid var(--brand-line);
  border-radius:11px;padding:11px 14px;font-size:13.5px;color:var(--brand-dk);line-height:1.65}
.mode em{display:block;font-style:normal;font-size:12.5px;color:var(--ink-3);margin-top:3px}
.mode code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 5px;
  font-size:11.5px;font-family:ui-monospace,Consolas,monospace}

/* 異常值審核 */
.ol{border:1px solid var(--red-line);background:linear-gradient(170deg,#fef7f5,#fff);
  border-radius:13px;padding:14px 16px;margin-bottom:12px}
.ol.inc{border-color:var(--brand-line);background:linear-gradient(170deg,#f4faf7,#fff)}
.ol-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.tagk{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 10px}
.tagk.no{color:var(--red);background:var(--red-soft);border:1px solid var(--red-line)}
.tagk.ok{color:var(--brand-dk);background:var(--brand-soft);border:1px solid var(--brand-line)}
.tagk.src{color:#8a6516;background:var(--gold-soft);border:1px solid var(--gold-line)}
.ol-r{font-size:13px;color:var(--red);font-weight:600;margin-bottom:9px}
.ol.inc .ol-r{color:var(--ink-3);font-weight:400}
.ol-d{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.ol-d em{font-style:normal;color:var(--ink-4);font-size:11.5px;margin-right:5px}
.ol-c{display:inline-flex;align-items:center;gap:8px;margin-top:11px;cursor:pointer;
  background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:7px 13px;
  font-size:13.5px;font-weight:700;color:var(--ink-2);transition:.15s}
.ol-c:hover{border-color:var(--brand)}
.ol.inc .ol-c{border-color:var(--brand);color:var(--brand-dk);background:var(--brand-soft)}
.ol-c input{accent-color:var(--brand);cursor:pointer;margin:0}
.ol-a{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:11px}
.ol-a .ol-c{margin-top:0}
.ol-e{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;
  font:inherit;font-size:13.5px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:.15s}
.ol-e:hover{border-color:var(--gold);color:#8a6516;background:var(--gold-soft)}
.ol-f{margin-top:12px;padding:13px 15px;border-radius:12px;
  background:#fff;border:1.5px solid var(--gold-line)}
.ol-f>p{margin:0 0 11px;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.ol-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px}
.ol-g label{display:block}
.ol-g em{display:block;font-style:normal;font-size:11.5px;font-weight:700;
  color:var(--ink-3);margin-bottom:3px}
.ol-g input{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;
  font:inherit;font-size:14px;font-variant-numeric:tabular-nums}
.ol-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.ol-b button{border:0;border-radius:10px;padding:8px 16px;font:inherit;font-size:13.5px;
  font-weight:700;cursor:pointer;transition:.15s}
.ol-s{background:var(--brand);color:#fff}
.ol-s:hover{background:var(--brand-dk)}
.ol-s:disabled{opacity:.55;cursor:default}
.ol-x{background:var(--line-2);color:var(--ink-2)}
.ol-r2{background:var(--gold-soft);color:#8a6516;border:1.5px solid var(--gold-line) !important}
/* ── 統計數據 ── */
.sec{margin:22px 0 0}
.sec:first-child{margin-top:0}
.sec>h3{font-size:14px;font-weight:900;letter-spacing:.3px;margin:0 0 3px;
  display:flex;align-items:center;gap:8px;color:var(--ink)}
.sec>h3::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--brand)}
.sec>p{margin:0 0 11px;font-size:12.5px;color:var(--ink-3)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:10px}
.kpi>div{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fafcfd}
.kpi b{display:block;font-size:22px;font-weight:900;line-height:1.25;
  font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--ink-3);font-weight:700}
.kpi .hot b{color:var(--brand)} .kpi .bad b{color:var(--red)}
.prog{margin-top:11px;background:var(--line-2);border:1px solid var(--line);
  border-radius:99px;height:22px;position:relative;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand-2),var(--brand))}
.prog span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.prog.done span{color:#fff}
.trend{display:flex;align-items:flex-end;gap:3px;height:76px;margin-top:4px;
  border-bottom:1px solid var(--line);padding-bottom:0}
.trend>div{flex:1;position:relative;display:flex;flex-direction:column;
  justify-content:flex-end;align-items:center;height:100%}
.trend i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--brand-2);min-height:2px}
.trend i.z{background:var(--line)}
.trend b{font-size:10px;font-weight:800;color:var(--brand-dk);line-height:1.2}
.trend-x{display:flex;gap:3px;margin-top:5px}
.trend-x>div{flex:1;text-align:center;font-size:9.5px;color:var(--ink-4);
  font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.box{border:1px solid var(--line);border-radius:13px;padding:13px 15px;background:#fafcfd;
  margin-bottom:10px}
.box-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:13px;font-weight:800;margin-bottom:10px}
.box-h em{font-style:normal;font-weight:700;color:var(--brand-dk);
  font-variant-numeric:tabular-nums}
.bxw{margin:0 13px}
.bx{position:relative;height:30px}
.bx u{position:absolute;left:0;right:0;top:14px;height:2px;background:var(--ink-4);
  text-decoration:none}
.bx s{position:absolute;top:8px;width:2px;height:14px;background:var(--ink-4);
  text-decoration:none}
.bx q{position:absolute;top:5px;height:20px;border-radius:5px;quotes:none;
  background:var(--brand-soft);border:1.5px solid var(--brand)}
.bx q::before,.bx q::after{content:""}
.bx o{position:absolute;top:1px;width:3px;height:28px;border-radius:2px;background:var(--brand-dk)}
.bx i{position:absolute;top:11px;width:10px;height:10px;border-radius:50%;
  background:var(--gold);border:2px solid #fff;box-sizing:border-box}
.bx b{position:absolute;top:5px;font-size:17px;font-weight:900;line-height:1;color:var(--ink-4)}
.bx b.lo{left:-11px} .bx b.hi{right:-11px}
.bx-med{position:relative;height:17px;font-size:11.5px;font-variant-numeric:tabular-nums}
.bx-med span{position:absolute;bottom:0;transform:translateX(-50%);white-space:nowrap;
  font-weight:800;color:var(--brand-dk)}
.bx-x{position:relative;height:16px;margin-top:3px;font-size:10.5px;color:var(--ink-4);
  font-variant-numeric:tabular-nums}
.bx-x span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.bx-med span.l,.bx-x span.l{transform:none}
.bx-med span.r,.bx-x span.r{transform:translateX(-100%)}
.bx-n{margin:9px 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:99px;
  padding:6px 14px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);
  cursor:pointer;transition:.15s}
.tabs button:hover{border-color:var(--brand)}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rk{display:grid;grid-template-columns:minmax(74px,auto) 1fr;gap:5px 10px;align-items:center}
.rk>div:nth-child(odd){font-size:12.5px;font-weight:700;color:var(--ink-2);text-align:right;
  line-height:1.3}
.rk>div:nth-child(odd) em{font-style:normal;display:block;font-size:10.5px;
  color:var(--ink-4);font-weight:700;font-variant-numeric:tabular-nums}
.rb{position:relative;background:var(--line-2);border-radius:7px;height:26px;overflow:hidden}
.rb i{position:absolute;inset:0 auto 0 0;border-radius:7px;
  background:linear-gradient(90deg,var(--brand-2),var(--brand))}
.rb b{position:absolute;top:0;bottom:0;display:flex;align-items:center;white-space:nowrap;
  font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
.rk.thin .rb{height:20px}
.rk .low .rb i{background:var(--ink-4);opacity:.45}
.rk .low{opacity:.72}
.hm{overflow-x:auto;margin:0 -3px}
.hm table{border-collapse:separate;border-spacing:3px;font-size:11.5px;
  font-variant-numeric:tabular-nums}
.hm th{font-size:10.5px;color:var(--ink-3);font-weight:800;padding:2px 5px;white-space:nowrap}
.hm th.rh{text-align:right;max-width:120px;white-space:normal;line-height:1.3}
.hm td{border-radius:7px;padding:6px 8px;text-align:center;min-width:62px;
  background:var(--line-2);color:var(--ink-4);line-height:1.35}
.hm td b{display:block;font-size:12.5px;font-weight:800}
.hm td i{font-style:normal;font-size:9.5px;opacity:.8}
.hm td.v{color:#fff} .hm td.v.lo{color:var(--ink)}
.hm td.na{color:var(--ink-4)}
.hm td.few{outline:1.5px dashed var(--ink-4);outline-offset:-1.5px}
.hm-lg{display:flex;align-items:center;gap:6px;margin:0 0 9px;
  font-size:10.5px;font-weight:800;color:var(--ink-3)}
.hm-lg i{flex:0 0 118px;height:8px;border-radius:5px;
  background:linear-gradient(90deg,rgba(14,122,83,.1),rgba(14,122,83,.92))}
.hm-lg em{font-style:normal;font-weight:700;color:var(--ink-4)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{border:1px solid var(--line);border-radius:13px;padding:12px 14px}
.cmp .a{background:var(--gold-soft);border-color:var(--gold-line)}
.cmp .b{background:var(--brand-soft);border-color:var(--brand-line)}
.cmp h4{margin:0 0 7px;font-size:12px;font-weight:900;letter-spacing:.2px}
.cmp .a h4{color:#8a6516} .cmp .b h4{color:var(--brand-dk)}
.cmp dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 9px;font-size:12.5px}
.cmp dt{color:var(--ink-3);font-weight:700}
.cmp dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.q-list{display:grid;gap:4px}
.q-list>div{display:grid;grid-template-columns:minmax(76px,auto) 1fr 58px;gap:9px;
  align-items:center;font-size:12.5px}
.q-list .nm{font-weight:700;color:var(--ink-2);text-align:right}
.q-list .tr{background:var(--line-2);border-radius:5px;height:9px;overflow:hidden}
.q-list .tr i{display:block;height:100%;border-radius:5px;background:var(--gold)}
.q-list .pc{font-weight:800;color:var(--ink-3);font-variant-numeric:tabular-nums;
  text-align:right;font-size:12px}
.q-list .good .tr i{background:var(--brand-2)}
@media(max-width:600px){
  .cmp{grid-template-columns:1fr}
  .trend{height:60px} .trend b{font-size:9px}
  .rk{grid-template-columns:minmax(62px,auto) 1fr}
}
@media(max-width:600px){ .card{padding:19px 16px} .hero h1{font-size:22px} }
</style>

<script>
var BOOT = <?!= BOOT ?>;
var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
var fmt = function (n) {
  if (n === null || n === undefined || n === '' || isNaN(n)) return '—';
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
};

var PW = '';
var SUM = null;
var CONFIRM_ON = true;   // 危險操作前是否跳確認對話框

function call(fn, args, ok, fail) {
  // 注意：必須把 runner 本身當 receiver，用 apply(null, ...) 會讓 google.script.run 失效
  var runner = google.script.run
    .withSuccessHandler(function (r) {
      if (r && r.ok === false) { (fail || defaultFail)(r.error || '操作失敗'); return; }
      ok(r);
    })
    .withFailureHandler(function (e) { (fail || defaultFail)((e && e.message) || String(e)); });
  runner[fn].apply(runner, args);
}
function defaultFail(m) { toast(m, 'err'); }
function toast(m, kind) {
  var el = $('#msg');
  if (!el) { alert(m); return; }
  el.className = 'msg ' + (kind || 'ok');
  el.innerHTML = m;
  el.classList.remove('hidden');
}

/* 匯入前的來源盤點：來源幾筆／可解析幾筆／已進來幾筆／還差幾筆 */
function loadLegacyScan() {
  var box = $('#impScan');
  if (!box) return;
  call('adminLegacyScan', [PW], function (r) {
    if (!$('#impScan')) return;
    $('#impScan').innerHTML = '來源試算表共 <b>' + r.total + '</b> 筆，可解析 <b>' +
      r.usable + '</b> 筆（' + r.skipped + ' 筆因薪資／年資／工作地填寫無法解析而略過）；' +
      '目前已匯入 <b>' + r.imported + '</b> 筆，' +
      (r.pending ? '還有 <b style="color:var(--red)">' + r.pending + '</b> 筆沒進來。'

/* ── 統計數據 ── */
var STD = null;      // adminStats 的回傳
var STDIM = 0;       // 分組排行榜目前的維度

// 金額一律換成「萬」，欄位才不會被長數字撐開
function wan(v) {
  if (v === null || v === undefined || v === '' || isNaN(v)) return '—';
  var n = Number(v) / 10000;
  return (n >= 100 ? Math.round(n) : Math.round(n * 10) / 10) + '萬';
}
function pc(v) { return (Math.round(v * 10) / 10) + '%'; }

function loadStats() {
  var box = $('#stats');
  if (!box) return;
  box.innerHTML = '<p class="hint" style="margin:0">載入中…</p>';
  call('adminStats', [PW],
    function (d) { STD = d; renderStats(); },
    function (m) { box.innerHTML = '<div class="msg err">' + esc(m) + '</div>'; });
}

function renderStats() {
  var d = STD, box = $('#stats');
  if (!d) return;
  if (!d.valid) {
    box.innerHTML = '<p class="hint" style="margin:0">目前還沒有有效資料，統計無法計算。</p>';
    return;
  }
  box.innerHTML =
    secIntake(d) + secSalary(d) + secRank(d) + secCross(d) + secSource(d) + secQuality(d) +
    '<p class="hint" style="margin:18px 0 0;text-align:right">統計時間 ' + esc(d.generatedAt) +
    '　|　已排除 ' + d.outliers + ' 筆異常值</p>';
  bindRankTabs();
}

/* ① 回收儀表 */
function secIntake(d) {
  var goal = d.minPublicN, prog = Math.min(100, d.valid / goal * 100);
  var peak = 1;
  d.days.forEach(function (x) { if (x.count > peak) peak = x.count; });
  return '<div class="sec"><h3>回收儀表</h3>' +
    '<p>公開門檻為 ' + goal + ' 份有效資料；未達標時，受訪者送出後只會看到「待累積」而不是百分位。</p>' +
    '<div class="kpi">' +
      '<div><b class="num">' + d.total + '</b><span>累計筆數</span></div>' +
      '<div class="hot"><b class="num">' + d.valid + '</b><span>有效樣本</span></div>' +
      '<div><b class="num">' + d.weekCount + '</b><span>近 7 天新增</span></div>' +
      '<div class="' + (d.outliers ? 'bad' : '') + '"><b class="num">' + d.outliers +
        '</b><span>排除異常值</span></div>' +
      '<div><b class="num">' + d.bySource.fresh.n + '</b><span>真實新回覆</span></div>' +
    '</div>' +
    '<div class="prog' + (prog >= 100 ? ' done' : '') + '"><i style="width:' + prog + '%"></i>' +
      '<span>' + (d.valid >= goal ? '已達公開門檻（' + goal + ' 份）' :
        '還差 ' + (goal - d.valid) + ' 份才達公開門檻') + '</span></div>' +
    '<p style="margin:14px 0 2px;font-size:12.5px;color:var(--ink-3);font-weight:700">' +
      '每日回收（近 21 天）</p>' +
    '<div class="trend">' + d.days.map(function (x) {
      var h = Math.round(x.count / peak * 54);
      return '<div>' + (x.count ? '<b>' + x.count + '</b>' : '') +
        '<i class="' + (x.count ? '' : 'z') + '" style="height:' + (x.count ? h : 2) + 'px"></i></div>';
    }).join('') + '</div>' +
    '<div class="trend-x">' + d.days.map(function (x, i) {
      return '<div>' + (i % 3 === 0 || i === d.days.length - 1 ? esc(x.label) : '') + '</div>';
    }).join('') + '</div>' +
    '</div>';
}

/* ② 薪資核心：箱型圖式橫條 */
function bxBar(s) {
  if (!s || s.median === null) return '<p class="hint" style="margin:0">沒有可用數字。</p>';
  // 鬚線取 Tukey 1.5 倍四分位距：只要有一筆離譜的數字，min~max 刻度就會把整個盒子壓到最左邊
  var iqr = s.p75 - s.p25;
  var lo = s.min, hi = s.max;
  if (iqr > 0) {
    lo = Math.max(s.min, s.p25 - 1.5 * iqr);
    hi = Math.min(s.max, s.p75 + 1.5 * iqr);
  }
  if (!(hi > lo)) { lo = s.min; hi = s.max; }
  var span = (hi - lo) || 1;
  var at = function (v) { return Math.max(0, Math.min(100, (v - lo) / span * 100)); };
  var p25 = at(s.p25), p75 = at(s.p75), med = at(s.median), mean = at(s.mean);
  var outLo = s.min < lo, outHi = s.max > hi;
  // 標籤直接錨在自己的記號下方；太靠邊就改成靠邊對齊，免得被切掉
  var tag = function (pos, txt, extra) {
    var cls = pos < 7 ? ' class="l' + (extra || '') + '"'
            : pos > 93 ? ' class="r' + (extra || '') + '"'
            : (extra ? ' class="' + extra + '"' : '');
    return '<span' + cls + ' style="left:' + pos + '%">' + txt + '</span>';
  };
  return '<div class="bxw">' +
    '<div class="bx-med">' + tag(med, '中位 ' + wan(s.median)) + '</div>' +
    '<div class="bx">' +
      '<u></u><s style="left:0"></s><s style="right:0"></s>' +
      '<q style="left:' + p25 + '%;width:' + Math.max(1, p75 - p25) + '%"></q>' +
      '<o style="left:calc(' + med + '% - 1.5px)"></o>' +
      '<i style="left:calc(' + mean + '% - 5px)"></i>' +
      (outLo ? '<b class="lo">‹</b>' : '') + (outHi ? '<b class="hi">›</b>' : '') +
    '</div>' +
    '<div class="bx-x">' + tag(0, wan(lo)) + tag(p25, 'P25 ' + wan(s.p25)) +
      tag(p75, 'P75 ' + wan(s.p75)) + tag(100, wan(hi)) + '</div>' +
    (outLo || outHi ?
      '<p class="bx-n">' + (outLo && outHi ? '‹ 和 ›' : outLo ? '‹' : '›') +
      ' 代表鬚線外還有極端值沒有畫進來；實際全距 ' +
      wan(s.min) + ' ～ ' + wan(s.max) + '。</p>' : '') +
    '</div>';
}
function secSalary(d) {
  var one = function (title, s) {
    return '<div class="box"><div class="box-h"><span>' + title + '</span>' +
      '<em>n=' + s.n + '　平均 ' + wan(s.mean) + '</em></div>' + bxBar(s) + '</div>';
  };
  return '<div class="sec"><h3>薪資核心</h3>' +
    '<p>淺綠方塊＝P25～P75（中間一半的人），深綠直線＝中位數，金色圓點＝平均數。' +
    '鬚線只畫到 1.5 倍四分位距，離譜的數字不會把整條刻度拉歪。' +
    '金點明顯落在深綠線右邊，就是少數高薪把平均拉高了。</p>' +
    one('月薪', d.overall.monthly) + one('全年本業總收入', d.overall.annual) +
    '</div>';
}

/* ③ 分組排行榜 */
function secRank(d) {
  return '<div class="sec"><h3>分組排行榜</h3>' +
    '<p>依「年收入中位數」由高到低排。灰色淡化的是樣本數不足 10 的組，數字僅供參考。</p>' +
    '<div class="tabs" id="rankTabs">' + d.groups.map(function (g, i) {
      return '<button data-i="' + i + '" class="' + (i === STDIM ? 'on' : '') + '">' +
        esc(g.title) + '</button>';
    }).join('') + '</div>' +
    '<div id="rankBox">' + rankBody(d) + '</div></div>';
}
function rankBody(d) {
  var g = d.groups[STDIM];
  if (!g || !g.items.length) return '<p class="hint" style="margin:0">這個維度還沒有可用資料。</p>';
  var max = g.items[0].annual.median || 1;
  return '<div class="rk">' + g.items.map(function (it) {
    var w = Math.max(6, it.annual.median / max * 100), few = it.n < 10;
    var inside = w > 38;
    return '<div class="' + (few ? 'low' : '') + '">' + esc(it.label) +
        '<em>n=' + it.n + '</em></div>' +
      '<div class="' + (few ? 'low' : '') + '"><div class="rb"><i style="width:' + w + '%"></i>' +
        '<b style="' + (inside ? 'right:calc(100% - ' + w + '% + 9px);color:#fff' :
          'left:calc(' + w + '% + 9px);color:var(--ink-2)') + '">' +
        wan(it.annual.median) +
        (it.monthly.median !== null ? '　<span style="opacity:.78;font-weight:700">月薪 ' +
          wan(it.monthly.median) + '</span>' : '') +
        '</b></div></div>';
  }).join('') + '</div>';
}
function bindRankTabs() {
  var tabs = $('#rankTabs');
  if (!tabs) return;
  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    STDIM = Number(b.getAttribute('data-i'));
    Array.prototype.forEach.call(tabs.children, function (x, i) {
      x.className = (i === STDIM ? 'on' : '');
    });
    $('#rankBox').innerHTML = rankBody(STD);
  });
}

/* ④ 行業 x 年資 熱力圖 */
function secCross(d) {
  var c = d.cross, vals = [];
  // google.script.run 回傳時會把物件裡的 null 吃掉，空格子的 median 到前端是 undefined，
  // 只用 !== null 擋不住；undefined 一旦混進 vals，lo/hi 就全變 NaN，
  // rgba(...,NaN) 是無效宣告會被瀏覽器整條丟掉，所有格子就退回 CSS 的底色，看起來完全沒上色。
  c.cells.forEach(function (r) {
    r.forEach(function (x) { if (Number(x.median) > 0) vals.push(Number(x.median)); });
  });
  if (!vals.length) return '';
  // 用名次而不是數值比例決定深淺：只要有一格特別高（例如外商 10~15 年的 275 萬），
  // 線性比例會把其餘格子全部壓到最淺的一端，一樣看不出由左往右變深。
  var uniq = vals.slice().sort(function (a, b) { return a - b; })
    .filter(function (v, i, s) { return i === 0 || v !== s[i - 1]; });
  var alpha = function (v) {
    var t = uniq.length < 2 ? 1 : uniq.indexOf(v) / (uniq.length - 1);
    return Math.round((0.1 + t * 0.82) * 100) / 100;
  };
  var head = '<tr><th></th>' + c.cols.map(function (x) {
    return '<th>' + esc(x) + '</th>';
  }).join('') + '</tr>';
  var body = c.rows.map(function (name, ri) {
    return '<tr><th class="rh">' + esc(name) + '</th>' + c.cells[ri].map(function (x) {
      var m = Number(x.median);
      if (!(m > 0)) return '<td class="na"><b>—</b><i>n=' + x.n + '</i></td>';
      var a = alpha(m);
      var cls = 'v' + (a > 0.55 ? '' : ' lo') + (x.n < 10 ? ' few' : '');
      return '<td class="' + cls + '" style="background:rgba(14,122,83,' + a + ')">' +
        '<b>' + wan(m) + '</b><i>n=' + x.n + '</i></td>';
    }).join('') + '</tr>';
  }).join('');
  return '<div class="sec"><h3>行業 × 年資 交叉中位數</h3>' +
    '<p>顏色越深代表年收入中位數越高；虛線框的格子樣本不足 10 筆。' +
    '正常情況下每一列應該由左往右變深，若中間斷掉就是那一段樣本太少。</p>' +
    '<div class="hm-lg"><span>低</span><i></i><span>高</span>' +
      '<em>' + wan(uniq[0]) + '　→　' + wan(uniq[uniq.length - 1]) + '</em></div>' +
    '<div class="hm"><table>' + head + body + '</table></div></div>';
}

/* ⑤ 匯入資料 vs 真實新回覆 */
function secSource(d) {
  var a = d.bySource.imported, b = d.bySource.fresh;
  if (!a.n) return '';
  var dl = function (s) {
    return '<dl><dt>樣本數</dt><dd>' + s.n + '</dd>' +
      '<dt>月薪中位</dt><dd>' + wan(s.monthly.median) + '</dd>' +
      '<dt>年收入中位</dt><dd>' + wan(s.annual.median) + '</dd>' +
      '<dt>年收入 P25</dt><dd>' + wan(s.annual.p25) + '</dd>' +
      '<dt>年收入 P75</dt><dd>' + wan(s.annual.p75) + '</dd></dl>';
  };
  var gap = (a.annual.median && b.annual.median)
    ? Math.round((b.annual.median - a.annual.median) / a.annual.median * 1000) / 10 : null;
  return '<div class="sec"><h3>舊資料 vs 真實新回覆</h3>' +
    '<p>' + esc(d.legacyTag) + '是 111 年度（2022）的收入，混在 2025 年度的統計裡會把中位數往下拉。' +
    '兩邊差距太大時，建議在真實回覆累積足夠後把匯入資料移除。</p>' +
    '<div class="cmp">' +
      '<div class="a"><h4>' + esc(d.legacyTag) + '</h4>' + dl(a) + '</div>' +
      '<div class="b"><h4>真實新回覆</h4>' + dl(b) + '</div>' +
    '</div>' +
    (gap === null ? '' :
      '<p class="hint" style="margin:10px 0 0">新回覆的年收入中位數比匯入資料' +
      (gap >= 0 ? '高 ' : '低 ') + pc(Math.abs(gap)) + '。</p>') +
    '</div>';
}

/* ⑥ 未填率 */
function secQuality(d) {
  var bad = d.quality.filter(function (q) { return q.blank > 0; });
  var full = d.quality.length - bad.length;
  if (!bad.length) {
    return '<div class="sec"><h3>選填欄位的未填率</h3>' +
      '<p style="margin:0">全部 ' + d.quality.length + ' 個追蹤欄位都是 100% 填答，資料很完整。</p></div>';
  }
  return '<div class="sec"><h3>選填欄位的未填率</h3>' +
    '<p>未填率太高的欄位，寫報告時那一段的樣本數會明顯掉下來，必要時可以考慮改成必填或簡化選項。' +
    (full ? '另外 ' + full + ' 個欄位是 100% 填答，已略過不列。' : '') + '</p>' +
    '<div class="q-list">' + bad.map(function (q) {
      return '<div class="' + (q.pct < 10 ? 'good' : '') + '">' +
        '<span class="nm">' + esc(q.label) + '</span>' +
        '<span class="tr"><i style="width:' + Math.max(q.pct, q.pct > 0 ? 1.5 : 0) + '%"></i></span>' +
        '<span class="pc">' + pc(q.pct) + '</span></div>';
    }).join('') + '</div></div>';
}

/* ── 異常值審核 ── */
function numf(label, name, val) {
  return '<label><em>' + label + '</em>' +
    '<input type="number" name="' + name + '" step="1" min="0" value="' +
    (val === '' || val === null || val === undefined || isNaN(val) ? '' : val) + '"></label>';
}

function loadOutliers() {
  var box = $('#outliers');
  if (!box) return;
  call('adminListOutliers', [PW], function (r) {
    if (!r.rows.length) {
      box.innerHTML = '<p class="hint" style="margin:0">目前沒有任何異常值，' +
        '所有資料都已計入統計。</p>';
      return;
    }
    box.innerHTML = r.rows.map(function (x) {
      return '<div class="ol' + (x.included ? ' inc' : '') + '" data-id="' + esc(x.id) + '">' +
        '<div class="ol-h"><span class="mono">' + esc(x.id) + '</span>' +
          '<span class="tagk ' + (x.included ? 'ok' : 'no') + '">' +
            (x.included ? '計入統計' : '排除於統計') + '</span>' +
          (x.source ? '<span class="tagk src">' + esc(x.source) + '</span>' : '') + '</div>' +
        '<div class="ol-r">' + esc(x.reason || '（規則已不再判定為異常）') + '</div>' +
        '<div class="ol-d">' +
          f2('月薪', x.monthly) + f2('年終', x.bonus) + f2('年收入', x.annual) +
          f2('加班/月', x.ot, true) +
          '<span><em>分類</em>' + esc(x.cat || '—') + '</span>' +
          '<span><em>工作地</em>' + esc(x.city || '—') + '</span>' +
          '<span><em>年資</em>' + esc(x.yrs === '' ? '—' : x.yrs) + '</span>' +
        '</div>' +
        '<div class="ol-a">' +
          '<label class="ol-c"><input type="checkbox" data-ol="' + esc(x.id) + '"' +
            (x.included ? ' checked' : '') + '><span>計入統計</span></label>' +
          '<button class="ol-e" data-edit="' + esc(x.id) + '">修正數字</button>' +
        '</div>' +
        '<div class="ol-f hidden" data-form="' + esc(x.id) + '">' +
          '<p>打錯字就直接改這裡。存檔後會重新套用異常判定規則，' +
          '若數字變合理就會自動從這張清單移除。</p>' +
          '<div class="ol-g">' +
            numf('月薪', 'monthly', x.monthly) + numf('年終', 'bonus', x.bonus) +
            numf('年收入', 'annual', x.annual) + numf('加班/月', 'ot', x.ot) +
          '</div>' +
          '<div class="ol-b">' +
            '<button class="ol-s" data-save="' + esc(x.id) + '">儲存</button>' +
            '<button class="ol-x" data-cancel="' + esc(x.id) + '">取消</button>' +
            '<button class="ol-r2" data-recalc="' + esc(x.id) + '">年收入＝月薪×12＋年終</button>' +
          '</div>' +
        '</div>' +
        '</div>';
    }).join('');
    var fld = function (id, k) { return box.querySelector('[data-form="' + id + '"] [name="' + k + '"]'); };

    Array.prototype.forEach.call(box.querySelectorAll('[data-edit]'), function (b) {
      b.addEventListener('click', function () {
        var f = box.querySelector('[data-form="' + b.dataset.edit + '"]');
        f.classList.toggle('hidden');
        b.textContent = f.classList.contains('hidden') ? '修正數字' : '收起';
        if (!f.classList.contains('hidden')) f.querySelector('input').focus();
      });
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-cancel]'), function (b) {
      b.addEventListener('click', function () { loadOutliers(); });
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-recalc]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.recalc;
        var m = Number(fld(id, 'monthly').value) || 0, bo = Number(fld(id, 'bonus').value) || 0;
        fld(id, 'annual').value = m * 12 + bo;
      });
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-save]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.save;
        var patch = {};
        ['monthly', 'bonus', 'annual', 'ot'].forEach(function (k) { patch[k] = fld(id, k).value; });
        b.disabled = true; b.textContent = '儲存中…';
        call('adminEditSalary', [PW, id, patch],
          function (r) { SUM = r; renderPanel(r.message); },
          function (m) { b.disabled = false; b.textContent = '儲存'; toast(m, 'err'); });
      });
    });

    Array.prototype.forEach.call(box.querySelectorAll('[data-ol]'), function (cb) {
      cb.addEventListener('change', function () {
        cb.disabled = true;
        call('adminSetOutlier', [PW, cb.dataset.ol, cb.checked],
          function (s) { SUM = s; renderPanel(s.message); },
          function (m) { cb.disabled = false; cb.checked = !cb.checked; toast(m, 'err'); });
      });
    });
  }, function (m) { box.innerHTML = '<div class="msg err">' + esc(m) + '</div>'; });
}

function f2(k, v, raw) {
  return '<span><em>' + k + '</em>' + (raw ? (v === '' ? '—' : v) : fmt(v)) + '</span>';
}

function st(k, v, cls) {
  return '<div class="st ' + (cls || '') + '"><div class="k">' + esc(k) + '</div>' +
    '<div class="v">' + v + '</div></div>';
}

function bindPanel() {
  $('#refresh').addEventListener('click', function () {
    call('adminSummary', [PW], function (s) { SUM = s; renderPanel('已重新整理'); });
  });
  $('#recalc').addEventListener('click', function () {
    call('adminRecalc', [PW], function (s) { SUM = s; renderPanel(s.message); });
  });

  $('#doDraw').addEventListener('click', function () {
    var n = Number($('#drawN').value) || SUM.drawWinners;
    var box = $('#winners');
    box.innerHTML = '<p class="hint">抽獎中…</p>';
    call('adminDraw', [PW, n], function (r) {
      box.innerHTML = '<div class="win"><div class="sub">從 ' + r.poolSize +
        ' 位參加者中抽出 ' + r.winners.length + ' 位</div><ol>' +
        r.winners.map(function (w) {
          return '<li><span class="em">' + esc(w.email) + '</span>' +
            '<div class="sub">' + esc(w.id) + '　' +
            (w.phone ? '電話 ' + esc(w.phone) + '　' : '') +
            (w.address ? '地址 ' + esc(w.address) : '未填地址 → 寄電子禮券到 Email') +
            '</div></li>';
        }).join('') + '</ol></div>';
    }, function (m) { box.innerHTML = '<div class="msg err">' + esc(m) + '</div>'; });
  });

  function runImport(btn, n, label, confirmText) {
    if (CONFIRM_ON && !confirm(confirmText)) return;
    var old = btn.textContent;
    btn.disabled = true; btn.textContent = '匯入中…';
    call('adminImportLegacy', [PW, n], function (s) { SUM = s; renderPanel(s.message); },
      function (m) { btn.disabled = false; btn.textContent = old; toast(m, 'err'); });
  }
  $('#doImportAll').addEventListener('click', function () {
    runImport(this, 'all', '全部匯入',
      '將把 2023 年調查裡所有可解析、且尚未匯入過的資料全部收進來。\n' +
      '提醒：那是 111 年度（2022）的收入，與本次 2025 年度不同年份。\n確定要匯入嗎？');
  });
  $('#doImport').addEventListener('click', function () {
    var n = Number($('#impN').value) || 50;
    runImport(this, n, '隨機抽樣匯入',
      '將從 2023 年調查隨機匯入 ' + n + ' 筆（已匯入過的會跳過）。\n' +
      '提醒：那是 111 年度（2022）的收入，與本次 2025 年度不同年份。\n確定要匯入嗎？');
  });
  loadLegacyScan();
  $('#doClearImp').addEventListener('click', function () {
    if (CONFIRM_ON && !confirm('將移除所有 source 標記為「2023調查匯入」的資料，無法復原。確定嗎？')) return;
    var b = this; b.disabled = true;
    call('adminClearImported', [PW], function (s) { SUM = s; renderPanel(s.message); },
      function (m) { b.disabled = false; toast(m, 'err'); });
  });

  $('#stRefresh').addEventListener('click', loadStats);

  bindClearButtons();
  loadNotify();
  loadStats();
  loadRows();
}

/* ── 新回覆通知信 ── */
function loadNotify() {
  var box = $('#notify');
  if (!box) return;
  call('adminGetNotify', [PW], function (c) {
    box.innerHTML =
      '<label class="ol-c" style="margin:0 0 12px"><input type="checkbox" id="nfOn"' +
        (c.on ? ' checked' : '') + '><span>有新回覆就寄信通知我</span></label>' +
      '<div><label class="f">收件信箱</label>' +
        '<input type="text" id="nfMail" placeholder="' + esc(c.fallback || 'you@example.com') +
        '（必填，通知信會寄到這裡）" value="' + esc(c.email) + '"></div>' +
      '<label class="ol-c" style="margin:12px 0 0"><input type="checkbox" id="nfDetail"' +
        (c.detail ? ' checked' : '') + '><span>通知信包含薪資數字' +
        '<small>預設不含。通知信有精確時間，若附上薪資，就能跟抽獎名單當下新增的那一列對起來，' +
        '等於放棄問卷頁向填答者保證的「管理者也無法把 Email 對回薪資」。</small>' +
        '</span></label>' +
      '<div class="mode">' +
        '<b>' + (c.mode === 'each' ? '目前：每一筆回覆都寄一封' : '目前：每週日寄一份摘要') + '</b>' +
        '<em>' + esc(c.eachUntil) + '（含）以前逐筆寄，之後自動改成每週日 ' + c.digestHour +
        ' 點寄摘要。要調整就改 程式碼.js 最上面的 <code>NOTIFY_EACH_UNTIL</code>。</em>' +
        '<em>週日排程：' + (c.hasTrigger ? '<b style="color:#0a5c3e">已排定</b>' :
          '<b style="color:#b0341f">尚未排定</b>（按下面的「重設週日排程」）') + '</em>' +
      '</div>' +
      '<div class="btns" style="margin-top:14px">' +
        '<button class="btn p" id="nfSave">儲存設定</button>' +
        '<button class="btn g" id="nfTest">寄一封測試信</button>' +
        '<button class="btn g" id="nfDigest">立刻寄一份週報</button>' +
        '<button class="btn g" id="nfTrig">重設週日排程</button>' +
      '</div>' +
      '<p class="hint" style="margin:12px 0 0">今日剩餘寄信額度：' +
        (c.quota < 0 ? '無法取得（尚未授權寄信權限）' : c.quota + ' 封') +
        '　·　Gmail 免費帳號每天 100 封，額度不足會自動略過，不影響問卷。</p>';

    $('#nfSave').addEventListener('click', function () {
      var b = this; b.disabled = true;
      call('adminSetNotify', [PW, {
        on: $('#nfOn').checked, email: $('#nfMail').value, detail: $('#nfDetail').checked
      }], function (c2) { toast(c2.message, 'ok'); loadNotify(); },
         function (m) { b.disabled = false; toast(m, 'err'); });
    });
    var busy = function (b, label, fn, args) {
      var old = b.textContent;
      b.disabled = true; b.textContent = label;
      call(fn, args, function (c2) {
        b.disabled = false; b.textContent = old; toast(c2.message, 'ok'); loadNotify();
      }, function (m) { b.disabled = false; b.textContent = old; toast(m, 'err'); });
    };
    $('#nfTest').addEventListener('click', function () { busy(this, '寄送中…', 'adminTestNotify', [PW]); });
    $('#nfDigest').addEventListener('click', function () { busy(this, '寄送中…', 'adminSendDigest', [PW]); });
    $('#nfTrig').addEventListener('click', function () { busy(this, '設定中…', 'adminSetupDigest', [PW, true]); });
  }, function (m) { box.innerHTML = '<div class="msg err">' + esc(m) + '</div>'; });
}

/* ── 最近的回覆（自動載入） ── */
function loadRows() {
  var box = $('#rows');
  if (!box) return;
  call('adminListResponses', [PW, 50], function (r) {
      if (!r.rows.length) { box.innerHTML = '<p class="hint">目前沒有任何回覆。</p>'; return; }
      box.innerHTML = '<table><thead><tr><th>編號</th><th>時間</th><th>年齡</th><th>學歷</th>' +
        '<th>年資</th><th>分類</th><th>工作地</th><th>月薪</th><th>年收入</th><th></th></tr></thead><tbody>' +
        r.rows.map(function (x) {
          return '<tr' + (x.outlier ? ' class="out"' : '') + '>' +
            '<td class="mono">' + esc(x.id) + '</td><td>' + esc(x.time) + '</td>' +
            '<td class="n">' + esc(x.age) + '</td><td>' + esc(x.edu) + '</td>' +
            '<td class="n">' + esc(x.yrs) + '</td><td>' + esc(x.cat) + '</td>' +
            '<td>' + esc(x.city) + '</td><td class="n">' + fmt(x.monthly) + '</td>' +
            '<td class="n">' + fmt(x.annual) + '</td>' +
            '<td><button class="btn d" style="padding:4px 10px;font-size:12px" ' +
            'data-del="' + esc(x.id) + '">刪除</button></td></tr>';
        }).join('') + '</tbody></table>' +
        '<p class="hint" style="margin-top:10px">共 ' + r.total + ' 筆，顯示最近 ' + r.rows.length + ' 筆。</p>';
      Array.prototype.forEach.call(box.querySelectorAll('[data-del]'), function (b) {
        b.addEventListener('click', function () {
          var id = b.dataset.del;
          if (!confirm('確定刪除 ' + id + ' 這筆回覆？無法復原。')) return;
          b.disabled = true;
          call('adminDeleteResponse', [PW, id], function (s) {
            SUM = s; renderPanel(s.message);
          }, function (m) { b.disabled = false; toast(m, 'err'); });
        });
      });
    }, function (m) { box.innerHTML = '<div class="msg err">' + esc(m) + '</div>'; });
}

/* ── 危險操作：清除 ── */
function bindClearButtons() {
  var LABEL = { responses: '問卷回覆', draws: '抽獎名單', logs: '操作日誌', all: '全部資料' };
  Array.prototype.forEach.call(document.querySelectorAll('[data-clear]'), function (b) {
    b.addEventListener('click', function () {
      var t = b.dataset.clear;
      var word = (t === 'all') ? '全部清除' : '清除';
      var typed = prompt('即將清除「' + LABEL[t] + '」，此操作無法復原。\n' +
        '確定請輸入：' + word);
      if (typed === null) return;
      if (String(typed).trim() !== word) { toast('確認文字不符，已取消。', 'err'); return; }
      b.disabled = true;
      call('adminClear', [PW, t], function (s) {
        SUM = s; renderPanel(s.message);
      }, function (m) { b.disabled = false; toast(m, 'err'); });
    });
  });
}

renderLogin();
</script>
