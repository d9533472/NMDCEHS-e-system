<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>環境船檢系統 | Environmental Vessel Inspection</title>
<script>
/* ================================================================
 *  設定(只需改這裡)
 *  SCRIPT_URL:GAS Web App URL(留空 = 本機測試模式)
 *  EDIT_CODE :編輯模式密碼(點右上角 🔑 輸入)
 * ================================================================ */
window.EVIS_CONFIG = {
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbxLNoMax3Efsn0xNF8iXwlf2rvSZyehL809UMXIoF1-kifOsL1LbalQqlxUdAQa09ex/exec',
  EDIT_CODE : 'nmdc'
};

/* 頁面一載入立刻預抓資料(與 React 載入平行進行),縮短首次開啟等待 */
window.__earlyBoot = null;
(function () {
  var u = window.EVIS_CONFIG.SCRIPT_URL;
  var isTest = false;
  try { isTest = localStorage.getItem('evis_test') === '1'; } catch (e) {}
  if (!u || isTest) return;
  window.__earlyBoot = new Promise(function (res, rej) {
    var x = new XMLHttpRequest();
    x.open('POST', u, true);
    x.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
    x.onload = function () {
      try { var r = JSON.parse(x.responseText); r.ok ? res(r) : rej(new Error(r.error || 'Server error')); }
      catch (e) { rej(new Error('Bad response')); }
    };
    x.onerror = function () { rej(new Error('NETWORK')); };
    x.send(JSON.stringify({ action: 'bootstrap' }));
  });
  window.__earlyBoot.catch(function () {}); // 避免未處理的 rejection 警告
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  :root{
    --navy:#12283f; --navy2:#1d3d5c; --accent:#2e9e5b; --accent2:#e8f5ec;
    --red:#d64545; --amber:#c77f0a; --gray:#8a94a0; --bg:#f2f5f8; --line:#dde4ea; --card:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:#22303d;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:15px;}
  input,select,textarea,button{font-family:inherit; font-size:inherit;}
  input,select,textarea{border:1px solid var(--line); border-radius:8px; padding:9px 10px; background:#fff; width:100%;}
  input:disabled{background:#f4f6f8; color:#55606c;}
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(46,158,91,.35); border-color:var(--accent);}
  button{cursor:pointer; border:none; border-radius:8px;}

  .topbar{background:var(--navy); color:#fff; padding:10px 14px; position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:10px;}
  .topbar .logo{font-weight:800; letter-spacing:.5px; font-size:16px; white-space:nowrap;}
  .topbar .logo span{color:#6fd08c;}
  .topbar .sub{font-size:11px; opacity:.75; line-height:1.3;}
  .topbar .grow{flex:1; min-width:0;}
  .langbtn{background:rgba(255,255,255,.14); color:#fff; padding:7px 12px; border-radius:20px; font-size:13px; font-weight:600;}
  .langbtn:active{background:rgba(255,255,255,.3);}
  .lockbtn{background:rgba(255,255,255,.14); color:#fff; padding:7px 11px; border-radius:20px; font-size:15px;}
  .lockbtn.unlocked{background:#2e9e5b;}

  .wrap{max-width:1120px; margin:0 auto; padding:14px 12px 96px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px;}
  .card h3{margin:0 0 10px; font-size:15px; color:var(--navy);}

  .banner{background:#fff7e0; border:1px solid #eedc9a; color:#7a5c00; border-radius:10px;
    padding:8px 12px; font-size:13px; margin-bottom:12px;}
  .banner.blue{background:#eef6ff; border-color:#cfe3f7; color:#1e5ca8;}
  .banner.gray{background:#f0f2f5; border-color:var(--line); color:#5a6673;}

  .statrow{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
  .chip{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 14px; font-size:13px;}
  .chip b{font-size:17px; color:var(--navy); margin-right:4px;}

  table.list{width:100%; border-collapse:collapse; background:#fff; font-size:13.5px; min-width:820px;}
  table.list th{background:var(--navy2); color:#fff; padding:9px 8px; text-align:left; font-weight:600; white-space:nowrap;}
  table.list td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.list tr:hover td{background:#f7fafc;}
  .tblscroll{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}

  .badge{display:inline-block; padding:3px 9px; border-radius:12px; font-size:12px; font-weight:600; white-space:nowrap;}
  .defchip{display:inline-block; border:1.5px solid #C6D2DE; border-radius:14px; padding:2px 10px; font-size:12px; font-weight:700;
    margin:2px 4px 2px 0; cursor:pointer; background:#fff; color:#33475a; user-select:none;}
  .defchip.no{border-color:#d08a8a; color:#a33;}
  .defchip.on{background:#1D3D5C; color:#fff; border-color:#1D3D5C;}
  .defchip.on.no{background:#B03030; border-color:#B03030; color:#fff;}
  .defchip.ro{cursor:default;}
  .defcard{border:1px solid #E0D6C2; background:#FFFDF6; border-radius:10px; padding:10px 12px; margin-bottom:10px;}
  .defnum{display:inline-block; background:#8a5a00; color:#fff; font-weight:800; font-size:12px; border-radius:8px; padding:2px 10px; margin-right:6px;}
  .b-done{background:var(--accent2); color:#1c7a42; border:1px solid #bfe3cc;}
  .b-wait{background:#f0f2f5; color:#78828d; border:1px solid var(--line);}
  .b-fail{background:#fdecec; color:#b03030; border:1px solid #f3c6c6;}
  .b-cond{background:#fdf3e0; color:#a06a08; border:1px solid #f0dcb0;}
  .datesub{font-size:11px; color:#78828d;}

  .btn{padding:10px 16px; border-radius:9px; font-weight:600; font-size:14px;}
  .btn-p{background:var(--accent); color:#fff;}
  .btn-p:active{background:#25824a;}
  .btn-navy{background:var(--navy); color:#fff;}
  .btn-o{background:#fff; border:1px solid var(--line); color:#3a4753;}
  .btn-r{background:#fdecec; color:var(--red); border:1px solid #f3c6c6;}
  .btn-amber{background:#b8860b; color:#fff;}
  .btn-sm{padding:6px 11px; font-size:13px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}
  .mini{padding:5px 9px; font-size:13px; background:#f0f4f8; border:1px solid var(--line); border-radius:7px; color:#3a4753;}
  .mini:hover{background:#e4ebf1;}
  .mini.danger{color:var(--red); background:#fdecec; border-color:#f3c6c6;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:#54626f; margin-bottom:4px;}
  .req{color:var(--red);}
  .kv{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px 14px; font-size:13.5px;}
  .kv .k{font-size:11.5px; color:#78828d;}
  .kv .v{font-weight:600;}

  .secnav{position:sticky; top:56px; z-index:40; display:flex; gap:6px; overflow-x:auto;
    padding:8px 2px; background:var(--bg); margin:0 -2px;}
  .secnav button{background:#fff; border:1px solid var(--line); border-radius:18px; padding:7px 13px;
    font-size:13px; font-weight:600; color:#3a4753; white-space:nowrap;}
  .secnav button.on{background:var(--navy); color:#fff; border-color:var(--navy);}
  .secnav .cnt{font-size:11px; opacity:.7; margin-left:3px;}

  .sechead{background:var(--navy2); color:#fff; border-radius:10px 10px 0 0; padding:10px 14px;
    font-weight:700; font-size:14.5px; display:flex; justify-content:space-between; align-items:center;}
  .secbody{border:1px solid var(--line); border-top:none; border-radius:0 0 10px 10px; background:#fff; margin-bottom:16px;}

  .item{padding:13px 14px; border-bottom:1px solid #eef2f5;}
  .item:last-child{border-bottom:none;}
  .item .no{display:inline-block; background:#eef3f7; color:var(--navy); font-weight:700; font-size:12px;
    border-radius:6px; padding:2px 8px; margin-right:8px;}
  .item.miss{background:#fff8f8;}
  .item.miss .no{background:#fdecec; color:var(--red);}
  .item .txt{font-size:14px; line-height:1.5;}
  .item .row2{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:flex-start;}
  .evhint{font-size:12.5px; color:#7a6320; background:#fdf9ec; border:1px dashed #e5d7a3;
    border-radius:8px; padding:6px 10px; margin-top:8px; line-height:1.45;}
  .seg{display:flex; gap:6px;}
  .seg button{padding:8px 16px; border-radius:8px; border:1.5px solid var(--line); background:#fff;
    font-weight:700; font-size:13px; color:#6a7682; min-width:56px;}
  .seg button.yes.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .seg button.no.on{background:var(--red); border-color:var(--red); color:#fff;}
  .seg button.na.on{background:var(--gray); border-color:var(--gray); color:#fff;}
  .seg button:disabled{cursor:default; opacity:.9;}
  .remark{flex:1; min-width:200px;}
  .remark input{padding:8px 10px; font-size:13.5px;}

  .panelgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  @media(max-width:760px){ .panelgrid{grid-template-columns:1fr;} }
  .panel{border:1px solid var(--line); border-radius:9px; padding:10px;}
  .panel.ctr{background:#f8fafb;}
  .panel .ph{font-size:11.5px; font-weight:700; color:#54626f; margin-bottom:7px; letter-spacing:.3px;}
  .ansbadge{display:inline-block; padding:4px 14px; border-radius:8px; font-weight:800; font-size:13px;}
  .ans-yes{background:var(--accent); color:#fff;}
  .ans-no{background:var(--red); color:#fff;}
  .ans-na{background:var(--gray); color:#fff;}
  .ans-none{background:#eef1f4; color:#8a94a0;}
  .ctr-remark{font-size:13px; color:#3a4753; margin-top:6px; white-space:pre-wrap;}

  .attrow{margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .attbtn{background:#f0f4f8; border:1px dashed #b8c4cf; color:#4a5764; border-radius:8px;
    padding:6px 12px; font-size:12.5px; font-weight:600;}
  .attchip{display:inline-flex; align-items:center; gap:6px; background:#eef6ff; border:1px solid #cfe3f7;
    border-radius:8px; padding:5px 9px; font-size:12.5px; max-width:280px;}
  .attchip a{color:#1e5ca8; text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .attchip .x{cursor:pointer; color:#8194a8; font-weight:700; padding:0 2px;}
  .attchip .x:hover{color:var(--red);}
  .uploading{background:#fffbe8; border-color:#eadfa2; color:#8a7514;}

  .vopt{display:flex; align-items:flex-start; gap:10px; border:1.5px solid var(--line); border-radius:10px;
    padding:11px 13px; margin-bottom:8px; cursor:pointer; font-size:14px; background:#fff;}
  .vopt .dot{width:18px; height:18px; border-radius:50%; border:2px solid #b8c4cf; flex:none; margin-top:1px;}
  .vopt.sel{border-color:var(--navy); background:#f4f8fc;}
  .vopt.sel .dot{border-color:var(--navy); background:var(--navy); box-shadow:inset 0 0 0 3.5px #fff;}
  .vopt.sel.fail{border-color:var(--red); background:#fdf6f6;}
  .vopt.sel.fail .dot{border-color:var(--red); background:var(--red);}
  .vopt.sel.cond{border-color:var(--amber); background:#fdfaf2;}
  .vopt.sel.cond .dot{border-color:var(--amber); background:var(--amber);}
  .vopt.sel.pass{border-color:var(--accent); background:#f4faf6;}
  .vopt.sel.pass .dot{border-color:var(--accent); background:var(--accent);}
  .vopt.ro{cursor:default; opacity:.95;}
  .ddl{margin:4px 0 10px 28px; max-width:280px;}

  .signgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px;}
  .signbox{border:1px solid var(--line); border-radius:10px; padding:12px;}
  .signbox .role{font-weight:700; font-size:13.5px; color:var(--navy); margin-bottom:2px;}
  .signbox .rolesub{font-size:11.5px; color:#78828d; margin-bottom:8px;}
  .signbox input{margin-bottom:8px;}

  /* 項目編輯器 */
  .editem{display:flex; gap:10px; padding:12px 0; border-bottom:1px dashed var(--line); align-items:flex-start;}
  .editem:last-child{border-bottom:none;}
  .editem .no{background:#eef3f7; color:var(--navy); font-weight:700; font-size:12px;
    border-radius:6px; padding:3px 8px; white-space:nowrap; margin-top:6px;}
  .editem .fields{flex:1; min-width:0;}
  .editem textarea{margin-bottom:6px; font-size:13.5px; resize:vertical;}
  .editem input{margin-bottom:6px; font-size:13px;}
  .editem .ops{display:flex; flex-direction:column; gap:5px;}
  .sechead-edit{display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
  .sechead-edit input.code{width:64px; text-align:center; font-weight:800;}
  .sechead-edit input{font-size:14px;}

  .retrybar{position:fixed; left:0; right:0; bottom:64px; z-index:70; background:#8a4a00; color:#fff;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:9px 16px; font-size:13.5px; font-weight:700;
    box-shadow:0 -2px 10px rgba(0,0,0,.25);}
  .retrybar .btn{padding:5px 14px; font-size:13px;}
  .footbar{position:fixed; left:0; right:0; bottom:0; z-index:60; background:#fff;
    border-top:1px solid var(--line); padding:10px 12px; display:flex; gap:8px; align-items:center;
    box-shadow:0 -4px 14px rgba(0,0,0,.06); flex-wrap:wrap;}
  .footbar .grow{flex:1; min-width:120px; font-size:12px; color:#67737f;}
  .savehint{background:#fdecec; border:1px solid #f3c6c6; color:#b03030; border-radius:8px;
    padding:6px 10px; font-size:12px; line-height:1.4; max-width:340px;}

  .toast{position:fixed; bottom:84px; left:50%; transform:translateX(-50%); z-index:100;
    background:var(--navy); color:#fff; padding:10px 18px; border-radius:22px; font-size:13.5px;
    box-shadow:0 6px 18px rgba(0,0,0,.25); animation:fadein .2s; max-width:90vw;}
  .toast.err{background:var(--red);}
  @keyframes fadein{from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);}}

  /* 資料讀取中 overlay(整頁模糊) */
  .loadbg{position:fixed; inset:0; z-index:95; background:rgba(240,244,248,.45);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; animation:fadebg .15s;}
  @keyframes fadebg{from{opacity:0;} to{opacity:1;}}
  .loadcard{background:#fff; border-radius:14px; padding:22px 34px; box-shadow:0 10px 34px rgba(0,0,0,.18);
    display:flex; align-items:center; gap:14px; font-weight:700; color:var(--navy); font-size:15px;}
  .spinner{width:26px; height:26px; border-radius:50%; border:3.5px solid #dde4ea;
    border-top-color:var(--accent); animation:spin .8s linear infinite; flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .modalbg{position:fixed; inset:0; background:rgba(15,28,42,.45); z-index:90;
    display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{background:#fff; border-radius:14px; padding:20px; max-width:420px; width:100%;}
  .modal h4{margin:0 0 8px; color:var(--navy);}
  .modal p{margin:0 0 16px; font-size:14px; color:#4a5764; line-height:1.5; word-break:break-all;}
  .modal .btns{display:flex; gap:8px; justify-content:flex-end;}
  .modal input{margin-bottom:14px;}

  .pbar{height:6px; background:#e7ecf1; border-radius:3px; overflow:hidden; min-width:70px;}
  .pbar i{display:block; height:100%; background:var(--accent); border-radius:3px;}
  .pbar i.blue{background:#2563a8;}

  @media(max-width:640px){
    .topbar .sub{display:none;}
    .btn{padding:10px 12px; font-size:13px;}
    .wrap{padding:10px 8px 116px;}
    .editem{flex-wrap:wrap;}
  }
</style>
</head>

function codesOf(cl){ const out=[]; (cl||[]).forEach(sec => (sec.items||[]).forEach((it,i)=>out.push(sec.code+'-'+(i+1)))); return out; }
function totalOf(cl){ return (cl||[]).reduce((s,sec)=>s+(sec.items||[]).length,0); }

function truncS(s,n){ s=String(s||''); return s.length>n ? s.slice(0,n)+'…' : s; }
function missingOf(map, cl){ return codesOf(cl).filter(c => !(map && map[c] && map[c].v)); }

/* ---------------- API (XHR text/plain,行動 Safari 相容) ---------------- */
const LOCAL = !SCRIPT_URL;
const LS_KEY = 'evis_data_v1';
const TEST_KEY = 'evis_data_test';
let TESTMODE = localStorage.getItem('evis_test') === '1';   // 🧪 測試模式:資料只存瀏覽器

/* 讀取類請求自動重試(GAS 偶發暫時錯誤/冷啟動逾時的主因對策) */
const READ_ACTIONS = { list:1, get:1, getChecklist:1, bootstrap:1, filesData:1 };

function apiOnce(action, payload) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', SCRIPT_URL, true);
    /* 上傳/存 PDF 帶大 payload,行動網路慢時 30 秒不夠 → 給 120 秒;其餘 30 秒避免掛住 */
    xhr.timeout = (action === 'upload' || action === 'storePdf') ? 120000
                : (action === 'filesData' || action === 'fileData') ? 90000 : 30000;   // 抓附件圖片:分批+90 秒
    xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
    xhr.onload = () => {
      if (xhr.status >= 400) { reject(new Error('HTTP ' + xhr.status)); return; }
      try {
        const res = JSON.parse(xhr.responseText);
        res.ok ? resolve(res) : reject(new Error(res.error || 'Server error'));
      } catch (e) { reject(new Error('Bad response')); }   // GAS 偶爾回 HTML 錯誤頁
    };
    xhr.ontimeout = () => reject(new Error('TIMEOUT'));
    xhr.onerror = () => reject(new Error('NETWORK'));
    xhr.send(JSON.stringify(Object.assign({ action }, payload)));
  });
}

/* 🕘 歷程紀錄:寫入類動作自動附上操作者資訊(角色+裝置代碼+瀏覽器;GAS 拿不到 IP) */
const WHO_ACTIONS = { save:1, delete:1, upload:1, deleteFile:1, storePdf:1, restore:1, saveChecklist:1 };
function getWho() {
  let dev = '';
  try {
    dev = localStorage.getItem('evis_dev') || '';
    if (!dev) { dev = 'DV-' + Math.random().toString(36).slice(2, 8).toUpperCase(); localStorage.setItem('evis_dev', dev); }
  } catch (e) {}
  return { role: localStorage.getItem('evis_unlocked') === '1' ? 'NMDC' : 'Contractor',
           device: dev, ua: navigator.userAgent };
}
function api(action, payload) {
  payload = payload || {};
  if (WHO_ACTIONS[action] && !payload.who) payload.who = getWho();
  if (LOCAL || TESTMODE) return localApi(action, payload);
  const retries = (action === 'filesData' || action === 'fileData') ? 1   // 抓圖:批次本身可容錯,只重試 1 次
                : READ_ACTIONS[action] ? 2 : 0;   // 讀取最多重試 2 次;寫入不重試(避免重複)
  const attempt = (n) => apiOnce(action, payload || {}).catch(err => {
    if (n < retries) return new Promise(r => setTimeout(r, 800 * (n + 1))).then(() => attempt(n + 1));
    throw err;
  });
  return attempt(0);
}

/* 本機/測試模式:localStorage 模擬後端 */
function lsKey(){ return TESTMODE ? TEST_KEY : LS_KEY; }
function clKey(){ return TESTMODE ? 'evis_cl_test' : 'evis_cl_local'; }
function lsRead(){ try { return JSON.parse(localStorage.getItem(lsKey())) || {items:{}}; } catch(e){ return {items:{}}; } }
function lsWrite(d){ localStorage.setItem(lsKey(), JSON.stringify(d)); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowStr(){ return todayStr()+' '+new Date().toTimeString().slice(0,8); }

function localApi(action, p) {
  const db = lsRead();
  const done = (o) => Promise.resolve(Object.assign({ ok: true }, o));
  /* 🕘 本機/測試模式的歷程紀錄(同樣可練習還原) */
  const logA = (act, o, note, snap) => {
    db.audit = db.audit || [];
    let sj = null;
    if (snap) { try { const s = JSON.stringify(snap); if (s.length < 800000) sj = s; } catch (e) {} }
    db.audit.push({ rowId: 'L' + Date.now() + Math.floor(Math.random() * 99), ts: nowStr(), action: act,
      inspId: (o && o.id) || '', inspNo: (o && o.inspNo) || '', vessel: (o && (o.vesselEn || o.vesselZh)) || '',
      role: (p.who && p.who.role) || '', device: (p.who && p.who.device) || '', ua: '',
      note: note || '', snapJson: sj });
    if (db.audit.length > 300) db.audit = db.audit.slice(-300);
  };
  if (action === 'auditList') {
    return done({ rows: (db.audit || []).slice().reverse().map(r =>
      Object.assign({}, r, { hasSnap: !!r.snapJson, snapJson: undefined })) });
  }
  if (action === 'restore') {
    const en = (db.audit || []).find(x => x.rowId === p.rowId);
    if (!en || !en.snapJson) return Promise.reject(new Error('此筆歷程沒有快照,無法還原'));
    let snap; try { snap = JSON.parse(en.snapJson); } catch (e) { return Promise.reject(new Error('快照資料損毀')); }
    const item = snap.item;
    if (!item || !item.id) return Promise.reject(new Error('快照缺少內容'));
    db.items[item.id] = item;
    logA('restore', item, '還原自 ' + en.ts, { item });
    lsWrite(db);
    return done({ item });
  }
  if (action === 'getChecklist') {
    try { return done({ checklist: JSON.parse(localStorage.getItem(clKey())) || null }); }
    catch(e){ return done({ checklist: null }); }
  }
  if (action === 'bootstrap') {
    const items = Object.values(db.items).map(it => { const c = Object.assign({}, it); delete c.data; delete c.attachments; return c; })
      .sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));
    let cl = null; try { cl = JSON.parse(localStorage.getItem(clKey())); } catch(e){}
    return done({ items, checklist: cl });
  }
  if (action === 'saveChecklist') {
    localStorage.setItem(clKey(), JSON.stringify(p.checklist));
    return done({});
  }
  if (action === 'list') {
    const items = Object.values(db.items).map(it => { const c = Object.assign({}, it); delete c.data; delete c.attachments; return c; })
      .sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));
    return done({ items });
  }
  if (action === 'get') return done({ item: db.items[p.id] });
  if (action === 'save') {
    const item = Object.assign({}, p.item);
    if (!item.id) item.id = 'INS-' + Date.now();
    item.updatedAt = nowStr();
    if (!item.inspNo) {   // 全域流水號 EVI-001、EVI-002…
      let max = 0;
      Object.values(db.items).forEach(x => {
        const m = String(x.inspNo||'').match(/^EVI-(\d+)$/);
        if (m) max = Math.max(max, parseInt(m[1], 10));
      });
      item.inspNo = 'EVI-' + String(max+1).padStart(3,'0');
    }
    if (item.status === 'self_done' && !item.selfDate) item.selfDate = todayStr();
    if (item.status === 'nmdc_done') { if(!item.selfDate) item.selfDate = todayStr(); if(!item.nmdcDate) item.nmdcDate = todayStr(); }
    if (item.status === 'draft') { item.selfDate=''; item.nmdcDate=''; }
    if (item.status === 'self_done') item.nmdcDate='';
    item.attachments = (db.items[item.id] && db.items[item.id].attachments) || [];
    const isNewL = !db.items[item.id];
    db.items[item.id] = item;
    logA(isNewL ? 'create' : 'save', item, item.status + (String(item.closed)==='1' ? '/closed' : ''), { item });
    lsWrite(db);
    return done({ item });
  }
  if (action === 'delete') {
    const itD = db.items[p.id];
    if (itD) logA('delete', itD, '', { item: itD });
    delete db.items[p.id]; lsWrite(db); return done({});
  }
  if (action === 'upload') {
    const it = db.items[p.inspId]; if (!it) return Promise.reject(new Error('not saved'));
    const att = { fileId:'local-'+Date.now()+Math.floor(Math.random()*99), inspId:p.inspId, itemCode:p.itemCode,
      name:(p.label||p.itemCode)+' & '+p.name, url:'data:'+(p.mimeType||'application/octet-stream')+';base64,'+p.base64,
      uploadedAt:nowStr(), size:Math.round(p.base64.length*0.75) };
    it.attachments = it.attachments || []; it.attachments.push(att);
    logA('upload', it, att.name);
    try { lsWrite(db); } catch (e) { it.attachments.pop(); return Promise.reject(new Error('LSFULL')); }
    return done({ attachment: att });
  }
  if (action === 'deleteFile') {
    Object.values(db.items).forEach(it => { if (it.attachments) it.attachments = it.attachments.filter(a=>a.fileId!==p.fileId); });
    logA('deleteFile', {}, String(p.fileId || ''));
    lsWrite(db); return done({});
  }
  return Promise.reject(new Error('unknown'));
}

  g.fillStyle = color; g.fillRect(0, 0, 480, 320);
  g.fillStyle = 'rgba(255,255,255,.18)';

/* ================================================================

const LIB_H2C   = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
const LIB_JSPDF = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const __libs = {};
/* 備援 CDN:cdnjs 連不上(公司網路封鎖/船上網路)時改抓 jsdelivr */
const LIB_FALLBACK = {};
LIB_FALLBACK[LIB_H2C]   = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
LIB_FALLBACK[LIB_JSPDF] = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
function loadOne_(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = () => res(); s.onerror = () => rej(new Error('LIB_LOAD: ' + src.split('/').pop()));
    document.head.appendChild(s);
  });
}
function loadScriptOnce(src) {
  if (__libs[src]) return __libs[src];
  __libs[src] = loadOne_(src).catch(() =>
    LIB_FALLBACK[src] ? loadOne_(LIB_FALLBACK[src]) : Promise.reject(new Error('PDF 元件載入失敗'))
  ).catch(() => { delete __libs[src]; throw new Error('PDF 元件載入失敗(網路無法連到 CDN)LIB_LOAD_FAIL'); });
  return __libs[src];
}

function buildReportBlocks(o, cl, imgMap) {
  const a  = (o.data && o.data.answers) || {};
  const na = (o.data && o.data.nmdcAnswers) || {};
  const sg = (o.data && o.data.signoff) || {};
  const atts = o.attachments || [];
  const codes = codesOf(cl);
  const attsOf = (code, stage) => atts.filter(x => x.itemCode === (stage==='nmdc' ? code+'#NMDC' : code));
  const secColorOf = code => {
    const idx = cl.findIndex(s => s.code === String(code).split('-')[0]);
    return PDF_COLORS[(idx < 0 ? 0 : idx) % PDF_COLORS.length];
  };
  const B = [];
  const push = (html, brk) => B.push({ html, pageBreak: !!brk });

  const h2 = txt =>
    '<div style="display:flex; align-items:center; gap:8px; margin:16px 0 8px">' +
    '<div style="width:6px; height:16px; background:#1D3D5C; border-radius:3px"></div>' +
    '<div style="font-size:13px; font-weight:800; color:#12283F">'+txt+'</div></div>';

  const ans = (x, files) => {
    const v = x && x.v;
    const m = v==='yes' ? { col:'#1C7A42', bg:'#F2FAF5', label:'✔ YES' }
            : v==='no'  ? { col:'#B03030', bg:'#FDEEEE', label:'✘ NO' }
            : v==='na'  ? { col:'#5A6673', bg:'#F3F5F7', label:'N/A' }
            : { col:'#98A2AC', bg:'#FFFFFF', label:'—' };
    let h = '<span style="display:inline-block; background:'+m.col+'; color:#fff; font-weight:800; font-size:8.5px; padding:2px 9px; border-radius:9px">'+m.label+'</span>';
    if (x && x.remark) h += '<div style="color:#333; margin-top:3px; font-size:9px; line-height:1.4">'+esc(x.remark)+'</div>';
    if (files.length) h += files.map(f=>'<div style="color:#556; font-size:8px; margin-top:2px">📎 '+esc(f.name)+'</div>').join('');
    return { h, bg: m.bg };
  };

  /* ── 頁首橫幅 ── */
  push(
    '<div style="background:linear-gradient(135deg,#0B1F33 0%,#1D3D5C 70%,#24507A 100%); border-radius:10px; padding:16px 20px; color:#fff; display:flex; align-items:center; justify-content:space-between; gap:14px">' +
      '<div style="flex:none">' +
        '<div style="font-size:19px; font-weight:800; letter-spacing:1px; white-space:nowrap">NMDC <span style="color:#6FD08C">ENERGY</span></div>' +
        '<div style="font-size:8.5px; color:#9FB3C8; margin-top:2px">⚓ Marine Environmental Compliance</div>' +
      '</div>' +
      '<div style="text-align:center">' +
        '<div style="font-size:14.5px; font-weight:800; letter-spacing:.5px">ENVIRONMENTAL INSPECTION CHECKLIST FOR MARINE VESSELS</div>' +
        '<div style="font-size:11px; color:#CFE0EE; font-weight:700; margin-top:2px">船 舶 環 境 檢 查 表</div>' +
      '</div>' +
      '<div style="flex:none; text-align:right; font-size:8px; color:#9FB3C8; line-height:1.7">' +
        'Document No: '+DOC_NO+'<br>'+DOC_REV+' · 列印 '+todayStr()+'<br>' +
        '<span style="background:#6FD08C; color:#0B1F33; font-weight:800; padding:2px 10px; border-radius:9px; font-size:10.5px">'+esc(o.inspNo||'—')+'</span>' +
      '</div>' +
    '</div>' +
    '<div style="height:4px; background:linear-gradient(90deg,#6FD08C,#2C6FAD,#0B1F33); border-radius:2px; margin:8px 0 4px"></div>');

  /* ── 1. 船舶基本資料 ── */
  const info = [
    ['船檢編號 Inspection No.', o.inspNo], ['檢查日期 Inspection Date', o.inspectDate],
    ['船舶中文名稱 Vessel Name (ZH)', o.vesselZh], ['船舶英文名稱 Vessel Name (EN)', o.vesselEn],
    ['MMSI', o.mmsi], ['IMO No.', o.imo],
    ['總噸位 Gross Tonnage', o.tonnage], ['船級 Class Society', o.vesselClass],
    ['專案編號 Project No.', o.projectNo], ['地點 Location', o.location],
    ['廠商自檢完成日 Self-Check Date', o.selfDate], ['NMDC 檢查完成日 NMDC Date', o.nmdcDate],
  ];
  const ct = (o.data && o.data.contact) || {};
  if (ct.name || ct.phone || ct.email) {
    info.push(['船檢聯絡人 Contact Person', ct.name], ['聯絡電話 Contact Phone', ct.phone]);
    info.push(['電子信箱 Contact Email', ct.email]);
  }
  const scp = o.scope || (o.data && o.data.scope) || '';
  if (scp) info.push(['工作範疇 Scope', scp]);
  if (o.data && o.data.reOf) info.push(['🔁 複檢自 Re-inspection of', o.data.reOf]);
  let ir = '';
  const lcell = s => '<td style="background:#F0F4F8; color:#1D3D5C; font-weight:700; width:21%; padding:5px 9px; border:1px solid #E1E8EF; font-size:8.5px">'+s+'</td>';
  const vcell = s => '<td style="width:29%; padding:5px 9px; border:1px solid #E1E8EF; font-size:9.5px; font-weight:600; color:#1E2A36">'+esc(s||'—')+'</td>';
  for (let i = 0; i < info.length; i += 2) {

  push(h2('1. 船舶基本資料 Vessel Information') +

  /* ── 2. 檢查結論 ── */

  };
  const vd = vMap[o.verdict] || { txt:'—', col:'#5A6673', bg:'#F3F5F7', icon:'·' };
  push(h2('2. 檢查結論 Final Inspection Result') +

      '<div style="flex:none; width:36px; height:36px; border-radius:50%; background:'+vd.col+'; color:#fff; font-size:19px; font-weight:800; display:flex; align-items:center; justify-content:center">'+vd.icon+'</div>' +
      '<div style="color:'+vd.col+'; font-weight:800; font-size:12px; line-height:1.6">'+vd.txt+'</div>' +

  /* ── 🧾 缺失清單(標題+每筆各自成塊 → 自動逐筆填滿頁面,不留大空白)── */
  const defects = (o.data && o.data.defects) || [];
  if (defects.length) {
    const tmap = titleMapOf(cl);
    push('<div style="font-weight:800; color:#12283F; font-size:10.5px; border-left:4px solid #8a5a00; background:#FDF7EA; border-radius:0 6px 6px 0; padding:6px 10px; margin-top:10px">🧾 缺失清單 Deficiency List('+defects.length+')</div>');
    defects.forEach((d, i) => {
      const chips = (d.codes || []).map(c =>
        '<span style="display:inline-block; border:1px solid #B03030; color:#B03030; font-weight:800; font-size:8px; border-radius:9px; padding:1px 8px; margin-right:4px">'+esc(c)+'</span>').join('');
      /* 每個項目代碼附上題目,一看就知道缺失對應哪一項 */

        return '<div style="font-size:8px; color:#555; line-height:1.5; margin-top:1px"><b style="color:#B03030">'+esc(c)+'</b> '+esc(truncS(tt.zh, 52))+'　<span style="color:#98A2AC">'+esc(truncS(tt.en, 80))+'</span></div>'; }).join('');
      const dAtts = atts.filter(x => x.itemCode === 'DEF-' + d.id);

          (dAtts.length ? '<div style="font-size:8px; color:#556; margin-top:2px">'+dAtts.map(f=>'📎 '+esc(f.name)).join('　')+'</div>' : '') +
        '</div></div>');
    });
  }

  /* ── 💬 檢查意見與驗證回覆(留言板)── */
  const fu = (o.data && o.data.followup) || {};
  const cmts = (o.data && o.data.comments) || [];
  const isCmtAtt = x => x.itemCode === 'FOLLOWUP' || /^CMT-/.test(String(x.itemCode||''));
  const hasFu = cmts.length || fu.text || String(o.closed) === '1' || atts.some(isCmtAtt);
  if (hasFu) {
    const closedTag = String(o.closed) === '1'

  cl.forEach((sec, si) => {
    const c = PDF_COLORS[si % PDF_COLORS.length];
    push('<div style="display:flex; align-items:center; gap:8px; background:'+c.bg+'; border-left:5px solid '+c.ac+'; border-radius:0 6px 6px 0; padding:6px 10px; margin:'+(si===0?'8px':'22px')+' 0 4px">' +

      '<div style="font-weight:800; color:'+c.tx+'; font-size:11px">'+esc(sec.en)+'　'+esc(sec.zh)+'</div>' +

    (sec.items||[]).forEach((it, i) => {
      const code = sec.code+'-'+(i+1);
      const alt = i % 2 ? '#F8FAFC' : '#FFFFFF';
      const c1 = ans(a[code], attsOf(code,'self'));

  /* ── 4. 簽核 ── */
  const signBox = (role, sub, nm, dt) =>
    '<div style="flex:1; border:1px solid #D5DEE7; border-radius:10px; overflow:hidden; background:#fff">' +
      '<div style="background:#F0F4F8; padding:6px 10px; border-bottom:1px solid #E1E8EF">' +

      '<div style="padding:8px 10px; font-size:9px; line-height:1.8">姓名 Name: <b>'+esc(nm||'')+'</b><br>日期 Date: '+esc(dt||'')+'</div>' +
      '<div style="margin:16px 10px 8px; border-top:1px solid #98A2AC; color:#98A2AC; font-size:8px; padding-top:2px">簽名 Signature</div>' +
    '</div>';
  push(h2('4. 簽核 Name &amp; Sign-off') +
    '<div style="display:flex; gap:10px">' +
    signBox('檢查人 Inspected By','廠商檢查人 Supplier Inspector', sg.inspName, sg.inspDate) +
    signBox('覆核人 Verified By','NMDC ENV Officer', sg.verName, sg.verDate) +
    signBox('核可人 Endorsed By','NMDC ENV Lead', sg.endName, sg.endDate) +
    '</div>');

  /* ── 5. 附件(換頁)── */
  push(h2('5. 附件 Attachments') +
    '<div style="color:#5A6673; font-size:8.5px; margin-bottom:8px; background:#F2F5F8; border:1px solid #DDE4EA; border-radius:7px; padding:5px 9px">📁 所有附件原始檔(含照片)皆存放於 Google Drive 該筆檢查('+esc(o.inspNo||o.id||'')+')之對應資料夾內。 All original attachment files are stored in the corresponding Google Drive folder of this inspection record.</div>', true);

  /* 附件卡片:依來源分三組 — 5.1 廠商自檢 / 5.2 NMDC 檢查 / 5.3 留言與改善回覆 */
  const attBody = f => {
    const src = imgMap[f.fileId];
    return src
      ? '<div style="padding:7px; text-align:center"><img src="'+src+'" style="max-width:100%; max-height:240px; border-radius:5px"></div>'
      : '<div style="padding:10px; color:#5A6673; font-size:8.5px">📁 原始檔存放於 Google Drive 對應檢查資料夾內<br>File stored in the corresponding Google Drive inspection folder</div>';
  };
  const attCard = (tag, ac, hbg, f, dispName, titlesHtml) =>
    '<div style="flex:1; min-width:0; border:1px solid #D5DEE7; border-radius:9px; overflow:hidden; background:#fff">' +
    '<div style="background:'+hbg+'; padding:4px 8px; font-size:8px; font-weight:700; color:#12283F; border-left:4px solid '+ac+'">'+tag+' '+esc(dispName!=null?dispName:f.name)+
    ' <span style="color:#8A94A0; font-weight:400">'+esc(f.uploadedAt||'')+'</span>' + (titlesHtml||'') + '</div>' + attBody(f) + '</div>';

  /* 同一張照片上傳到多個項目(檔名+大小相同)→ 附錄只放一次,標籤列出涵蓋的項目 */
  const origName = f => { const s = String(f.name||''); const i = s.indexOf(' & '); return i > -1 ? s.slice(i+3) : s; };
  const dedupeAtts = list => {          // list: [{f, tag, ac, hbg}]
    const map = new Map();
    list.forEach(x => {
      const k = origName(x.f) + '|' + (x.f.size || '');
      const g = map.get(k);
      if (g) { if (g.tags.indexOf(x.tag) < 0) g.tags.push(x.tag); }
      else map.set(k, { f: x.f, tags: [x.tag], ac: x.ac, hbg: x.hbg });
    });
    return Array.from(map.values());
  };
  /* 附錄卡片標頭:項目編號後面附上項目題目(合併多項時每個代碼各一行) */
  const tmapA = titleMapOf(cl);
  const tagTitles = (tags) => {
    const seen2 = [];
    tags.forEach(tg => String(tg).split(' · ').forEach(tok => {
      tok = tok.trim();
      if (/^[A-Z]{1,3}-\d+$/i.test(tok) && tmapA[tok] && seen2.indexOf(tok) < 0) seen2.push(tok);
    }));
    return seen2.map(c => '<div style="font-size:7.5px; color:#5A6673; font-weight:400; line-height:1.45; margin-top:1px">' +
      '<b style="color:#B03030">'+esc(c)+'</b> '+esc(truncS(tmapA[c].zh, 40))+'　<span style="color:#98A2AC">'+esc(truncS(tmapA[c].en, 55))+'</span></div>').join('');
  };
  const mkCards = list => dedupeAtts(list).map(g =>
    attCard('['+g.tags.join(' · ')+']', g.ac, g.hbg, g.f, origName(g.f), tagTitles(g.tags)));

  const selfList = [], nmdcList = [], cmtList = [];
  codes.forEach(code => {
    const c = secColorOf(code);
    attsOf(code, 'self').forEach(f => selfList.push({ f, tag: code, ac: c.ac, hbg: '#F0F4F8' }));
    attsOf(code, 'nmdc').forEach(f => nmdcList.push({ f, tag: code, ac: '#1D3D5C', hbg: '#EDF2F8' }));
  });
  defects.forEach((d, i) => {
    atts.filter(x => x.itemCode === 'DEF-' + d.id).forEach(f =>
      cmtList.push({ f, tag: 'D' + (i+1) + ((d.codes||[]).length ? ' · ' + d.codes.join(' · ') : ''),
        ac: '#8a5a00', hbg: '#FFF7E8' }));
  });
  atts.filter(x => x.itemCode === 'FOLLOWUP').forEach(f =>
    cmtList.push({ f, tag: '改善回覆 Follow-up', ac: '#C77F0A', hbg: '#FDF7EA' }));
  cmts.forEach(e => {
    const isN = e.author === 'nmdc';
    atts.filter(x => x.itemCode === 'CMT-'+e.id).forEach(f =>
      cmtList.push({ f, tag: '💬 '+(isN?'NMDC':'廠商 Contractor')+' '+String(e.at||'').slice(0,10),
        ac: isN?'#1D3D5C':'#1C7A42', hbg: isN?'#EDF2F8':'#F0FAF4' }));
  });
  const selfCards = mkCards(selfList), nmdcCards = mkCards(nmdcList), cmtCards = mkCards(cmtList);

  const pushCards = (title, cards) => {
    if (!cards.length) return;
    push('<div style="font-weight:800; color:#12283F; font-size:10px; border-left:4px solid #1D3D5C; background:#F0F4F8; border-radius:0 6px 6px 0; padding:5px 10px; margin:4px 0 8px">'+title+'</div>');
    for (let i = 0; i < cards.length; i += 2) {
      push('<div style="display:flex; gap:10px; margin-bottom:10px">' + cards[i] + (cards[i+1] || '<div style="flex:1"></div>') + '</div>');
    }
  };

  if (!selfCards.length && !nmdcCards.length && !cmtCards.length) {
    push('<div style="color:#8A94A0; font-size:9.5px">(無附件 No attachments)</div>');
  } else {
    pushCards('5.1 廠商自檢附件 Contractor Self-Check Attachments('+selfCards.length+')', selfCards);
    pushCards('5.2 NMDC 檢查附件 NMDC Inspection Attachments('+nmdcCards.length+')', nmdcCards);
    pushCards('5.3 留言與改善回覆附件 Comment &amp; Follow-up Attachments('+cmtCards.length+')', cmtCards);
  }
  return B;
}

/* 附件照片先縮到長邊 1280px 再排版:舊的未壓縮大圖是 PDF 慢的主因之一 */
function shrinkDataUrl(durl, MAX) {
  return new Promise((resolve) => {
    if (!/^data:image\//.test(String(durl))) { resolve(durl); return; }
    const img = new Image();
    img.onload = () => {
      try {
        const w = img.naturalWidth, h = img.naturalHeight;
        if (Math.max(w, h) <= MAX) { resolve(durl); return; }
        const sc = MAX / Math.max(w, h);
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w*sc)); cv.height = Math.max(1, Math.round(h*sc));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', 0.82));
      } catch (e) { resolve(durl); }
    };
    img.onerror = () => resolve(durl);
    img.src = durl;
  });
}

async function generatePdf(o, cl, imgMap, onProg) {
  await loadScriptOnce(LIB_H2C);
  await loadScriptOnce(LIB_JSPDF);
  /* 大圖先縮小(平行處理) */
  const keys = Object.keys(imgMap || {});
  await Promise.all(keys.map(k => shrinkDataUrl(imgMap[k], 1600).then(d => { imgMap[k] = d; })));
  const PAGE_W = 794, PAGE_H = 1123, PAD = 30, FOOT = 26;   // A4 @96dpi
  const availH = PAGE_H - PAD * 2 - FOOT;
  const FONT = 'Arial,\'Noto Sans TC\',\'PingFang TC\',\'Microsoft JhengHei\',sans-serif';

  const work = document.createElement('div');
  work.style.cssText = 'position:fixed; left:-12000px; top:0; background:#fff;';
  document.body.appendChild(work);

  // 先把全部 blocks 放進暫存區,等圖片載入
  const stage = document.createElement('div');
  stage.style.cssText = 'width:'+(PAGE_W - PAD*2)+'px; background:#fff; font-family:'+FONT+'; color:#1E2A36;';
  work.appendChild(stage);
  const queue = buildReportBlocks(o, cl, imgMap).map(b => {
    const d = document.createElement('div');
    d.innerHTML = b.html;
    d.__break = b.pageBreak;
    stage.appendChild(d);
    return d;
  });
  await Promise.all(Array.from(stage.querySelectorAll('img')).map(im =>
    (im.decode ? im.decode() : Promise.resolve()).catch(()=>{})));

  // 逐頁「實際裝箱」:放進頁面量實際高度(含 margin),超出就整塊移到下一頁 → 內容不會被切割
  const pageDivs = [];
  let qi = 0;
  while (qi < queue.length) {
    const pg = document.createElement('div');
    pg.style.cssText = 'width:'+PAGE_W+'px; height:'+PAGE_H+'px; background:#fff; padding:'+PAD+'px; box-sizing:border-box; position:relative; overflow:hidden; font-family:'+FONT+'; color:#1E2A36;';
    const inner = document.createElement('div');
    pg.appendChild(inner);
    work.appendChild(pg);
    let count = 0;
    while (qi < queue.length) {
      const d = queue[qi];
      if (count > 0 && d.__break) break;          // 指定換頁
      inner.appendChild(d);
      if (inner.scrollHeight > availH && count > 0) { inner.removeChild(d); break; }  // 裝不下 → 下一頁
      qi++; count++;
      if (inner.scrollHeight > availH) break;     // 單一 block 高於一頁:自成一頁
    }
    pageDivs.push(pg);
  }

  // 加頁尾 → 逐頁轉圖 → jsPDF
  const jsPDFC = window.jspdf.jsPDF;
  const pdf = new jsPDFC({ unit:'mm', format:'a4', orientation:'portrait', compress:true });
  for (let i = 0; i < pageDivs.length; i++) {
    const pg = pageDivs[i];
    const foot = document.createElement('div');
    foot.style.cssText = 'position:absolute; left:'+PAD+'px; right:'+PAD+'px; bottom:9px; background:#fff; border-top:1px solid #C9D3DC; color:#8A94A0; font-size:8px; padding-top:4px; display:flex; justify-content:space-between;';
    foot.innerHTML = '<span>'+DOC_NO+' · '+DOC_REV+' · '+esc(o.inspNo||'')+' · 環境船檢系統</span><span>Page '+(i+1)+' / '+pageDivs.length+'</span>';
    pg.appendChild(foot);
    if (onProg) onProg(i + 1, pageDivs.length);
    /* 📷 照片以「原始解析度」另外疊進 PDF:整頁轉圖只是底圖,照片本身用最高 1600px 原圖嵌入
       → 放大 PDF 也能看清照片裡的文字 */
    const pgRect = pg.getBoundingClientRect();
    const overlays = Array.from(pg.querySelectorAll('img')).map(im => {
      const r = im.getBoundingClientRect();
      return { src: im.src,
        x: (r.left - pgRect.left) * 210 / PAGE_W, y: (r.top - pgRect.top) * 210 / PAGE_W,
        w: r.width * 210 / PAGE_W, h: r.height * 210 / PAGE_W };
    }).filter(o => o.w > 5 && o.h > 5 && /^data:image\/(jpeg|jpg|png)/i.test(o.src));
    /* 手機記憶體有限:行動裝置降為 1.5 倍,避免 iOS Safari 記憶體不足閃退/失敗 */
    const SCALE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? 1.5 : 1.75;
    const canvas = await window.html2canvas(pg, { scale:SCALE, backgroundColor:'#ffffff', logging:false });
    if (i > 0) pdf.addPage();
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, 210, 297);
    overlays.forEach(o => {
      try { pdf.addImage(o.src, /png/i.test(o.src.slice(0,20)) ? 'PNG' : 'JPEG', o.x, o.y, o.w, o.h); } catch (e) {}
    });
    canvas.width = canvas.height = 0;   // 立即釋放記憶體
    pg.remove();
    await new Promise(r => setTimeout(r, 30));   // 讓瀏覽器喘口氣回收記憶體
  }
  work.remove();
  return pdf;
}

const { useState, useEffect, useRef, useCallback } = React;

function Toast({ msg }) {
  if (!msg) return null;
  return <div className={'toast' + (msg.err ? ' err' : '')}>{msg.text}</div>;
}

function Modal({ m, t }) {
  const [val, setVal] = useState('');
  useEffect(()=>{ setVal(''); }, [m]);
  if (!m) return null;
  const ok = () => m.input ? m.onOk(val) : m.onOk();
  return (
    <div className="modalbg" onClick={m.onCancel}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h4 style={m.titleStyle}>{m.title}</h4>
        {m.body && <p style={{whiteSpace:'pre-wrap'}}>{m.body}</p>}
        {m.list &&
          <ol style={{margin:'0 0 16px', paddingLeft:22, fontSize:14, color:'#333', lineHeight:1.75}}>
            {m.list.map((x,i)=> (typeof x === 'object' && x.hot)
              ? <li key={i} style={{marginBottom:6}}>
                  <span style={{background:'#fdecec', color:'var(--red)', fontWeight:800,
                    border:'1px solid #f3c6c6', borderRadius:7, padding:'2px 7px', display:'inline-block'}}>
                    ❗ {x.text}</span></li>
              : <li key={i} style={{marginBottom:6}}>{typeof x === 'object' ? x.text : x}</li>)}
          </ol>}
        {m.link && <p><a href={m.link} target="_blank" rel="noopener" style={{color:'#1e5ca8', fontWeight:700}}>{m.linkLabel || m.link}</a></p>}
        {m.input &&
          <input type="password" autoFocus value={val} onChange={e=>setVal(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter') ok(); }} placeholder="••••" />}
        <div className="btns" style={{flexWrap:'wrap'}}>
          {m.buttons ? m.buttons.map((b,i)=>
              <button key={i} className={'btn btn-sm ' + b.cls} onClick={b.onClick}>{b.label}</button>)
            : <React.Fragment>
                <button className="btn btn-o btn-sm" onClick={m.onCancel}>{m.cancelLabel || t.cancel}</button>
                {m.onOk && <button className={'btn btn-sm ' + (m.danger ? 'btn-r' : 'btn-p')} onClick={ok}>{m.okLabel || t.confirm}</button>}
              </React.Fragment>}
        </div>
      </div>
    </div>
  );
}

function StatusBadge({ status, stage, dateSelf, dateNmdc, verdict, verdictDeadline, closed, closedDate, t }) {
  if (stage === 'self') {
    if (status === 'self_done' || status === 'nmdc_done')
      return <span><span className="badge b-done">✓ {t.statusSelf}</span><div className="datesub">{dateSelf}</div></span>;
    return <span className="badge b-wait">{t.pending}</span>;
  }
  if (status === 'nmdc_done') {
    const isClosed = String(closed) === '1';
    const v = verdict==='fail' ? <span className="badge b-fail">✗ {t.sFail}</span>
      : verdict==='cond' ? (isClosed
          ? <span className="badge b-done">✓ {t.sCond} · {t.closedTag} {closedDate}</span>
          : <span className="badge b-cond">⚠ {t.sCond} · {t.sCondBy} {verdictDeadline}</span>)
      : verdict==='pass' ? <span className="badge b-done">✓ {t.sPass}</span> : null;
    return <span><span className="badge b-done">✓ {t.statusNmdc}</span><div className="datesub">{dateNmdc}</div>{v && <div style={{marginTop:3}}>{v}</div>}</span>;
  }
  return <span className="badge b-wait">{t.pending}</span>;
}

            )}
            {[...list].sort((a,b) =>
              String(b.inspectDate||'').localeCompare(String(a.inspectDate||'')) ||
              String(b.inspNo||'').localeCompare(String(a.inspNo||''))
            ).map(it => {
              const [a1,d1] = progParts(it.progress);
              const [a2,d2] = progParts(it.nmdcProgress);
              return (
                <tr key={it.id}>
                  <td style={{whiteSpace:'nowrap', fontWeight:700, color:'var(--navy)'}}>{it.inspNo || '—'}</td>
                  <td>
                    <div style={{fontWeight:700}}>{it.vesselZh || it.vesselEn || '—'}</div>
                    <div className="datesub">{it.vesselZh ? it.vesselEn : ''}{it.vesselClass ? ' · ' + it.vesselClass : ''}</div>
                    {it.scope ? <div className="datesub" style={{color:'#7A6A45'}}>🛠 {it.scope}</div> : null}
                  </td>
                  <td><div>{it.mmsi || '—'}</div><div className="datesub">IMO {it.imo || '—'}</div></td>
                  <td>{it.inspectDate || '—'}</td>
                  <td>
                    <div className="datesub">{t.progSelf} {it.progress || '—'}</div>
                    <div className="pbar"><i style={{width:(d1?Math.round(a1/d1*100):0)+'%'}}></i></div>
                    {it.status !== 'draft' && <div>
                      <div className="datesub" style={{marginTop:3}}>{t.progNmdc} {it.nmdcProgress || '—'}</div>
                      <div className="pbar"><i className="blue" style={{width:(d2?Math.round(a2/d2*100):0)+'%'}}></i></div>
                    </div>}
                  </td>
                  <td><StatusBadge status={it.status} stage="self" dateSelf={it.selfDate} t={t} /></td>
                  <td><StatusBadge status={it.status} stage="nmdc" dateNmdc={it.nmdcDate}
                        verdict={it.verdict} verdictDeadline={it.verdictDeadline}
                        closed={it.closed} closedDate={it.closedDate} t={t} /></td>
                  <td style={{whiteSpace:'nowrap'}}>
                    <button className="btn btn-navy btn-sm" onClick={()=>onOpen(it.id)}>{t.open}</button>{' '}
                    {canEdit && it.status==='nmdc_done' && it.verdict==='fail' &&
                      <button className="btn btn-r btn-sm" title={t.reinspectBtn} onClick={()=>onRe(it.id)}>🔁</button>}{' '}
                    {canEdit && it.folderUrl &&
                      <a className="btn btn-o btn-sm" style={{textDecoration:'none', display:'inline-block'}}
                        href={it.folderUrl} target="_blank" rel="noopener" title={t.folderTip}>📁</a>}{' '}
                    {(it.status==='nmdc_done' || it.status==='self_done') && canEdit &&
                      <button className="btn btn-amber btn-sm" onClick={()=>onPdf(it.id)}>📄 {t.pdf}</button>}{' '}
                    {canEdit && <button className="btn btn-r btn-sm" onClick={()=>onDelete(it.id)}>{t.del}</button>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------------- 附件列 ---------------- */
function AttRow({ t, code, stage, atts, can, uploading, onPick, onDelete, fileRefs }) {
  const key = stage==='nmdc' ? code+'#NMDC' : code;
  return (
    <div className="attrow">
      {can && <button className="attbtn" onClick={()=>fileRefs.current[key] && fileRefs.current[key].click()}>📎 {t.addFile}</button>}
      {can && <input type="file" multiple style={{display:'none'}}
        ref={el=>fileRefs.current[key]=el}
        onChange={e=>{ onPick(code, e.target.files, stage); e.target.value=''; }} />}
      {uploading && <span className="attchip uploading">⏳ {t.uploading}</span>}
      {atts.map(f => (
        <span className="attchip" key={f.fileId} title={f.name}>
          <a href={f.url} target="_blank" rel="noopener">{f.name}</a>
          <span className="datesub">{fmtSize(f.size)}</span>
          {can && <span className="x" onClick={()=>onDelete(f)}>✕</span>}
        </span>
      ))}
    </div>
  );
}

/* 檢查人 = 廠商可填;覆核人 / 核可人 = 需 🔑 解鎖(NMDC)才能填 */
function SignCard({ t, sign, setSign, can, adminEdit }) {

          { role:t.signEnd,  sub:t.signEndSub,  nk:'endName',  dk:'endDate',  nmdcOnly:true },
        ].map(s => {
          const editable = s.nmdcOnly ? !!adminEdit : !!can;

/* ---------------- 建議佐證提示 ---------------- */
function EvHint({ it, lang }) {

/* ---------------- 廠商自檢表單 ---------------- */

  const [activeSec, setActiveSec] = useState(cl.length ? cl[0].code : 'A');
  const fileRefs = useRef({});

  const setField = (k, v) => can && setItem(p => Object.assign({}, p, {[k]: v}));
  const setContact = (k, v) => can && setItem(p =>
    Object.assign({}, p, { data: Object.assign({}, p.data, { contact: Object.assign({}, p.data.contact, {[k]: v}) }) }));
  const setAns = (code, patch) => can && setItem(p => {
    const a = Object.assign({}, p.data.answers);
    a[code] = Object.assign({ v:'', remark:'' }, a[code], patch);
    return Object.assign({}, p, { data: Object.assign({}, p.data, { answers: a }) });
  });
  const setSign = (k, v) => can && setItem(p =>
    Object.assign({}, p, { data: Object.assign({}, p.data, { signoff: Object.assign({}, p.data.signoff, {[k]: v}) }) }));

  const answered = countMap(answers);
  const secCount = sec => sec.items.filter((i,idx) => { const a = answers[sec.code+'-'+(idx+1)]; return a && a.v; }).length;

    setActiveSec(code);
    const el = document.getElementById('sec-' + code);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  };

  const trySubmit = () => {
    const miss = missingOf(answers, cl);
    if (miss.length) {
      showToast(t.errAllItems(miss.length, TOTAL), true);
      highlightMissing(miss);
      const el = document.getElementById('item-' + miss[0]);

          <div className="field"><label>{t.vNameEn} <span className="req">*</span></label>
            <input disabled={!can} value={item.vesselEn} onChange={e=>setField('vesselEn', e.target.value)} placeholder="e.g. Normand Tonjer" /></div>

          <div className="field"><label>{t.tonnage}</label>

  /* 🔓 管理者:可修改廠商勾選結果與基本資料 */
  const setCtrAns = (code, patch) => adminEdit && setItem(p => {
    const a = Object.assign({}, p.data.answers);
    a[code] = Object.assign({ v:'', remark:'' }, a[code], patch);

  const setField = (k, v) => adminEdit && setItem(p => Object.assign({}, p, {[k]: v}));
  const setSign = (k, v) => can && setItem(p =>
    Object.assign({}, p, { data: Object.assign({}, p.data, { signoff: Object.assign({}, p.data.signoff, {[k]: v}) }) }));
  const setVerdict = (v) => can && setItem(p => Object.assign({}, p, { verdict: v }));

                                {v==='yes'?'Yes':v==='no'?'No':'N/A'}
                              </button>
                            ))}
                          </div>
                          <div className="remark">
                            <input value={ca.remark || ''} placeholder={t.remark}
                              onChange={e=>setCtrAns(code, { remark: e.target.value })} />
                          </div>
                        </div>
                      ) : (
                        <React.Fragment>
                          <span className={'ansbadge ' + (ca.v ? 'ans-'+ca.v : 'ans-none')}>{ca.v ? ansLabel(ca.v) : t.notAnswered}</span>
                          {ca.remark && <div className="ctr-remark">💬 {ca.remark}</div>}
                        </React.Fragment>
                      )}
                      <AttRow t={t} code={code} stage="self" atts={attsFor(code,'self')} can={adminEdit}
                        uploading={uploadingKeys.includes(code)} onPick={uploadFile} onDelete={deleteAtt} fileRefs={fileRefs} />
                    </div>
                    <div className="panel">
                      <div className="ph">{t.nmdcResult}</div>
                      <div className="row2" style={{marginTop:0}}>
                        <div className="seg">
                          {['yes','no','na'].map(v => (
                            <button key={v} disabled={!can} className={v + (a.v===v ? ' on' : '')}
                              onClick={()=>setAns(code, { v: a.v===v ? '' : v })}>
                              {v==='yes'?'Yes':v==='no'?'No':'N/A'}
                            </button>
                          ))}
                        </div>
                        <div className="remark">
                          <input disabled={!can} value={a.remark || ''} placeholder={t.remark}
                            onChange={e=>setAns(code, { remark: e.target.value })} />
                        </div>
                      </div>
                      <AttRow t={t} code={code} stage="nmdc" atts={attsFor(code,'nmdc')} can={can}
                        uploading={uploadingKeys.includes(code+'#NMDC')} onPick={uploadFile} onDelete={deleteAtt} fileRefs={fileRefs} />
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}

      <div className="card" id="verdict-card">
        <h3>⚖️ {t.verdictTitle}</h3>
        {[['fail', t.vFail], ['cond', t.vCond], ['pass', t.vPass]].map(([v, label]) => (
          <div key={v}>
            <div className={'vopt' + (item.verdict===v ? ' sel ' + v : '') + (!can ? ' ro' : '')}
              onClick={()=>can && setVerdict(v)}>
              <div className="dot"></div>
              <div>{label}</div>
            </div>
            {v==='cond' && item.verdict==='cond' &&
              <div className="ddl">
                <label style={{fontSize:12.5, fontWeight:600, color:'#54626f'}}>{t.vDeadline} <span className="req">*</span></label>
                <input type="date" disabled={!can} value={item.verdictDeadline||''} onChange={e=>setDeadline(e.target.value)} />
              </div>}
          </div>
        ))}
      </div>

      {/* 🧾 缺失清單:NMDC 選項目(複選)+敘述 → 廠商在每筆缺失下回覆+上傳佐證(附件自動以 D1、D2 編號) */}
      {(item.verdict === 'fail' || item.verdict === 'cond' || ((item.data.defects || []).length > 0)) && (() => {
        const isClosed = String(item.closed) === '1';
        const defects = item.data.defects || [];
        const allCodes = codesOf(cl);
        const canDef = editMode && !isClosed;
        const setDefects = (list) => setItem(p => Object.assign({}, p, { data: Object.assign({}, p.data, { defects: list }) }));
        const upDef = (i, patch) => setDefects(defects.map((d, j) => j === i ? Object.assign({}, d, patch) : d));
        const addDef = () => setDefects(defects.concat([{ id: 'd' + Date.now(), codes: [], desc: '', reply: '' }]));
        const delDef = (i) => askConfirm(t.confirmDelT, 'D' + (i + 1), () => setDefects(defects.filter((_, j) => j !== i)), true);
        const toggleCode = (i, c) => { const d = defects[i]; const has = (d.codes || []).indexOf(c) > -1;
          upDef(i, { codes: has ? d.codes.filter(x => x !== c) : (d.codes || []).concat([c]) }); };
        const isNo = c => nAns[c] && nAns[c].v === 'no';
        return (
          <div className="card" id="def-card">
            <h3>🧾 {t.defTitle}</h3>
            {canDef && <div className="banner blue">{t.defCodesHint}</div>}
            {done && !isClosed && !editMode && defects.length > 0 && <div className="banner blue">{t.defUpNote}</div>}
            {defects.map((d, i) => {
              const dAtts = (item.attachments || []).filter(x => x.itemCode === 'DEF-' + d.id);
              return (
                <div key={d.id} className="defcard">
                  <div style={{display:'flex', alignItems:'flex-start', gap:6, flexWrap:'wrap', marginBottom:6}}>
                    <span className="defnum">D{i + 1}</span>
                    <div style={{flex:1, minWidth:200}}>
                      {canDef
                        ? allCodes.map(c =>
                            <span key={c} className={'defchip' + ((d.codes||[]).indexOf(c)>-1 ? ' on' : '') + (isNo(c) ? ' no' : '')}
                              onClick={() => toggleCode(i, c)}>{c}</span>)
                        : (d.codes||[]).map(c =>
                            <span key={c} className={'defchip on ro' + (isNo(c) ? ' no' : '')}>{c}</span>)}
                      {/* 項目題目:一看就知道缺失對應哪一項 */}
                      {(d.codes||[]).length > 0 && (() => { const tm = titleMapOf(cl); return (
                        <div style={{marginTop:3}}>
                          {(d.codes||[]).map(c => { const tt = tm[c] || {}; return (
                            <div key={c} style={{fontSize:12, color:'#54626f', lineHeight:1.5}}>
                              <b style={{color:'#B03030'}}>{c}</b> {truncS(lang==='zh' ? (tt.zh || tt.en) : (tt.en || tt.zh), 70)}
                            </div>); })}
                        </div>); })()}
                    </div>
                    {canDef && <button className="btn btn-r btn-sm" onClick={() => delDef(i)}>✕</button>}
                  </div>
                  {canDef
                    ? <textarea rows={3} placeholder={t.defDescPh} value={d.desc || ''} onChange={e => upDef(i, { desc: e.target.value })} />
                    : <div style={{fontSize:13.5, whiteSpace:'pre-wrap', lineHeight:1.55}}>{d.desc || '—'}</div>}
                  {done && (
                    <div style={{marginTop:8, borderTop:'1px dashed #D8CBAA', paddingTop:8}}>
                      <div style={{fontSize:12, fontWeight:800, color:'#1C7A42', marginBottom:4}}>⛴ {t.defCtrReply}</div>
                      <textarea rows={2} disabled={isClosed} placeholder={t.defReplyPh} value={d.reply || ''}
                        onChange={e => upDef(i, { reply: e.target.value })} />
                      <AttRow t={t} code={'DEF-' + d.id} stage="fu" atts={dAtts}
                        can={!isClosed} uploading={uploadingKeys.includes('DEF-' + d.id)}
                        onPick={uploadFile} onDelete={deleteAtt} fileRefs={fileRefs} />
                    </div>
                  )}
                </div>
              );
            })}
            <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
              {canDef && <button className="btn btn-o" onClick={addDef}>{t.defAdd}</button>}
              {done && !isClosed && defects.length > 0 &&
                <button className="btn btn-p" disabled={saving} onClick={() => onSave()}>{t.defReplySave}</button>}
            </div>
          </div>
        );
      })()}

      {/* 💬 檢查意見與驗證回覆:NMDC 留 comment → 廠商依 comment 自檢、上傳佐證、留言驗證 → (有條件通過)NMDC 結案
          檢查進行中勾選「未通過/有條件通過」即出現(必填);檢查完成後所有結果都顯示 */}
      {(done || item.verdict === 'fail' || item.verdict === 'cond') && (() => {
        const isClosed = String(item.closed) === '1';
        const isCond = item.verdict === 'cond';
        const cmts = (item.data && item.data.comments) || [];
        const legacyFu = (item.data && item.data.followup && item.data.followup.text) || '';
        const legacyAtts = (item.attachments || []).filter(x => x.itemCode === 'FOLLOWUP');
        const postCmt = () => {
          const txt = cmtText.trim(); if (!txt) return;
          const entry = { id:'c'+Date.now(), author: editMode ? 'nmdc' : 'ctr', text: txt, at: nowStr() };
          onSave(null, { data: Object.assign({}, item.data, { comments: cmts.concat([entry]) }) })
            .then(() => setCmtText('')).catch(()=>{});
        };
        const roleTag = (au) => au === 'nmdc'
          ? <span className="badge" style={{background:'#1D3D5C', color:'#fff'}}>🛠 {t.cmtNmdc}</span>
          : <span className="badge b-done">⛴ {t.cmtCtr}</span>;
        return (
          <div className="card" id="cmt-card">
            <h3>💬 {t.cmtTitle}{' '}
              {isCond && done && (isClosed
                ? <span className="badge b-done">✓ {t.closedTag} {item.closedDate}</span>
                : <span className="badge b-cond">⏳ {t.fuPending}</span>)}
            </h3>
            {!done && <div className="banner">⚠ {t.cmtNeed}</div>}
            {done && !isClosed && <div className="banner blue">{t.cmtNote}</div>}

            {legacyFu || legacyAtts.length ? (
              <div style={{border:'1px solid #E5D9BC', background:'#FDF9EF', borderRadius:10, padding:'9px 12px', marginBottom:10}}>
                <div style={{fontSize:12, fontWeight:800, color:'#8a6d3b', marginBottom:4}}>📤 {t.cmtLegacy}</div>
                {legacyFu && <div style={{fontSize:13, whiteSpace:'pre-wrap', lineHeight:1.55}}>{legacyFu}</div>}
                {legacyAtts.length > 0 &&
                  <AttRow t={t} code="FOLLOWUP" stage="fu" atts={legacyAtts}
                    can={false} uploading={false} onPick={uploadFile} onDelete={deleteAtt} fileRefs={fileRefs} />}
              </div>
            ) : null}

            {cmts.length === 0 && !legacyFu && !legacyAtts.length &&
              <div style={{color:'#8A94A0', fontSize:13, padding:'4px 2px'}}>{t.cmtEmpty}</div>}

            {cmts.map(e => {
              const mine = e.author === 'nmdc' ? editMode : true;   // 廠商留言人人可改;NMDC 留言需 🔑
              const eAtts = (item.attachments || []).filter(x => x.itemCode === 'CMT-'+e.id);
              const editing = cmtEditId === e.id;
              const saveEdit = () => {
                const txt = cmtEditText.trim(); if (!txt) return;
                const updated = cmts.map(c => c.id === e.id ? Object.assign({}, c, { text: txt, editedAt: nowStr() }) : c);
                onSave(null, { data: Object.assign({}, item.data, { comments: updated }) })
                  .then(() => setCmtEditId(null)).catch(()=>{});
              };
              const delEntry = () => askConfirm(t.confirmDelT, t.cmtDelP, () => {
                Promise.all(eAtts.map(f => api('deleteFile', { fileId: f.fileId }).catch(()=>{}))).then(() => {
                  setItem(p => Object.assign({}, p, { attachments: (p.attachments||[]).filter(x => x.itemCode !== 'CMT-'+e.id) }));
                  onSave(null, { data: Object.assign({}, item.data, { comments: cmts.filter(c => c.id !== e.id) }) });
                });
              }, true);
              return (
                <div key={e.id} style={{border:'1px solid '+(e.author==='nmdc'?'#C9D6E4':'#CBE3D2'),
                    background:e.author==='nmdc'?'#F5F8FB':'#F4FAF6', borderRadius:10, padding:'9px 12px', marginBottom:8}}>
                  <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:5, flexWrap:'wrap'}}>
                    {roleTag(e.author)}
                    <span style={{fontSize:11.5, color:'#8A94A0'}}>{e.at}</span>
                    {e.editedAt && <span style={{fontSize:11, color:'#B8A26E'}}>✎ {t.cmtEdited} {String(e.editedAt).slice(0,16)}</span>}
                    {mine && !isClosed && !editing &&
                      <span style={{marginLeft:'auto', display:'flex', gap:6}}>
                        <button className="btn btn-o btn-sm" onClick={()=>{ setCmtEditId(e.id); setCmtEditText(e.text||''); }}>✎</button>
                        <button className="btn btn-r btn-sm" onClick={delEntry}>✕</button>
                      </span>}
                  </div>
                  {editing
                    ? <div>
                        <textarea rows={3} value={cmtEditText} onChange={ev=>setCmtEditText(ev.target.value)} />
                        <div style={{display:'flex', gap:8, marginTop:6}}>
                          <button className="btn btn-p btn-sm" disabled={saving || !cmtEditText.trim()} onClick={saveEdit}>{t.cmtEditSave}</button>
                          <button className="btn btn-o btn-sm" onClick={()=>setCmtEditId(null)}>{t.cmtEditCancel}</button>
                        </div>
                      </div>
                    : <div style={{fontSize:13.5, whiteSpace:'pre-wrap', lineHeight:1.55}}>{e.text}</div>}
                  <AttRow t={t} code={'CMT-'+e.id} stage="fu" atts={eAtts}
                    can={!isClosed && mine} uploading={uploadingKeys.includes('CMT-'+e.id)}
                    onPick={uploadFile} onDelete={deleteAtt} fileRefs={fileRefs} />
                </div>
              );
            })}

            {!isClosed &&
              <div style={{marginTop:6}}>
                <div style={{fontSize:12, fontWeight:700, color: editMode ? '#1D3D5C' : '#1C7A42', marginBottom:4}}>
                  {editMode ? t.cmtAsNmdc : t.cmtAsCtr}</div>
                <textarea rows={3} placeholder={t.cmtPh} value={cmtText}
                  onChange={e => setCmtText(e.target.value)} />
                <div style={{fontSize:11.5, color:'#8A94A0', marginTop:3}}>{t.cmtAttachHint}</div>
                <div style={{display:'flex', gap:8, marginTop:8, flexWrap:'wrap'}}>
                  <button className="btn btn-p" disabled={saving || !cmtText.trim()} onClick={postCmt}>{t.cmtPost}</button>
                  {isCond && done && editMode &&
                    <button className="btn btn-navy" disabled={saving}
                      onClick={()=>askConfirm(t.confirmCloseT, t.confirmCloseP, ()=>onSave(null, { closed:'1' }))}>{t.fuClose}</button>}
                </div>
              </div>}
          </div>
        );
      })()}

      <SignCard t={t} sign={item.data.signoff||{}} setSign={setSign} can={can} adminEdit={adminEdit && can} />

      <div className="footbar">
        <button className="btn btn-o" onClick={onBack}>{t.back}</button>
        <div className="grow">
          NMDC {answered}/{TOTAL} {t.answered}
          {editMode && !done &&
            <a style={{marginLeft:8, color:'#1e5ca8', cursor:'pointer'}}
              onClick={()=>setItem(p=>Object.assign({}, p, {status:'draft'}))}>{t.revert}</a>}
          {editMode && done &&
            <a style={{marginLeft:8, color:'#1e5ca8', cursor:'pointer'}}
              onClick={()=>setItem(p=>Object.assign({}, p, {status:'self_done'}))}>{t.revert}</a>}
        </div>
        {can && <button className="btn btn-o" disabled={saving} onClick={()=>onSave()}>{saving ? '...' : '💾 ' + t.save}</button>}
        {can && !done && <button className="btn btn-navy" disabled={saving} onClick={trySubmit}>✓✓ {t.markNmdc}</button>}
        {done && item.verdict==='fail' && editMode &&
          <button className="btn btn-r" disabled={saving} onClick={onReinspect}>🔁 {t.reinspectBtn}</button>}
        {editMode && <button className="btn btn-amber" disabled={exporting} onClick={onExport}>{exporting ? t.exporting : t.exportPdf}</button>}
      </div>
    </div>
  );
}

/* ---------------- 檢查項目編輯器 ---------------- */
function Editor({ t, checklist, onSave, onBack, askConfirm, saving }) {
  const [cl, setCl] = useState(() => JSON.parse(JSON.stringify(checklist)));
  const upd = fn => setCl(p => { const c = JSON.parse(JSON.stringify(p)); fn(c); return c; });
  const move = (arr, i, dir) => { const j = i + dir; if (j < 0 || j >= arr.length) return; const x = arr[i]; arr[i] = arr[j]; arr[j] = x; };

  return (
    <div>
      <div className="banner blue">{t.editorNote}</div>

      {cl.map((sec, si) => (
        <div className="card" key={si}>
          <div className="sechead-edit">
            <input className="code" maxLength={2} value={sec.code} placeholder={t.secCodePh}
              onChange={e=>upd(c=>c[si].code = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''))} />
            <input style={{flex:1, minWidth:140}} value={sec.zh} placeholder={t.secZhPh}
              onChange={e=>upd(c=>c[si].zh = e.target.value)} />
            <input style={{flex:1, minWidth:140}} value={sec.en} placeholder={t.secEnPh}
              onChange={e=>upd(c=>c[si].en = e.target.value)} />
            <button className="mini" onClick={()=>upd(c=>move(c, si, -1))}>▲</button>
            <button className="mini" onClick={()=>upd(c=>move(c, si, 1))}>▼</button>
            <button className="mini danger"
              onClick={()=>askConfirm(t.confirmDelSecT, (sec.code||'?') + '. ' + (sec.zh||sec.en||''), ()=>upd(c=>c.splice(si,1)), true)}>✕</button>
          </div>

          {sec.items.map((it, ii) => (
            <div className="editem" key={ii}>
              <div className="no">{sec.code}-{ii+1}</div>
              <div className="fields">
                <textarea rows={2} value={it.zh} placeholder={t.itemZhPh}
                  onChange={e=>upd(c=>c[si].items[ii].zh = e.target.value)} />
                <textarea rows={2} value={it.en} placeholder={t.itemEnPh}
                  onChange={e=>upd(c=>c[si].items[ii].en = e.target.value)} />
                <input value={it.evZh||''} placeholder={t.evZhPh}
                  onChange={e=>upd(c=>c[si].items[ii].evZh = e.target.value)} />
                <input value={it.evEn||''} placeholder={t.evEnPh}
                  onChange={e=>upd(c=>c[si].items[ii].evEn = e.target.value)} />
              </div>
              <div className="ops">
                <button className="mini" onClick={()=>upd(c=>move(c[si].items, ii, -1))}>▲</button>
                <button className="mini" onClick={()=>upd(c=>move(c[si].items, ii, 1))}>▼</button>
                <button className="mini danger"
                  onClick={()=>askConfirm(t.confirmDelItemT, sec.code+'-'+(ii+1), ()=>upd(c=>c[si].items.splice(ii,1)), true)}>✕</button>
              </div>
            </div>
          ))}
          <button className="mini" style={{marginTop:8}}
            onClick={()=>upd(c=>c[si].items.push({en:'', zh:'', evEn:'', evZh:''}))}>{t.addItem}</button>
        </div>
      ))}

      <button className="btn btn-o" onClick={()=>upd(c=>{
        const used = c.map(s=>s.code);
        let code = 'F';
        for (let i = 0; i < 26; i++) { const ch = String.fromCharCode(65+i); if (used.indexOf(ch) === -1) { code = ch; break; } }
        c.push({code, zh:'', en:'', items:[{en:'', zh:'', evEn:'', evZh:''}]});
      })}>{t.addSection}</button>

      <div className="footbar">
        <button className="btn btn-o" onClick={onBack}>{t.back}</button>
        <div className="grow">{t.editorTitle} · {totalOf(cl)} items</div>
        <button className="btn btn-p" disabled={saving} onClick={()=>{
          const clean = cl.filter(s => s.code && (s.items||[]).length)
            .map(s => Object.assign({}, s, { items: s.items.filter(i => (i.zh||'').trim() || (i.en||'').trim()) }))
            .filter(s => s.items.length);
          onSave(clean);
        }}>{saving ? '...' : t.saveChecklist}</button>
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [lang, setLang] = useState(localStorage.getItem('evis_lang') || 'en');
  const t = T[lang];
  const [editMode, setEditMode] = useState(localStorage.getItem('evis_unlocked') === '1');
  const [testMode, setTestMode] = useState(TESTMODE);
  /* 啟動加速:先用 localStorage 快取秒開,背景再向伺服器更新 */
  const [checklist, setChecklist] = useState(() => {
    try { const c = JSON.parse(localStorage.getItem('evis_cache_cl')); return (c && c.length) ? c : DEFAULT_CHECKLIST; }
    catch(e){ return DEFAULT_CHECKLIST; }
  });
  const [view, setView] = useState('dash');
  const [list, setList] = useState(() => {
    if (LOCAL || TESTMODE) return [];
    try { return JSON.parse(localStorage.getItem('evis_cache_list')) || []; } catch(e){ return []; }
  });
  const [loading, setLoading] = useState(true);
  const [item, setItem] = useState(null);
  const [saving, setSaving] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [toast, setToast] = useState(null);
  const [modal, setModal] = useState(null);
  const [uploadingKeys, setUploadingKeys] = useState([]);
  const [failedUps, setFailedUps] = useState([]);   // 上傳失敗的附件(壓縮檔暫存於記憶體,可一鍵重試)
  const failedRef = useRef([]); failedRef.current = failedUps;
  const [busyMsgs, setBusyMsgs] = useState([]);   // 長時間動作 overlay(讀取/儲存/上傳/PDF)
  const track = (p, msg) => {
    const m = { msg };
    setBusyMsgs(a => [...a, m]);
    return p.finally(() => setBusyMsgs(a => a.filter(x => x !== m)));
  };
  const [dirty, setDirty] = useState(false);       // 有未儲存的修改
  const dirtyRef = useRef(false); dirtyRef.current = dirty;
  const viewRef = useRef('dash'); viewRef.current = view;
  const itemRef = useRef(null);
  itemRef.current = item;
  /* 表單修改都走這個 setter,自動標記未儲存 */
  /* 📝 本機草稿備援:編輯內容 0.8 秒後自動備份到此裝置(不含附件),意外關閉/斷線可還原 */
  const draftKey = (it) => 'evis_draft_' + (TESTMODE ? 'test_' : '') + ((it && it.id) ? it.id : 'new');
  const draftTimer = useRef(null);
  const writeDraft = (force) => {
    const it = itemRef.current;
    if (!it || viewRef.current !== 'form' || (!force && !dirtyRef.current)) return;
    try {
      const c = Object.assign({}, it); delete c._miss; c.attachments = [];
      localStorage.setItem(draftKey(it), JSON.stringify({ at: Date.now(), item: c }));
    } catch (e) {}   // 空間滿等錯誤:草稿為輔助功能,略過
  };
  const clearDraftOne = (it) => { try { localStorage.removeItem(draftKey(it || {})); } catch (e) {} };
  const clearDraft = (it) => { clearDraftOne(it); clearDraftOne({}); };   // 含 new 草稿
  const setItemDirty = (updater) => {
    setDirty(true); setItem(updater);
    if (draftTimer.current) clearTimeout(draftTimer.current);
    draftTimer.current = setTimeout(writeDraft, 800);
  };
  /* 開啟紀錄時:若此裝置有比伺服器版本新的草稿 → 詢問是否還原 */
  const maybeOfferDraft = (it) => {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(draftKey(it))); } catch (e) {}
    if (!d || !d.item) return;
    const srvT = Date.parse(String(it.updatedAt || '').replace(' ', 'T')) || 0;

  /* 📷 照片自動壓縮:長邊 1600px、JPEG 0.82(佐證照片綽綽有餘)
   *   → 8MB 手機照片通常變 300~600KB,大幅減少行動網路上傳逾時 */
  const prepFile = (f) => new Promise((resolve) => {
    const asOriginal = () => {
      const rd = new FileReader();
      rd.onload = () => resolve({ base64: String(rd.result).split(',')[1], name: f.name, mimeType: f.type || 'application/octet-stream', size: f.size });
      rd.onerror = () => resolve(null);
      rd.readAsDataURL(f);
    };
    /* 非圖片、GIF、或本來就小(<400KB)→ 不壓縮 */
    if (!/^image\//i.test(f.type || '') || /gif/i.test(f.type || '') || f.size < 400*1024) { asOriginal(); return; }
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      try {
        const MAX = 1600;
        const sc = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * sc));
        const h = Math.max(1, Math.round(img.naturalHeight * sc));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        const b64 = cv.toDataURL('image/jpeg', 0.82).split(',')[1];
        URL.revokeObjectURL(url);
        const bytes = Math.round(b64.length * 0.75);
        if (bytes && bytes < f.size) {
          resolve({ base64: b64, name: f.name.replace(/\.[^.]+$/, '') + '.jpg', mimeType: 'image/jpeg', size: bytes });
        } else asOriginal();
      } catch (e) { URL.revokeObjectURL(url); asOriginal(); }   // 例:HEIC 無法解碼 → 原檔上傳
    };
    img.onerror = () => { URL.revokeObjectURL(url); asOriginal(); };
    img.src = url;
  });

    const itemCode = stage==='nmdc' ? code+'#NMDC' : code;
    let label = stage==='nmdc' ? code+' (NMDC)' : (code==='FOLLOWUP' ? 'FU' : (/^CMT-/.test(code) ? 'CMT' : code));
    if (/^DEF-/.test(code)) {   // 缺失附件:自動以缺失編號命名(D1、D2…)
      const ds = (itemRef.current && itemRef.current.data && itemRef.current.data.defects) || [];

      label = 'D' + (ix > -1 ? ix + 1 : '');

    /* 改善相關附件(缺失回覆/留言/補件)→ 存 Drive 子資料夾 */

      arr.reduce((chain, f) => chain.then(() =>
        prepFile(f).then(pf => {

          if (pf.size > maxSize) { showToast(t.fileTooBig, true); return; }
          return sendUpload({ inspId: saved.id, itemCode, label, sub, name: pf.name, mimeType: pf.mimeType, base64: pf.base64, size: pf.size });
        })
      ), Promise.resolve()).catch(()=>{});
    }).catch(()=>{});
  };

  /* 單張上傳(含失敗暫存):成功掛進附件列表;失敗留在 failedUps 可一鍵重試,不用重選檔案
     ★ 全站單一上傳佇列:不同欄位同時選檔也乖乖排同一條隊,不再互搶後端寫入鎖而報錯 */
  const upQRef = useRef(Promise.resolve());
  const sendUpload = (u) => {
    setUploadingKeys(k => [...k, u.itemCode]);

      api('upload', { inspId: u.inspId, itemCode: u.itemCode, label: u.label, sub: u.sub || '', name: u.name, mimeType: u.mimeType, base64: u.base64 }));

      .then(r => {

  const guardLeave = (next) => {
