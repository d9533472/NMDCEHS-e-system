            {!isClosed && <div className="banner blue">{t.cmtNote}</div>}

            {legacyFu || legacyAtts.length ? (
              <div style={{border:'1px solid #E5D9BC', background:'#FDF9EF', borderRadius:10, padding:'9px 12px', marginBottom:10}}>
                <div style={{fontSize:12, fontWeight:800, color:'#8a6d3b', marginBottom:4}}>📤 {t.cmtLegacy}</div>
                {legacyFu && <div style={{fontSize:13, whiteSpace:'pre-wrap', lineHeight:1.55}}>{legacyFu}</div>}
                {legacyAtts.length > 0 &&
                  <AttRow t={t} code="FOLLOWUP" stage="fu" atts={legacyAtts}
                    can={false} uploading={false} onPick={uploadFile} onDelete={deleteAtt} fileRefs={fileRefs} />}
              </div>
            ) : null}

            {cmts.length === 0 && !legacyFu && !legacyAtts.length &&
              <div style={{color:'#8A94A0', fontSize:13, padding:'4px 2px'}}>{t.cmtEmpty}</div>}

            {cmts.map(e => {
              const mine = e.author === 'nmdc' ? editMode : true;   // 廠商留言人人可補附件;NMDC 留言需 🔑
              const eAtts = (item.attachments || []).filter(x => x.itemCode === 'CMT-'+e.id);
              return (
                <div key={e.id} style={{border:'1px solid '+(e.author==='nmdc'?'#C9D6E4':'#CBE3D2'),
                    background:e.author==='nmdc'?'#F5F8FB':'#F4FAF6', borderRadius:10, padding:'9px 12px', marginBottom:8}}>
                  <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:5, flexWrap:'wrap'}}>
                    {roleTag(e.author)}
                    <span style={{fontSize:11.5, color:'#8A94A0'}}>{e.at}</span>
                  </div>
                  <div style={{fontSize:13.5, whiteSpace:'pre-wrap', lineHeight:1.55}}>{e.text}</div>
                  <AttRow t={t} code={'CMT-'+e.id} stage="fu" atts={eAtts}
                    can={!isClosed && mine} uploading={uploadingKeys.includes('CMT-'+e.id)}
                    onPick={uploadFile} onDelete={deleteAtt} fileRefs={fileRefs} />
                </div>
              );
            })}

            {!isClosed &&
              <div style={{marginTop:6}}>
                <div style={{fontSize:12, fontWeight:700, color: editMode ? '#1D3D5C' : '#1C7A42', marginBottom:4}}>
                  {editMode ? t.cmtAsNmdc : t.cmtAsCtr}</div>
                <textarea rows={3} placeholder={t.cmtPh} value={cmtText}
                  onChange={e => setCmtText(e.target.value)} />
                <div style={{display:'flex', gap:8, marginTop:8, flexWrap:'wrap'}}>
                  <button className="btn btn-p" disabled={saving || !cmtText.trim()} onClick={postCmt}>{t.cmtPost}</button>
                  {isCond && editMode &&
                    <button className="btn btn-navy" disabled={saving}
                      onClick={()=>askConfirm(t.confirmCloseT, t.confirmCloseP, ()=>onSave(null, { closed:'1' }))}>{t.fuClose}</button>}
                </div>
              </div>}
          </div>
        );
      })()}

      <SignCard t={t} sign={item.data.signoff||{}} setSign={setSign} can={can} adminEdit={adminEdit && can} />

      <div className="footbar">
        <button className="btn btn-o" onClick={onBack}>{t.back}</button>
        <div className="grow">
          NMDC {answered}/{TOTAL} {t.answered}
          {editMode && !done &&
            <a style={{marginLeft:8, color:'#1e5ca8', cursor:'pointer'}}
              onClick={()=>setItem(p=>Object.assign({}, p, {status:'draft'}))}>{t.revert}</a>}
          {editMode && done &&
            <a style={{marginLeft:8, color:'#1e5ca8', cursor:'pointer'}}
              onClick={()=>setItem(p=>Object.assign({}, p, {status:'self_done'}))}>{t.revert}</a>}
        </div>
        {can && <button className="btn btn-o" disabled={saving} onClick={()=>onSave()}>{saving ? '...' : '💾 ' + t.save}</button>}
        {can && !done && <button className="btn btn-navy" disabled={saving} onClick={trySubmit}>✓✓ {t.markNmdc}</button>}
        {done && item.verdict==='fail' && editMode &&
          <button className="btn btn-r" disabled={saving} onClick={onReinspect}>🔁 {t.reinspectBtn}</button>}
        {done && editMode && <button className="btn btn-amber" disabled={exporting} onClick={onExport}>{exporting ? t.exporting : t.exportPdf}</button>}
      </div>
    </div>
  );
}

/* ---------------- 檢查項目編輯器 ---------------- */
function Editor({ t, checklist, onSave, onBack, askConfirm, saving }) {
  const [cl, setCl] = useState(() => JSON.parse(JSON.stringify(checklist)));
  const upd = fn => setCl(p => { const c = JSON.parse(JSON.stringify(p)); fn(c); return c; });
  const move = (arr, i, dir) => { const j = i + dir; if (j < 0 || j >= arr.length) return; const x = arr[i]; arr[i] = arr[j]; arr[j] = x; };

  return (
    <div>
      <div className="banner blue">{t.editorNote}</div>

      {cl.map((sec, si) => (
        <div className="card" key={si}>
          <div className="sechead-edit">
            <input className="code" maxLength={2} value={sec.code} placeholder={t.secCodePh}
              onChange={e=>upd(c=>c[si].code = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''))} />
            <input style={{flex:1, minWidth:140}} value={sec.zh} placeholder={t.secZhPh}
              onChange={e=>upd(c=>c[si].zh = e.target.value)} />
            <input style={{flex:1, minWidth:140}} value={sec.en} placeholder={t.secEnPh}
              onChange={e=>upd(c=>c[si].en = e.target.value)} />
            <button className="mini" onClick={()=>upd(c=>move(c, si, -1))}>▲</button>
            <button className="mini" onClick={()=>upd(c=>move(c, si, 1))}>▼</button>
            <button className="mini danger"
              onClick={()=>askConfirm(t.confirmDelSecT, (sec.code||'?') + '. ' + (sec.zh||sec.en||''), ()=>upd(c=>c.splice(si,1)), true)}>✕</button>
          </div>

          {sec.items.map((it, ii) => (
            <div className="editem" key={ii}>
              <div className="no">{sec.code}-{ii+1}</div>
              <div className="fields">
                <textarea rows={2} value={it.zh} placeholder={t.itemZhPh}
                  onChange={e=>upd(c=>c[si].items[ii].zh = e.target.value)} />
                <textarea rows={2} value={it.en} placeholder={t.itemEnPh}
                  onChange={e=>upd(c=>c[si].items[ii].en = e.target.value)} />
                <input value={it.evZh||''} placeholder={t.evZhPh}
                  onChange={e=>upd(c=>c[si].items[ii].evZh = e.target.value)} />
                <input value={it.evEn||''} placeholder={t.evEnPh}
                  onChange={e=>upd(c=>c[si].items[ii].evEn = e.target.value)} />
              </div>
              <div className="ops">
                <button className="mini" onClick={()=>upd(c=>move(c[si].items, ii, -1))}>▲</button>
                <button className="mini" onClick={()=>upd(c=>move(c[si].items, ii, 1))}>▼</button>
                <button className="mini danger"
                  onClick={()=>askConfirm(t.confirmDelItemT, sec.code+'-'+(ii+1), ()=>upd(c=>c[si].items.splice(ii,1)), true)}>✕</button>
              </div>
            </div>
          ))}
          <button className="mini" style={{marginTop:8}}
            onClick={()=>upd(c=>c[si].items.push({en:'', zh:'', evEn:'', evZh:''}))}>{t.addItem}</button>
        </div>
      ))}

      <button className="btn btn-o" onClick={()=>upd(c=>{
        const used = c.map(s=>s.code);
        let code = 'F';
        for (let i = 0; i < 26; i++) { const ch = String.fromCharCode(65+i); if (used.indexOf(ch) === -1) { code = ch; break; } }
        c.push({code, zh:'', en:'', items:[{en:'', zh:'', evEn:'', evZh:''}]});
      })}>{t.addSection}</button>

      <div className="footbar">
        <button className="btn btn-o" onClick={onBack}>{t.back}</button>
        <div className="grow">{t.editorTitle} · {totalOf(cl)} items</div>
        <button className="btn btn-p" disabled={saving} onClick={()=>{
          const clean = cl.filter(s => s.code && (s.items||[]).length)
            .map(s => Object.assign({}, s, { items: s.items.filter(i => (i.zh||'').trim() || (i.en||'').trim()) }))
            .filter(s => s.items.length);
          onSave(clean);
        }}>{saving ? '...' : t.saveChecklist}</button>
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [lang, setLang] = useState(localStorage.getItem('evis_lang') || 'en');
  const t = T[lang];
  const [editMode, setEditMode] = useState(localStorage.getItem('evis_unlocked') === '1');
  const [testMode, setTestMode] = useState(TESTMODE);
  /* 啟動加速:先用 localStorage 快取秒開,背景再向伺服器更新 */
  const [checklist, setChecklist] = useState(() => {
    try { const c = JSON.parse(localStorage.getItem('evis_cache_cl')); return (c && c.length) ? c : DEFAULT_CHECKLIST; }
    catch(e){ return DEFAULT_CHECKLIST; }
  });
  const [view, setView] = useState('dash');
  const [list, setList] = useState(() => {
    if (LOCAL || TESTMODE) return [];
    try { return JSON.parse(localStorage.getItem('evis_cache_list')) || []; } catch(e){ return []; }
  });
  const [loading, setLoading] = useState(true);
  const [item, setItem] = useState(null);
  const [saving, setSaving] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [toast, setToast] = useState(null);
  const [modal, setModal] = useState(null);
  const [uploadingKeys, setUploadingKeys] = useState([]);
  const [failedUps, setFailedUps] = useState([]);   // 上傳失敗的附件(壓縮檔暫存於記憶體,可一鍵重試)
  const failedRef = useRef([]); failedRef.current = failedUps;
  const [busyMsgs, setBusyMsgs] = useState([]);   // 長時間動作 overlay(讀取/儲存/上傳/PDF)
  const track = (p, msg) => {
    const m = { msg };
    setBusyMsgs(a => [...a, m]);
    return p.finally(() => setBusyMsgs(a => a.filter(x => x !== m)));
  };
  const [dirty, setDirty] = useState(false);       // 有未儲存的修改
  const dirtyRef = useRef(false); dirtyRef.current = dirty;
  const viewRef = useRef('dash'); viewRef.current = view;
  const itemRef = useRef(null);
  itemRef.current = item;
  /* 表單修改都走這個 setter,自動標記未儲存 */
  /* 📝 本機草稿備援:編輯內容 0.8 秒後自動備份到此裝置(不含附件),意外關閉/斷線可還原 */
  const draftKey = (it) => 'evis_draft_' + (TESTMODE ? 'test_' : '') + ((it && it.id) ? it.id : 'new');
  const draftTimer = useRef(null);
  const writeDraft = (force) => {
    const it = itemRef.current;
    if (!it || viewRef.current !== 'form' || (!force && !dirtyRef.current)) return;
    try {
      const c = Object.assign({}, it); delete c._miss; c.attachments = [];
      localStorage.setItem(draftKey(it), JSON.stringify({ at: Date.now(), item: c }));
    } catch (e) {}   // 空間滿等錯誤:草稿為輔助功能,略過
  };
  const clearDraftOne = (it) => { try { localStorage.removeItem(draftKey(it || {})); } catch (e) {} };
  const clearDraft = (it) => { clearDraftOne(it); clearDraftOne({}); };   // 含 new 草稿
  const setItemDirty = (updater) => {
    setDirty(true); setItem(updater);
    if (draftTimer.current) clearTimeout(draftTimer.current);
    draftTimer.current = setTimeout(writeDraft, 800);
  };
  /* 開啟紀錄時:若此裝置有比伺服器版本新的草稿 → 詢問是否還原 */
  const maybeOfferDraft = (it) => {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(draftKey(it))); } catch (e) {}
    if (!d || !d.item) return;
    const srvT = Date.parse(String(it.updatedAt || '').replace(' ', 'T')) || 0;
    if (!(d.at > srvT)) { clearDraftOne(it); return; }   // 草稿比伺服器舊 → 自動丟棄
    const dt = new Date(d.at);
    const tm = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')+' '+dt.toTimeString().slice(0,5);
    setModal({ title: '📝 ' + t.draftT, body: t.draftP(tm),
      onCancel: () => setModal(null),
      buttons: [
        { label: t.draftRestore, cls: 'btn-p', onClick: () => { setModal(null);
            setItem(x => normalize(Object.assign({}, d.item, { id: (x && x.id) || d.item.id || '',
              attachments: (x && x.attachments) || [] })));
            setDirty(true); } },
        { label: t.draftDiscard, cls: 'btn-o', onClick: () => { setModal(null); clearDraftOne(it); } },
      ] });
  };

  /* 關閉/重新整理瀏覽器時的原生攔截 */
  useEffect(() => {
    const h = (e) => { if ((dirtyRef.current && viewRef.current === 'form') || failedRef.current.length) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', h);
    return () => window.removeEventListener('beforeunload', h);
  }, []);
  const clRef = useRef(checklist);
  clRef.current = checklist;

  const showToast = (text, err) => {
    setToast({ text, err });
    setTimeout(()=>setToast(null), 3200);
  };
  const askConfirm = (title, body, onOk, danger) =>
    setModal({ title, body, danger, onCancel:()=>setModal(null), onOk:()=>{ setModal(null); onOk(); } });

  const refresh = useCallback(() => {
    setLoading(true);
    const useCache = !LOCAL && !TESTMODE;
    const hasCache = useCache && !!localStorage.getItem('evis_cache_list');
    const apply = r => {
      setList(r.items || []); setLoading(false);
      setChecklist(r.checklist && r.checklist.length ? r.checklist : DEFAULT_CHECKLIST);
      if (useCache) {
        try {
          localStorage.setItem('evis_cache_list', JSON.stringify(r.items || []));
          localStorage.setItem('evis_cache_cl', JSON.stringify(r.checklist || null));
        } catch(e){}
      }
    };
    let p;
    if (useCache && window.__earlyBoot) { p = window.__earlyBoot; window.__earlyBoot = null; } // 用頁面預抓的結果
    else p = api('bootstrap');
    (hasCache ? p : track(p))   // 有快取:背景更新不擋畫面;沒快取:顯示讀取中
      .then(apply)
      .catch(() => {
        // 後端尚未更新到 bootstrap 版本時,退回兩段式讀取
        Promise.all([api('list'), api('getChecklist').catch(()=>({ checklist:null }))])
          .then(([a, b]) => apply({ items: a.items, checklist: b.checklist }))
          .catch(() => {
            setLoading(false);
            // 有快取:溫和提示即可,畫面仍顯示上次資料;沒快取才是真的失敗
            if (hasCache) showToast(t.refreshFail);
            else showToast(t.loadFail, true);
          });
      });
  }, [lang]);

  useEffect(() => { refresh(); }, []);

  /* 🧪 測試模式切換 */
  const toggleTest = () => {
    TESTMODE = !TESTMODE;
    if (TESTMODE) localStorage.setItem('evis_test','1'); else localStorage.removeItem('evis_test');
    setTestMode(TESTMODE);
    setItem(null); setView('dash'); setList([]);
    showToast(TESTMODE ? t.testOn : t.testOff);
    setTimeout(refresh, 50);
  };
  const clearTestData = () => askConfirm(t.confirmClearT, t.confirmClearP, () => {
    localStorage.removeItem(TEST_KEY); localStorage.removeItem('evis_cl_test');
    setItem(null); setView('dash'); refresh();
  }, true);

  /* ⚡ 測試模式:一鍵建立範例資料 */
  const seedDemo = () => {
    if (!TESTMODE) return;
    const cl = clRef.current;
    const codes = codesOf(cl);
    const total = totalOf(cl);
    const pick = c => codes.indexOf(c) > -1 ? c : codes[Math.min(1, codes.length-1)];
    const noC1 = pick('B-8'), noC2 = pick('A-2');
    const mkAnswers = (noCode, noRemark) => {
      const m = {};
      codes.forEach(c => {
        m[c] = { v: c === noCode ? 'no' : 'yes',
                 remark: c === noCode ? noRemark :
                         c === 'E-5' ? 'Fuel 12,500 USG / Water 860 USG (last month)' : '' };
      });
      return m;
    };
    const plus14 = (() => { const d = new Date(); d.setDate(d.getDate() + 14);
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();

    const baseInfo = (zh, en, mmsi, imo, ton, cls) => ({
      vesselZh:zh, vesselEn:en, mmsi:mmsi, imo:imo, tonnage:ton, vesselClass:cls,
      projectNo:'TXO-P2', location:'Taichung Anchorage' });
    const signAll = {inspName:'HSEO 王環安', inspDate:todayStr(), verName:'HSEE 李工程', verDate:todayStr(),
                     endName:'Capt. J. Hansen', endDate:todayStr()};

    /* ① Alpha:自檢完成(等 NMDC 查驗) */
    const rec1 = Object.assign(blankItem(cl), baseInfo('測試船 Alpha','TEST VESSEL ALPHA','416000001','9000001','3500','CR'),
      { status:'self_done', progress:total+'/'+total });
    rec1.data.answers = mkAnswers(noC1, 'Waste bin near galley overflowing — cleared during inspection');
    rec1.data.signoff = {inspName:'', inspDate:'', verName:'', verDate:'', endName:'Capt. J. Hansen', endDate:todayStr()};

    /* ② Beta:有條件通過 → 廠商已補件,待 NMDC 確認結案 */
    const rec2 = Object.assign(blankItem(cl), baseInfo('測試船 Beta','TEST VESSEL BETA','416000002','9000002','5200','DNV'),
      { status:'nmdc_done', verdict:'cond', verdictDeadline:plus14,
        progress:total+'/'+total, nmdcProgress:total+'/'+total });
    rec2.data.answers = mkAnswers(noC2, 'Visible dust observed during bulk material transfer');
    rec2.data.nmdcAnswers = mkAnswers(noC2, 'Confirmed — submit updated dust control method statement');
    rec2.data.comments = [
      { id:'demo-b1', author:'nmdc', at:todayStr()+' 10:30:00',
        text:'請提交更新之揚塵抑制作業程序,並依 comment 自行檢查後上傳散裝作業灑水/密閉輸送照片。\nPlease submit the updated dust control method statement, self-check per this comment, and upload photos of water spray / enclosed transfer.' },
      { id:'demo-b2', author:'ctr', at:todayStr()+' 15:20:00',
        text:'已依意見完成改善:散裝物料改採密閉輸送並加強灑水,佐證照片如附,請查核驗證。\nImprovement completed per comment — bulk transfer now enclosed with water spray applied. Evidence attached for your verification.' },
    ];
    rec2.data.signoff = signAll;

    /* ③ Gamma:未通過(總表會出現 🔁 建立複檢) */
    const rec3 = Object.assign(blankItem(cl), baseInfo('測試船 Gamma','TEST VESSEL GAMMA','416000003','9000003','4100','ABS'),
      { status:'nmdc_done', verdict:'fail',
        progress:total+'/'+total, nmdcProgress:total+'/'+total });
    rec3.data.answers = mkAnswers(noC1, 'Oily water discharge record missing for last voyage');
    rec3.data.nmdcAnswers = mkAnswers(noC1, 'Not acceptable — records cannot be produced on board. Re-inspection required.');
    rec3.data.signoff = signAll;

    /* ⑤ Delta:有條件通過 → 已補件並結案(綠色 ✓) */
    const rec5 = Object.assign(blankItem(cl), baseInfo('測試船 Delta','TEST VESSEL DELTA','416000004','9000004','2800','CR'),
      { status:'nmdc_done', verdict:'cond', verdictDeadline:todayStr(),
        closed:'1', closedDate:todayStr(),
        progress:total+'/'+total, nmdcProgress:total+'/'+total });
    rec5.data.answers = mkAnswers(noC2, 'Dust screen partially damaged on stbd side');
    rec5.data.nmdcAnswers = mkAnswers(noC2, 'Conditional — replace dust screen and submit photo evidence');
    rec5.data.comments = [
      { id:'demo-d1', author:'nmdc', at:todayStr()+' 09:00:00',
        text:'請更換右舷防塵網並上傳更換後照片。Replace the stbd dust screen and upload photo evidence.' },
      { id:'demo-d2', author:'ctr', at:todayStr()+' 14:00:00',
        text:'右舷防塵網已更換完成,照片如附件,請驗證。Stbd dust screen replaced — photo attached for verification.' },
      { id:'demo-d3', author:'nmdc', at:todayStr()+' 16:30:00',
        text:'已確認改善完成,本筆檢查結案。Improvement verified — this inspection is closed.' },
    ];
    rec5.data.signoff = signAll;

    const img1 = demoPhotoB64('A-2 DUST PHOTO', '#8a6d3b');
    const img2 = demoPhotoB64('NMDC VERIFICATION', '#1d3d5c');
    const img3 = demoPhotoB64('IMPROVEMENT EVIDENCE', '#1c7a42');
    (async () => {
      await api('save', { item: rec1 });
      const r2 = await api('save', { item: rec2 });
      await api('upload', { inspId:r2.item.id, itemCode:noC2, label:noC2, name:'dust_photo.png', mimeType:'image/png', base64:img1 });
      await api('upload', { inspId:r2.item.id, itemCode:noC2+'#NMDC', label:noC2+' (NMDC)', name:'verification_photo.png', mimeType:'image/png', base64:img2 });
      await api('upload', { inspId:r2.item.id, itemCode:'CMT-demo-b2', label:'CMT', name:'improvement_evidence.png', mimeType:'image/png', base64:img3 });
      const r3 = await api('save', { item: rec3 });
      /* ④ Gamma-R1:複檢紀錄(帶入 Gamma 廠商勾選,草稿狀態) */
      const rec4 = Object.assign(blankItem(cl), baseInfo('測試船 Gamma','TEST VESSEL GAMMA','416000003','9000003','4100','ABS'));
      rec4.inspNo = (r3.item.inspNo || 'EVI-003') + '-R1';
      rec4.data.reOf = r3.item.inspNo || '';
      rec4.data.answers = JSON.parse(JSON.stringify(rec3.data.answers));
      rec4.progress = countMap(rec4.data.answers) + '/' + total;
      await api('save', { item: rec4 });
      const r5 = await api('save', { item: rec5 });
      await api('upload', { inspId:r5.item.id, itemCode:'CMT-demo-d2', label:'CMT', name:'dust_screen_replaced.png', mimeType:'image/png', base64:img3 });
      showToast(t.seedDone); refresh();
    })().catch(e => showToast(String(e.message||e), true));
  };

  const normalize = (it) => {
    it.data = it.data || {};
    it.data.answers = it.data.answers || {};
    it.data.nmdcAnswers = it.data.nmdcAnswers || {};
    it.data.signoff = it.data.signoff || {};
    it.attachments = it.attachments || [];
    return it;
  };

  const openItem = id => {
    track(api('get', { id })).then(r => {
      const it = normalize(r.item);
      setItem(it); setDirty(false); setView('form'); window.scrollTo(0,0);
      maybeOfferDraft(it);
    }).catch(e => showToast(t.loadFail + ': ' + e.message, true));
  };

  const newItem = () => {
    setModal({ title: '🚨 ' + t.newNoticeT + ' 🚨',
      titleStyle: { color:'var(--red)', fontSize:20, textAlign:'center', letterSpacing:'2px' },
      list: t.newNoticeList, okLabel: t.newNoticeOk,
      onCancel: ()=>setModal(null),
      onOk: ()=>{ setModal(null); setItem(blankItem(clRef.current)); setDirty(false); setView('form'); window.scrollTo(0,0);
        setTimeout(()=>maybeOfferDraft({ id:'', updatedAt:'' }), 80); } });   // 未儲存過的新表單草稿
  };

  const highlightMissing = (miss) => setItem(p => Object.assign({}, p, { _miss: miss }));

  const bgChainRef = useRef(Promise.resolve());
  const doSave = (newStatus, extra) => {
    const cur = Object.assign({}, itemRef.current, extra || {});
    delete cur._miss;
    const total = totalOf(recCl(cur, clRef.current));
    if (newStatus) cur.status = newStatus;
    cur.progress = countMap(cur.data.answers) + '/' + total;
    cur.nmdcProgress = countMap(cur.data.nmdcAnswers) + '/' + total;

    /* 階段變更(完成自檢/完成檢查/退回)、結案、第一次儲存(要取編號)→ 同步等待,其餘背景儲存 */
    const blocking = !!newStatus || !!(extra && extra.closed) || !cur.id;
    if (blocking) {
      setSaving(true);
      return track(api('save', { item: cur }), t.savingData).then(r => {
        const saved = normalize(r.item);
        if (!saved.attachments.length && cur.attachments) saved.attachments = cur.attachments;
        setItem(saved); setDirty(false); setSaving(false); showToast(t.saved);
        clearDraft(saved);
        api('list').then(x=>setList(x.items||[])).catch(()=>{});
        return saved;
      }).catch(e => { setSaving(false); showToast(t.saveFail + ': ' + e.message, true); throw e; });
    }

    /* 🚀 背景儲存:畫面立即可繼續操作;成功跳「已儲存 ✓」,失敗自動標回未儲存+保留本機草稿 */
    if (extra) setItem(x => x ? Object.assign({}, x, extra) : x);   // 樂觀更新(例:留言立即顯示)
    setDirty(false);
    const p = bgChainRef.current
      .then(() => api('save', { item: cur }))
      .then(r => {
        const s = (r && r.item) || {};
        setItem(x => x ? Object.assign({}, x, { updatedAt: s.updatedAt || x.updatedAt,
          inspNo: s.inspNo || x.inspNo, folderUrl: s.folderUrl || x.folderUrl }) : x);
        if (!dirtyRef.current) clearDraft(cur);
        showToast(t.saved);
        api('list').then(x=>setList(x.items||[])).catch(()=>{});
        return normalize(Object.assign({}, cur, { inspNo: s.inspNo || cur.inspNo, updatedAt: s.updatedAt || cur.updatedAt }));
      })
      .catch(e => { setDirty(true); writeDraft(true); showToast(t.bgSaveFail, true); throw e; });
    bgChainRef.current = p.catch(()=>{});   // 序列化:多次儲存依序送出,不互搶
    return p;
  };

  /* 📷 照片自動壓縮:長邊 1600px、JPEG 0.82(佐證照片綽綽有餘)
   *   → 8MB 手機照片通常變 300~600KB,大幅減少行動網路上傳逾時 */
  const prepFile = (f) => new Promise((resolve) => {
    const asOriginal = () => {
      const rd = new FileReader();
      rd.onload = () => resolve({ base64: String(rd.result).split(',')[1], name: f.name, mimeType: f.type || 'application/octet-stream', size: f.size });
      rd.onerror = () => resolve(null);
      rd.readAsDataURL(f);
    };
    /* 非圖片、GIF、或本來就小(<400KB)→ 不壓縮 */
    if (!/^image\//i.test(f.type || '') || /gif/i.test(f.type || '') || f.size < 400*1024) { asOriginal(); return; }
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      try {
        const MAX = 1600;
        const sc = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * sc));
        const h = Math.max(1, Math.round(img.naturalHeight * sc));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        const b64 = cv.toDataURL('image/jpeg', 0.82).split(',')[1];
        URL.revokeObjectURL(url);
        const bytes = Math.round(b64.length * 0.75);
        if (bytes && bytes < f.size) {
          resolve({ base64: b64, name: f.name.replace(/\.[^.]+$/, '') + '.jpg', mimeType: 'image/jpeg', size: bytes });
        } else asOriginal();
      } catch (e) { URL.revokeObjectURL(url); asOriginal(); }   // 例:HEIC 無法解碼 → 原檔上傳
    };
    img.onerror = () => { URL.revokeObjectURL(url); asOriginal(); };
    img.src = url;
  });

  const friendlyUpErr = (e) => {
    const m = String((e && e.message) || e);
    if (m === 'TIMEOUT') return t.upTimeout;
    if (m === 'NETWORK') return t.upNetwork;
    if (m === 'LSFULL' || /quota/i.test(m)) return t.upLsFull;
    return t.upFail + ': ' + m;
  };

  const uploadFile = (code, files, stage) => {
    if (!files || !files.length) return;
    const itemCode = stage==='nmdc' ? code+'#NMDC' : code;
    const label = stage==='nmdc' ? code+' (NMDC)' : (code==='FOLLOWUP' ? 'FU' : (/^CMT-/.test(code) ? 'CMT' : code));
    const maxSize = (LOCAL || TESTMODE) ? 2*1024*1024 : 15*1024*1024;
    const arr = Array.from(files);
    const ensureSaved = itemRef.current.id ? Promise.resolve(itemRef.current) :
      (showToast(t.needSave), doSave());
    ensureSaved.then(saved => {
      /* 逐張排隊上傳:避免多張同時打後端搶寫入鎖而逾時(背景執行,不擋畫面) */
      arr.reduce((chain, f) => chain.then(() =>
        prepFile(f).then(pf => {
          if (!pf) { showToast(t.upFail + ': ' + f.name, true); return; }
          if (pf.size > maxSize) { showToast(t.fileTooBig, true); return; }
          return sendUpload({ inspId: saved.id, itemCode, label, name: pf.name, mimeType: pf.mimeType, base64: pf.base64, size: pf.size });
        })
      ), Promise.resolve()).catch(()=>{});
    }).catch(()=>{});
  };

  /* 單張上傳(含失敗暫存):成功掛進附件列表;失敗留在 failedUps 可一鍵重試,不用重選檔案 */
  const sendUpload = (u) => {
    setUploadingKeys(k => [...k, u.itemCode]);
    return api('upload', { inspId: u.inspId, itemCode: u.itemCode, label: u.label, name: u.name, mimeType: u.mimeType, base64: u.base64 })
      .then(r => {
        setItem(x => (x && x.id === u.inspId)
          ? Object.assign({}, x, { attachments: [...(x.attachments||[]), r.attachment] }) : x);
        return true;
      })
      .catch(e => {
        showToast(friendlyUpErr(e), true);
        setFailedUps(p => [...p, Object.assign({ fid: 'f' + Date.now() + Math.floor(Math.random()*999) }, u)]);
        return false;
      })
      .then(ok => { setUploadingKeys(k => { const i=k.indexOf(u.itemCode); const c=[...k]; if(i>-1)c.splice(i,1); return c; }); return ok; });
  };

  const retryFailedUps = () => {
    const list = failedRef.current;
    if (!list.length) return;
    setFailedUps([]);
    list.reduce((chain, u) => chain.then(okAll =>
      sendUpload(u).then(ok => okAll && ok)
    ), Promise.resolve(true)).then(allOk => { if (allOk) showToast(t.upRetryDone); });
  };
  const dropFailedUps = () => setFailedUps([]);

  /* 未儲存離開的三鍵警告 */
  const guardLeave = (next) => {
    const it = itemRef.current;
    const editable = viewRef.current === 'form' && it && dirtyRef.current &&
      (it.status === 'draft' || editMode || testMode ||
       (it.status === 'nmdc_done' && String(it.closed) !== '1'));
    if (!editable) { next(); return; }
    setModal({
      title: '🚨 ' + t.leaveT + ' 🚨',
      titleStyle: { color:'var(--red)', fontSize:19, textAlign:'center', letterSpacing:'2px' },
      body: t.leaveP,
      onCancel: ()=>setModal(null),
      buttons: [
        { label: t.leaveGo,   cls:'btn-r', onClick: ()=>{ setModal(null); setDirty(false); clearDraftOne(itemRef.current); next(); } },
        { label: t.leaveSave, cls:'btn-p', onClick: ()=>{ setModal(null); doSave().then(()=>next()).catch(()=>{}); } },
        { label: t.leaveStay, cls:'btn-o', onClick: ()=>setModal(null) },
      ],
    });
  };
  const goHome = () => guardLeave(()=>{ setView('dash'); refresh(); window.scrollTo(0,0); });

  const deleteAtt = (f) => askConfirm(t.confirmDelT, f.name, () => {
    track(api('deleteFile', { fileId: f.fileId }), t.working).then(() => {
      setItem(p => Object.assign({}, p, { attachments: (p.attachments||[]).filter(a=>a.fileId!==f.fileId) }));
    }).catch(e => showToast(e.message, true));
  }, true);

  /* 🔁 未通過 → 建立複檢紀錄(帶入上次廠商勾選,附件不複製) */
  const nextRNo = (no) => {
    const m = String(no || '').match(/^(.*?)-R(\d+)$/);
    return m ? m[1] + '-R' + (parseInt(m[2], 10) + 1) : (no ? no + '-R1' : '');
  };
  const reinspect = (full) => {
    const newNo = nextRNo(full.inspNo);
    askConfirm(t.confirmReT, t.confirmReP(newNo), () => {
      const cl = recCl(full, clRef.current);
      const copy = blankItem(cl);
      ['vesselZh','vesselEn','mmsi','imo','tonnage','vesselClass','projectNo','location'].forEach(k => copy[k] = full[k] || '');
      copy.inspNo = newNo;
      copy.data.answers = JSON.parse(JSON.stringify((full.data && full.data.answers) || {}));
      copy.data.reOf = full.inspNo;
      copy.progress = countMap(copy.data.answers) + '/' + totalOf(cl);
      track(api('save', { item: copy }), t.savingData).then(r => {
        showToast(t.reCreated(r.item.inspNo || newNo));
        setItem(normalize(r.item)); setDirty(false); setView('form'); window.scrollTo(0,0);
        api('list').then(x=>setList(x.items||[])).catch(()=>{});
      }).catch(e => showToast(String(e.message || e), true));
    });
  };
  const reinspectById = (id) =>
    track(api('get', { id })).then(r => reinspect(normalize(r.item)))
      .catch(() => showToast(t.loadFail, true));

  const deleteInsp = (id) => askConfirm(t.confirmDelT, t.confirmDelP, () => {
    track(api('delete', { id }), t.working).then(refresh).catch(e => showToast(e.message, true));
  }, true);

  /* 📝 儲存檢查項目範本 */
  const saveChecklistFn = (cl) => {
    setSaving(true);
    track(api('saveChecklist', { checklist: cl }), t.savingData).then(() => {
      setChecklist(cl); setSaving(false);
      showToast(t.checklistSaved); setView('dash');
    }).catch(e => { setSaving(false); showToast(t.saveFail + ': ' + e.message, true); });
  };

  /* PDF 匯出:瀏覽器排版產生 → 正式模式上傳存回 Drive;本機/測試模式直接下載 */
  const exportRecord = (full) => {
    const cl = recCl(full, clRef.current);
    const run = (async () => {
      const atts = full.attachments || [];
      let imgMap = {};
      if (LOCAL || TESTMODE) {
        atts.forEach(x => { if (String(x.url).indexOf('data:image/') === 0) imgMap[x.fileId] = x.url; });
      } else if (atts.length) {
        const r = await api('filesData', { ids: atts.map(x => x.fileId) });
        imgMap = r.images || {};
      }
      const pdf = await generatePdf(full, cl, imgMap);
      const name = '船檢表_' + (full.inspNo || full.id) + '_' + (full.vesselEn || full.vesselZh || '') + '.pdf';
      if (LOCAL || TESTMODE) { pdf.save(name); showToast(t.pdfDone); return; }
      const base64 = pdf.output('datauristring').split(',')[1];
      const r2 = await api('storePdf', { id: full.id, name, base64 });
      setModal({ title: t.pdfDone, body: r2.name, link: r2.url, linkLabel: '🔗 ' + t.pdfOpen,
        onCancel:()=>setModal(null), onOk:null, cancelLabel:'OK' });
    })();
    setExporting(true);
    track(run, t.exportingData)
      .then(() => setExporting(false))
      .catch(e => { setExporting(false); showToast(String(e.message || e), true); });
  };
  const exportById = (id) => {
    track(api('get', { id })).then(r => exportRecord(normalize(r.item)))
      .catch(e => showToast(t.loadFail + ': ' + e.message, true));
  };

  /* 🔑 編輯模式 */
  const toggleLock = () => {
    if (editMode) {
      setEditMode(false); localStorage.removeItem('evis_unlocked'); showToast(t.lockedMsg);
      return;
    }
    if (!EDIT_CODE) { setEditMode(true); localStorage.setItem('evis_unlocked','1'); return; }
    setModal({ title:'🔑 ' + t.unlockT, body:t.unlockP, input:true,
      onCancel:()=>setModal(null),
      onOk:(val)=>{
        if (val === EDIT_CODE) { setEditMode(true); localStorage.setItem('evis_unlocked','1'); setModal(null); }
        else showToast(t.wrongCode, true);
      }});
  };

  const toggleLang = () => {
    const nl = lang === 'en' ? 'zh' : 'en';
    setLang(nl); localStorage.setItem('evis_lang', nl);
  };

  const effEdit = editMode || testMode;   // 測試模式免鑰匙即可編輯
  // 任何人都能新增並填寫廠商自檢(draft 階段);提交後僅解鎖的管理者可修改
  const canContractor = item && item.status === 'draft';
  const canNmdc = effEdit && item && item.status !== 'draft';   // 🔓 管理者:self_done 與 nmdc_done 都可編輯

  return (
    <div>
      <div className="topbar">
        {view !== 'dash' &&
          <button className="langbtn" onClick={goHome}>🏠 {t.dash}</button>}
        <div><div className="logo">NMDC <span>ENERGY</span></div></div>
        <div className="grow">
          <div style={{fontWeight:700, fontSize:13.5}}>{t.appTitle}</div>
          <div className="sub">{DOC_NO} · {DOC_REV}</div>
        </div>
        <button className="langbtn" onClick={toggleLang}>{lang === 'en' ? '中文' : 'EN'}</button>
        <button className={'lockbtn'} style={testMode ? {background:'#b8860b'} : null} onClick={toggleTest}
          title="Test mode">🧪</button>
        <button className={'lockbtn' + (editMode ? ' unlocked' : '')} onClick={toggleLock}
          title={editMode ? 'Lock' : 'Unlock'}>{editMode ? '🔓' : '🔑'}</button>
      </div>

      <div className="wrap">
        {LOCAL && !testMode && <div className="banner">{t.localMode}</div>}
        {testMode &&
          <div className="banner">{t.testBanner}{' '}
            <a style={{color:'#1e5ca8', fontWeight:700, cursor:'pointer', textDecoration:'underline'}}
              onClick={seedDemo}>{t.seedDemo}</a>{' · '}
            <a style={{color:'#a06a08', fontWeight:700, cursor:'pointer', textDecoration:'underline'}}
              onClick={clearTestData}>{t.clearTest}</a></div>}
        {!effEdit && <div className="banner gray">{t.viewMode}</div>}
        {view === 'dash' &&
          <Dashboard t={t} list={list} loading={loading} canEdit={effEdit}
            onOpen={openItem} onNew={newItem} onDelete={deleteInsp} onPdf={exportById} onRe={reinspectById}
            onEditor={()=>{ setView('editor'); window.scrollTo(0,0); }} />}
        {view === 'editor' &&
          <Editor t={t} checklist={checklist} onSave={saveChecklistFn} saving={saving}
            onBack={()=>{ setView('dash'); window.scrollTo(0,0); }} askConfirm={askConfirm} />}
        {view === 'form' && item && item.status === 'draft' &&
          <ContractorForm t={t} lang={lang} cl={recCl(item, checklist)} item={item} setItem={setItemDirty} can={canContractor} adminEdit={effEdit}
            onSave={doSave} saving={saving}
            onBack={goHome}
            uploadFile={uploadFile} deleteAtt={deleteAtt} uploadingKeys={uploadingKeys}
            askConfirm={askConfirm} showToast={showToast} highlightMissing={highlightMissing} />}
        {view === 'form' && item && item.status !== 'draft' &&
          <NmdcForm t={t} lang={lang} cl={recCl(item, checklist)} item={item} setItem={setItemDirty} can={canNmdc} adminEdit={effEdit} editMode={effEdit}
            onSave={doSave} saving={saving}
            onBack={goHome}
            uploadFile={uploadFile} deleteAtt={deleteAtt} uploadingKeys={uploadingKeys}
            askConfirm={askConfirm} showToast={showToast}
            onExport={()=>exportRecord(itemRef.current)} exporting={exporting} highlightMissing={highlightMissing}
            onReinspect={()=>reinspect(itemRef.current)} />}
      </div>

      {failedUps.length > 0 &&
        <div className="retrybar">
          <span style={{flex:1, minWidth:200}}>{t.upRetryMsg(failedUps.length)}</span>
          <button className="btn btn-p" onClick={retryFailedUps}>{t.upRetryAll}</button>
          <button className="btn btn-o" onClick={dropFailedUps}>{t.upRetryDrop}</button>
        </div>}
      {busyMsgs.length > 0 &&
        <div className="loadbg">
          <div className="loadcard"><div className="spinner"></div>{busyMsgs[busyMsgs.length-1].msg || t.loadingData}</div>
        </div>}
      <Toast msg={toast} />
      <Modal m={modal} t={t} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
