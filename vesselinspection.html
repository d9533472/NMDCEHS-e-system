  const goHome = () => guardLeave(()=>{ setView('dash'); refresh(); window.scrollTo(0,0); });

  const deleteAtt = (f) => askConfirm(t.confirmDelT, f.name, () => {
    track(api('deleteFile', { fileId: f.fileId }), t.working).then(() => {
      setItem(p => Object.assign({}, p, { attachments: (p.attachments||[]).filter(a=>a.fileId!==f.fileId) }));
    }).catch(e => showToast(e.message, true));
  }, true);

  /* 🔁 未通過 → 建立複檢紀錄(帶入上次廠商勾選,附件不複製) */
  const nextRNo = (no) => {
    const m = String(no || '').match(/^(.*?)-R(\d+)$/);
    return m ? m[1] + '-R' + (parseInt(m[2], 10) + 1) : (no ? no + '-R1' : '');
  };
  const reinspect = (full) => {
    const newNo = nextRNo(full.inspNo);
    askConfirm(t.confirmReT, t.confirmReP(newNo), () => {
      const cl = recCl(full, clRef.current);
      const copy = blankItem(cl);
      ['vesselZh','vesselEn','mmsi','imo','tonnage','vesselClass','projectNo','location'].forEach(k => copy[k] = full[k] || '');
      copy.inspNo = newNo;
      copy.data.answers = JSON.parse(JSON.stringify((full.data && full.data.answers) || {}));
      copy.data.reOf = full.inspNo;
      copy.progress = countMap(copy.data.answers) + '/' + totalOf(cl);
      track(api('save', { item: copy }), t.savingData).then(r => {
        showToast(t.reCreated(r.item.inspNo || newNo));
        setItem(normalize(r.item)); setDirty(false); setView('form'); window.scrollTo(0,0);
        api('list').then(x=>setList(x.items||[])).catch(()=>{});
      }).catch(e => showToast(String(e.message || e), true));
    });
  };
  const reinspectById = (id) =>
    track(api('get', { id })).then(r => reinspect(normalize(r.item)))
      .catch(() => showToast(t.loadFail, true));

  const deleteInsp = (id) => askConfirm(t.confirmDelT, t.confirmDelP, () => {
    track(api('delete', { id }), t.working).then(refresh).catch(e => showToast(e.message, true));
  }, true);

  /* 📝 儲存檢查項目範本 */
  const saveChecklistFn = (cl) => {
    setSaving(true);
    track(api('saveChecklist', { checklist: cl }), t.savingData).then(() => {
      setChecklist(cl); setSaving(false);
      showToast(t.checklistSaved); setView('dash');
    }).catch(e => { setSaving(false); showToast(t.saveFail + ': ' + e.message, true); });
  };

  /* PDF 匯出:瀏覽器排版產生 → 正式模式上傳存回 Drive;本機/測試模式直接下載 */
  const exportRecord = (full) => {
    const cl = recCl(full, clRef.current);
    /* 進度顯示:抓圖 → 逐頁排版 → 存 Drive,等待時看得到進行到哪 */
    const bm = { msg: t.exportingData };
    setBusyMsgs(a => [...a, bm]);
    const upd = (m) => { bm.msg = m; setBusyMsgs(a => [...a]); };
    const diag = { stage: 'init', atts: (full.attachments || []).length, imgs: 0, pages: 0 };
    const run = (async () => {
      const atts = full.attachments || [];
      let imgMap = {};
      if (LOCAL || TESTMODE) {
        atts.forEach(x => { if (String(x.url).indexOf('data:image/') === 0) imgMap[x.fileId] = x.url; });
      } else if (atts.length) {
        /* 分批(每批 3 張)× 3 條線平行抓;抓過的存快取,同筆再匯出免重抓;某批失敗 → 以「存於 Drive」佔位 */
        diag.stage = 'fetch';
        const IMGC = window.__imgCache = window.__imgCache || {};
        const ids = atts.map(x => x.fileId);
        ids.forEach(id => { if (IMGC[id]) imgMap[id] = IMGC[id]; });
        const need = ids.filter(id => !imgMap[id]);
        const chunks = [];
        for (let i = 0; i < need.length; i += 3) chunks.push(need.slice(i, i + 3));
        let fdone = ids.length - need.length;
        upd(t.pdfFetchingN(Math.min(fdone, ids.length), ids.length));
        await Promise.all(Array.from({ length: Math.min(3, chunks.length || 1) }, async () => {
          while (chunks.length) {
            const c = chunks.shift();
            try {
              const r = await api('filesData', { ids: c });
              Object.assign(imgMap, r.images || {});
              Object.keys(r.images || {}).forEach(k => {   // 只快取壓縮過的小圖,避免吃光記憶體
                if (String(r.images[k]).length < 1.5 * 1024 * 1024) IMGC[k] = r.images[k]; });
            } catch (e) {}
            fdone += c.length;
            upd(t.pdfFetchingN(Math.min(fdone, ids.length), ids.length));
          }
        }));
        /* 保底:凡是「圖片檔」還沒拿到圖(超大圖且縮圖失敗)→ 逐張抓原圖回來,由瀏覽器壓縮後放入 PDF
           佔位文字只保留給 PDF/文件等非圖片檔案 */
        const isImgName = n => /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(String(n || ''));
        const missing = atts.filter(a => !imgMap[a.fileId] && isImgName(a.name)).map(a => a.fileId);
        for (let m = 0; m < missing.length; m++) {
          upd(t.pdfFetchBig(m + 1, missing.length));
          try {
            const r = await api('fileData', { id: missing[m] });
            if (r.image) {
              const small = await shrinkDataUrl(r.image, 1600);
              imgMap[missing[m]] = small;
              if (String(small).length < 1.5 * 1024 * 1024) IMGC[missing[m]] = small;
            }
          } catch (e) {}
        }
      }
      diag.imgs = Object.keys(imgMap).length;
      diag.stage = 'render';
      const pdf = await generatePdf(full, cl, imgMap, (i, n) => { diag.pages = n; upd(t.pdfPaging(i, n)); });
      const name = '船檢表_' + (full.inspNo || full.id) + '_' + (full.vesselEn || full.vesselZh || '') + '.pdf';
      diag.stage = 'download';
      if (LOCAL || TESTMODE) { pdf.save(name); showToast(t.pdfDone); return; }
      pdf.save(name);   // ① 先直接下載一份到裝置
      diag.stage = 'upload';
      upd(t.pdfUploading);
      const base64 = pdf.output('datauristring').split(',')[1];
      try {
        const r2 = await api('storePdf', { id: full.id, name, base64 });   // ② 再存回 Drive
        setModal({ title: t.pdfDone, body: r2.name + '\n' + t.pdfLocalToo, link: r2.url, linkLabel: '🔗 ' + t.pdfOpen,
          onCancel:()=>setModal(null), onOk:null, cancelLabel:'OK' });
      } catch (e) {
        showToast(t.pdfDriveFail, true);   // 檔案已在裝置上,只是 Drive 留底失敗
      }
    })();
    setExporting(true);
    run.finally(() => setBusyMsgs(a => a.filter(x => x !== bm)))
      .then(() => setExporting(false))
      .catch(e => {
        setExporting(false);
        /* 🔍 失敗診斷視窗:顯示死在哪個階段+環境資訊,截圖即可回報 */
        setModal({ title: '⚠ ' + t.pdfFailT,
          body: t.pdfFailBody(t.pdfStage[diag.stage] || diag.stage, String((e && e.message) || e), diag),
          onCancel: () => setModal(null), onOk: null, cancelLabel: 'OK' });
      });
  };
  const exportById = (id) => {
    track(api('get', { id })).then(r => exportRecord(normalize(r.item)))
      .catch(e => showToast(t.loadFail + ': ' + e.message, true));
  };

  /* 🔑 編輯模式 */
  const toggleLock = () => {
    if (editMode) {
      setEditMode(false); localStorage.removeItem('evis_unlocked'); showToast(t.lockedMsg);
      return;
    }
    if (!EDIT_CODE) { setEditMode(true); localStorage.setItem('evis_unlocked','1'); return; }
    setModal({ title:'🔑 ' + t.unlockT, body:t.unlockP, input:true,
      onCancel:()=>setModal(null),
      onOk:(val)=>{
        if (val === EDIT_CODE) { setEditMode(true); localStorage.setItem('evis_unlocked','1'); setModal(null); }
        else showToast(t.wrongCode, true);
      }});
  };

  const toggleLang = () => {
    const nl = lang === 'en' ? 'zh' : 'en';
    setLang(nl); localStorage.setItem('evis_lang', nl);
  };

  const effEdit = editMode || testMode;   // 測試模式免鑰匙即可編輯
  // 任何人都能新增並填寫廠商自檢(draft 階段);提交後僅解鎖的管理者可修改
  const canContractor = item && item.status === 'draft';
  const canNmdc = effEdit && item && item.status !== 'draft';   // 🔓 管理者:self_done 與 nmdc_done 都可編輯

  return (
    <div>
      <div className="topbar">
        {view !== 'dash' &&
          <button className="langbtn" onClick={goHome}>🏠 {t.dash}</button>}
        <div><div className="logo">NMDC <span>ENERGY</span></div></div>
        <div className="grow">
          <div style={{fontWeight:700, fontSize:13.5}}>{t.appTitle}</div>
          <div className="sub">{DOC_NO} · {DOC_REV} · {APP_VER}</div>
        </div>
        <button className="langbtn" onClick={toggleLang}>{lang === 'en' ? '中文' : 'EN'}</button>
        {(editMode || testMode) &&   /* 🧪 測試模式:登入(🔑)後才顯示;已開啟時保留顯示以便關閉 */
          <button className={'lockbtn'} style={testMode ? {background:'#b8860b'} : null} onClick={toggleTest}
            title="Test mode">🧪</button>}
        <button className={'lockbtn' + (editMode ? ' unlocked' : '')} onClick={toggleLock}
          title={editMode ? 'Lock' : 'Unlock'}>{editMode ? '🔓' : '🔑'}</button>
      </div>

      <div className="wrap">
        {LOCAL && !testMode && <div className="banner">{t.localMode}</div>}
        {testMode &&
          <div className="banner">{t.testBanner}{' '}
            <a style={{color:'#1e5ca8', fontWeight:700, cursor:'pointer', textDecoration:'underline'}}
              onClick={seedDemo}>{t.seedDemo}</a>{' · '}
            <a style={{color:'#a06a08', fontWeight:700, cursor:'pointer', textDecoration:'underline'}}
              onClick={clearTestData}>{t.clearTest}</a></div>}
        {!effEdit && <div className="banner gray">{t.viewMode}</div>}
        {view === 'dash' &&
          <Dashboard t={t} list={list} loading={loading} canEdit={effEdit}
            onOpen={openItem} onNew={newItem} onDelete={deleteInsp} onPdf={exportById} onRe={reinspectById}
            onEditor={()=>{ setView('editor'); window.scrollTo(0,0); }}
            onHistory={openHistory} onFlow={()=>setShowFlow(true)} />}
        {view === 'history' &&
          <HistoryView t={t} rows={histRows} editMode={effEdit} onRestore={restoreLog}
            onBack={()=>{ setView('dash'); window.scrollTo(0,0); }} />}
        {view === 'editor' &&
          <Editor t={t} checklist={checklist} onSave={saveChecklistFn} saving={saving}
            onBack={()=>{ setView('dash'); window.scrollTo(0,0); }} askConfirm={askConfirm} />}
        {view === 'form' && item && item.status === 'draft' &&
          <ContractorForm t={t} lang={lang} cl={recCl(item, checklist)} item={item} setItem={setItemDirty} can={canContractor} adminEdit={effEdit}
            onSave={doSave} saving={saving}
            onBack={goHome}
            uploadFile={uploadFile} deleteAtt={deleteAtt} uploadingKeys={uploadingKeys}
            askConfirm={askConfirm} showToast={showToast} highlightMissing={highlightMissing} />}
        {view === 'form' && item && item.status !== 'draft' &&
          <NmdcForm t={t} lang={lang} cl={recCl(item, checklist)} item={item} setItem={setItemDirty} can={canNmdc} adminEdit={effEdit} editMode={effEdit}
            onSave={doSave} saving={saving}
            onBack={goHome}
            uploadFile={uploadFile} deleteAtt={deleteAtt} uploadingKeys={uploadingKeys}
            askConfirm={askConfirm} showToast={showToast}
            onExport={()=>exportRecord(itemRef.current)} exporting={exporting} highlightMissing={highlightMissing}
            onReinspect={()=>reinspect(itemRef.current)} />}
      </div>

      {failedUps.length > 0 &&
        <div className="retrybar">
          <span style={{flex:1, minWidth:200}}>{t.upRetryMsg(failedUps.length)}</span>
          <button className="btn btn-p" onClick={retryFailedUps}>{t.upRetryAll}</button>
          <button className="btn btn-o" onClick={dropFailedUps}>{t.upRetryDrop}</button>
        </div>}
      {busyMsgs.length > 0 &&
        <div className="loadbg">
          <div className="loadcard"><div className="spinner"></div>{busyMsgs[busyMsgs.length-1].msg || t.loadingData}</div>
        </div>}
      {/* ⚓ 船檢流程圖:點背景或 ✕ 關閉 */}
      {showFlow &&
        <div className="modalbg" style={{zIndex:220, padding:'12px 8px'}} onClick={()=>setShowFlow(false)}>
          <div style={{position:'relative', maxWidth:'min(96vw, 900px)', background:'#fff', borderRadius:14,
              boxShadow:'0 10px 40px rgba(0,0,0,.35)', overflow:'hidden'}} onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:10,
                background:'#12283F', color:'#fff', padding:'8px 14px'}}>
              <div style={{fontWeight:800, fontSize:14.5}}>📖 {t.flowTitle}</div>
              <button className="btn btn-r btn-sm" onClick={()=>setShowFlow(false)}>{t.flowClose}</button>
            </div>
            {/* 圖片自動縮小到一個畫面內完整顯示,不會被切掉 */}
            <img src={window.FLOW_IMG} alt="Inspection flow"
              style={{maxWidth:'100%', maxHeight:'calc(94vh - 60px)', width:'auto', height:'auto', display:'block', margin:'0 auto'}} />
          </div>
        </div>}
      <Toast msg={toast} />
      <Modal m={modal} t={t} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
