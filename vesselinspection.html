<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>環境船檢系統 | Environmental Vessel Inspection</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  :root{
    --navy:#12283f; --navy2:#1d3d5c; --accent:#2e9e5b; --accent2:#e8f5ec;
    --red:#d64545; --amber:#c77f0a; --gray:#8a94a0; --bg:#f2f5f8; --line:#dde4ea; --card:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:#22303d;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:15px;}
  input,select,textarea,button{font-family:inherit; font-size:inherit;}
  input,select,textarea{border:1px solid var(--line); border-radius:8px; padding:9px 10px; background:#fff; width:100%;}
  input:disabled{background:#f4f6f8; color:#55606c;}
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(46,158,91,.35); border-color:var(--accent);}
  button{cursor:pointer; border:none; border-radius:8px;}

  .topbar{background:var(--navy); color:#fff; padding:10px 14px; position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:10px;}
  .topbar .logo{font-weight:800; letter-spacing:.5px; font-size:16px; white-space:nowrap;}
  .topbar .logo span{color:#6fd08c;}
  .topbar .sub{font-size:11px; opacity:.75; line-height:1.3;}
  .topbar .grow{flex:1; min-width:0;}
  .langbtn{background:rgba(255,255,255,.14); color:#fff; padding:7px 12px; border-radius:20px; font-size:13px; font-weight:600;}
  .langbtn:active{background:rgba(255,255,255,.3);}
  .lockbtn{background:rgba(255,255,255,.14); color:#fff; padding:7px 11px; border-radius:20px; font-size:15px;}
  .lockbtn.unlocked{background:#2e9e5b;}

  .wrap{max-width:1120px; margin:0 auto; padding:14px 12px 96px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px;}
  .card h3{margin:0 0 10px; font-size:15px; color:var(--navy);}

  .banner{background:#fff7e0; border:1px solid #eedc9a; color:#7a5c00; border-radius:10px;
    padding:8px 12px; font-size:13px; margin-bottom:12px;}
  .banner.blue{background:#eef6ff; border-color:#cfe3f7; color:#1e5ca8;}
  .banner.gray{background:#f0f2f5; border-color:var(--line); color:#5a6673;}

  .statrow{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
  .chip{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 14px; font-size:13px;}
  .chip b{font-size:17px; color:var(--navy); margin-right:4px;}

  table.list{width:100%; border-collapse:collapse; background:#fff; font-size:13.5px; min-width:820px;}
  table.list th{background:var(--navy2); color:#fff; padding:9px 8px; text-align:left; font-weight:600; white-space:nowrap;}
  table.list td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.list tr:hover td{background:#f7fafc;}
  .tblscroll{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}

  .badge{display:inline-block; padding:3px 9px; border-radius:12px; font-size:12px; font-weight:600; white-space:nowrap;}
  .b-done{background:var(--accent2); color:#1c7a42; border:1px solid #bfe3cc;}
  .b-wait{background:#f0f2f5; color:#78828d; border:1px solid var(--line);}
  .b-fail{background:#fdecec; color:#b03030; border:1px solid #f3c6c6;}
  .b-cond{background:#fdf3e0; color:#a06a08; border:1px solid #f0dcb0;}
  .datesub{font-size:11px; color:#78828d;}

  .btn{padding:10px 16px; border-radius:9px; font-weight:600; font-size:14px;}
  .btn-p{background:var(--accent); color:#fff;}
  .btn-p:active{background:#25824a;}
  .btn-navy{background:var(--navy); color:#fff;}
  .btn-o{background:#fff; border:1px solid var(--line); color:#3a4753;}
  .btn-r{background:#fdecec; color:var(--red); border:1px solid #f3c6c6;}
  .btn-amber{background:#b8860b; color:#fff;}
  .btn-sm{padding:6px 11px; font-size:13px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:#54626f; margin-bottom:4px;}
  .req{color:var(--red);}
  .kv{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px 14px; font-size:13.5px;}
  .kv .k{font-size:11.5px; color:#78828d;}
  .kv .v{font-weight:600;}

  .secnav{position:sticky; top:56px; z-index:40; display:flex; gap:6px; overflow-x:auto;
    padding:8px 2px; background:var(--bg); margin:0 -2px;}
  .secnav button{background:#fff; border:1px solid var(--line); border-radius:18px; padding:7px 13px;
    font-size:13px; font-weight:600; color:#3a4753; white-space:nowrap;}
  .secnav button.on{background:var(--navy); color:#fff; border-color:var(--navy);}
  .secnav .cnt{font-size:11px; opacity:.7; margin-left:3px;}

  .sechead{background:var(--navy2); color:#fff; border-radius:10px 10px 0 0; padding:10px 14px;
    font-weight:700; font-size:14.5px; display:flex; justify-content:space-between; align-items:center;}
  .secbody{border:1px solid var(--line); border-top:none; border-radius:0 0 10px 10px; background:#fff; margin-bottom:16px;}

  .item{padding:13px 14px; border-bottom:1px solid #eef2f5;}
  .item:last-child{border-bottom:none;}
  .item .no{display:inline-block; background:#eef3f7; color:var(--navy); font-weight:700; font-size:12px;
    border-radius:6px; padding:2px 8px; margin-right:8px;}
  .item.miss{background:#fff8f8;}
  .item.miss .no{background:#fdecec; color:var(--red);}
  .item .txt{font-size:14px; line-height:1.5;}
  .item .row2{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:flex-start;}
  .seg{display:flex; gap:6px;}
  .seg button{padding:8px 16px; border-radius:8px; border:1.5px solid var(--line); background:#fff;
    font-weight:700; font-size:13px; color:#6a7682; min-width:56px;}
  .seg button.yes.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .seg button.no.on{background:var(--red); border-color:var(--red); color:#fff;}
  .seg button.na.on{background:var(--gray); border-color:var(--gray); color:#fff;}
  .seg button:disabled{cursor:default; opacity:.9;}
  .remark{flex:1; min-width:200px;}
  .remark input{padding:8px 10px; font-size:13.5px;}

  .panelgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  @media(max-width:760px){ .panelgrid{grid-template-columns:1fr;} }
  .panel{border:1px solid var(--line); border-radius:9px; padding:10px;}
  .panel.ctr{background:#f8fafb;}
  .panel .ph{font-size:11.5px; font-weight:700; color:#54626f; margin-bottom:7px; letter-spacing:.3px;}
  .ansbadge{display:inline-block; padding:4px 14px; border-radius:8px; font-weight:800; font-size:13px;}
  .ans-yes{background:var(--accent); color:#fff;}
  .ans-no{background:var(--red); color:#fff;}
  .ans-na{background:var(--gray); color:#fff;}
  .ans-none{background:#eef1f4; color:#8a94a0;}
  .ctr-remark{font-size:13px; color:#3a4753; margin-top:6px; white-space:pre-wrap;}

  .attrow{margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .attbtn{background:#f0f4f8; border:1px dashed #b8c4cf; color:#4a5764; border-radius:8px;
    padding:6px 12px; font-size:12.5px; font-weight:600;}
  .attchip{display:inline-flex; align-items:center; gap:6px; background:#eef6ff; border:1px solid #cfe3f7;
    border-radius:8px; padding:5px 9px; font-size:12.5px; max-width:280px;}
  .attchip a{color:#1e5ca8; text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .attchip .x{cursor:pointer; color:#8194a8; font-weight:700; padding:0 2px;}
  .attchip .x:hover{color:var(--red);}
  .uploading{background:#fffbe8; border-color:#eadfa2; color:#8a7514;}

  .vopt{display:flex; align-items:flex-start; gap:10px; border:1.5px solid var(--line); border-radius:10px;
    padding:11px 13px; margin-bottom:8px; cursor:pointer; font-size:14px; background:#fff;}
  .vopt .dot{width:18px; height:18px; border-radius:50%; border:2px solid #b8c4cf; flex:none; margin-top:1px;}
  .vopt.sel{border-color:var(--navy); background:#f4f8fc;}
  .vopt.sel .dot{border-color:var(--navy); background:var(--navy); box-shadow:inset 0 0 0 3.5px #fff;}
  .vopt.sel.fail{border-color:var(--red); background:#fdf6f6;}
  .vopt.sel.fail .dot{border-color:var(--red); background:var(--red);}
  .vopt.sel.cond{border-color:var(--amber); background:#fdfaf2;}
  .vopt.sel.cond .dot{border-color:var(--amber); background:var(--amber);}
  .vopt.sel.pass{border-color:var(--accent); background:#f4faf6;}
  .vopt.sel.pass .dot{border-color:var(--accent); background:var(--accent);}
  .vopt.ro{cursor:default; opacity:.95;}
  .ddl{margin:4px 0 10px 28px; max-width:280px;}

  .signgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px;}
  .signbox{border:1px solid var(--line); border-radius:10px; padding:12px;}
  .signbox .role{font-weight:700; font-size:13.5px; color:var(--navy); margin-bottom:2px;}
  .signbox .rolesub{font-size:11.5px; color:#78828d; margin-bottom:8px;}
  .signbox input{margin-bottom:8px;}

  .footbar{position:fixed; left:0; right:0; bottom:0; z-index:60; background:#fff;
    border-top:1px solid var(--line); padding:10px 12px; display:flex; gap:8px; align-items:center;
    box-shadow:0 -4px 14px rgba(0,0,0,.06); flex-wrap:wrap;}
  .footbar .grow{flex:1; min-width:120px; font-size:12px; color:#67737f;}

  .toast{position:fixed; bottom:84px; left:50%; transform:translateX(-50%); z-index:100;
    background:var(--navy); color:#fff; padding:10px 18px; border-radius:22px; font-size:13.5px;
    box-shadow:0 6px 18px rgba(0,0,0,.25); animation:fadein .2s; max-width:90vw;}
  .toast.err{background:var(--red);}
  @keyframes fadein{from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);}}

  .modalbg{position:fixed; inset:0; background:rgba(15,28,42,.45); z-index:90;
    display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{background:#fff; border-radius:14px; padding:20px; max-width:420px; width:100%;}
  .modal h4{margin:0 0 8px; color:var(--navy);}
  .modal p{margin:0 0 16px; font-size:14px; color:#4a5764; line-height:1.5; word-break:break-all;}
  .modal .btns{display:flex; gap:8px; justify-content:flex-end;}
  .modal input{margin-bottom:14px;}

  .pbar{height:6px; background:#e7ecf1; border-radius:3px; overflow:hidden; min-width:70px;}
  .pbar i{display:block; height:100%; background:var(--accent); border-radius:3px;}
  .pbar i.blue{background:#2563a8;}

  @media(max-width:640px){
    .topbar .sub{display:none;}
    .btn{padding:10px 12px; font-size:13px;}
    .wrap{padding:10px 8px 116px;}
  }
</style>
</head>

const TOTAL_ITEMS = CHECKLIST.reduce((s, sec) => s + sec.items.length, 0);
const ALL_CODES = CHECKLIST.flatMap(sec => sec.items.map(it => sec.code + '-' + it.n));
const CLASS_OPTIONS = ['CR','ABS','BV','DNV','LR','NK (ClassNK)','KR','RINA','CCS'];

/* ---------------- API (XHR text/plain,行動 Safari 相容) ---------------- */
const LOCAL = !SCRIPT_URL;
const LS_KEY = 'evis_data_v1';

function api(action, payload) {
  if (LOCAL) return localApi(action, payload || {});
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', SCRIPT_URL, true);
    xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
    xhr.onload = () => {
      try {
        const res = JSON.parse(xhr.responseText);
        res.ok ? resolve(res) : reject(new Error(res.error || 'Server error'));
      } catch (e) { reject(new Error('Bad response')); }
    };
    xhr.onerror = () => reject(new Error('NETWORK'));
    xhr.send(JSON.stringify(Object.assign({ action }, payload)));
  });
}

/* 本機測試模式:localStorage 模擬後端 */
function lsRead(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || {items:{}}; } catch(e){ return {items:{}}; } }
function lsWrite(d){ localStorage.setItem(LS_KEY, JSON.stringify(d)); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowStr(){ return todayStr()+' '+new Date().toTimeString().slice(0,8); }

function localApi(action, p) {
  const db = lsRead();
  const done = (o) => Promise.resolve(Object.assign({ ok: true }, o));
  if (action === 'list') {
    const items = Object.values(db.items).map(it => { const c = Object.assign({}, it); delete c.data; delete c.attachments; return c; })
      .sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));
    return done({ items });
  }
  if (action === 'get') return done({ item: db.items[p.id] });
  if (action === 'save') {
    const item = Object.assign({}, p.item);
    if (!item.id) item.id = 'INS-' + Date.now();
    item.updatedAt = nowStr();
    if (item.status === 'self_done' && !item.selfDate) item.selfDate = todayStr();
    if (item.status === 'nmdc_done') { if(!item.selfDate) item.selfDate = todayStr(); if(!item.nmdcDate) item.nmdcDate = todayStr(); }
    if (item.status === 'draft') { item.selfDate=''; item.nmdcDate=''; }
    if (item.status === 'self_done') item.nmdcDate='';
    item.attachments = (db.items[item.id] && db.items[item.id].attachments) || [];
    db.items[item.id] = item; lsWrite(db);
    return done({ item });
  }
  if (action === 'delete') { delete db.items[p.id]; lsWrite(db); return done({}); }
  if (action === 'upload') {
    const it = db.items[p.inspId]; if (!it) return Promise.reject(new Error('not saved'));
    const att = { fileId:'local-'+Date.now()+Math.floor(Math.random()*99), inspId:p.inspId, itemCode:p.itemCode,
      name:(p.label||p.itemCode)+' & '+p.name, url:'data:'+(p.mimeType||'application/octet-stream')+';base64,'+p.base64,
      uploadedAt:nowStr(), size:Math.round(p.base64.length*0.75) };
    it.attachments = it.attachments || []; it.attachments.push(att); lsWrite(db);
    return done({ attachment: att });
  }
  if (action === 'deleteFile') {
    Object.values(db.items).forEach(it => { if (it.attachments) it.attachments = it.attachments.filter(a=>a.fileId!==p.fileId); });
    lsWrite(db); return done({});
  }
  return Promise.reject(new Error('unknown'));
}

    progress:'0/'+TOTAL_ITEMS, nmdcProgress:'0/'+TOTAL_ITEMS, verdict:'', verdictDeadline:'',
    data:{ answers:{}, nmdcAnswers:{}, signoff:{inspName:'',inspDate:'',verName:'',verDate:'',endName:'',endDate:''} },
    attachments:[] };
}
function countMap(m){ return Object.values(m||{}).filter(x => x && x.v).length; }
function missingCodes(m){ return ALL_CODES.filter(c => !(m && m[c] && m[c].v)); }
function fmtSize(n){ if(!n) return ''; return n>1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB'; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ansLabel(v){ return v==='yes'?'YES':v==='no'?'NO':v==='na'?'N/A':'—'; }

}

/* ---------------- UI 元件 ---------------- */
const { useState, useEffect, useRef, useCallback } = React;

function Toast({ msg }) {
  if (!msg) return null;
  return <div className={'toast' + (msg.err ? ' err' : '')}>{msg.text}</div>;
}

function Modal({ m, t }) {
  const [val, setVal] = useState('');
  useEffect(()=>{ setVal(''); }, [m]);
  if (!m) return null;
  const ok = () => m.input ? m.onOk(val) : m.onOk();
  return (
    <div className="modalbg" onClick={m.onCancel}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h4>{m.title}</h4>
        {m.body && <p>{m.body}</p>}
        {m.link && <p><a href={m.link} target="_blank" rel="noopener" style={{color:'#1e5ca8', fontWeight:700}}>{m.linkLabel || m.link}</a></p>}
        {m.input &&
          <input type="password" autoFocus value={val} onChange={e=>setVal(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter') ok(); }} placeholder="••••" />}
        <div className="btns">
          <button className="btn btn-o btn-sm" onClick={m.onCancel}>{m.cancelLabel || t.cancel}</button>
          {m.onOk && <button className={'btn btn-sm ' + (m.danger ? 'btn-r' : 'btn-p')} onClick={ok}>{m.okLabel || t.confirm}</button>}
        </div>
      </div>
    </div>
  );
}

function StatusBadge({ status, stage, dateSelf, dateNmdc, verdict, verdictDeadline, t }) {
  if (stage === 'self') {
    if (status === 'self_done' || status === 'nmdc_done')
      return <span><span className="badge b-done">✓ {t.statusSelf}</span><div className="datesub">{dateSelf}</div></span>;
    return <span className="badge b-wait">{t.pending}</span>;
  }
  if (status === 'nmdc_done') {
    const v = verdict==='fail' ? <span className="badge b-fail">✗ {t.sFail}</span>
      : verdict==='cond' ? <span className="badge b-cond">⚠ {t.sCond} · {t.sCondBy} {verdictDeadline}</span>
      : verdict==='pass' ? <span className="badge b-done">✓ {t.sPass}</span> : null;
    return <span><span className="badge b-done">✓ {t.statusNmdc}</span><div className="datesub">{dateNmdc}</div>{v && <div style={{marginTop:3}}>{v}</div>}</span>;
  }
  return <span className="badge b-wait">{t.pending}</span>;
}

/* ---------------- 總表 Dashboard ---------------- */
function Dashboard({ t, list, loading, canEdit, onOpen, onNew, onDelete, onPdf }) {
  const nSelf = list.filter(i=>i.status==='self_done'||i.status==='nmdc_done').length;
  const nNmdc = list.filter(i=>i.status==='nmdc_done').length;
  return (
    <div>
      <div className="statrow">
        <div className="chip"><b>{list.length}</b>{t.stTotal}</div>
        <div className="chip"><b>{nSelf}</b>{t.stSelf}</div>
        <div className="chip"><b>{nNmdc}</b>{t.stNmdc}</div>
        <div style={{flex:1}}></div>
        {canEdit && <button className="btn btn-p" onClick={onNew}>{t.newInsp}</button>}
      </div>
      <div className="tblscroll">
        <table className="list">
          <thead><tr>
            <th>{t.colVessel}</th><th>{t.colIds}</th><th>{t.colDate}</th><th>{t.colProg}</th>
            <th>{t.colSelf}</th><th>{t.colNmdc}</th><th>{t.colAct}</th>
          </tr></thead>
          <tbody>
            {list.length === 0 && (
              <tr><td colSpan="7" style={{textAlign:'center', color:'#8a94a0', padding:'28px 10px'}}>
                {loading ? '...' : t.empty}</td></tr>
            )}
            {list.map(it => {
              const p1 = parseInt(it.progress) || 0, p2 = parseInt(it.nmdcProgress) || 0;
              return (
                <tr key={it.id}>
                  <td>
                    <div style={{fontWeight:700}}>{it.vesselZh || it.vesselEn || '—'}</div>
                    <div className="datesub">{it.vesselZh ? it.vesselEn : ''}{it.vesselClass ? ' · ' + it.vesselClass : ''}</div>
                  </td>
                  <td><div>{it.mmsi || '—'}</div><div className="datesub">IMO {it.imo || '—'}</div></td>
                  <td>{it.inspectDate || '—'}</td>
                  <td>
                    <div className="datesub">{t.progSelf} {p1}/{TOTAL_ITEMS}</div>
                    <div className="pbar"><i style={{width:Math.round(p1/TOTAL_ITEMS*100)+'%'}}></i></div>
                    {it.status !== 'draft' && <div>
                      <div className="datesub" style={{marginTop:3}}>{t.progNmdc} {p2}/{TOTAL_ITEMS}</div>
                      <div className="pbar"><i className="blue" style={{width:Math.round(p2/TOTAL_ITEMS*100)+'%'}}></i></div>
                    </div>}
                  </td>
                  <td><StatusBadge status={it.status} stage="self" dateSelf={it.selfDate} t={t} /></td>
                  <td><StatusBadge status={it.status} stage="nmdc" dateNmdc={it.nmdcDate}
                        verdict={it.verdict} verdictDeadline={it.verdictDeadline} t={t} /></td>
                  <td style={{whiteSpace:'nowrap'}}>
                    <button className="btn btn-navy btn-sm" onClick={()=>onOpen(it.id)}>{t.open}</button>{' '}
                    {it.status==='nmdc_done' &&
                      <button className="btn btn-amber btn-sm" onClick={()=>onPdf(it.id)}>📄 {t.pdf}</button>}{' '}
                    {canEdit && <button className="btn btn-r btn-sm" onClick={()=>onDelete(it.id)}>{t.del}</button>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------------- 附件列 ---------------- */
function AttRow({ t, code, stage, atts, can, uploading, onPick, onDelete, fileRefs }) {
  const key = stage==='nmdc' ? code+'#NMDC' : code;
  return (
    <div className="attrow">
      {can && <button className="attbtn" onClick={()=>fileRefs.current[key] && fileRefs.current[key].click()}>📎 {t.addFile}</button>}
      {can && <input type="file" multiple style={{display:'none'}}
        ref={el=>fileRefs.current[key]=el}
        onChange={e=>{ onPick(code, e.target.files, stage); e.target.value=''; }} />}
      {uploading && <span className="attchip uploading">⏳ {t.uploading}</span>}
      {atts.map(f => (
        <span className="attchip" key={f.fileId} title={f.name}>
          <a href={f.url} target="_blank" rel="noopener">{f.name}</a>
          <span className="datesub">{fmtSize(f.size)}</span>
          {can && <span className="x" onClick={()=>onDelete(f)}>✕</span>}
        </span>
      ))}
    </div>
  );
}

/* ---------------- 簽核卡 ---------------- */
function SignCard({ t, sign, setSign, can }) {
  return (
    <div className="card">
      <h3>✍️ {t.signTitle}</h3>
      <div className="signgrid">
        {[
          { role:t.signInsp, sub:t.signInspSub, nk:'inspName', dk:'inspDate' },
          { role:t.signVer,  sub:t.signVerSub,  nk:'verName',  dk:'verDate' },
          { role:t.signEnd,  sub:t.signEndSub,  nk:'endName',  dk:'endDate' },
        ].map(s => (
          <div className="signbox" key={s.nk}>
            <div className="role">{s.role}</div>
            <div className="rolesub">{s.sub}</div>
            <input placeholder={t.name} disabled={!can} value={sign[s.nk]||''} onChange={e=>setSign(s.nk, e.target.value)} />
            <input type="date" disabled={!can} value={sign[s.dk]||''} onChange={e=>setSign(s.dk, e.target.value)} />
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------- 廠商自檢表單 ---------------- */
function ContractorForm({ t, lang, item, setItem, can, onSave, onBack, saving, uploadFile, deleteAtt, uploadingKeys, askConfirm, showToast, highlightMissing }) {
  const answers = item.data.answers || {};
  const [activeSec, setActiveSec] = useState('A');
  const fileRefs = useRef({});

  const setField = (k, v) => can && setItem(p => Object.assign({}, p, {[k]: v}));
  const setAns = (code, patch) => can && setItem(p => {
    const a = Object.assign({}, p.data.answers);
    a[code] = Object.assign({ v:'', remark:'' }, a[code], patch);
    return Object.assign({}, p, { data: Object.assign({}, p.data, { answers: a }) });
  });
  const setSign = (k, v) => can && setItem(p =>
    Object.assign({}, p, { data: Object.assign({}, p.data, { signoff: Object.assign({}, p.data.signoff, {[k]: v}) }) }));

  const answered = countMap(answers);
  const secCount = sec => sec.items.filter(i => { const a = answers[sec.code+'-'+i.n]; return a && a.v; }).length;
  const jump = code => {
    setActiveSec(code);
    const el = document.getElementById('sec-' + code);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  };
  const attsFor = code => (item.attachments || []).filter(a => a.itemCode === code);

  const trySubmit = () => {
    const miss = missingCodes(answers);
    if (miss.length) {
      showToast(t.errAllItems(miss.length), true);
      highlightMissing(miss);
      const el = document.getElementById('item-' + miss[0]);
      if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
      return;
    }
    askConfirm(t.confirmSelfT, t.confirmSelfP, ()=>onSave('self_done'));
  };

  return (
    <div>
      <div className="card">
        <h3>🚢 {t.vesselInfo}</h3>
        <div className="grid">
          <div className="field"><label>{t.vNameZh}</label>
            <input disabled={!can} value={item.vesselZh} onChange={e=>setField('vesselZh', e.target.value)} placeholder="例:大地" /></div>
          <div className="field"><label>{t.vNameEn} <span className="req">*</span></label>
            <input disabled={!can} value={item.vesselEn} onChange={e=>setField('vesselEn', e.target.value)} placeholder="e.g. Normand Tonjer" /></div>
          <div className="field"><label>MMSI</label>
            <input disabled={!can} value={item.mmsi} inputMode="numeric" onChange={e=>setField('mmsi', e.target.value)} placeholder="9 digits" /></div>
          <div className="field"><label>{t.imo}</label>
            <input disabled={!can} value={item.imo} inputMode="numeric" onChange={e=>setField('imo', e.target.value)} placeholder="7 digits" /></div>
          <div className="field"><label>{t.tonnage}</label>
            <input disabled={!can} value={item.tonnage} onChange={e=>setField('tonnage', e.target.value)} placeholder="GT" /></div>
          <div className="field"><label>{t.vClass}</label>
            <input disabled={!can} list="classList" value={item.vesselClass} onChange={e=>setField('vesselClass', e.target.value)} placeholder="CR / ABS / DNV ..." />
            <datalist id="classList">{CLASS_OPTIONS.map(c=><option key={c} value={c} />)}</datalist></div>
          <div className="field"><label>{t.projectNo}</label>
            <input disabled={!can} value={item.projectNo} onChange={e=>setField('projectNo', e.target.value)} /></div>
          <div className="field"><label>{t.location}</label>
            <input disabled={!can} value={item.location} onChange={e=>setField('location', e.target.value)} placeholder="e.g. Taichung Anchorage" /></div>
          <div className="field"><label>{t.inspectDate}</label>
            <input type="date" disabled={!can} value={item.inspectDate} onChange={e=>setField('inspectDate', e.target.value)} /></div>
        </div>
      </div>

      <div className="banner blue">{t.legend}</div>

      <div className="secnav">
        {CHECKLIST.map(sec => (
          <button key={sec.code} className={activeSec===sec.code ? 'on' : ''} onClick={()=>jump(sec.code)}>
            {sec.code}. {lang==='zh' ? sec.zh : sec.en}
            <span className="cnt">{secCount(sec)}/{sec.items.length}</span>
          </button>
        ))}
      </div>

      {CHECKLIST.map(sec => (
        <div key={sec.code} id={'sec-'+sec.code}>
          <div className="sechead">
            <span>{sec.code}. {lang==='zh' ? sec.zh : sec.en}</span>
            <span style={{fontSize:12, opacity:.85}}>{secCount(sec)}/{sec.items.length}</span>
          </div>
          <div className="secbody">
            {sec.items.map(it => {
              const code = sec.code + '-' + it.n;
              const a = answers[code] || { v:'', remark:'' };
              const isMiss = item._miss && item._miss.includes(code);
              return (
                <div className={'item' + (isMiss && !a.v ? ' miss' : '')} key={code} id={'item-'+code}>
                  <div className="txt"><span className="no">{code}</span>{lang==='zh' ? it.zh : it.en}</div>
                  <div className="row2">
                    <div className="seg">
                      {['yes','no','na'].map(v => (
                        <button key={v} disabled={!can} className={v + (a.v===v ? ' on' : '')}
                          onClick={()=>setAns(code, { v: a.v===v ? '' : v })}>
                          {v==='yes'?'Yes':v==='no'?'No':'N/A'}
                        </button>
                      ))}
                    </div>
                    <div className="remark">
                      <input disabled={!can} value={a.remark || ''} placeholder={t.remark}
                        onChange={e=>setAns(code, { remark: e.target.value })} />
                    </div>
                  </div>
                  <AttRow t={t} code={code} stage="self" atts={attsFor(code)} can={can}
                    uploading={uploadingKeys.includes(code)} onPick={uploadFile} onDelete={deleteAtt} fileRefs={fileRefs} />

              );
            })}
          </div>
        </div>
      ))}

      <SignCard t={t} sign={item.data.signoff||{}} setSign={setSign} can={can} />

      <div className="footbar">
        <button className="btn btn-o" onClick={onBack}>{t.back}</button>
        <div className="grow">{answered}/{TOTAL_ITEMS} {t.answered}</div>
        {can && <button className="btn btn-o" disabled={saving} onClick={()=>onSave()}>{saving ? '...' : '💾 ' + t.save}</button>}
        {can && <button className="btn btn-p" disabled={saving} onClick={trySubmit}>✓ {t.markSelf}</button>}
      </div>
    </div>
  );
}

/* ---------------- NMDC 覆核表單 ---------------- */
function NmdcForm({ t, lang, item, setItem, can, editMode, onSave, onBack, saving, uploadFile, deleteAtt, uploadingKeys, askConfirm, showToast, onExport, exporting, highlightMissing }) {
  const answers = item.data.answers || {};
  const nAns = item.data.nmdcAnswers || {};
  const [activeSec, setActiveSec] = useState('A');
  const fileRefs = useRef({});
  const done = item.status === 'nmdc_done';

  const setAns = (code, patch) => can && setItem(p => {
    const a = Object.assign({}, p.data.nmdcAnswers);
    a[code] = Object.assign({ v:'', remark:'' }, a[code], patch);
    return Object.assign({}, p, { data: Object.assign({}, p.data, { nmdcAnswers: a }) });
  });
  const setSign = (k, v) => can && setItem(p =>
    Object.assign({}, p, { data: Object.assign({}, p.data, { signoff: Object.assign({}, p.data.signoff, {[k]: v}) }) }));
  const setVerdict = (v) => can && setItem(p => Object.assign({}, p, { verdict: v }));
  const setDeadline = (d) => can && setItem(p => Object.assign({}, p, { verdictDeadline: d }));

  const answered = countMap(nAns);
  const secCount = sec => sec.items.filter(i => { const a = nAns[sec.code+'-'+i.n]; return a && a.v; }).length;
  const jump = code => {
    setActiveSec(code);
    const el = document.getElementById('sec-' + code);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  };
  const attsFor = (code, stage) => (item.attachments || []).filter(a => a.itemCode === (stage==='nmdc' ? code+'#NMDC' : code));

  const trySubmit = () => {
    const miss = missingCodes(nAns);
    if (miss.length) {
      showToast(t.errAllItems(miss.length), true);
      highlightMissing(miss);
      const el = document.getElementById('item-' + miss[0]);
      if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
      return;
    }
    if (!item.verdict) { showToast(t.errVerdict, true); const el=document.getElementById('verdict-card'); if(el) el.scrollIntoView({behavior:'smooth', block:'center'}); return; }
    if (item.verdict === 'cond' && !item.verdictDeadline) { showToast(t.errDeadline, true); const el=document.getElementById('verdict-card'); if(el) el.scrollIntoView({behavior:'smooth', block:'center'}); return; }
    askConfirm(t.confirmNmdcT, t.confirmNmdcP, ()=>onSave('nmdc_done'));
  };

  const infoPairs = [
    [t.vNameZh, item.vesselZh], [t.vNameEn, item.vesselEn], ['MMSI', item.mmsi], [t.imo, item.imo],
    [t.tonnage, item.tonnage], [t.vClass, item.vesselClass], [t.projectNo, item.projectNo],
    [t.location, item.location], [t.inspectDate, item.inspectDate], [t.statusSelf, item.selfDate],
  ];

  return (
    <div>
      <div className={'banner ' + (done ? 'gray' : 'blue')}>{done ? t.doneStage : t.nmdcStage}</div>

      <div className="card">
        <h3>🚢 {t.vesselInfo}</h3>
        <div className="kv">
          {infoPairs.map(([k,v]) => <div key={k}><div className="k">{k}</div><div className="v">{v || '—'}</div></div>)}
        </div>
      </div>

      <div className="banner blue">{t.legend}</div>

      <div className="secnav">
        {CHECKLIST.map(sec => (
          <button key={sec.code} className={activeSec===sec.code ? 'on' : ''} onClick={()=>jump(sec.code)}>
            {sec.code}. {lang==='zh' ? sec.zh : sec.en}
            <span className="cnt">{secCount(sec)}/{sec.items.length}</span>
          </button>
        ))}
      </div>

      {CHECKLIST.map(sec => (
        <div key={sec.code} id={'sec-'+sec.code}>
          <div className="sechead">
            <span>{sec.code}. {lang==='zh' ? sec.zh : sec.en}</span>
            <span style={{fontSize:12, opacity:.85}}>{secCount(sec)}/{sec.items.length}</span>
          </div>
          <div className="secbody">
            {sec.items.map(it => {
              const code = sec.code + '-' + it.n;
              const ca = answers[code] || {};
              const a = nAns[code] || { v:'', remark:'' };
              const isMiss = item._miss && item._miss.includes(code);
              return (
                <div className={'item' + (isMiss && !a.v ? ' miss' : '')} key={code} id={'item-'+code}>
                  <div className="txt"><span className="no">{code}</span>{lang==='zh' ? it.zh : it.en}</div>
                  <div className="panelgrid">
                    <div className="panel ctr">
                      <div className="ph">{t.ctrResult}</div>
                      <span className={'ansbadge ' + (ca.v ? 'ans-'+ca.v : 'ans-none')}>{ca.v ? ansLabel(ca.v) : t.notAnswered}</span>
                      {ca.remark && <div className="ctr-remark">💬 {ca.remark}</div>}
                      <AttRow t={t} code={code} stage="self" atts={attsFor(code,'self')} can={false}
                        uploading={false} onPick={()=>{}} onDelete={()=>{}} fileRefs={fileRefs} />
                    </div>
                    <div className="panel">
                      <div className="ph">{t.nmdcResult}</div>
                      <div className="row2" style={{marginTop:0}}>
                        <div className="seg">
                          {['yes','no','na'].map(v => (
                            <button key={v} disabled={!can} className={v + (a.v===v ? ' on' : '')}
                              onClick={()=>setAns(code, { v: a.v===v ? '' : v })}>
                              {v==='yes'?'Yes':v==='no'?'No':'N/A'}
                            </button>
                          ))}
                        </div>
                        <div className="remark">
                          <input disabled={!can} value={a.remark || ''} placeholder={t.remark}
                            onChange={e=>setAns(code, { remark: e.target.value })} />
                        </div>
                      </div>
                      <AttRow t={t} code={code} stage="nmdc" atts={attsFor(code,'nmdc')} can={can}
                        uploading={uploadingKeys.includes(code+'#NMDC')} onPick={uploadFile} onDelete={deleteAtt} fileRefs={fileRefs} />
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}

      {/* 檢查結論 */}
      <div className="card" id="verdict-card">
        <h3>⚖️ {t.verdictTitle}</h3>
        {[['fail', t.vFail], ['cond', t.vCond], ['pass', t.vPass]].map(([v, label]) => (
          <div key={v}>
            <div className={'vopt' + (item.verdict===v ? ' sel ' + v : '') + (!can ? ' ro' : '')}
              onClick={()=>can && setVerdict(v)}>
              <div className="dot"></div>
              <div>{label}</div>
            </div>
            {v==='cond' && item.verdict==='cond' &&
              <div className="ddl">
                <label style={{fontSize:12.5, fontWeight:600, color:'#54626f'}}>{t.vDeadline} <span className="req">*</span></label>
                <input type="date" disabled={!can} value={item.verdictDeadline||''} onChange={e=>setDeadline(e.target.value)} />
              </div>}
          </div>
        ))}
      </div>

      <SignCard t={t} sign={item.data.signoff||{}} setSign={setSign} can={can} />

      <div className="footbar">
        <button className="btn btn-o" onClick={onBack}>{t.back}</button>
        <div className="grow">
          NMDC {answered}/{TOTAL_ITEMS} {t.answered}
          {editMode && !done &&
            <a style={{marginLeft:8, color:'#1e5ca8', cursor:'pointer'}}
              onClick={()=>setItem(p=>Object.assign({}, p, {status:'draft'}))}>{t.revert}</a>}
          {editMode && done &&
            <a style={{marginLeft:8, color:'#1e5ca8', cursor:'pointer'}}
              onClick={()=>setItem(p=>Object.assign({}, p, {status:'self_done'}))}>{t.revert}</a>}
        </div>
        {can && <button className="btn btn-o" disabled={saving} onClick={()=>onSave()}>{saving ? '...' : '💾 ' + t.save}</button>}
        {can && <button className="btn btn-navy" disabled={saving} onClick={trySubmit}>✓✓ {t.markNmdc}</button>}
        {done && <button className="btn btn-amber" disabled={exporting} onClick={onExport}>{exporting ? t.exporting : t.exportPdf}</button>}
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [lang, setLang] = useState(localStorage.getItem('evis_lang') || 'en');
  const t = T[lang];
  const [editMode, setEditMode] = useState(localStorage.getItem('evis_unlocked') === '1');
  const [view, setView] = useState('dash');
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [item, setItem] = useState(null);
  const [saving, setSaving] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [toast, setToast] = useState(null);
  const [modal, setModal] = useState(null);
  const [uploadingKeys, setUploadingKeys] = useState([]);
  const itemRef = useRef(null);
  itemRef.current = item;

  const showToast = (text, err) => {
    setToast({ text, err });
    setTimeout(()=>setToast(null), 3200);
  };
  const askConfirm = (title, body, onOk, danger) =>
    setModal({ title, body, danger, onCancel:()=>setModal(null), onOk:()=>{ setModal(null); onOk(); } });

  const refresh = useCallback(() => {
    setLoading(true);
    api('list').then(r => { setList(r.items || []); setLoading(false); })
      .catch(() => { setLoading(false); showToast(t.loadFail, true); });
  }, [lang]);

  useEffect(() => { refresh(); }, []);

  const normalize = (it) => {
    it.data = it.data || {};
    it.data.answers = it.data.answers || {};
    it.data.nmdcAnswers = it.data.nmdcAnswers || {};
    it.data.signoff = it.data.signoff || {};
    it.attachments = it.attachments || [];
    return it;
  };

  const openItem = id => {
    api('get', { id }).then(r => {
      setItem(normalize(r.item)); setView('form'); window.scrollTo(0,0);
    }).catch(e => showToast(t.loadFail + ': ' + e.message, true));
  };

  const newItem = () => { setItem(blankItem()); setView('form'); window.scrollTo(0,0); };

  const highlightMissing = (miss) => setItem(p => Object.assign({}, p, { _miss: miss }));

  const doSave = (newStatus) => {
    const cur = Object.assign({}, itemRef.current);
    delete cur._miss;
    if (newStatus) cur.status = newStatus;
    cur.progress = countMap(cur.data.answers) + '/' + TOTAL_ITEMS;
    cur.nmdcProgress = countMap(cur.data.nmdcAnswers) + '/' + TOTAL_ITEMS;
    setSaving(true);
    return api('save', { item: cur }).then(r => {
      const saved = normalize(r.item);
      if (!saved.attachments.length && cur.attachments) saved.attachments = cur.attachments;
      setItem(saved); setSaving(false); showToast(t.saved);
      api('list').then(x=>setList(x.items||[])).catch(()=>{});
      return saved;
    }).catch(e => { setSaving(false); showToast(t.saveFail + ': ' + e.message, true); throw e; });
  };

  const uploadFile = (code, files, stage) => {
    if (!files || !files.length) return;
    const itemCode = stage==='nmdc' ? code+'#NMDC' : code;
    const label = stage==='nmdc' ? code+' (NMDC)' : code;
    const maxSize = LOCAL ? 2*1024*1024 : 15*1024*1024;
    const arr = Array.from(files);
    const ensureSaved = itemRef.current.id ? Promise.resolve(itemRef.current) :
      (showToast(t.needSave), doSave());
    ensureSaved.then(saved => {
      arr.forEach(f => {
        if (f.size > maxSize) { showToast(t.fileTooBig, true); return; }
        setUploadingKeys(p=>[...p, itemCode]);
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = String(reader.result).split(',')[1];
          api('upload', { inspId: saved.id, itemCode, label, name: f.name, mimeType: f.type, base64 })
            .then(r => {
              setItem(p => Object.assign({}, p, { attachments: [...(p.attachments||[]), r.attachment] }));
              setUploadingKeys(p => { const i=p.indexOf(itemCode); const c=[...p]; if(i>-1)c.splice(i,1); return c; });
            })
            .catch(e => {
              setUploadingKeys(p => { const i=p.indexOf(itemCode); const c=[...p]; if(i>-1)c.splice(i,1); return c; });
              showToast('Upload failed: ' + e.message, true);
            });
        };
        reader.readAsDataURL(f);
      });
    }).catch(()=>{});
  };

  const deleteAtt = (f) => askConfirm(t.confirmDelT, f.name, () => {
    api('deleteFile', { fileId: f.fileId }).then(() => {
      setItem(p => Object.assign({}, p, { attachments: (p.attachments||[]).filter(a=>a.fileId!==f.fileId) }));
    }).catch(e => showToast(e.message, true));
  }, true);

  const deleteInsp = (id) => askConfirm(t.confirmDelT, t.confirmDelP, () => {
    api('delete', { id }).then(refresh).catch(e => showToast(e.message, true));
  }, true);

  /* PDF 匯出 */
  const exportRecord = (full) => {
    const html = buildReportHtml(full);
    if (LOCAL) {
      const w = window.open('', '_blank');
      w.document.write(html); w.document.close();
      showToast(t.pdfLocal);
      setTimeout(()=>{ try{ w.print(); }catch(e){} }, 600);
      return;
    }
    setExporting(true);
    api('exportPdf', { id: full.id, html }).then(r => {
      setExporting(false);
      setModal({ title: t.pdfDone, body: r.name, link: r.url, linkLabel: '🔗 ' + t.pdfOpen,
        onCancel:()=>setModal(null), onOk:null, cancelLabel:'OK' });
    }).catch(e => { setExporting(false); showToast(e.message, true); });
  };
  const exportById = (id) => {
    api('get', { id }).then(r => exportRecord(normalize(r.item)))
      .catch(e => showToast(t.loadFail + ': ' + e.message, true));
  };

  /* 🔑 編輯模式 */
  const toggleLock = () => {
    if (editMode) {
      setEditMode(false); localStorage.removeItem('evis_unlocked'); showToast(t.lockedMsg);
      return;
    }
    if (!EDIT_CODE) { setEditMode(true); localStorage.setItem('evis_unlocked','1'); return; }
    setModal({ title:'🔑 ' + t.unlockT, body:t.unlockP, input:true,
      onCancel:()=>setModal(null),
      onOk:(val)=>{
        if (val === EDIT_CODE) { setEditMode(true); localStorage.setItem('evis_unlocked','1'); setModal(null); }
        else showToast(t.wrongCode, true);
      }});
  };

  const toggleLang = () => {
    const nl = lang === 'en' ? 'zh' : 'en';
    setLang(nl); localStorage.setItem('evis_lang', nl);
  };

  const canContractor = editMode && item && item.status === 'draft';
  const canNmdc = editMode && item && item.status === 'self_done';

  return (
    <div>
      <div className="topbar">
        <div><div className="logo">NMDC <span>ENERGY</span></div></div>
        <div className="grow">
          <div style={{fontWeight:700, fontSize:13.5}}>{t.appTitle}</div>
          <div className="sub">{DOC_NO} · {DOC_REV}</div>
        </div>
        {view === 'form' &&
          <button className="langbtn" onClick={()=>{ setView('dash'); refresh(); }}>{t.dash}</button>}
        <button className="langbtn" onClick={toggleLang}>{lang === 'en' ? '中文' : 'EN'}</button>
        <button className={'lockbtn' + (editMode ? ' unlocked' : '')} onClick={toggleLock}
          title={editMode ? 'Lock' : 'Unlock'}>{editMode ? '🔓' : '🔑'}</button>
      </div>

      <div className="wrap">
        {LOCAL && <div className="banner">{t.localMode}</div>}
        {!editMode && <div className="banner gray">{t.viewMode}</div>}
        {view === 'dash' &&
          <Dashboard t={t} list={list} loading={loading} canEdit={editMode}
            onOpen={openItem} onNew={newItem} onDelete={deleteInsp} onPdf={exportById} />}
        {view === 'form' && item && item.status === 'draft' &&
          <ContractorForm t={t} lang={lang} item={item} setItem={setItem} can={canContractor}
            onSave={doSave} saving={saving}
            onBack={()=>{ setView('dash'); refresh(); window.scrollTo(0,0); }}
            uploadFile={uploadFile} deleteAtt={deleteAtt} uploadingKeys={uploadingKeys}
            askConfirm={askConfirm} showToast={showToast} highlightMissing={highlightMissing} />}
        {view === 'form' && item && item.status !== 'draft' &&
          <NmdcForm t={t} lang={lang} item={item} setItem={setItem} can={canNmdc} editMode={editMode}
            onSave={doSave} saving={saving}
            onBack={()=>{ setView('dash'); refresh(); window.scrollTo(0,0); }}
            uploadFile={uploadFile} deleteAtt={deleteAtt} uploadingKeys={uploadingKeys}
            askConfirm={askConfirm} showToast={showToast}
            onExport={()=>exportRecord(itemRef.current)} exporting={exporting} highlightMissing={highlightMissing} />}
      </div>

      <Toast msg={toast} />
      <Modal m={modal} t={t} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
