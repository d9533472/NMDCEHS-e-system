<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
body{font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif;color:#1c2732;
 background:linear-gradient(180deg,#fafcfe 0,#f4f7fa 260px,#f3f6f9 560px);
 padding-bottom:48px;-webkit-font-smoothing:antialiased}

/* 手機：標題一行、三顆功能鍵折到第二行；桌機：全部擠在同一行 */
.hd{padding:13px 16px;background:linear-gradient(180deg,#fff,#f7fafc);position:sticky;top:0;z-index:9;
 display:flex;flex-wrap:wrap;align-items:center;gap:9px;
 box-shadow:0 2px 12px rgba(16,42,67,.10);
 border-bottom:4px solid transparent;border-image:linear-gradient(90deg,#002038,#00B050,#002038) 1}
.hdl{display:flex;align-items:center;gap:11px;min-width:0;flex:1 1 auto;order:0}
.hd h1{font-size:17px;font-weight:800;letter-spacing:.6px;color:#002038}
.hd small{color:#7d8ea0;font-size:10px;letter-spacing:1px;display:block;margin-top:1px}
.lgo{width:74px;height:25px;flex:0 0 auto;display:block}
.lg{order:2;flex:0 0 auto;background:#eef3f8;border:1px solid #d3dde8;color:#16324f;
 border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.hdr{order:3;flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ico{flex:1 1 auto;min-width:0;height:40px;padding:0 10px;border-radius:12px;border:1px solid #d3dde8;
 background:#eef3f8;color:#16324f;cursor:pointer;
 display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s}
.ico span{font-size:15px;line-height:1}
.ico em{font-style:normal;font-size:12.5px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.ico:active{transform:scale(.97)}
.ico.p{background:linear-gradient(135deg,#002038,#00B050);border-color:#002038;color:#fff;
 box-shadow:0 3px 10px rgba(0,32,56,.28)}
@media(min-width:680px){
 .hdr{order:1;flex:0 0 auto;margin-left:auto}
 .ico{flex:0 0 auto}
}

/* 浮動視窗：手機從下往上推，桌機置中 */
.mask{position:fixed;inset:0;z-index:40;display:none;background:rgba(10,22,35,.45);
 align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-width:660px;max-height:92vh;border-radius:20px 20px 0 0;
 display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(16,24,40,.28);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
.shd{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:14px 16px 11px;
 border-bottom:1px solid #eef1f4}
.shd .ft{flex:1;margin:0;padding:0;border:0}
.x{flex:0 0 auto;width:34px;height:34px;padding:0;border-radius:11px;border:1px solid #e3e9f0;
 background:#f5f8fb;color:#56657a;font-size:15px;font-weight:700;cursor:pointer}
.sbd{padding:2px 16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media(min-width:680px){
 .mask{align-items:center;padding:20px}
 .sheet{border-radius:20px}
}

.wrap{padding:14px;max-width:660px;margin:0 auto}
.card{background:#fff;border-radius:18px;padding:15px 16px;margin-bottom:11px;border:1px solid #e8ecf1;
 box-shadow:0 1px 3px rgba(16,24,40,.04),0 8px 20px rgba(16,24,40,.05)}
.ft{font-size:15px;font-weight:800;color:#16324f;margin:0 0 9px;padding-bottom:9px;
 border-bottom:1px solid #eef1f4;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.ft::before{content:"";width:5px;height:18px;border-radius:2px;background:linear-gradient(180deg,#002038,#00B050)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:18px;padding:12px 4px 10px;text-align:center;cursor:pointer;
 box-shadow:0 1px 3px rgba(16,24,40,.04),0 6px 16px rgba(16,24,40,.05);transition:transform .1s,box-shadow .15s}
.kpi:active{transform:scale(.96)}
.kpi b{display:block;font-size:26px;font-weight:900;line-height:1.15}
.kpi span{font-size:10.5px;font-weight:700;letter-spacing:.4px;color:#77808c;display:block;margin-top:2px}
.kpi.k0{background:linear-gradient(180deg,#fcfdff,#f5f9fd);border:1px solid #e7eef5}.kpi.k0 b{color:#1b3a5c}
.kpi.k1{background:linear-gradient(180deg,#fffef9,#fdf8ec);border:1px solid #f4ecd9}.kpi.k1 b{color:#c07a18}
.kpi.k2{background:linear-gradient(180deg,#fbfdfc,#f2f9f4);border:1px solid #e3f0e8}.kpi.k2 b{color:#1b6e3c}
.kpi.k3{background:linear-gradient(180deg,#fffbfb,#fdf4f4);border:1px solid #f7e7e7}.kpi.k3 b{color:#c62828}
.kpi.act{box-shadow:0 0 0 2.5px #1b3a5c,0 8px 24px rgba(16,24,40,.10)}

.dbar{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.dbar input[type=date]{flex:1;text-align:center;font-weight:700;color:#16324f}
.dtrow{display:flex;gap:8px}
.dtrow input{flex:1;min-width:0}
.dtrow input[type=time]{flex:0 0 40%}
.nav{flex:0 0 auto;width:42px;height:44px;border-radius:13px;border:0;background:#fff;color:#16324f;
 font-size:18px;font-weight:800;box-shadow:0 1px 3px rgba(16,24,40,.08);cursor:pointer}
.nav:active{transform:scale(.95)}
.dsum{text-align:center;font-size:12.5px;color:#6b7784;margin:-4px 0 10px;font-weight:600}

.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:700;
 letter-spacing:2px;margin-bottom:10px;color:#fff;cursor:pointer;
 background:linear-gradient(135deg,#1b8a4a,#00B050);box-shadow:0 5px 14px rgba(0,176,80,.25),inset 0 1px 0 rgba(255,255,255,.28);
 transition:transform .1s,filter .15s}
.btn:active{transform:scale(.985);filter:brightness(.95)}
.btn[disabled]{background:#9bb3a5;box-shadow:none}
.btn2{background:linear-gradient(135deg,#3c5568,#5b7686);box-shadow:0 4px 12px rgba(60,85,104,.24)}
.btn3{background:linear-gradient(135deg,#002038,#0b3c60);box-shadow:0 4px 12px rgba(0,32,56,.26)}

label{display:block;font-size:13px;color:#46566a;font-weight:700;margin:12px 0 5px}
label.req::after{content:" ＊";color:#c62828}
input,textarea,select{width:100%;border:1.5px solid transparent;border-radius:13px;padding:11px;
 font-size:16px;font-family:inherit;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.08);
 transition:border-color .15s,box-shadow .15s}
textarea{border:1.5px solid #cfd6de;height:78px;box-shadow:none;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none;border-color:#00B050;box-shadow:0 0 0 3px rgba(0,176,80,.14)}
.err{border-color:#c62828!important;background:#fdf4f4!important}
.hint{font-size:11.5px;color:#8a97a5;margin-top:4px;line-height:1.5}

.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.opt{padding:9px 14px;border-radius:12px;border:1.5px solid #ccd3da;background:#fff;
 font-size:14px;font-weight:700;color:#5a6b7c;cursor:pointer;transition:.13s;user-select:none}
.opt.on{background:#002038;border-color:#002038;color:#fff;box-shadow:0 3px 10px rgba(0,32,56,.28)}
.opt.on.g{background:#00B050;border-color:#00B050;box-shadow:0 3px 10px rgba(0,176,80,.3)}

.risks{display:flex;gap:8px;margin-top:2px}
.risk{flex:1;text-align:center;padding:11px 0;border:1.5px solid #ccd3da;border-radius:12px;
 font-weight:800;color:#8a97a5;background:#fff;cursor:pointer;transition:.15s;font-size:14px}
.risk small{display:block;font-size:10.5px;font-weight:700;margin-top:1px;opacity:.9}
.risk.on-P1{background:#c62828;border-color:#c62828;color:#fff;box-shadow:0 4px 12px rgba(198,40,40,.35)}
.risk.on-P2{background:#c07a18;border-color:#c07a18;color:#fff;box-shadow:0 4px 12px rgba(192,122,24,.35)}
.risk.on-P3{background:#546e7a;border-color:#546e7a;color:#fff;box-shadow:0 4px 12px rgba(84,110,122,.35)}

.thumbs{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.thw{position:relative;flex:0 0 auto}
.thumbs img{height:104px;border-radius:11px;border:1px solid #ccd3da;display:block;background:#eef1f4}
.thx{position:absolute;top:4px;right:4px;width:26px;height:26px;line-height:26px;text-align:center;
 border-radius:50%;background:rgba(198,40,40,.92);color:#fff;font-size:14px;font-weight:700;
 box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer;user-select:none;z-index:2}

.it{border-left:6px solid #ccd3da;padding:14px 15px 12px}
.it.Open{border-left-color:#c07a18}
.it.Closed{border-left-color:#1b6e3c}
.row1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:#6b7784;margin-bottom:8px}
.sn{font-weight:900;color:#002038;font-size:15px}
.pill{font-weight:800;font-size:12px;border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill.Open{background:#fff3df;color:#c07a18}
.pill.Closed{background:#e2f2e6;color:#1b6e3c}
.lbl{font-size:11px;font-weight:800;color:#8a97a5;letter-spacing:.6px;margin-top:7px}
.zh{font-size:15px;line-height:1.55;font-weight:500;color:#1c2732;word-break:break-word}
.en{font-size:13px;line-height:1.5;color:#5a6b7c;word-break:break-word;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;align-items:center;margin-top:10px}
.tag{background:#eef1f4;border-radius:999px;padding:4px 11px;color:#55606b;font-weight:600}
.tag.over{background:#fde3e3;color:#c62828;font-weight:800}
.tag.soon{background:#fff3df;color:#c07a18;font-weight:800}
.tag.hz{background:#eaf0fa;color:#1b3a5c;font-weight:800}

/* 危害統計 */
.stot{display:flex;gap:8px;margin:12px 0 4px}
.stot div{flex:1;text-align:center;background:#f5f8fb;border:1px solid #e7eef5;border-radius:13px;padding:9px 4px}
.stot b{display:block;font-size:21px;font-weight:900;color:#1b3a5c;line-height:1.2}
.stot.o b{color:#c07a18}.stot.c b{color:#1b6e3c}
.stot span{font-size:10.5px;font-weight:700;color:#77808c}
.qk{display:flex;gap:7px;margin-top:8px}
.qk button{flex:1;padding:8px 0;border-radius:11px;border:1.5px solid #ccd3da;background:#fff;
 font-size:12.5px;font-weight:800;color:#5a6b7c;cursor:pointer;font-family:inherit}
.qk button.on{background:#002038;border-color:#002038;color:#fff}
.srow{margin-top:11px}
.srow .sl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;
 font-weight:700;color:#38475a;margin-bottom:3px}
.srow .sn2{flex:0 0 auto;font-weight:900;color:#1b3a5c}
.srow .sm{font-size:11px;font-weight:700;color:#8a97a5}
.bar{height:9px;border-radius:999px;background:#eef1f4;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.o{background:linear-gradient(90deg,#e0a63c,#c07a18)}
.bar i.c{background:linear-gradient(90deg,#4fbf7a,#1b6e3c)}
.tag.cl{background:#e2f2e6;color:#1b6e3c;font-weight:800;padding:2px 8px 2px 11px;display:inline-flex;
 align-items:center;gap:5px}
/* 卡片上直接改結案日期，所以要把全域的 input 樣式縮回標籤大小 */
.cdt{width:auto;padding:2px 5px;font-size:12px;font-weight:800;font-family:inherit;color:#1b6e3c;
 background:#fff;border:1px solid #bcdcc6;border-radius:8px;box-shadow:none}
.cdt:focus{border-color:#00B050;box-shadow:0 0 0 2px rgba(0,176,80,.16)}
.ph{display:flex;gap:8px;margin-top:9px;overflow-x:auto;padding-bottom:3px}
.phw{position:relative;flex:0 0 auto}
.ph img{height:120px;min-width:80px;border-radius:12px;border:1px solid #dfe4ea;display:block;
 background:#eef1f4;box-shadow:0 3px 10px rgba(16,24,40,.12);cursor:pointer}
.pb{position:absolute;left:6px;top:6px;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;
 color:#fff;opacity:.93;pointer-events:none}
.pb.b{background:#546e7a}.pb.a{background:#1b6e3c}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.abtn{padding:9px 14px;border:1.5px solid #00B050;border-radius:12px;background:#fff;color:#12793f;
 font-size:13px;font-weight:800;cursor:pointer;transition:transform .1s}
.abtn:active{transform:scale(.96)}
.abtn.n{border-color:#1b3a5c;color:#1b3a5c}
.abtn.d{border-color:#c62828;color:#c62828}

.muted{color:#98a2ad;font-size:13.5px;text-align:center;padding:24px 10px;line-height:1.7}
#msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(0,32,56,.94);color:#fff;
 padding:11px 22px;border-radius:999px;font-size:14px;display:none;z-index:99;max-width:88%;
 box-shadow:0 6px 24px rgba(16,42,67,.45);text-align:center}
#lbx{display:none;position:fixed;inset:0;background:rgba(10,16,22,.94);z-index:100;
 flex-direction:column;align-items:center;justify-content:center;padding:18px}
#lbx img{max-width:96%;max-height:78%;border-radius:10px}
#lba{margin-top:16px;color:#9fc0dd;font-size:14px;text-decoration:none;border:1px solid #46617e;
 border-radius:999px;padding:9px 18px}
.out{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.out a{display:block;text-align:center;text-decoration:none;font-weight:800;font-size:14px;
 padding:12px;border-radius:13px;border:1.5px solid #d3dde8;color:#16324f;background:#f7fafc}
.out a.p{border-color:#c62828;color:#c62828}
.out a.w{border-color:#1b3a5c;color:#1b3a5c}
.out a.g{border-color:#1b6e3c;color:#1b6e3c}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
.tiny{font-size:12px;color:#8a97a5;line-height:1.7}

@media(min-width:980px){
 .hd{padding:15px max(16px,calc(50% - 540px))}
 .wrap{max-width:880px}
}
@media(hover:hover){
 .kpi:hover{transform:translateY(-2px)}
 .btn:hover{filter:brightness(1.06)}
 .abtn:hover{background:#f4faf6}
 .out a:hover{background:#eef3f8}
}
</style>
</head>
<body>

<div class="hd">
 <div class="hdl">
  <img class="lgo" src="data:image/png;base64,<?!= LOGO ?>" alt="NMDC ENERGY">
  <div>
   <h1 id="tTitle">NMDC 通霄工區</h1>
   <small id="tSub">HSE 現場巡查紀錄 · WALKTHROUGH</small>
  </div>
 </div>
 <button class="lg" id="lang" onclick="setLang(LG=='zh'?'en':'zh')">EN</button>
 <div class="hdr">
  <button class="ico p" id="bAdd" onclick="newRec()"><span>✚</span><em data-i="bAdd"></em></button>
  <button class="ico" id="bExp" onclick="openM('exp')"><span>📄</span><em data-i="bExp"></em></button>
  <button class="ico" id="bStat" onclick="openM('stat')"><span>📊</span><em data-i="bStat"></em></button>
  <button class="ico" id="bCfg" onclick="openM('cfg')"><span>⚙</span><em data-i="bCfg"></em></button>
 </div>
</div>

<div class="wrap">

 <div class="kpis">
  <div class="kpi k0 act" onclick="flt('')"><b id="k0">—</b><span data-i="kAll"></span></div>
  <div class="kpi k1" onclick="flt('Open')"><b id="k1">—</b><span data-i="kOpen"></span></div>
  <div class="kpi k2" onclick="flt('Closed')"><b id="k2">—</b><span data-i="kClosed"></span></div>
  <div class="kpi k3" onclick="flt('overdue')"><b id="k3">—</b><span data-i="kOver"></span></div>
 </div>

 <div id="dwrap">
  <div class="dbar">
   <button class="nav" onclick="shiftDay(-1)">‹</button>
   <input id="dt" type="date" onchange="load()">
   <button class="nav" onclick="shiftDay(1)">›</button>
   <button class="nav" onclick="goToday()" style="width:auto;padding:0 13px;font-size:13px" data-i="btnToday"></button>
  </div>
  <div class="dsum" id="dsum"></div>
 </div>

 <div class="mask" id="mRep" onclick="maskClick(event,'rep')">
  <div class="sheet">
   <div class="shd">
    <h2 class="ft" data-i="ftit"></h2>
    <button class="x" onclick="closeM('rep')">✕</button>
   </div>
   <div class="sbd">

   <label class="req" data-i="lTime"></label>
   <div class="dtrow">
    <input id="f_date" type="date" onchange="dateChg()">
    <input id="f_time" type="time">
   </div>
   <div class="hint" data-i="hDT"></div>

   <label class="req" data-i="lReporter"></label>
   <div class="opts" id="opReporter"></div>
   <input id="f_reporterOther" style="margin-top:7px;display:none" data-p="pOther">

   <label data-i="lProject"></label>
   <input id="f_project">

   <label data-i="lCon"></label>
   <select id="f_con"></select>
   <input id="f_conOther" style="margin-top:7px;display:none" data-p="pOther">
   <div class="hint" data-i="hCon"></div>

   <label class="req" data-i="lHaz"></label>
   <select id="f_haz"></select>
   <input id="f_hazOther" style="margin-top:7px;display:none" data-p="pOther">
   <div class="hint" data-i="hHaz"></div>

   <label class="req" data-i="lObs"></label>
   <textarea id="f_obsZh" data-p="pObs"></textarea>
   <label data-i="lObsEn"></label>
   <textarea id="f_obsEn" data-p="pAuto" style="height:60px"></textarea>

   <label class="req" data-i="lRec"></label>
   <textarea id="f_recZh" data-p="pRec"></textarea>
   <label data-i="lRecEn"></label>
   <textarea id="f_recEn" data-p="pAuto" style="height:60px"></textarea>

   <label data-i="lAction"></label>
   <select id="f_action"></select>
   <input id="f_actionOther" style="margin-top:7px;display:none" data-p="pOther">

   <label data-i="lRisk"></label>
   <div class="risks">
    <div class="risk" id="rP1" onclick="pick('P1')">P1<small data-i="rP1"></small></div>
    <div class="risk" id="rP2" onclick="pick('P2')">P2<small data-i="rP2"></small></div>
    <div class="risk" id="rP3" onclick="pick('P3')">P3<small data-i="rP3"></small></div>
   </div>

   <label data-i="lTarget"></label>
   <input id="f_target" type="date">
   <div class="hint" id="hTarget"></div>

   <label data-i="lPhoto"></label>
   <input id="fp" type="file" accept="image/*" multiple onchange="addPhotos(this.files)">
   <div class="thumbs" id="th"></div>

   <div style="height:14px"></div>
   <button class="btn" id="send" onclick="submit0()" style="margin-bottom:0"></button>
   <button class="btn btn2" id="cancelEdit" onclick="cancelEdit0()" style="margin:9px 0 0;display:none"></button>
   </div>
  </div>
 </div>

 <div id="list"><div class="muted" data-i="lding"></div></div>

 <div class="mask" id="mExp" onclick="maskClick(event,'exp')">
  <div class="sheet">
   <div class="shd">
    <h2 class="ft" data-i="etit"></h2>
    <button class="x" onclick="closeM('exp')">✕</button>
   </div>
   <div class="sbd">
  <div class="tiny" data-i="eHint" style="margin:8px 0 10px"></div>
  <label data-i="eDate"></label>
  <input id="expDt" type="date" onchange="expTouch()">
  <select id="expPick" onchange="expPickSel()" style="margin-top:7px"></select>
  <div class="hint" id="expCnt"></div>
  <div style="height:13px"></div>
  <button class="btn btn3" id="expBtn" onclick="buildReport()"></button>
  <div class="out" id="expOut"></div>
   </div>
  </div>
 </div>

 <div class="mask" id="mStat" onclick="maskClick(event,'stat')">
  <div class="sheet">
   <div class="shd">
    <h2 class="ft" data-i="stit"></h2>
    <button class="x" onclick="closeM('stat')">✕</button>
   </div>
   <div class="sbd">
  <div class="tiny" data-i="sHint" style="margin:8px 0 10px"></div>
  <div class="dtrow">
   <input id="sFrom" type="date" onchange="statRun(0)">
   <input id="sTo" type="date" onchange="statRun(0)">
  </div>
  <div class="qk">
   <button id="q_m" onclick="statQuick('m')" data-i="sQm"></button>
   <button id="q_30" onclick="statQuick('30')" data-i="sQ30"></button>
   <button id="q_all" onclick="statQuick('all')" data-i="sQall"></button>
  </div>
  <div id="statOut"></div>
   </div>
  </div>
 </div>

 <div class="mask" id="mCfg" onclick="maskClick(event,'cfg')">
  <div class="sheet">

/* ---------- 日期 ---------- */
function fmt(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function shiftDay(n){var v=$("dt").value||TODAY;var d=new Date(v+"T00:00:00");d.setDate(d.getDate()+n);$("dt").value=fmt(d);load()}
function goToday(){$("dt").value=TODAY||fmt(new Date());load()}
function addDays(v,n){var d=new Date(v+"T00:00:00");d.setDate(d.getDate()+n);return fmt(d)}
function dayDiff(a,b){return Math.round((new Date(a+"T00:00:00")-new Date(b+"T00:00:00"))/86400000)}

/* ---------- 載入 ---------- */
function load(){
 $("list").innerHTML='<div class="muted">'+esc(t("lding"))+'</div>';
 google.script.run.withSuccessHandler(function(r){
  if(!r||!r.ok){$("list").innerHTML='<div class="muted">'+esc(t("lfail"))+'</div>';return}
  TODAY=r.today; if(!$("dt").value)$("dt").value=r.date;
  // 表單沒開也不在編輯中時，讓新增用的巡查日跟著上面切換的日期走。
  if(!EDIT&&!isOpen("rep"))$("f_date").value=$("dt").value||TODAY;
  CFG=r.config; COUNTS=r.counts; DATA=r.records; DATES=r.dates||[];
  buildOptions(); buildDateOpts(); fillCfgForm(); paint();
 }).withFailureHandler(function(e){
  $("list").innerHTML='<div class="muted">'+esc(t("lfail"))+'<br><small>'+esc(e&&e.message||e)+'</small></div>';
 }).hseBoot(KEY,$("dt").value||"");
}

function flt(f){
 FILTER=(FILTER===f)?"":f;
 document.querySelectorAll(".kpi").forEach(function(el,i){
  var k=["","Open","Closed","overdue"][i];
  el.classList.toggle("act", k===FILTER || (FILTER===""&&i===0));
 });
 paint();
}

/* ---------- 下拉與選項 ---------- */
function buildOptions(){
 if(!CFG)return;
 var rp="";try{rp=localStorage.getItem("HSEWT_RP")||""}catch(e){}

 var or=$("opReporter");
 if(!or.dataset.built||or.dataset.sig!==CFG.members.join("|")){
  or.dataset.sig=CFG.members.join("|");or.dataset.built="1";or.innerHTML="";
  CFG.members.concat([REP_OTHER]).forEach(function(m){
   var d=document.createElement("div");d.className="opt";d.dataset.v=m;
   d.textContent=(m===REP_OTHER?t("other"):m);
   d.onclick=function(){pickReporter(m)};or.appendChild(d);
  });
  if(rp)pickReporter(CFG.members.indexOf(rp)>=0?rp:REP_OTHER,rp);
 }

 fillSel("f_con",CFG.contractors,true);
 fillSel("f_haz",CFG.hazards,true);
 fillSel("f_action",CFG.actionBy,true);
 if(!$("f_project").value)$("f_project").value=CFG.project||"";
}

function fillSel(id,list,withOther){
 var s=$(id),cur=s.value,sig=list.join("|");
 if(s.dataset.sig===sig)return;
 s.dataset.sig=sig;s.innerHTML="";
 var o0=document.createElement("option");o0.value="";o0.textContent="—";s.appendChild(o0);
 list.forEach(function(v){var o=document.createElement("option");o.value=v;o.textContent=v;s.appendChild(o)});
 if(withOther){var oo=document.createElement("option");oo.value=REP_OTHER;oo.textContent=t("other");s.appendChild(oo)}
 if(cur)s.value=cur;
 s.onchange=function(){
  var ot=$(id+"Other");
  if(ot)ot.style.display=(s.value===REP_OTHER)?"block":"none";
 };
}

function pickReporter(v,other){
 $("opReporter").querySelectorAll(".opt").forEach(function(d){d.classList.toggle("on",d.dataset.v===v)});
 var oi=$("f_reporterOther");
 oi.style.display=(v===REP_OTHER)?"block":"none";
 if(other!==undefined&&v===REP_OTHER)oi.value=other;
 if(v!==REP_OTHER)oi.value="";
}
function getReporter(){
 var on=$("opReporter").querySelector(".opt.on");
 if(!on)return "";
 return on.dataset.v===REP_OTHER?$("f_reporterOther").value.trim():on.dataset.v;
}

/** 新增表單的預設巡查日＝目前瀏覽的那一天（一開始就是今天）。 */

/** 改了巡查日期就重算預定完成日（＝巡查日＋風險天數）。 */
function dateChg(){
 if(RISK&&CFG){

function pick(r){
 RISK=RISK===r?"":r;
 ["P1","P2","P3"].forEach(function(x){$("r"+x).className="risk"+(RISK===x?" on-"+x:"")});
 if(RISK&&CFG){

 }

function autoTr(srcId,dstId){
 var src=$(srcId),dst=$(dstId);
 var z=src.value.trim();
 if(!z||z===src.dataset.last)return;
 src.dataset.last=z;
 if(dst.value.trim()&&dst.dataset.auto!=="1")return;
 TRB++;dst.value="";dst.placeholder=t("trBusy");
 google.script.run.withSuccessHandler(function(r){
  TRB--;dst.placeholder=t("pAuto");
  if(r&&r.ok){dst.value=r.text||"";dst.dataset.auto="1"}
 }).withFailureHandler(function(){TRB--;dst.placeholder=t("pAuto")})
  .hseTranslate(KEY,z,"zh-TW","en");
}

/* ---------- 照片 ---------- */
function compress(f,cb){
 var rd=new FileReader();
 rd.onload=function(){
  var img=new Image();
  img.onload=function(){
   try{
    var mx=1400,w=img.width,h=img.height,r=Math.min(1,mx/Math.max(w,h));
    var cv=document.createElement("canvas");cv.width=Math.round(w*r);cv.height=Math.round(h*r);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    var du=cv.toDataURL("image/jpeg",0.8).split(",")[1];
    if(!du)throw new Error("empty");
    cb(du);
   }catch(e){cb(null)}
  };
  img.onerror=function(){cb(null)};
  img.src=rd.result;
 };
 rd.onerror=function(){cb(null)};
 rd.readAsDataURL(f);
}

 var room=6-PH.length;
 if(arr.length>room){toast(t("phMax"));if(room<1){$("fp").value="";return}arr=arr.slice(0,room)}
 arr.forEach(function(f){
  var o={data:null,w:null,url:""};
  var dv=document.createElement("div");dv.className="thw";o.w=dv;
  var im=document.createElement("img");try{o.url=URL.createObjectURL(f);im.src=o.url}catch(e){}
  var x=document.createElement("span");x.className="thx";x.textContent="✕";
  x.onclick=function(){phDel(o)};
  dv.appendChild(im);dv.appendChild(x);$("th").appendChild(dv);PH.push(o);
  PBUSY++;
  compress(f,function(d){PBUSY--;if(!d){toast(t("rdFail"));phDel(o);return}o.data=d});
 });
 $("fp").value="";
}
function phDel(o){
 var i=PH.indexOf(o);if(i>=0)PH.splice(i,1);
 if(o.url)try{URL.revokeObjectURL(o.url)}catch(e){}
 if(o.w&&o.w.parentNode)o.w.parentNode.removeChild(o.w);
}

/* ---------- 送出 ---------- */
function submit0(retry){
 if(BUSY&&!retry)return;
 var miss=[];
 var reporter=getReporter(), obs=$("f_obsZh").value.trim(), rec=$("f_recZh").value.trim();
 if(!reporter)miss.push("opReporter");
 if(!selVal("f_haz"))miss.push("f_haz");   // 統計要靠這欄，所以設成必填
 if(!obs)miss.push("f_obsZh");
 if(!rec)miss.push("f_recZh");
 if(miss.length){
  miss.forEach(function(id){var el=$(id);if(el&&el.classList)el.classList.add("err")});
  toast(t("need"));$(miss[0]).scrollIntoView({behavior:"smooth",block:"center"});return;
 }
 BUSY=1;$("send").disabled=true;
 if(PBUSY>0){$("send").textContent=t("busy");setTimeout(function(){submit0(1)},500);return}
 if(TRB>0){$("send").textContent=t("trBusy");setTimeout(function(){submit0(1)},500);return}
 $("send").textContent=t("up");

 try{localStorage.setItem("HSEWT_RP",reporter)}catch(e){}

 var pay={
  id:EDIT||"",
  date:$("f_date").value||curDate(),
  time:$("f_time").value||nowHM(),
  reporter:reporter,
  members:getMembers(),
  project:$("f_project").value.trim(),
  contractor:selVal("f_con"),
  hazard:selVal("f_haz"),
  obsZh:obs, obsEn:$("f_obsEn").value.trim(),
  recZh:rec, recEn:$("f_recEn").value.trim(),
  actionBy:selVal("f_action"),
  risk:RISK,
  targetDate:$("f_target").value,
  photos:PH.filter(function(p){return p.data}).map(function(p){return {data:p.data}})
 };
 if(EDIT){
  var cur=DATA.filter(function(x){return x.id===EDIT})[0];
  if(cur){pay.status=cur.status;pay.closeOutDate=cur.closeOutDate}
 }
 google.script.run.withSuccessHandler(function(r){
  BUSY=0;$("send").disabled=false;$("send").textContent=t(EDIT?"save":"send");
  if(!r||!r.ok){toast(t("fail")+((r&&r.error)||"?"));return}
  // 存到別天時把清單跳過去，不然剛填的那筆會看不見。
  if(pay.date&&pay.date!==$("dt").value)$("dt").value=pay.date;
  toast(t("okSave"));resetForm();closeM("rep");load();
 }).withFailureHandler(function(e){
  BUSY=0;$("send").disabled=false;$("send").textContent=t(EDIT?"save":"send");
  toast(t("fail")+(e&&e.message||e));
 }).hseSave(KEY,pay);
}

function resetForm(){
 EDIT="";RISK="";PH=[];PBUSY=0;
 ["f_obsZh","f_obsEn","f_recZh","f_recEn","f_conOther","f_hazOther","f_actionOther"].forEach(function(id){
  var e=$(id);if(e){e.value="";e.dataset.auto="";e.dataset.last=""}});
 $("f_target").value="";$("th").innerHTML="";
 ["P1","P2","P3"].forEach(function(x){$("r"+x).className="risk"});
 $("f_con").value="";$("f_haz").value="";$("f_action").value="";
 ["f_conOther","f_hazOther","f_actionOther"].forEach(function(id){$(id).style.display="none"});
 $("f_time").value=nowHM();
 $("f_date").value=curDate();
 $("cancelEdit").style.display="none";
 $("send").textContent=t("send");
 document.querySelectorAll(".err").forEach(function(e){e.classList.remove("err")});
 updTargetHint();
}

function editRec(id){
 var x=DATA.filter(function(r){return r.id===id})[0];if(!x)return;
 EDIT=id;
 openM("rep");
 $("f_time").value=x.time||nowHM();
 $("f_date").value=x.date||curDate();
 pickReporter(CFG.members.indexOf(x.reporter)>=0?x.reporter:REP_OTHER,x.reporter);
 $("f_project").value=x.project||"";
 setSel("f_con",x.contractor);
 setSel("f_haz",x.hazard);
 $("f_obsZh").value=x.obsZh;$("f_obsEn").value=x.obsEn;
 $("f_recZh").value=x.recZh;$("f_recEn").value=x.recEn;
 $("f_obsZh").dataset.last=x.obsZh;$("f_recZh").dataset.last=x.recZh;
 setSel("f_action",x.actionBy);
 RISK=x.risk||"";["P1","P2","P3"].forEach(function(p){$("r"+p).className="risk"+(RISK===p?" on-"+p:"")});
 $("f_target").value=x.targetDate||"";
 PH=[];$("th").innerHTML="";
 $("cancelEdit").style.display="block";
 $("send").textContent=t("save");
 updTargetHint();
}
function setSel(id,v){
 var s=$(id),ot=$(id+"Other");
 var found=false;
 for(var i=0;i<s.options.length;i++)if(s.options[i].value===v){found=true;break}
 if(v&&!found){s.value=REP_OTHER;ot.value=v;ot.style.display="block"}
 else{s.value=v||"";ot.value="";ot.style.display="none"}
}

/* ---------- 清單 ---------- */
function paint(){
 applyLangStatic();
 $("k0").textContent=COUNTS.total||0;
 $("k1").textContent=COUNTS.open||0;
 $("k2").textContent=COUNTS.closed||0;
 $("k3").textContent=COUNTS.overdue||0;

 var list=DATA.slice();
 if(FILTER==="overdue")list=list.filter(function(x){return x.status!=="Closed"&&x.targetDate&&x.targetDate<TODAY});
 else if(FILTER)list=list.filter(function(x){return x.status===FILTER});

 $("dsum").textContent=t("dsum1")+DATA.length+t("dsum2")+(FILTER?"（"+list.length+"）":"");
 updExpBtn();

 if(!list.length){
  $("list").innerHTML='<div class="muted"><b>'+esc(t("nodata"))+'</b><br>'+esc(t("nodataH"))+'</div>';
  return;
 }
 var h="";
 list.forEach(function(x){
  h+=card(x);
 });
 $("list").innerHTML=h;
}
function applyLangStatic(){
 document.querySelectorAll("[data-i]").forEach(function(el){el.textContent=t(el.getAttribute("data-i"))});
}

function card(x){
 var st=x.status||"Open";
 var tags="";
 if(x.hazard)tags+='<span class="tag hz">'+esc(x.hazard)+'</span>';
 if(x.actionBy)tags+='<span class="tag">'+esc(t("tAction")+x.actionBy)+'</span>';
 if(x.contractor)tags+='<span class="tag">'+esc(t("tCon")+x.contractor)+'</span>';
 if(x.targetDate){
  var cls="tag",txt=t("tTarget")+x.targetDate;
  if(st!=="Closed"){
   var d=dayDiff(x.targetDate,TODAY);
   if(d<0){cls="tag over";txt=t("over1")+(-d)+t("over2")+"（"+x.targetDate+"）"}
   else if(d===0){cls="tag soon";txt=t("dueToday")}
   else if(d===1){cls="tag soon";txt=t("dueTmr")}
  }
  tags+='<span class="'+cls+'">'+esc(txt)+'</span>';
 }
 // 已結案的紀錄，結案日期直接做成可以點的日期欄，隨時改
 if(st==="Closed")
  tags+='<span class="tag cl">'+esc(t("tClose"))+
   '<input type="date" class="cdt" value="'+esc(x.closeOutDate||TODAY)+
   '" onchange="setClose(\''+x.id+'\',this.value)"></span>';

 var before=x.photos.filter(function(p){return p.kind==="before"});
 var after=x.photos.filter(function(p){return p.kind==="after"});
 var ph="";
 if(before.length||after.length){
  ph='<div class="ph">';
  before.forEach(function(p){ph+=thumb(p,"b",t("bB"))});
  after.forEach(function(p){ph+=thumb(p,"a",t("bA"))});
  ph+='</div>';
 }

 return '<div class="card it '+st+'">'+
  '<div class="row1"><span class="sn">#'+x.sn+'　<span style="font-weight:600;color:#6b7784">'+esc(x.time||"")+'　'+esc(t("tBy")+x.reporter)+'</span></span>'+
  '<span class="pill '+st+'">'+esc(t("s"+st))+'</span></div>'+
  '<div class="lbl">'+esc(t("tObs"))+'</div>'+
  '<div class="zh">'+esc(x.obsZh)+'</div>'+(x.obsEn?'<div class="en">'+esc(x.obsEn)+'</div>':'')+
  '<div class="lbl">'+esc(t("tRec"))+'</div>'+
  '<div class="zh">'+esc(x.recZh)+'</div>'+(x.recEn?'<div class="en">'+esc(x.recEn)+'</div>':'')+
  '<div class="tags">'+tags+'</div>'+ph+
  '<div class="acts">'+
   '<button class="abtn" onclick="afPick(\''+x.id+'\')">'+esc(t("aAfter"))+'</button>'+
   (st==="Closed"
     ? '<button class="abtn n" onclick="setSt(\''+x.id+'\',\'Open\')">'+esc(t("aReopen"))+'</button>'
     : '<button class="abtn" onclick="closeOut(\''+x.id+'\')">'+esc(t("aClose"))+'</button>')+
   '<button class="abtn n" onclick="editRec(\''+x.id+'\')">'+esc(t("aEdit"))+'</button>'+
   '<button class="abtn d" onclick="delRec(\''+x.id+'\')">'+esc(t("aDel"))+'</button>'+
  '</div></div>';
}
function thumb(p,cls,label){
 return '<div class="phw"><span class="pb '+cls+'">'+esc(label)+'</span>'+
  '<img src="'+esc(p.url)+'" loading="lazy" onclick="lbShow(\''+esc(p.url)+'\',\''+esc(p.open)+'\')" '+
  'onerror="this.style.opacity=.35">'+
  '<span class="thx" onclick="event.stopPropagation();delPhoto(\''+p.id+'\')">✕</span></div>';
}

function lbShow(u,o){$("lbi").src=u;$("lba").href=o;$("lbx").style.display="flex"}
function lbHide(){$("lbx").style.display="none";$("lbi").src=""}

/* ---------- 危害統計 ---------- */
var SQ="";   // 目前按著的快捷鍵，手動改日期就清掉

function statQuick(k){
 SQ=k;
 var td=TODAY||fmt(new Date());
 if(k==="all"){$("sFrom").value="";$("sTo").value=""}
 else if(k==="m"){$("sFrom").value=td.slice(0,8)+"01";$("sTo").value=td}
 else{$("sFrom").value=addDays(td,-29);$("sTo").value=td}
 statRun(1);
}

function statRun(keepQuick){
 if(!keepQuick)SQ="";
 ["m","30","all"].forEach(function(k){$("q_"+k).classList.toggle("on",SQ===k)});
 $("statOut").innerHTML='<div class="muted">'+esc(t("lding"))+'</div>';
 google.script.run.withSuccessHandler(function(r){
  if(!r||!r.ok){$("statOut").innerHTML='<div class="muted">'+esc(t("lfail"))+'</div>';return}
  statPaint(r);
 }).withFailureHandler(function(e){
  $("statOut").innerHTML='<div class="muted">'+esc(t("lfail"))+'<br><small>'+esc(e&&e.message||e)+'</small></div>';
 }).hseStats(KEY,$("sFrom").value||"",$("sTo").value||"");
}

function statPaint(r){
 if(!r.totals.total){$("statOut").innerHTML='<div class="muted">'+esc(t("sNone"))+'</div>';return}
 var h='<div class="stot"><div><b>'+r.totals.total+'</b><span>'+esc(t("sAll"))+'</span></div>'+
  '<div class="o"><b>'+r.totals.open+'</b><span>'+esc(t("kOpen"))+'</span></div>'+
  '<div class="c"><b>'+r.totals.closed+'</b><span>'+esc(t("kClosed"))+'</span></div></div>';
 if(r.first)h+='<div class="hint">'+esc(t("sSpan")+r.first+" ~ "+r.last)+'</div>';

 var max=r.rows[0]?r.rows[0].total:1;
 r.rows.forEach(function(x){
  var name=x.hazard==="__none__"?t("sUncat"):x.hazard;
  var pc=Math.max(4,Math.round(x.total/max*100));
  // 一條橫條裡用兩段顏色表示開放中與已結案的比例
  var op=Math.round(x.open/x.total*100);
  h+='<div class="srow"><div class="sl"><span>'+esc(name)+'</span>'+
   '<span class="sn2">'+x.total+' <span class="sm">('+x.open+'/'+x.closed+')</span></span></div>'+
   '<div class="bar" style="width:'+pc+'%"><i class="o" style="width:'+op+'%"></i>'+
   '<i class="c" style="width:'+(100-op)+'%"></i></div></div>';
 });
 h+='<div class="hint" style="margin-top:12px">'+esc(t("sLegend"))+'</div>';
 $("statOut").innerHTML=h;
}

/* ---------- 動作 ---------- */
function afPick(id){AFID=id;$("af").value="";$("af").click()}
function afAdd(fs){
 var arr=Array.prototype.slice.call(fs).slice(0,6);
 if(!arr.length||!AFID)return;
 var out=[],left=arr.length;
 toast(t("up"));
 arr.forEach(function(f){
  compress(f,function(d){
   if(d)out.push({data:d});
   if(--left===0){
    if(!out.length){toast(t("rdFail"));return}
    google.script.run.withSuccessHandler(function(r){
     // 後端貼完改善後照片會自動結案，回傳 closed 就提示一下結案日期可以改
     if(r&&r.ok){toast(t(r.closed?"okPhotoClosed":"okPhoto"));load()}
     else toast(t("fail")+((r&&r.error)||"?"));
    }).withFailureHandler(function(e){toast(t("fail")+(e&&e.message||e))})
     .hseAddPhotos(KEY,AFID,out,"after");
   }
  });
 });
}
/** 沒有照片也可以手動結案；日期先給今天，卡片上再改。 */
function closeOut(id){
 if(!confirm(t("cfmClose")))return;
 setSt(id,"Closed",TODAY);
}
/** 改結案日期：狀態不動，只換日期。 */
function setClose(id,v){
 if(!v)return;
 setSt(id,"Closed",v);
}
function setSt(id,st,cd){
 google.script.run.withSuccessHandler(function(r){
  if(r&&r.ok){toast(t("okSave"));load()}else toast(t("fail")+((r&&r.error)||"?"));
 }).withFailureHandler(function(e){toast(t("fail")+(e&&e.message||e))})
  .hseSetStatus(KEY,id,st,cd||"");
}
function delRec(id){
 if(!confirm(t("cfmDel")))return;
 google.script.run.withSuccessHandler(function(r){
  if(r&&r.ok){toast(t("okDel"));load()}else toast(t("fail")+((r&&r.error)||"?"));
 }).withFailureHandler(function(e){toast(t("fail")+(e&&e.message||e))}).hseDelete(KEY,id);
}
function delPhoto(pid){
 if(!confirm(t("cfmPDel")))return;
 google.script.run.withSuccessHandler(function(r){
  if(r&&r.ok){toast(t("okDel"));load()}else toast(t("fail")+((r&&r.error)||"?"));
 }).withFailureHandler(function(e){toast(t("fail")+(e&&e.message||e))}).hseDeletePhoto(KEY,pid);
}

/* ---------- 匯出 ---------- */
function expTouch(){EXPTOUCH=1;$("expOut").innerHTML="";updExpBtn()}
function expPickSel(){
 var v=$("expPick").value;
 if(v){$("expDt").value=v;expTouch()}
 $("expPick").value="";
}
function buildDateOpts(){
 var s=$("expPick"),sig=LG+"|"+DATES.map(function(d){return d.date+":"+d.n}).join(",");
 if(s.dataset.sig===sig)return;
 s.dataset.sig=sig;s.innerHTML="";
 var o0=document.createElement("option");o0.value="";o0.textContent=t("ePick");s.appendChild(o0);
 DATES.forEach(function(d){
  var o=document.createElement("option");o.value=d.date;
  o.textContent=d.date+"　("+d.n+")";s.appendChild(o);
 });
}
function dayCount(d){var n=0;DATES.forEach(function(x){if(x.date===d)n=x.n});return n}
function updExpBtn(){
 var b=$("expBtn");if(!b)return;
 if(!EXPTOUCH)$("expDt").value=$("dt").value||TODAY;
 var d=$("expDt").value||TODAY,n=dayCount(d);
 b.textContent=t("eBtn1")+d+t("eBtn2");
 b.disabled=!n;
 $("expCnt").textContent=n?(t("eCnt1")+n+t("eCnt2")):t("eCnt0");
}
function buildReport(){
 var d=$("expDt").value||TODAY;
 if(!dayCount(d)){toast(t("eNone"));return}
 var b=$("expBtn");b.disabled=true;b.textContent=t("eBusy");
 $("expOut").innerHTML="";
 google.script.run.withSuccessHandler(function(r){
  updExpBtn();
  if(!r||!r.ok){toast(t("fail")+((r&&r.error)||"?"));return}
  toast(t("eOk"));
  $("expOut").innerHTML=
   '<a class="p" href="'+esc(r.pdfUrl)+'" target="_blank">'+esc(t("ePdf"))+'</a>'+
   (r.docxDownload?'<a class="w" href="'+esc(r.docxDownload)+'" target="_blank">'+esc(t("eDocx"))+'</a>':'')+
   '<a class="g" href="'+esc(r.docUrl)+'" target="_blank">'+esc(t("eDoc"))+'</a>';
 }).withFailureHandler(function(e){
  updExpBtn();toast(t("fail")+(e&&e.message||e));
 }).hseBuildReport(KEY,d);
}

/* ---------- 設定 ---------- */
function fillCfgForm(){
 if(!CFG)return;
 if($("c_members").dataset.filled)return;
 $("c_members").dataset.filled="1";
 $("c_members").value=(CFG.members||[]).join("\n");
 $("c_actionBy").value=(CFG.actionBy||[]).join("\n");
 $("c_contractors").value=(CFG.contractors||[]).join("\n");
 $("c_hazards").value=(CFG.hazards||[]).join("\n");
 $("c_project").value=CFG.project||"";
 $("c_d1").value=(CFG.riskDays&&CFG.riskDays.P1)||3;
 $("c_d2").value=(CFG.riskDays&&CFG.riskDays.P2)||7;
 $("c_d3").value=(CFG.riskDays&&CFG.riskDays.P3)||14;
 $("c_hseRep").value=CFG.hseRep||"";
 $("c_sectionRep").value=CFG.sectionRep||"";
}
function lines(id){return $(id).value.split("\n").map(function(s){return s.trim()}).filter(String)}
function saveCfg(){
 var obj={
  members:lines("c_members"),
  actionBy:lines("c_actionBy"),
  contractors:lines("c_contractors"),
  hazards:lines("c_hazards"),
  project:$("c_project").value.trim(),
  riskDays:{P1:+$("c_d1").value||3,P2:+$("c_d2").value||7,P3:+$("c_d3").value||14},
  hseRep:$("c_hseRep").value.trim(),
  sectionRep:$("c_sectionRep").value.trim()
 };
 google.script.run.withSuccessHandler(function(r){
  if(r&&r.ok){CFG=r.config;$("c_members").dataset.filled="";
   $("opReporter").dataset.built="";
   $("f_con").dataset.sig="";$("f_haz").dataset.sig="";$("f_action").dataset.sig="";
   buildOptions();fillCfgForm();toast(t("okSave"))}
  else toast(t("fail")+((r&&r.error)||"?"));
 }).withFailureHandler(function(e){toast(t("fail")+(e&&e.message||e))}).hseSaveConfig(KEY,obj);
}
