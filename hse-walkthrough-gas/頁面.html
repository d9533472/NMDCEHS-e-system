<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
body{font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif;color:#1c2732;
 background:linear-gradient(180deg,#fafcfe 0,#f4f7fa 260px,#f3f6f9 560px);
 padding-bottom:48px;-webkit-font-smoothing:antialiased}

/* 手機：標題一行、三顆功能鍵折到第二行；桌機：全部擠在同一行 */
.hd{padding:13px 16px;background:linear-gradient(180deg,#fff,#f7fafc);position:sticky;top:0;z-index:9;
 display:flex;flex-wrap:wrap;align-items:center;gap:9px;
 box-shadow:0 2px 12px rgba(16,42,67,.10);
 border-bottom:4px solid transparent;border-image:linear-gradient(90deg,#002038,#00B050,#002038) 1}
.hdl{display:flex;align-items:center;gap:11px;min-width:0;flex:1 1 auto;order:0}
.hd h1{font-size:17px;font-weight:800;letter-spacing:.6px;color:#002038}
.hd small{color:#7d8ea0;font-size:10px;letter-spacing:1px;display:block;margin-top:1px}
.lgo{width:74px;height:25px;flex:0 0 auto;display:block}
.lg{order:2;flex:0 0 auto;background:#eef3f8;border:1px solid #d3dde8;color:#16324f;
 border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.hdr{order:3;flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ico{flex:1 1 auto;min-width:0;height:40px;padding:0 10px;border-radius:12px;border:1px solid #d3dde8;
 background:#eef3f8;color:#16324f;cursor:pointer;
 display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s}
.ico span{font-size:15px;line-height:1}
.ico em{font-style:normal;font-size:12.5px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.ico:active{transform:scale(.97)}
.ico.p{background:linear-gradient(135deg,#002038,#00B050);border-color:#002038;color:#fff;
 box-shadow:0 3px 10px rgba(0,32,56,.28)}
@media(min-width:680px){
 .hdr{order:1;flex:0 0 auto;margin-left:auto}
 .ico{flex:0 0 auto}
}

/* 浮動視窗：手機從下往上推，桌機置中 */
.mask{position:fixed;inset:0;z-index:40;display:none;background:rgba(10,22,35,.45);
 align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-width:660px;max-height:92vh;border-radius:20px 20px 0 0;
 display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(16,24,40,.28);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
.shd{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:14px 16px 11px;
 border-bottom:1px solid #eef1f4}
.shd .ft{flex:1;margin:0;padding:0;border:0}
.x{flex:0 0 auto;width:34px;height:34px;padding:0;border-radius:11px;border:1px solid #e3e9f0;
 background:#f5f8fb;color:#56657a;font-size:15px;font-weight:700;cursor:pointer}
.sbd{padding:2px 16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media(min-width:680px){
 .mask{align-items:center;padding:20px}
 .sheet{border-radius:20px}
}

.wrap{padding:14px;max-width:660px;margin:0 auto}
.card{background:#fff;border-radius:18px;padding:15px 16px;margin-bottom:11px;border:1px solid #e8ecf1;
 box-shadow:0 1px 3px rgba(16,24,40,.04),0 8px 20px rgba(16,24,40,.05)}
.ft{font-size:15px;font-weight:800;color:#16324f;margin:0 0 9px;padding-bottom:9px;
 border-bottom:1px solid #eef1f4;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.ft::before{content:"";width:5px;height:18px;border-radius:2px;background:linear-gradient(180deg,#002038,#00B050)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:18px;padding:12px 4px 10px;text-align:center;cursor:pointer;
 box-shadow:0 1px 3px rgba(16,24,40,.04),0 6px 16px rgba(16,24,40,.05);transition:transform .1s,box-shadow .15s}
.kpi:active{transform:scale(.96)}
.kpi b{display:block;font-size:26px;font-weight:900;line-height:1.15}
.kpi span{font-size:10.5px;font-weight:700;letter-spacing:.4px;color:#77808c;display:block;margin-top:2px}
.kpi.k0{background:linear-gradient(180deg,#fcfdff,#f5f9fd);border:1px solid #e7eef5}.kpi.k0 b{color:#1b3a5c}
.kpi.k1{background:linear-gradient(180deg,#fffef9,#fdf8ec);border:1px solid #f4ecd9}.kpi.k1 b{color:#c07a18}
.kpi.k2{background:linear-gradient(180deg,#fbfdfc,#f2f9f4);border:1px solid #e3f0e8}.kpi.k2 b{color:#1b6e3c}
.kpi.k3{background:linear-gradient(180deg,#fffbfb,#fdf4f4);border:1px solid #f7e7e7}.kpi.k3 b{color:#c62828}
.kpi.act{box-shadow:0 0 0 2.5px #1b3a5c,0 8px 24px rgba(16,24,40,.10)}

.dbar{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.dbar input[type=date]{flex:1;text-align:center;font-weight:700;color:#16324f}
.dtrow{display:flex;gap:8px}
.dtrow input{flex:1;min-width:0}
.dtrow input[type=time]{flex:0 0 40%}
.nav{flex:0 0 auto;width:42px;height:44px;border-radius:13px;border:0;background:#fff;color:#16324f;
 font-size:18px;font-weight:800;box-shadow:0 1px 3px rgba(16,24,40,.08);cursor:pointer}
.nav:active{transform:scale(.95)}
.kpi.k1.act{box-shadow:0 0 0 2.5px #c07a18,0 8px 24px rgba(16,24,40,.10)}
.kpi.k2.act{box-shadow:0 0 0 2.5px #1b6e3c,0 8px 24px rgba(16,24,40,.10)}
.kpi.k3.act{box-shadow:0 0 0 2.5px #c62828,0 8px 24px rgba(16,24,40,.10)}

/* 日期按鈕＋自製日曆（每天格子裡顯示筆數） */
.dsel{flex:1;min-width:0;height:44px;border-radius:13px;border:0;background:#fff;color:#16324f;font-family:inherit;
 font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
 box-shadow:0 1px 3px rgba(16,24,40,.08);font-variant-numeric:tabular-nums}
.dsel i{font-style:normal;font-size:11px;color:#8a97a5}
.dsel.on{box-shadow:0 0 0 2px #00B050,0 1px 3px rgba(16,24,40,.08)}
.cal{display:none;background:#fff;border-radius:18px;border:1px solid #e3e9f0;margin:-3px 0 11px;padding:11px 11px 9px;
 box-shadow:0 14px 34px rgba(16,24,40,.14);animation:up .15s ease-out}
.cal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.cal .mh button{width:36px;height:34px;border-radius:10px;border:0;background:#f5f8fb;color:#16324f;font-size:17px;font-weight:900;cursor:pointer}
.cal .mh div{text-align:center}
.cal .mh b{display:block;font-size:15px;color:#002038}
.cal .mh small{font-size:11px;color:#8a97a5;font-weight:700}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wk span{font-size:10.5px;font-weight:800;color:#8a97a5;text-align:center;padding:2px 0}
.wk span:first-child,.wk span:last-child{color:#c28a8a}
.dc{height:48px;border-radius:10px;border:0;background:none;cursor:pointer;font-family:inherit;padding:5px 0 0;
 display:flex;flex-direction:column;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.dc b{font-size:13px;font-weight:700;color:#38475a;line-height:1}
.dc.o b{color:#c3ccd5}
.dc i{font-style:normal;font-size:10.5px;font-weight:900;line-height:1;min-width:20px;text-align:center;border-radius:999px;padding:2px 5px}
.dc i.a{background:#fff3df;color:#c07a18}
.dc i.c{background:#e2f2e6;color:#1b6e3c}
.dc.today{box-shadow:inset 0 0 0 1.5px #bfe5cd}
.dc.today b{color:#1b6e3c;font-weight:900}
.dc.sel{background:#002038}
.dc.sel b{color:#fff}
.dc.sel i{background:#fff;color:#002038}
.leg{display:flex;gap:12px;justify-content:center;margin-top:8px;font-size:11px;color:#6b7784;font-weight:700}
.leg i{display:inline-block;width:15px;height:10px;border-radius:999px;vertical-align:-1px;margin-right:4px}
@media(hover:hover){.dc:hover{background:#f2f6fa}.dc.sel:hover{background:#002038}}

/* 當天摘要卡 */
.dsum{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid #e8ecf1;border-radius:16px;
 padding:11px 14px;margin:0 0 11px;box-shadow:0 1px 3px rgba(16,24,40,.04)}
.dsum .big{font-size:27px;font-weight:900;color:#002038;line-height:1;font-variant-numeric:tabular-nums;text-align:center;min-width:52px}
.dsum .big small{display:block;font-size:10px;font-weight:800;color:#8a97a5;letter-spacing:.4px;margin-top:4px;white-space:nowrap}
.dsum .seg{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dsum .bar{height:9px}
.dsum p{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;font-weight:800}
.dsum .o{color:#c07a18}.dsum .c{color:#1b6e3c}.dsum .s{color:#8a97a5}

/* 跨日期精簡清單 */
.fbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 9px}
.fbar strong{font-size:14px;color:#002038}
.fbar strong em{font-style:normal}
.chipx{flex:0 0 auto;font-family:inherit;font-size:12px;font-weight:800;color:#56657a;background:#fff;border:1px solid #d3dde8;
 border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.sorts{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.sorts button{font-family:inherit;font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;border:0;
 background:#e6ebf0;color:#5a6b7c;cursor:pointer}
.sorts button.on{background:#002038;color:#fff}
.rows{background:#fff;border:1px solid #e8ecf1;border-radius:16px;overflow:hidden;
 box-shadow:0 1px 3px rgba(16,24,40,.04),0 8px 20px rgba(16,24,40,.05)}
.lr{display:grid;grid-template-columns:5px 46px minmax(0,1fr) auto;align-items:center;gap:10px;
 padding:10px 12px 10px 0;border-top:1px solid #eef1f4;cursor:pointer}
.rows>.lr:first-child,.rows>.gh:first-child{border-top:0}
.lr .st{align-self:stretch;background:#c07a18}
.lr .st.ov{background:#c62828}.lr .st.cl{background:#1b6e3c}
.lr .d{font-size:12.5px;font-weight:900;color:#002038;line-height:1.15;text-align:center;font-variant-numeric:tabular-nums}
.lr .d small{display:block;font-weight:700;color:#8a97a5;font-size:10.5px;margin-top:1px}
.lr .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600}
.lr .t p{margin-top:2px;font-size:11.5px;color:#8a97a5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .con{font-weight:900;color:#1b3a5c}
.lr .pill{font-size:11px;padding:3px 9px}
.pill.ov{background:#fde3e3;color:#c62828}
.lr.on{background:#f7fafd}
.lexp{padding:4px 10px 2px;background:#f7fafd;border-top:1px dashed #dfe6ee}
.lexp .card{margin-bottom:10px}
.gh{padding:7px 14px;font-size:11.5px;font-weight:900;letter-spacing:.5px;color:#1b3a5c;background:#f2f5f8;border-top:1px solid #e8ecf1}
.gh span{color:#8a97a5;font-weight:700;margin-left:6px}
@media(hover:hover){.lr:hover{background:#f7fafd}}
.tag.src{background:#ffe7b8;color:#7a4b00;font-weight:800}

/* 逾期提示列 */
.odb{display:flex;align-items:center;gap:10px;background:#fdecec;border:1px solid #f5c6c6;border-radius:14px;
 padding:10px 14px;margin-bottom:11px;cursor:pointer;color:#a61f1f;font-size:13.5px;font-weight:700;line-height:1.45}
.odb b{font-size:18px;font-weight:900;color:#c62828}
.odb .go{margin-left:auto;flex:0 0 auto;font-size:12px;font-weight:900;background:#c62828;color:#fff;border-radius:999px;padding:5px 11px}
.odb .ic{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#c62828;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900}
@media(hover:hover){.odb:hover{background:#fbe1e1}}

/* 設定頁：逾期通知 */
.csec{margin:22px 0 2px;padding-top:14px;border-top:1px solid #eef1f4;font-size:13.5px;font-weight:900;color:#16324f;letter-spacing:.5px}
label.sw{display:flex;align-items:center;gap:9px;cursor:pointer;margin-top:14px;font-size:14px;color:#16324f}
label.sw input{width:20px;height:20px;flex:0 0 auto;box-shadow:none;accent-color:#00B050}
.cm{display:grid;grid-template-columns:minmax(80px,30%) 1fr;gap:7px;align-items:center;margin-bottom:7px}
.cm span{font-size:13px;font-weight:800;color:#38475a;word-break:break-all}
.cm input{padding:9px 10px;font-size:14px}
.srcb{display:inline-block;font-size:10px;font-weight:900;color:#7a4b00;background:#ffe7b8;border-radius:5px;padding:1px 6px;margin-left:5px;vertical-align:1px}

.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:700;
 letter-spacing:2px;margin-bottom:10px;color:#fff;cursor:pointer;
 background:linear-gradient(135deg,#1b8a4a,#00B050);box-shadow:0 5px 14px rgba(0,176,80,.25),inset 0 1px 0 rgba(255,255,255,.28);
 transition:transform .1s,filter .15s}
.btn:active{transform:scale(.985);filter:brightness(.95)}
.btn[disabled]{background:#9bb3a5;box-shadow:none}
.btn2{background:linear-gradient(135deg,#3c5568,#5b7686);box-shadow:0 4px 12px rgba(60,85,104,.24)}
.btn3{background:linear-gradient(135deg,#002038,#0b3c60);box-shadow:0 4px 12px rgba(0,32,56,.26)}

label{display:block;font-size:13px;color:#46566a;font-weight:700;margin:12px 0 5px}
label.req::after{content:" ＊";color:#c62828}
input,textarea,select{width:100%;border:1.5px solid transparent;border-radius:13px;padding:11px;
 font-size:16px;font-family:inherit;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.08);
 transition:border-color .15s,box-shadow .15s}
textarea{border:1.5px solid #cfd6de;height:78px;box-shadow:none;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none;border-color:#00B050;box-shadow:0 0 0 3px rgba(0,176,80,.14)}
.err{border-color:#c62828!important;background:#fdf4f4!important}
.hint{font-size:11.5px;color:#8a97a5;margin-top:4px;line-height:1.5}

.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.opt{padding:9px 14px;border-radius:12px;border:1.5px solid #ccd3da;background:#fff;
 font-size:14px;font-weight:700;color:#5a6b7c;cursor:pointer;transition:.13s;user-select:none}
.opt.on{background:#002038;border-color:#002038;color:#fff;box-shadow:0 3px 10px rgba(0,32,56,.28)}
.opt.on.g{background:#00B050;border-color:#00B050;box-shadow:0 3px 10px rgba(0,176,80,.3)}

.risks{display:flex;gap:8px;margin-top:2px}
.risk{flex:1;text-align:center;padding:11px 0;border:1.5px solid #ccd3da;border-radius:12px;
 font-weight:800;color:#8a97a5;background:#fff;cursor:pointer;transition:.15s;font-size:14px}
.risk small{display:block;font-size:10.5px;font-weight:700;margin-top:1px;opacity:.9}
.risk.on-P1{background:#c62828;border-color:#c62828;color:#fff;box-shadow:0 4px 12px rgba(198,40,40,.35)}
.risk.on-P2{background:#c07a18;border-color:#c07a18;color:#fff;box-shadow:0 4px 12px rgba(192,122,24,.35)}
.risk.on-P3{background:#546e7a;border-color:#546e7a;color:#fff;box-shadow:0 4px 12px rgba(84,110,122,.35)}

.thumbs{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.thw{position:relative;flex:0 0 auto}
.thumbs img{height:104px;border-radius:11px;border:1px solid #ccd3da;display:block;background:#eef1f4}
.thx{position:absolute;top:4px;right:4px;width:26px;height:26px;line-height:26px;text-align:center;
 border-radius:50%;background:rgba(198,40,40,.92);color:#fff;font-size:14px;font-weight:700;
 box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer;user-select:none;z-index:2}

.it{border-left:6px solid #ccd3da;padding:14px 15px 12px}
.it.Open{border-left-color:#c07a18}
.it.Closed{border-left-color:#1b6e3c}
.row1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:#6b7784;margin-bottom:8px}
.sn{font-weight:900;color:#002038;font-size:15px}
.pill{font-weight:800;font-size:12px;border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill.Open{background:#fff3df;color:#c07a18}
.pill.Closed{background:#e2f2e6;color:#1b6e3c}
.lbl{font-size:11px;font-weight:800;color:#8a97a5;letter-spacing:.6px;margin-top:7px}
.zh{font-size:15px;line-height:1.55;font-weight:500;color:#1c2732;word-break:break-word}
.en{font-size:13px;line-height:1.5;color:#5a6b7c;word-break:break-word;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;align-items:center;margin-top:10px}
.tag{background:#eef1f4;border-radius:999px;padding:4px 11px;color:#55606b;font-weight:600}
.tag.over{background:#fde3e3;color:#c62828;font-weight:800}
.tag.soon{background:#fff3df;color:#c07a18;font-weight:800}
.tag.hz{background:#eaf0fa;color:#1b3a5c;font-weight:800}

/* 危害統計 */
.stot{display:flex;gap:8px;margin:12px 0 4px}
.stot div{flex:1;text-align:center;background:#f5f8fb;border:1px solid #e7eef5;border-radius:13px;padding:9px 4px}
.stot b{display:block;font-size:21px;font-weight:900;color:#1b3a5c;line-height:1.2}
.stot.o b{color:#c07a18}.stot.c b{color:#1b6e3c}
.stot span{font-size:10.5px;font-weight:700;color:#77808c}
.qk{display:flex;gap:7px;margin-top:8px}
.qk button{flex:1;padding:8px 0;border-radius:11px;border:1.5px solid #ccd3da;background:#fff;
 font-size:12.5px;font-weight:800;color:#5a6b7c;cursor:pointer;font-family:inherit}
.qk button.on{background:#002038;border-color:#002038;color:#fff}
.srow{margin-top:11px}
.srow .sl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;
 font-weight:700;color:#38475a;margin-bottom:3px}
.srow .sn2{flex:0 0 auto;font-weight:900;color:#1b3a5c}
.srow .sm{font-size:11px;font-weight:700;color:#8a97a5}
.bar{height:9px;border-radius:999px;background:#eef1f4;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.o{background:linear-gradient(90deg,#e0a63c,#c07a18)}
.bar i.c{background:linear-gradient(90deg,#4fbf7a,#1b6e3c)}
.tag.cl{background:#e2f2e6;color:#1b6e3c;font-weight:800;padding:2px 8px 2px 11px;display:inline-flex;
 align-items:center;gap:5px}
/* 卡片上直接改結案日期，所以要把全域的 input 樣式縮回標籤大小 */
.cdt{width:auto;padding:2px 5px;font-size:12px;font-weight:800;font-family:inherit;color:#1b6e3c;
 background:#fff;border:1px solid #bcdcc6;border-radius:8px;box-shadow:none}
.cdt:focus{border-color:#00B050;box-shadow:0 0 0 2px rgba(0,176,80,.16)}
.ph{display:flex;gap:8px;margin-top:9px;overflow-x:auto;padding-bottom:3px}
.phw{position:relative;flex:0 0 auto}
.ph img{height:120px;min-width:80px;border-radius:12px;border:1px solid #dfe4ea;display:block;
 background:#eef1f4;box-shadow:0 3px 10px rgba(16,24,40,.12);cursor:pointer}
.pb{position:absolute;left:6px;top:6px;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;
 color:#fff;opacity:.93;pointer-events:none}
.pb.b{background:#546e7a}.pb.a{background:#1b6e3c}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.abtn{padding:9px 14px;border:1.5px solid #00B050;border-radius:12px;background:#fff;color:#12793f;
 font-size:13px;font-weight:800;cursor:pointer;transition:transform .1s}
.abtn:active{transform:scale(.96)}
.abtn.n{border-color:#1b3a5c;color:#1b3a5c}
.abtn.d{border-color:#c62828;color:#c62828}

.muted{color:#98a2ad;font-size:13.5px;text-align:center;padding:24px 10px;line-height:1.7}
#msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(0,32,56,.94);color:#fff;

/** 逾期天數；沒逾期（或已結案、沒期限）回 0。 */
function overDays(x){
 if(x.status==="Closed"||!x.targetDate||!TODAY||x.targetDate>=TODAY)return 0;
 return -dayDiff(x.targetDate,TODAY);
}
function byNewest(a,b){return b.date.localeCompare(a.date)||(b.sn||0)-(a.sn||0)}
function sortList(list){
 if(SORT==="date")return list.sort(byNewest);
 if(SORT==="con")return list.sort(function(a,b){
  var ca=a.contractor||"￿",cb=b.contractor||"￿";
  return ca.localeCompare(cb)||byNewest(a,b);
 });
 // 逾期優先：逾期越久越前面，接著是還開著的，已結案墊底；同一群裡新的在前
 return list.sort(function(a,b){
  var oa=overDays(a),ob=overDays(b);
  if(oa!==ob)return ob-oa;
  var ca=a.status==="Closed"?1:0,cb=b.status==="Closed"?1:0;
  return ca-cb||byNewest(a,b);
 });
}

/* ---------- 照片 ---------- */
function compress(f,cb){
 var rd=new FileReader();
 rd.onload=function(){
  var img=new Image();
  img.onload=function(){
   try{
    var mx=1400,w=img.width,h=img.height,r=Math.min(1,mx/Math.max(w,h));
    var cv=document.createElement("canvas");cv.width=Math.round(w*r);cv.height=Math.round(h*r);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    var du=cv.toDataURL("image/jpeg",0.8).split(",")[1];
    if(!du)throw new Error("empty");
    cb(du);
   }catch(e){cb(null)}
  };
  img.onerror=function(){cb(null)};
  img.src=rd.result;
 };
 rd.onerror=function(){cb(null)};
 rd.readAsDataURL(f);
}

function card(x){

 if(x.targetDate){
  var cls="tag",txt=t("tTarget")+x.targetDate;
  if(st!=="Closed"){
   var d=dayDiff(x.targetDate,TODAY);
   if(d<0){cls="tag over";txt=t("over1")+(-d)+t("over2")+"（"+x.targetDate+"）"}
   else if(d===0){cls="tag soon";txt=t("dueToday")}
   else if(d===1){cls="tag soon";txt=t("dueTmr")}
  }
  tags+='<span class="'+cls+'">'+esc(txt)+'</span>';
 }
 // 已結案的紀錄，結案日期直接做成可以點的日期欄，隨時改
 if(st==="Closed")
  tags+='<span class="tag cl">'+esc(t("tClose"))+

   '" onchange="setClose(\''+x.id+'\',this.value)"></span>';

 var before=x.photos.filter(function(p){return p.kind==="before"});
 var after=x.photos.filter(function(p){return p.kind==="after"});

 }

 return '<div class="card it '+st+'">'+
  '<div class="row1"><span class="sn">#'+x.sn+'　<span style="font-weight:600;color:#6b7784">'+esc(x.time||"")+'　'+esc(t("tBy")+x.reporter)+'</span></span>'+
  '<span class="pill '+st+'">'+esc(t("s"+st))+'</span></div>'+
  '<div class="lbl">'+esc(t("tObs"))+'</div>'+

  '<div class="tags">'+tags+'</div>'+ph+

   '<button class="abtn" onclick="afPick(\''+x.id+'\')">'+esc(t("aAfter"))+'</button>'+

function statQuick(k){

function statPaint(r){
 if(!r.totals.total){$("statOut").innerHTML='<div class="muted">'+esc(t("sNone"))+'</div>';return}
 var h='<div class="stot"><div><b>'+r.totals.total+'</b><span>'+esc(t("sAll"))+'</span></div>'+
  '<div class="o"><b>'+r.totals.open+'</b><span>'+esc(t("kOpen"))+'</span></div>'+
  '<div class="c"><b>'+r.totals.closed+'</b><span>'+esc(t("kClosed"))+'</span></div></div>';
 if(r.first)h+='<div class="hint">'+esc(t("sSpan")+r.first+" ~ "+r.last)+'</div>';

 var max=r.rows[0]?r.rows[0].total:1;
 r.rows.forEach(function(x){
  var name=x.hazard==="__none__"?t("sUncat"):x.hazard;
  var pc=Math.max(4,Math.round(x.total/max*100));
  // 一條橫條裡用兩段顏色表示開放中與已結案的比例
  var op=Math.round(x.open/x.total*100);
  h+='<div class="srow"><div class="sl"><span>'+esc(name)+'</span>'+
   '<span class="sn2">'+x.total+' <span class="sm">('+x.open+'/'+x.closed+')</span></span></div>'+
   '<div class="bar" style="width:'+pc+'%"><i class="o" style="width:'+op+'%"></i>'+
   '<i class="c" style="width:'+(100-op)+'%"></i></div></div>';
 });
 h+='<div class="hint" style="margin-top:12px">'+esc(t("sLegend"))+'</div>';
 $("statOut").innerHTML=h;
}

/** 負責人信箱欄位跟著承包商清單長；打到一半的值先記在 CMAIL，重畫也不會掉。 */
var CMAIL={};
function buildConMail(){
 var box=$("c_conMail");
 box.querySelectorAll("input").forEach(function(i){CMAIL[i.dataset.c]=i.value.trim()});
 box.innerHTML="";
 lines("c_contractors").filter(function(c){return c!=="NMDC"}).forEach(function(c){
  var r=document.createElement("div");r.className="cm";
  var sp=document.createElement("span");sp.textContent=c;
  var ip=document.createElement("input");ip.type="email";ip.dataset.c=c;ip.value=CMAIL[c]||"";ip.placeholder="name@company.com";
  r.appendChild(sp);r.appendChild(ip);box.appendChild(r);
 });
}
function odUi(){$("odBox").style.opacity=$("c_odMail").checked?"1":".55"}
function lines(id){return $(id).value.split("\n").map(function(s){return s.trim()}).filter(String)}
function saveCfg(){
 var obj={
  members:lines("c_members"),
  actionBy:lines("c_actionBy"),
  contractors:lines("c_contractors"),
  hazards:lines("c_hazards"),
  project:$("c_project").value.trim(),
  riskDays:{P1:+$("c_d1").value||3,P2:+$("c_d2").value||7,P3:+$("c_d3").value||14},
  hseRep:$("c_hseRep").value.trim(),
  sectionRep:$("c_sectionRep").value.trim(),
  contractorDays:Math.max(1,Math.min(60,+$("c_conDays").value||3)),
  overdueMail:$("c_odMail").checked,
  overdueCc:$("c_odCc").value.trim()
 };
 buildConMail();
 var cm={},bad="",re=/^[^@,;\s]+@[^@,;\s]+\.[^@,;\s]+$/;
 Object.keys(CMAIL).forEach(function(c){
  if(lines("c_contractors").indexOf(c)<0||!CMAIL[c])return;
  CMAIL[c].split(/[,;，]/).map(function(x){return x.trim()}).filter(String).forEach(function(x){if(!re.test(x))bad=bad||x});
  cm[c]=CMAIL[c];
 });
 obj.overdueCc.split(/[,;，]/).map(function(x){return x.trim()}).filter(String).forEach(function(x){if(!re.test(x))bad=bad||x});
 if(bad){toast(t("badMail")+bad);return}
 obj.contractorEmails=cm;
 google.script.run.withSuccessHandler(function(r){
  if(r&&r.ok){CFG=r.config;$("c_members").dataset.filled="";
   $("opReporter").dataset.built="";
   $("f_con").dataset.sig="";$("f_haz").dataset.sig="";$("f_action").dataset.sig="";
   buildOptions();fillCfgForm();
   toast(r.triggerError?(t("fail")+r.triggerError):t(obj.overdueMail?"okTrig":"okSave"))}
  else toast(t("fail")+((r&&r.error)||"?"));
 }).withFailureHandler(function(e){toast(t("fail")+(e&&e.message||e))}).hseSaveConfig(KEY,obj);
}
