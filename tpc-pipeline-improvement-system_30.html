                        </div>
                      </div>
                      <div className="item-close-bar" style={{marginTop:8}}><div className="item-close-fill" style={{width:rate+'%',background:color}}></div></div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>

        {/* 下排：改善單類型(左1/2) + 各工區統計(右1/2) */}
        <div style={{display:'grid',gridTemplateColumns:window.innerWidth<=640?'1fr':'1fr 1fr',gap:16,marginBottom:16}}>
          {typeData.length>0 && <DonutChart data={typeData} title="🧾 改善單類型分布" onFilterClick={onFilterClick} />}
          {areaData.length>0 && <BarChart data={areaData} title="🗺️ 各工區開/關單統計" height={230} />}
        </div>

        {/* 第三排：月度趨勢（全寬） */}
        <div style={{marginBottom:16}}>
          <MonthTrendChart records={activeRecs} />
        </div>

        {/* 第四排：開單人排行(左) + 單位別分布(右) */}
        <div style={{display:'grid',gridTemplateColumns:window.innerWidth<=640?'1fr':'1fr 1fr',gap:16,marginBottom:16}}>
          <IssuerRankChart records={activeRecs} onFilterClick={onFilterClick} />
          <UnitDistChart records={activeRecs} onFilterClick={onFilterClick} />
        </div>
      </>)}
      {total===0 && <div className="empty-state"><div className="empty-icon">📋</div><div className="empty-text">尚無紀錄，請至「紀錄管理」新增</div></div>}
    </div>
  );
}


// ─── PHOTO SYSTEM BUTTON ──────────────────────────────────────
function PhotoBtn({ record }) {
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState(0);
  const [msg, setMsg] = useState('');

  const handleClick = async () => {
    // 先開空視窗，並立刻寫入等待畫面（iOS 要求同步）
    const win = window.open('', '_blank');
    if (win) {
      win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>載入中...</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f1d30;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif}.box{background:#1e3a5f;border-radius:16px;padding:36px 40px;text-align:center;color:#fff;width:min(320px,88vw)}.icon{font-size:40px;margin-bottom:16px}.title{font-size:17px;font-weight:700;margin-bottom:20px}.bar-wrap{background:rgba(255,255,255,.15);border-radius:99px;height:8px;overflow:hidden;margin-bottom:14px}.bar{height:100%;background:linear-gradient(90deg,#38bdf8,#34d399);border-radius:99px;animation:grow 20s ease-out forwards}@keyframes grow{0%{width:5%}40%{width:40%}70%{width:70%}90%{width:88%}100%{width:93%}}.sub{font-size:12px;opacity:.65;margin-top:8px}</style></head><body><div class="box"><div class="icon">📷</div><div class="title">正在連結改善照片系統...</div><div class="bar-wrap"><div class="bar"></div></div><div>請稍候，GAS 首次連線約需 10~20 秒</div><div class="sub">連結完成後將自動跳轉</div></div></body></html>`);
      win.document.close();
    }
    if (!PHOTO_GAS_URL) {
      if (win) win.location.href = PHOTO_SYSTEM_URL + '#label=' + encodeURIComponent(record.number);
      return;
    }
    setBusy(true); setProgress(10); setMsg('連線照片系統中...');
    try {
      await new Promise(r=>setTimeout(r,300));
      setProgress(30); setMsg('查詢改善單紀錄...');
      const indexRes = await xhrGet(PHOTO_GAS_URL + '?action=index');
      const recs = (indexRes.ok && indexRes.data && indexRes.data.records) ? indexRes.data.records : [];
      const exists = recs.some(r => r.label === record.number);
      setProgress(65);
      if (!exists) {
        setMsg('建立新紀錄中...');
        const desc = (record.defects && record.defects.length > 0)
          ? record.defects.map(d => d.description).join('\n')
          : (record.description || '');
        await xhrPost(PHOTO_GAS_URL, {
          action: 'saveRecord',
          record: { id: Date.now(), label: record.number, date: record.date||'', beforeDesc: desc, duringDesc: '', afterDesc: '', remark: '' },
          header: null
        });
        setProgress(90); setMsg('紀錄建立完成，即將開啟...');
      } else {
        setProgress(90); setMsg('即將開啟照片系統...');
      }
      await new Promise(r=>setTimeout(r,400));
      setProgress(100);
      if (win) win.location.href = PHOTO_SYSTEM_URL + '#label=' + encodeURIComponent(record.number);
      else window.open(PHOTO_SYSTEM_URL + '#label=' + encodeURIComponent(record.number), '_blank');
    } catch(e) {
      if (win) win.close();
      alert('照片系統連線失敗：' + e.message);
    } finally {
      setTimeout(()=>{ setBusy(false); setProgress(0); setMsg(''); }, 600);
    }
  };

  return (<>
    {busy && (
      <div style={{position:'fixed',inset:0,background:'rgba(15,37,64,.82)',zIndex:9999,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16}}>
        <div style={{background:'var(--bg-card)',borderRadius:16,padding:'28px 36px',width:'min(340px,88vw)',boxShadow:'0 8px 40px rgba(0,0,0,.4)',display:'flex',flexDirection:'column',gap:14,alignItems:'center'}}>
          <div style={{fontSize:28}}>📷</div>
          <div style={{fontSize:15,fontWeight:700,color:'var(--text-primary)',textAlign:'center'}}>開啟改善照片系統</div>
          <div style={{width:'100%',background:'var(--bg-input)',borderRadius:99,height:8,overflow:'hidden'}}>
            <div style={{height:'100%',borderRadius:99,background:'linear-gradient(90deg,var(--accent-blue),var(--accent-green))',width:`${progress}%`,transition:'width .4s ease'}}></div>
          </div>
          <div style={{fontSize:13,color:'var(--text-secondary)',textAlign:'center'}}>{msg}</div>
          <div style={{fontSize:11,color:'var(--text-muted)',textAlign:'center'}}>GAS 首次連線約需 10~20 秒，請稍候...</div>
        </div>
      </div>
    )}
    <button className="btn btn-secondary btn-sm btn-icon" title="開啟改善照片系統" disabled={busy} onClick={handleClick}>
      {busy ? '⏳' : '📷'}
    </button>
  </>);
}

// ─── STATS TAB ───────────────────────────────────────────────
function StatsTab({ records, onFilterClick, issuerRoles, onSaveRoles }) {
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo,   setDateTo]   = useState('');
  const [sortKey,  setSortKey]  = useState('total');
  const [sortDir,  setSortDir]  = useState(-1);
  const [roles, setRoles] = useState(issuerRoles || {});
  const [dirty, setDirty] = useState(false);
  const [savingRoles, setSavingRoles] = useState(false);

  const ROLES = {
    A: { label:'A 經辦員', color:'#0ea5e9', bg:'rgba(14,165,233,.1)', border:'rgba(14,165,233,.3)' },
    B: { label:'B 主管',   color:'#d97706', bg:'rgba(217,119,6,.1)',  border:'rgba(217,119,6,.3)' },
    C: { label:'C 核定工及以上', color:'#7c3aed', bg:'rgba(124,58,237,.1)', border:'rgba(124,58,237,.3)' },
  };

  // 同步外部傳入的 issuerRoles
  React.useEffect(() => { setRoles(issuerRoles || {}); setDirty(false); }, [issuerRoles]);

  const setRole = (issuer, role) => {
    const newRoles = { ...roles };
    if (newRoles[issuer] === role) delete newRoles[issuer];
    else newRoles[issuer] = role;
    setRoles(newRoles);
    setDirty(true); // 標記未儲存
  };

  const handleSaveRoles = async () => {
    setSavingRoles(true);
    try { await onSaveRoles(roles); setDirty(false); }
    finally { setSavingRoles(false); }
  };

  const today = () => new Date().toISOString().slice(0,10);
  const localFmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  const applyQuick = (period) => {
    const now = new Date();
    if (period==='all') { setDateFrom(''); setDateTo(''); return; }
    if (period==='thisweek') {
      const dw=now.getDay(), diff=dw===0?-6:1-dw;
      const mon=new Date(now); mon.setDate(now.getDate()+diff);
      const sun=new Date(mon); sun.setDate(mon.getDate()+6);
      setDateFrom(localFmt(mon)); setDateTo(localFmt(sun)); return;
    }
    if (period==='thismonth') {
      setDateFrom(localFmt(new Date(now.getFullYear(), now.getMonth(), 1)));
      setDateTo(localFmt(new Date(now.getFullYear(), now.getMonth()+1, 0))); return;
    }
    if (period==='lastmonth') {
      setDateFrom(localFmt(new Date(now.getFullYear(), now.getMonth()-1, 1)));
      setDateTo(localFmt(new Date(now.getFullYear(), now.getMonth(), 0))); return;
    }
    if (period==='last30') {
      const d=new Date(now); d.setDate(now.getDate()-30);
      setDateFrom(localFmt(d)); setDateTo(localFmt(now)); return;
    }
  };

  // 篩選紀錄
  const filtered = records.filter(r =>
    (!dateFrom || r.date >= dateFrom) &&
    (!dateTo   || r.date <= dateTo)
  );

  // 統計：以開單人分組
  const statsMap = {};
  filtered.forEach(r => {
    const issuer = r.issuer || '（未填）';
    if (!statsMap[issuer]) statsMap[issuer] = { issuer, total: 0, defects: 0, dates: [] };
    statsMap[issuer].total++;
    statsMap[issuer].defects += (r.defects && r.defects.length > 0) ? r.defects.length : 1;
    if (r.date) statsMap[issuer].dates.push(r.date);
  });

  const rows = Object.values(statsMap).sort((a,b) => {
    const va = a[sortKey], vb = b[sortKey];
    return typeof va === 'number' ? (va-vb)*sortDir : (String(va)>String(vb)?1:-1)*sortDir;
  });

  const toggleSort = k => { if(sortKey===k) setSortDir(d=>d*-1); else { setSortKey(k); setSortDir(-1); } };
  const SortIcon = ({k}) => <span style={{fontSize:10,opacity:.6}}>{sortKey===k?(sortDir>0?'▲':'▼'):'↕'}</span>;

  const totalRecs = rows.reduce((s,r)=>s+r.total, 0);
  const totalDefs = rows.reduce((s,r)=>s+r.defects, 0);

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">📈 開單統計</div>
          <div className="page-sub">依開單人彙整開單張數與缺失件數</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          {dirty && <span style={{fontSize:12,color:'var(--accent-orange)',fontWeight:600}}>⚠️ 角色設定未儲存</span>}
          <button className="btn btn-primary" onClick={handleSaveRoles} disabled={!dirty||savingRoles}>
            {savingRoles ? '⏳ 儲存中...' : '☁️ 儲存角色設定'}
          </button>
        </div>
      </div>

      {/* 日期篩選 */}
      <div className="filter-bar period-bar">
        <span className="filter-label">篩選期間</span>
        {[
          {id:'all',label:'全部'},
          {id:'thisweek',label:'本週'},
          {id:'thismonth',label:'本月'},
          {id:'lastmonth',label:'上月'},
          {id:'last30',label:'近30天'},
        ].map(p=>(
          <button key={p.id} onClick={()=>applyQuick(p.id)} className={`chip${(!dateFrom&&!dateTo&&p.id==='all')?' active':''}`}>
            {p.label}
          </button>
        ))}
        <span style={{fontSize:12,color:'var(--text-muted)'}}>自訂</span>
        <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)}
          style={{background:'var(--bg-input)',border:'1px solid var(--border)',color:'var(--text-primary)',borderRadius:'var(--radius-sm)',padding:'5px 10px',fontSize:12,fontFamily:'inherit'}} />
        <span style={{fontSize:12,color:'var(--text-muted)'}}>～</span>
        <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)}
          style={{background:'var(--bg-input)',border:'1px solid var(--border)',color:'var(--text-primary)',borderRadius:'var(--radius-sm)',padding:'5px 10px',fontSize:12,fontFamily:'inherit'}} />
        {(dateFrom||dateTo) && <span style={{fontSize:12,color:'var(--accent-blue)',fontWeight:700}}>共 {filtered.length} 筆</span>}
      </div>

      {/* 合計列 + U值 */}
      {(() => {
        const roleStats = {};
        rows.forEach(r => {
          const rk = roles[r.issuer];
          if (!rk) return;
          if (!roleStats[rk]) roleStats[rk] = { total:0, defects:0 };
          roleStats[rk].total += r.total;
          roleStats[rk].defects += r.defects;
        });
        const uParts = ['A','B','C'].map(k => roleStats[k] && roleStats[k].total > 0 ? roleStats[k].defects / roleStats[k].total : null);
        const validU = uParts.filter(v => v !== null);
        const uVal = validU.length > 0 ? (validU.reduce((s,v)=>s+v,0)/3).toFixed(2) : null;
        return (<>
          <div style={{display:'flex',gap:12,marginBottom:12,flexWrap:'wrap'}}>
            <div style={{flex:1,minWidth:120,background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'14px 18px'}}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:6}}>統計人數</div>
              <div style={{fontFamily:'var(--num)',fontSize:32,fontWeight:900,color:'var(--accent-blue)'}}>{rows.length}</div>
            </div>
            <div style={{flex:1,minWidth:120,background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'14px 18px'}}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:6}}>總開單數</div>
              <div style={{fontFamily:'var(--num)',fontSize:32,fontWeight:900,color:'var(--accent-orange)'}}>{totalRecs}</div>
            </div>
            <div style={{flex:1,minWidth:120,background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'14px 18px'}}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:6}}>總缺失件數</div>
              <div style={{fontFamily:'var(--num)',fontSize:32,fontWeight:900,color:'var(--accent-red)'}}>{totalDefs}</div>
            </div>
            {Object.entries(ROLES).map(([k,v])=>(
              <div key={k} style={{flex:1,minWidth:140,background:v.bg,border:`1.5px solid ${v.border}`,borderRadius:'var(--radius)',padding:'14px 18px'}}>
                <div style={{fontSize:11,fontWeight:700,color:v.color,textTransform:'uppercase',marginBottom:4}}>{v.label}</div>
                <div style={{display:'flex',gap:12,alignItems:'baseline'}}>
                  <div><div style={{fontSize:9,color:v.color,opacity:.7,marginBottom:2}}>次數</div><div style={{fontFamily:'var(--num)',fontSize:22,fontWeight:900,color:v.color}}>{roleStats[k]?.total||0}</div></div>
                  <div><div style={{fontSize:9,color:v.color,opacity:.7,marginBottom:2}}>件數</div><div style={{fontFamily:'var(--num)',fontSize:22,fontWeight:900,color:v.color}}>{roleStats[k]?.defects||0}</div></div>
                </div>
              </div>
            ))}
            {uVal && (
              <div style={{flex:1,minWidth:160,background:'linear-gradient(135deg,rgba(124,58,237,.12),rgba(14,165,233,.08))',border:'2px solid rgba(124,58,237,.3)',borderRadius:'var(--radius)',padding:'14px 18px'}}>
                <div style={{fontSize:11,fontWeight:700,color:'#7c3aed',textTransform:'uppercase',marginBottom:4}}>U 值</div>
                <div style={{fontFamily:'var(--num)',fontSize:36,fontWeight:900,color:'#7c3aed'}}>{uVal}</div>
                <div style={{fontSize:9,color:'var(--text-muted)',marginTop:4}}>= (A件/A次 + B件/B次 + C件/C次) / 3</div>
              </div>
            )}
          </div>
        </>);
      })()}

      {/* 統計表 */}
      <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius)',overflow:'hidden'}}>
        {/* 表頭 */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 80px 80px 80px 1fr',background:'#e4ecf4',borderBottom:'2px solid var(--border)',padding:'10px 16px',gap:8}}>
          {[['issuer','開單人'],['total','開單單數'],['defects','開單件數'],['role','角色'],['dates','開單日期範圍']].map(([k,l])=>(
            <div key={k} onClick={()=>toggleSort(k)}
              style={{fontSize:11,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px',cursor:'pointer',userSelect:'none',display:'flex',alignItems:'center',gap:4}}>
              {l} <SortIcon k={k} />
            </div>
          ))}
        </div>
        {/* 資料列 */}
        {rows.length === 0 ? (
          <div style={{padding:'40px',textAlign:'center',color:'var(--text-muted)'}}>📋 無資料</div>
        ) : rows.map((r,i) => {
          const dates = r.dates.sort();
          const dateRange = dates.length > 0
            ? dates.length === 1
              ? dates[0]
              : `${dates[0]} ～ ${dates[dates.length-1]}`
            : '—';
          const roleKey = roles[r.issuer];
          const roleInfo = roleKey ? ROLES[roleKey] : null;
          return (
            <div key={r.issuer} style={{display:'grid',gridTemplateColumns:'1fr 80px 80px 80px 1fr',padding:'10px 16px',gap:8,borderBottom:'1px solid var(--border)',background:i%2===0?'transparent':'rgba(0,0,0,.015)',alignItems:'center'}}>
              <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                <span onClick={()=>onFilterClick({issuer: r.issuer})} title={`點擊查看 ${r.issuer} 的紀錄`}
                  style={{fontWeight:700,fontSize:13,color:'var(--accent-blue)',cursor:'pointer',display:'flex',alignItems:'center',gap:4}}>
                  {r.issuer}<span style={{fontSize:10,opacity:.4}}>↗</span>
                </span>
                <div style={{display:'flex',gap:4}}>
                  {Object.entries(ROLES).map(([k,v])=>(
                    <button key={k} onClick={()=>setRole(r.issuer, k)}
                      style={{padding:'2px 8px',borderRadius:12,fontSize:11,fontWeight:700,cursor:'pointer',border:`1.5px solid`,
                        borderColor: roleKey===k ? v.color : 'var(--border)',
                        background: roleKey===k ? v.bg : 'transparent',
                        color: roleKey===k ? v.color : 'var(--text-muted)',
                        transition:'all .12s'}}>
                      {k}
                    </button>
                  ))}
                </div>
              </div>
              <div style={{fontFamily:'var(--num)',fontSize:18,fontWeight:900,color:'var(--accent-orange)',textAlign:'center'}}>{r.total}</div>
              <div style={{fontFamily:'var(--num)',fontSize:18,fontWeight:900,color:'var(--accent-red)',textAlign:'center'}}>{r.defects}</div>
              <div style={{textAlign:'center'}}>
                {roleInfo ? <span style={{fontSize:11,fontWeight:700,borderRadius:20,padding:'2px 10px',background:roleInfo.bg,color:roleInfo.color,border:`1px solid ${roleInfo.border}`}}>{roleInfo.label}</span> : <span style={{fontSize:11,color:'var(--text-muted)'}}>—</span>}
              </div>
              <div style={{fontSize:12,color:'var(--text-secondary)'}}>{dateRange}</div>
            </div>
          );
        })}
        {/* 合計列 */}
        {rows.length > 0 && (
          <div style={{display:'grid',gridTemplateColumns:'1fr 80px 80px 80px 1fr',padding:'12px 16px',gap:8,borderTop:'2px solid var(--border)',background:'#e4ecf4',alignItems:'center'}}>
            <div style={{fontWeight:800,fontSize:12,color:'var(--text-muted)',textTransform:'uppercase'}}>合計</div>
            <div style={{fontFamily:'var(--num)',fontSize:18,fontWeight:900,color:'var(--accent-orange)',textAlign:'center'}}>{totalRecs}</div>
            <div style={{fontFamily:'var(--num)',fontSize:18,fontWeight:900,color:'var(--accent-red)',textAlign:'center'}}>{totalDefs}</div>
            <div></div><div></div>
          </div>
        )}
      </div>
    </div>
  );
}


function RecordsTab({ records, config, onAdd, onEdit, onDelete, onRefresh, saving, gasUrl, connected, activeFilter }) {
  const { itemOptions, areaOptions, unitOptions } = config;
  const [filters, setFilters] = useState({ type:'', area:'', unit:'', status:'', item:'', issuer:'', search:'', _overdue:false, _neardue:false, _thisweek:false });
  const [sort, setSort] = useState({ key:'date', dir:'desc' });
  const [showModal, setShowModal] = useState(false);
  const [editRec, setEditRec] = useState(null);
  const [mode, setMode] = useState('add');
  const setF = (k,v) => setFilters(f=>({...f,[k]:v}));

  // 從儀表板點擊卡片帶入篩選
  useEffect(() => {
    if (activeFilter) {
      if (activeFilter._newrecord) {
        setMode('add'); setEditRec(null); setShowModal(true);
        return;
      }
      setFilters(f => ({
        ...f,
        type: activeFilter.type || '',
        status: activeFilter.status || '',
        item: activeFilter.item || '',
        issuer: activeFilter.issuer || '',
        unit: activeFilter.unit || '',
        area: activeFilter.area || '',
        _overdue: activeFilter._overdue || false,
        _neardue: activeFilter._neardue || false,
        _thisweek: activeFilter._thisweek || false,
      }));
    }
  }, [activeFilter]);

  const filtered = records.filter(r=>
    (!filters.type || r.type===filters.type) &&
    (!filters.area || r.area===filters.area) &&
    (!filters.unit || r.unit===filters.unit) &&
    (!filters.issuer || r.issuer===filters.issuer) &&
    (!filters.status || r.status===filters.status) &&
    (!filters.item || (r.defects&&r.defects.length>0 ? r.defects.some(d=>String(d.item)===filters.item) : String(r.item)===filters.item)) &&
    (!filters._overdue || (r.status==='Open' && r.deadline && r.deadline!=='-' && r.deadline < today())) &&
    (!filters._neardue || (r.status==='Open' && r.deadline && r.deadline!=='-' && r.deadline >= today() && r.deadline <= (()=>{const d=new Date();d.setDate(d.getDate()+7);return d.toISOString().slice(0,10);})())) &&
    (!filters._thisweek || (()=>{ const n=new Date(); const dw=n.getDay(); const diff=dw===0?-6:1-dw; const mon=new Date(n); mon.setDate(n.getDate()+diff); const sun=new Date(mon); sun.setDate(mon.getDate()+6); const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; return r.date>=fmt(mon)&&r.date<=fmt(sun); })()) &&
    (!filters.search || [r.number,r.description,r.issuer,r.refNumber,...(r.defects||[]).map(d=>d.description)].join(' ').toLowerCase().includes(filters.search.toLowerCase()))
  ).sort((a,b)=>{
    let va=a[sort.key]||'', vb=b[sort.key]||'';
    if(sort.key==='amount'){va=parseFloat(va)||0; vb=parseFloat(vb)||0;}
    const primary = sort.dir==='asc' ? (va>vb?1:va<vb?-1:0) : (va<vb?1:va>vb?-1:0);
    if(primary!==0) return primary;
    // 次要排序：改善單編號數字部分 大的在上
    const na = parseInt((a.number||'').replace(/\D+/g,''))||0;
    const nb = parseInt((b.number||'').replace(/\D+/g,''))||0;
    return nb - na;
  });

  const toggleSort = k => setSort(s=>({key:k, dir:s.key===k&&s.dir==='asc'?'desc':'asc'}));
  const SortIcon = ({k}) => <span className={`sort-icon${sort.key===k?' active':''}`}>{sort.key===k?(sort.dir==='asc'?'▲':'▼'):'↕'}</span>;

  const openCnt = filtered.filter(r=>r.status==='Open').length;
  const td = today();

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">📋 紀錄管理
            {filters._overdue && <span style={{marginLeft:10,fontSize:13,background:'rgba(239,68,68,.1)',color:'#ef4444',border:'1px solid rgba(239,68,68,.3)',borderRadius:20,padding:'2px 12px',fontWeight:600}}>⚠️ 逾期未結</span>}
            {filters._neardue && <span style={{marginLeft:10,fontSize:13,background:'rgba(245,158,11,.1)',color:'#d97706',border:'1px solid rgba(245,158,11,.3)',borderRadius:20,padding:'2px 12px',fontWeight:600}}>⏰ 即將到期</span>}
            {filters._thisweek && <span style={{marginLeft:10,fontSize:13,background:'rgba(139,92,246,.1)',color:'var(--accent-purple)',border:'1px solid rgba(139,92,246,.3)',borderRadius:20,padding:'2px 12px',fontWeight:600}}>📅 本週新增</span>}
            {filters.issuer && <span onClick={()=>setF('issuer','')} title="點擊清除篩選" style={{marginLeft:10,fontSize:13,background:'var(--accent-blue-dim)',color:'var(--accent-blue)',border:'1px solid rgba(14,165,233,.3)',borderRadius:20,padding:'2px 12px',fontWeight:600,cursor:'pointer'}}>👤 {filters.issuer} ✕</span>}
          </div>
          <div className="page-sub">共 {filtered.length} 筆 | Open: {openCnt} | Closed: {filtered.length - openCnt}</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-secondary" onClick={onRefresh} disabled={saving}>🔄 重新整理</button>
          <button className="btn btn-secondary" onClick={()=>window.open(PHOTO_SYSTEM_URL,'_blank')} title="開啟改善照片表產生器">📷 照片系統</button>
          <button className="btn btn-primary" onClick={()=>{setMode('add');setEditRec(null);setShowModal(true);}}>➕ 新增紀錄</button>
        </div>
      </div>

      <div className="filter-bar">
        <div className="filter-group"><span className="filter-label">類型</span>
          <select value={filters.type} onChange={e=>setF('type',e.target.value)}>
            <option value="">全部</option><option value="WM">WM</option><option value="NCR">NCR</option><option value="PN">PN</option>
          </select>
        </div>
        <div className="filter-group"><span className="filter-label">工區</span>
          <select value={filters.area} onChange={e=>setF('area',e.target.value)}>
            <option value="">全部</option>{areaOptions.map(a=><option key={a}>{a}</option>)}
          </select>
        </div>
        <div className="filter-group"><span className="filter-label">單位</span>
          <select value={filters.unit} onChange={e=>setF('unit',e.target.value)}>
            <option value="">全部</option>{unitOptions.map(u=><option key={u}>{u}</option>)}
          </select>
        </div>
        <div className="filter-group"><span className="filter-label">狀態</span>
          <select value={filters.status} onChange={e=>setF('status',e.target.value)}>
            <option value="">全部</option><option value="Open">Open</option><option value="Closed">Closed</option>
          </select>
        </div>
        <div className="filter-group"><span className="filter-label">項目</span>
          <select value={filters.item} onChange={e=>setF('item',e.target.value)}>
            <option value="">全部</option>{Object.entries(itemOptions).map(([k,v])=><option key={k} value={k}>{k}. {v}</option>)}
          </select>
        </div>
        <div className="filter-group"><span className="filter-label">開單人</span>
          <select value={filters.issuer} onChange={e=>setF('issuer',e.target.value)}>
            <option value="">全部</option>{(config.peopleOptions||[]).map(p=><option key={p}>{p}</option>)}
          </select>
        </div>
        <div className="filter-spacer"></div>
        <input type="text" value={filters.search} onChange={e=>setF('search',e.target.value)} placeholder="🔍 搜尋..." style={{minWidth:160}} />
      </div>

      <div className="table-wrap">
        <div className="table-head t-cols">
          {[['type','類型'],['number','編號'],['date','缺失日期'],['unit','單位'],['issuer','開單人'],['area','工區'],['item','缺失項目'],['description','缺失說明'],['refNumber','業主改善單編號'],['deadline','關單期限'],['submitDate','關單日期'],['status','狀態']].map(([k,l])=>(
            <div key={k} className="table-head-cell" onClick={()=>toggleSort(k)}>{l} <SortIcon k={k} /></div>
          ))}
          <div className="table-head-cell">操作</div>
        </div>
        {filtered.length===0
          ? <div className="empty-state"><div className="empty-icon">🔍</div><div className="empty-text">無符合條件的紀錄</div></div>
          : filtered.map(r=>(
            <div key={r.id} className={`table-row t-cols row-${(r.type||'').toLowerCase()}`}>
              {/* ── 電腦版：表格欄位 ── */}
              <div className="table-cell desktop-only"><span className={`badge badge-${r.type.toLowerCase()}`}>{r.type}</span></div>
              <div className="table-cell desktop-only" style={{fontFamily:'var(--num)',fontSize:11}}>{r.number}</div>
              <div className="table-cell hm desktop-only" style={{fontSize:11}}>{fmtDate(r.date)}</div>
              <div className="table-cell hm desktop-only">{r.unit}</div>
              <div className="table-cell hm desktop-only">{r.issuer}</div>
              <div className="table-cell hm desktop-only" style={{fontSize:11}}>{r.area}</div>
              <div className="table-cell hm desktop-only" style={{fontSize:11}}>
                {(r.defects&&r.defects.length>0)?r.defects.map(d=>itemOptions[d.item]||d.item).join('、'):(itemOptions[r.item]||'')}
              </div>
              <div className="table-cell hm desktop-only" style={{fontSize:11}}>
                {(r.defects&&r.defects.length>0)?<><span style={{fontFamily:'var(--num)',fontSize:10,background:'var(--accent-blue-dim)',color:'var(--accent-blue)',borderRadius:4,padding:'1px 5px',marginRight:4}}>{r.defects.length}條</span>{r.defects[0].description}{r.defects.length>1?'...':''}</>:r.description}
              </div>
              <div className="table-cell hm desktop-only" style={{fontSize:11}}>{r.refNumber||'—'}</div>
              <div className="table-cell hm desktop-only" style={{fontSize:11, color: r.deadline&&r.status==='Open'&&r.deadline<td?'var(--accent-red)':''}}>{fmtDate(r.deadline)}</div>
              <div className="table-cell hm desktop-only" style={{fontSize:11,color:r.submitDate?'var(--accent-green)':''}}>{r.submitDate&&r.submitDate!=='-'?fmtDate(r.submitDate):'—'}</div>
              <div className="table-cell desktop-only"><span className={`badge badge-${r.status.toLowerCase()}`}>{r.status}</span></div>
              <div className="table-cell desktop-only" style={{display:'flex',gap:4}}>
                <button className="btn btn-secondary btn-sm btn-icon" onClick={()=>{setMode('edit');setEditRec(r);setShowModal(true);}}>✏️</button>
                <PhotoBtn record={r} />
                <button className="btn btn-secondary btn-sm btn-icon" title="Drive 資料夾" onClick={async()=>{
                if (r.driveFolderUrl) { window.open(r.driveFolderUrl,'_blank'); return; }
                const win = window.open('', '_blank');
                try {
                  const res = await xhrPost(gasUrl, {action:'getFolderUrl', type:r.type, date:r.date, number:r.number});
                  if (res.ok) { if(win) win.location.href = res.url; onEdit({...r, driveFolderUrl:res.url, driveFolderId:res.folderId}); }
                  else { if(win) win.close(); alert('Drive 錯誤：' + res.error); }
                } catch(e) { if(win) win.close(); alert('Drive 錯誤：' + e.message); }
              }}>📁</button>
                <button className="btn btn-danger btn-sm btn-icon" onClick={()=>{if(confirm(`確定刪除 ${r.number}？`))onDelete(r.id);}}>🗑</button>
              </div>

              {/* ── 手機版：美化卡片 ── */}
              <div className="mobile-card" style={{flexDirection:'column',gap:0}}>
                {/* 卡片頂部色條 + 標題列 */}
                <div style={{
                  background: r.type==='NCR'?'linear-gradient(135deg,#92400e,#d97706)':r.type==='PN'?'linear-gradient(135deg,#991b1b,#ef4444)':'linear-gradient(135deg,#075985,#0ea5e9)',
                  padding:'10px 14px',display:'flex',alignItems:'center',gap:8,borderRadius:'var(--radius) var(--radius) 0 0'
                }}>
                  <span style={{fontFamily:'var(--num)',fontSize:14,fontWeight:900,color:'#fff',flex:1,letterSpacing:1}}>{r.number}</span>
                  <span style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.85)',background:'rgba(255,255,255,.18)',borderRadius:20,padding:'2px 10px'}}>
                    {r.type==='WM'?'走動管理':r.type==='NCR'?'改善通知':'罰單'}
                  </span>
                  <span style={{fontSize:11,fontWeight:700,color:r.status==='Closed'?'#6ee7b7':'#fca5a5',background:'rgba(0,0,0,.25)',borderRadius:20,padding:'2px 10px'}}>
                    {r.status}
                  </span>
                </div>

                {/* 卡片主體 */}
                <div style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:10,background:'var(--bg-card)',borderRadius:'0 0 var(--radius) var(--radius)',border:'1px solid var(--border)',borderTop:'none'}}>

                  {/* 操作按鈕 */}
                  <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
                    <button className="btn btn-secondary btn-sm" style={{fontSize:12,padding:'5px 12px'}} onClick={()=>{setMode('edit');setEditRec(r);setShowModal(true);}}>✏️ 編輯</button>
                    <PhotoBtn record={r} />
                    <button className="btn btn-secondary btn-sm btn-icon" title="Drive" onClick={async()=>{
                      if (r.driveFolderUrl) { window.open(r.driveFolderUrl,'_blank'); return; }
                      const win = window.open('', '_blank');
                      try {
                        const res = await xhrPost(gasUrl, {action:'getFolderUrl', type:r.type, date:r.date, number:r.number});
                        if (res.ok) { if(win) win.location.href = res.url; onEdit({...r, driveFolderUrl:res.url, driveFolderId:res.folderId}); }
                        else { if(win) win.close(); alert('Drive 錯誤：' + res.error); }
                      } catch(e) { if(win) win.close(); alert('Drive 錯誤：' + e.message); }
                    }}>📁</button>
                    <button className="btn btn-danger btn-sm btn-icon" onClick={()=>{if(confirm(`確定刪除 ${r.number}？`))onDelete(r.id);}}>🗑</button>
                  </div>

                  {/* 資訊 2欄 */}
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 16px'}}>
                    {[
                      ['缺失日期', fmtDate(r.date), ''],
                      ['工區', r.area||'—', ''],
                      ['單位', r.unit||'—', ''],
                      ['開單人', r.issuer||'—', ''],
                      ['關單期限', fmtDate(r.deadline)||'—', r.deadline&&r.status==='Open'&&r.deadline<td?'var(--accent-red)':''],
                      ['關單日期', r.submitDate&&r.submitDate!=='-'?fmtDate(r.submitDate):'—', r.submitDate&&r.submitDate!=='-'?'var(--accent-green)':''],
                    ].map(([label,val,color])=>(
                      <div key={label}>
                        <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.5,marginBottom:2}}>{label}</div>
                        <div style={{fontSize:13,color:color||'var(--text-primary)',fontWeight:500}}>{val}</div>
                      </div>
                    ))}
                    <div style={{gridColumn:'1/-1'}}>
                      <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.5,marginBottom:2}}>業主改善單編號</div>
                      <div style={{fontSize:13,color:'var(--text-primary)',fontWeight:500}}>{r.refNumber||'—'}</div>
                    </div>
                  </div>

                  {/* 缺失條目 */}
                  {(r.defects&&r.defects.length>0) && (
                    <div style={{borderTop:'1px solid var(--border)',paddingTop:10}}>
                      <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.5,marginBottom:6}}>缺失條目</div>
                      {r.defects.map((d,i)=>(
                        <div key={i} style={{marginBottom:i<r.defects.length-1?8:0,paddingLeft:8,borderLeft:'3px solid var(--accent-blue)'}}>
                          <div style={{fontSize:10,fontWeight:700,color:'var(--accent-blue)',marginBottom:2}}>{i+1}. {itemOptions[d.item]||d.item}</div>
                          <div style={{fontSize:12,color:'var(--text-primary)',wordBreak:'break-word',whiteSpace:'pre-wrap',lineHeight:1.5}}>{d.description}</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          ))
        }
      </div>

      {showModal && (
        <RecordModal
          record={editRec} mode={mode} records={records} config={config} saving={saving} gasUrl={gasUrl}
          onSave={form => { if(mode==='add') onAdd(form); else onEdit(form); setShowModal(false); }}
          onClose={()=>!saving && setShowModal(false)}
        />
      )}
    </div>
  );
}

// ─── SETTINGS TAB ─────────────────────────────────────────────
function SettingsTab({ config, records, gasUrl, onSaveConfig, onDisconnect, syncState, lastSync, onRefresh, saving }) {
  const [editItems, setEditItems] = useState(JSON.stringify(config.itemOptions, null, 2));
  const [editAreas, setEditAreas] = useState(config.areaOptions.join('\n'));
  const [editUnits, setEditUnits] = useState(config.unitOptions.join('\n'));
  const [editPeople, setEditPeople] = useState((config.peopleOptions||DEFAULT_PEOPLE).join('\n'));

  // ── 郵件通知設定 ──────────────────────────────────────────
  const mc0 = mergeMailConfig(config.mailConfig);
  const [mailEnabled, setMailEnabled] = useState(mc0.enabled !== false);
  const [areaMails, setAreaMails]     = useState({ ...(mc0.areaRecipients||{}) });
  const [defMails, setDefMails]       = useState(mc0.defaultRecipients || '');
  const [ccMails, setCcMails]         = useState(mc0.cc || '');
  const [weeklyMails, setWeeklyMails] = useState(mc0.weeklyRecipients || '');
  const [testTo, setTestTo]           = useState('');
  const [testing, setTesting]         = useState(false);
  const [preview, setPreview]         = useState(null);   // {kind, subject, html, to}
  const [previewRecId, setPreviewRecId] = useState('');
  const [previewing, setPreviewing]   = useState(false);
  const areaList = editAreas.split('\n').map(s=>s.trim()).filter(Boolean);

  const buildMailConfig = (areaOptions) => {
    const areaRecipients = {};
    areaOptions.forEach(a => { const v=(areaMails[a]||'').trim(); if(v) areaRecipients[a]=v; });
    return { ...mc0, enabled: mailEnabled, areaRecipients,
      defaultRecipients: defMails.trim(), cc: ccMails.trim(), weeklyRecipients: weeklyMails.trim() };
  };

  // 版型預覽（不寄出，直接向 GAS 取回信件 HTML 顯示於下方）
  const doPreview = async (kind) => {
    setPreviewing(true);
    try {
      const rec = previewRecId ? (records||[]).find(r=>String(r.id)===String(previewRecId)) : null;
      const res = await xhrPost(gasUrl, {
        action:'previewMail', kind, record: rec || null,
        itemOptions: config.itemOptions, mailConfig: buildMailConfig(areaList),
      });
      if (res && res.ok) setPreview({ kind, subject: res.subject, html: res.html, to: res.to||'' });
      else alert('❌ 預覽失敗：' + ((res&&res.error)||'未知錯誤') +
        '\n\n若出現「Unknown action」，表示 Apps Script 尚未貼上新版 Code.gs 或尚未重新部署。');
    } catch(e) { alert('❌ 預覽失敗：' + e.message); }
    finally { setPreviewing(false); }
  };

  const sendTestMail = async () => {
    const to = testTo.trim() || defMails.split(',')[0].trim();
    if (!to) { alert('請先輸入測試收件信箱，或填寫「預設收件人」。'); return; }
    setTesting(true);
    try {
      const res = await xhrPost(gasUrl, { action:'testMail', to, mailConfig: buildMailConfig(areaList) });
      alert(res && res.ok ? `✅ 測試信已寄出至 ${to}` : `❌ 寄送失敗：${(res&&res.error)||'未知錯誤'}`);
    } catch(e) { alert('❌ 寄送失敗：' + e.message); }
    finally { setTesting(false); }
  };

  const saveConfig = () => {
    try {
      const itemOptions = JSON.parse(editItems);
      const areaOptions = editAreas.split('\n').map(s=>s.trim()).filter(Boolean);
      const unitOptions = editUnits.split('\n').map(s=>s.trim()).filter(Boolean);
      const peopleOptions = editPeople.split('\n').map(s=>s.trim()).filter(Boolean);
      onSaveConfig({ ...config, itemOptions, areaOptions, unitOptions, peopleOptions,
        mailConfig: buildMailConfig(areaOptions) });
    } catch(e) { alert('項目格式錯誤：' + e.message); }
  };

  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">⚙️ 系統設定</div><div className="page-sub">選項與雲端設定</div></div>
      </div>

      <div className="settings-section">
        <div className="settings-title">☁️ 雲端連線狀態</div>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
          <div className={`sync-dot ${syncState}`} style={{width:10,height:10}}></div>
          <span style={{fontSize:12,color:'var(--text-secondary)',fontFamily:'var(--num)',wordBreak:'break-all'}}>{gasUrl}</span>
        </div>
        {lastSync && <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:16}}>上次同步：{lastSync}</div>}
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <button className="btn btn-secondary" onClick={onRefresh} disabled={saving}>🔄 重新從雲端載入</button>
          <button className="btn btn-danger btn-sm" onClick={()=>{ if(confirm('確定要斷線？將會清除連線設定，需重新輸入 GAS 網址。')) { sessionStorage.removeItem(SS_KEY); onDisconnect(); } }}>🔌 斷線重設</button>
        </div>
      </div>

      <div className="settings-section">
        <div className="settings-title">📋 環保項目（JSON 格式）</div>
        <div className="settings-row">
          <label>項目清單（數字索引：名稱）</label>
          <textarea value={editItems} onChange={e=>setEditItems(e.target.value)} rows={14} style={{resize:'vertical'}} />
        </div>
      </div>
      <div className="settings-section">
        <div className="settings-title">📍 工區設定（每行一個）</div>
        <div className="settings-row">
          <textarea value={editAreas} onChange={e=>setEditAreas(e.target.value)} rows={5} style={{resize:'vertical'}} />
        </div>
      </div>
      <div className="settings-section">
        <div className="settings-title">🏢 單位設定（每行一個）</div>
        <div className="settings-row">
          <textarea value={editUnits} onChange={e=>setEditUnits(e.target.value)} rows={4} style={{resize:'vertical'}} />
        </div>
      </div>
      <div className="settings-section">
        <div className="settings-title">👤 人員清單（每行一人，開單人 &amp; 關單人共用）</div>
        <div className="settings-row">
          <textarea value={editPeople} onChange={e=>setEditPeople(e.target.value)} rows={10} style={{resize:'vertical'}} placeholder="每行一個人名..." />
        </div>
        <div style={{fontSize:11,color:'var(--text-muted)',marginTop:6}}>
          新增或修改後按下方「儲存設定至雲端」即生效，表單中的下拉選單會同步更新。
        </div>
      </div>
      <div className="settings-section">
        <div className="settings-title">📧 郵件通知設定</div>

        <label style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,cursor:'pointer',fontSize:13,color:'var(--text-secondary)'}}>
          <input type="checkbox" checked={mailEnabled} onChange={e=>setMailEnabled(e.target.checked)} style={{width:16,height:16,cursor:'pointer'}} />
          <span>啟用郵件通知（新增改善單／關單／到期前 2 天提醒／每週一未關單彙總）</span>
        </label>

        <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:12,lineHeight:1.7}}>
          每欄可填多個信箱，以逗號 <code style={{color:'var(--accent-orange)'}}>,</code> 分隔。<br/>
          工區未填寫者，一律寄給下方「預設收件人」。
        </div>

        {areaList.map(a => (
          <div className="settings-row" key={a}>
            <label>📍 {a}</label>
            <input type="text" value={areaMails[a]||''} placeholder="paul@example.com, sean@example.com"
              onChange={e=>setAreaMails(m=>({...m, [a]: e.target.value}))} />
          </div>
        ))}

            <button className="btn btn-secondary btn-sm" disabled={previewing} onClick={()=>doPreview('closed')}>✅ 關單通知</button>

        {preview && (

            <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',padding:'10px 14px',background:'var(--bg-secondary)',borderBottom:'1px solid var(--border)'}}>

                <div style={{fontSize:12,fontWeight:700,color:'var(--text-primary)',wordBreak:'break-all'}}>{preview.subject}</div>
                {preview.kind!=='weekly' && preview.to &&
                  <div style={{fontSize:11,color:'var(--text-muted)',marginTop:3}}>將寄給：{preview.to}</div>}
              </div>
              <button className="btn btn-secondary btn-sm" onClick={()=>setPreview(null)}>✕ 關閉預覽</button>
            </div>
            <iframe title="mail-preview" srcDoc={preview.html} sandbox=""
              style={{width:'100%',height:560,border:'none',background:'#fff',display:'block'}} />
          </div>
        )}

        <div className="settings-row">
          <label>🧪 測試寄信（留空則使用預設收件人）</label>
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            <input type="text" value={testTo} placeholder="test@example.com" style={{flex:1,minWidth:220}}
              onChange={e=>setTestTo(e.target.value)} />
            <button className="btn btn-secondary" onClick={sendTestMail} disabled={testing}>

                setTesting(true);

                finally { setTesting(false); }

          ・關單期限前 2 天 <b>12:00</b> 自動寄出到期提醒（依工區規則）<br/>
          ・每週一 <b>09:00</b> 寄出所有未關單彙總報表<br/>
          設定完成後請按下方「儲存設定至雲端」，定時信才會使用最新收件人。
        </div>
      </div>

      <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
        <button className="btn btn-primary" onClick={saveConfig} disabled={saving}>
          {saving ? '⏳ 儲存中...' : '☁️ 儲存設定至雲端'}
        </button>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────
function App() {
  // ── 連線狀態 ──────────────────────────────────────────────
  const [gasUrl, setGasUrl] = useState(GAS_URL);
  const [connected, setConnected] = useState(false);
  // 若 GAS_URL 常數已填，自動連線不需手動輸入
  React.useEffect(() => {
    if (GAS_URL && !connected) {
      loadFromCloud(GAS_URL).catch(() => {});
    }
  }, []);

  // ── 純雲端資料（不存 localStorage）────────────────────────
  const [records, setRecords] = useState([]);
  const [config, setConfig] = useState({
    itemOptions: DEFAULT_ITEMS,
    areaOptions: DEFAULT_AREAS,
    unitOptions: DEFAULT_UNITS,
    peopleOptions: DEFAULT_PEOPLE,
    mailConfig: DEFAULT_MAIL_CONFIG,
  });

  // ── UI 狀態 ───────────────────────────────────────────────
  const [tab, setTab] = useState('dashboard');
  const [activeFilter, setActiveFilter] = useState(null);
  const [loading, setLoading] = useState(false);
  const [loadingMsg, setLoadingMsg] = useState('');
  const [saving, setSaving] = useState(false);
  const [syncState, setSyncState] = useState('idle'); // idle | ok | busy | error
  const [lastSync, setLastSync] = useState('');
  const [toasts, setToasts] = useState([]);

  const toast = useCallback((msg, type='success') => {
    const id = genId();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }, []);

  // ── 雲端載入 ──────────────────────────────────────────────
  // ── 資料格式轉換（舊格式相容）────────────────────────────
  const normalizeRecords = (recs) => recs.map(r => {
    let rec = {...r};
    if (!rec.defects || rec.defects.length === 0)
      rec.defects = [{ item: rec.item || 1, description: rec.description || '' }];
    rec.status = (rec.submitDate && rec.submitDate !== '' && rec.submitDate !== '-') ? 'Closed' : 'Open';
    return rec;
  });

  const loadFromCloud = useCallback(async (url) => {
    setLoading(true); setLoadingMsg('從雲端載入資料...');
    try {
      const data = await xhrGet((url||gasUrl) + '?action=index');
      let cloudRecords = normalizeRecords(data.records || []);
      const cfg = {
        itemOptions:  (data.config?.itemOptions  || data.itemOptions)  || DEFAULT_ITEMS,
        areaOptions:  (data.config?.areaOptions  || data.areaOptions)  || DEFAULT_AREAS,
        unitOptions:  (data.config?.unitOptions  || data.unitOptions)  || DEFAULT_UNITS,
        peopleOptions:(data.config?.peopleOptions|| data.peopleOptions)|| DEFAULT_PEOPLE,
        issuerRoles:  (data.config?.issuerRoles  || {}),
        mailConfig:   mergeMailConfig(data.config?.mailConfig),
      };
      if (cloudRecords.length === 0) {
        setLoadingMsg('首次連線，正在遷移資料至 Drive...');
        let seedRecs = SEED_RECORDS;
        try {
          const oldData = await xhrGet((url||gasUrl) + '?action=read');
          if (oldData.records && oldData.records.length > 0)
            seedRecs = normalizeRecords(oldData.records);
        } catch(e) {}
        setLoadingMsg(`一次性遷移 ${seedRecs.length} 筆，請稍候（約 30 秒）...`);
        await xhrPost((url||gasUrl), { action:'migrateAll', records: seedRecs, config: cfg });
        cloudRecords = seedRecs;
      }
      setRecords(cloudRecords);
      setConfig(cfg);
      setLastSync(new Date().toLocaleString('zh-TW'));
      setSyncState('ok'); setConnected(true);
    } catch(e) {
      setSyncState('error');
      toast('載入失敗：' + e.message, 'error');
      throw e;
    } finally { setLoading(false); }
  }, [gasUrl, toast]);

  // ── 連線回調 ──────────────────────────────────────────────
  const handleConnect = async (url) => {
    setGasUrl(url);
    await loadFromCloud(url);
  };

  // ── 寫單筆到 Drive ────────────────────────────────────────
  const saveRecordToDrive = async (record) => {
    setSaving(true); setSyncState('busy');
    try {
      const res = await xhrPost(gasUrl, { action:'saveRecord', record });
      if (!res.success) throw new Error(res.error || '儲存失敗');
      setLastSync(new Date().toLocaleString('zh-TW'));
      setSyncState('ok');
    } catch(e) {
      setSyncState('error');
      toast('雲端儲存失敗：' + e.message, 'error');
      throw e;
    } finally { setSaving(false); }
  };

  // ── 郵件通知（交由 GAS 以 MailApp 寄出）────────────────────
  // kind：'new' 新增改善單 ｜ 'closed' 改善單關閉
  const sendMailNotify = useCallback(async (record, kind) => {
    const mc = mergeMailConfig(config.mailConfig);
    if (!mc.enabled) return;
    try {
      const res = await xhrPost(gasUrl, {
        action: 'sendMail', kind, record,
        mailConfig: mc, itemOptions: config.itemOptions,
      });
      if (res && res.ok) toast(`📧 通知信已寄出：${res.to || ''}`);
      else toast('⚠️ 通知信未寄出：' + ((res && res.error) || '收件人未設定'), 'error');
    } catch(e) {
      toast('⚠️ 通知信寄送失敗：' + e.message, 'error');
    }
  }, [gasUrl, config, toast]);

  // ── CRUD ──────────────────────────────────────────────────
  const addRecord = async (form) => {
    try {
      await saveRecordToDrive(form);
      setRecords(prev => [...prev, form]);
      toast('紀錄已新增並儲存至雲端');
      sendMailNotify(form, 'new');
    } catch {}
  };

  const editRecord = async (form) => {
    const before = records.find(r => r.id === form.id);
    try {
      await saveRecordToDrive(form);
      setRecords(prev => prev.map(r => r.id===form.id ? form : r));
      toast('紀錄已更新');
      // 由未關單 → 已關單 時寄出結案通知
      if (form.status === 'Closed' && (!before || before.status !== 'Closed'))
        sendMailNotify(form, 'closed');
    } catch {}
  };

  const deleteRecord = async (id) => {
    const target = records.find(r => r.id === id);
    try {
      if (target && target.driveFolderId) {
        const deleteDate = new Date().toISOString().slice(0,10);
        await xhrPost(gasUrl, {
          action: 'archiveAndDeleteFolder',
          folderId: target.driveFolderId,
          archiveName: `Deleted @ ${deleteDate} _ ${target.number}`,
          type: target.type,
        });
      }
      setSaving(true); setSyncState('busy');
      const res = await xhrPost(gasUrl, { action:'deleteRecord', id });
      if (!res.success) throw new Error(res.error || '刪除失敗');
      setRecords(prev => prev.filter(r => r.id !== id));
      setLastSync(new Date().toLocaleString('zh-TW'));
      setSyncState('ok');
      toast('紀錄已刪除');
    } catch(e) {
      setSyncState('error');
      toast('刪除失敗：' + e.message, 'error');
    } finally { setSaving(false); }
  };

  const saveConfig = async (newConfig) => {
    try {
      setSaving(true); setSyncState('busy');
      const res = await xhrPost(gasUrl, { action:'saveConfig', config: newConfig });
      if (!res.success) throw new Error(res.error || '儲存失敗');
      setConfig(newConfig);
      setLastSync(new Date().toLocaleString('zh-TW'));
      setSyncState('ok');
      toast('設定已儲存至雲端');
    } catch(e) {
      setSyncState('error');
      toast('設定儲存失敗：' + e.message, 'error');
    } finally { setSaving(false); }
  };

  const handleDisconnect = () => {
    setGasUrl('');
    setConnected(false);
    setRecords([]);
    setSyncState('idle');
  };

  // ── 未連線 → 顯示設定畫面 ─────────────────────────────────
  if (!gasUrl || (!connected && !loading)) {
    return (
      <>
        <SetupScreen onConnect={handleConnect} />
        {loading && (
          <div className="g-loading">
            <div className="g-loading-spinner"></div>
            <div className="g-loading-text">{loadingMsg}</div>
          </div>
        )}
      </>
    );
  }

  const openCnt = records.filter(r=>r.status==='Open').length;

  return (
    <div className="app-shell">
      {/* Global Loading */}
      {loading && (
        <div className="g-loading">
          <div className="g-loading-spinner"></div>
          <div className="g-loading-text">{loadingMsg}</div>
        </div>
      )}

      {/* Topbar */}
      <div className="topbar">
        <div className="topbar-icon">🌿</div>
        <div>
          <div className="topbar-title">{PROJECT.shortName}</div>
          <div className="topbar-sub">EHS Improvement Order System</div>
        </div>
        <div className="topbar-divider"></div>
        <div className="topbar-project">
          <div className="topbar-project-name">{PROJECT.name}</div>
          <div className="topbar-project-client">業主：{PROJECT.client}</div>
        </div>
        <div className="sync-status">
          <div className={`sync-dot ${syncState}`}></div>
          <span className="sync-text">
            {syncState==='ok'?'已同步':syncState==='busy'?'同步中':syncState==='error'?'失敗':'—'}
          </span>
        </div>
      </div>

      {/* Nav */}
      <nav className="nav">
        {[
          {id:'dashboard', label:'📊 儀表板'},
          {id:'records', label:'📋 紀錄管理', badge: openCnt>0 ? openCnt : null},
          {id:'stats', label:'📈 開單統計'},
          {id:'settings', label:'⚙️ 設定'},
        ].map(n=>(
          <button key={n.id} className={`nav-btn${tab===n.id?' active':''}`} onClick={()=>setTab(n.id)}>
            {n.label}
            {n.badge && <span className="nav-badge">{n.badge}</span>}
          </button>
        ))}
      </nav>

      {/* Content */}
      <div className="content">
        {tab==='dashboard' && <DashboardTab records={records} itemOptions={config.itemOptions} onFilterClick={filter=>{ if(filter._newrecord){ setTab('records'); setActiveFilter({_newrecord:true, _ts:Date.now()}); } else { setActiveFilter({...filter, _ts: Date.now()}); setTab('records'); } }} onExport={(exportData)=>{
          // 動態建立排版精美的匯出元素
          const doExport = () => {
            const dateStr = new Date().toLocaleDateString('zh-TW');
            const el = document.createElement('div');
            el.style.cssText = `

                        <div style="font-family:'Courier New',monospace;font-size:40px;font-weight:900;line-height:1;color:${c.color};margin-bottom:5px;">${c.value}</div>
                        <div style="font-size:9px;color:${c.sub2};line-height:1.5;">${c.sub}</div>

                  </div>
                  <div style="background:#fff;border:1px solid #d1dae6;border-radius:10px;padding:12px 14px;flex:1;min-height:0;">
                    <div style="font-size:10px;font-weight:800;color:#1e3a5f;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #e2eaf2;">📊 環境缺失分類統計 / Env. Defect Category Statistics</div>
                    ${itemRows}
                  </div>
                </div>
                <!-- 右欄 -->
                <div style="display:flex;flex-direction:column;background:#fff;">
                  <div style="background:linear-gradient(135deg,#0c1f3d,#1e3a5f);padding:14px 18px;display:flex;align-items:center;gap:10px;flex-shrink:0;">

                      <div style="font-size:13px;font-weight:700;color:#e8f4fd;line-height:1.3;">通霄電廠二期海底輸氣管線統包工程</div>
                      <div style="font-size:10px;font-style:italic;color:#93c5e8;margin-top:1px;">Tongxiao PP Ph.II Subsea Gas Pipeline EPC</div>

                    </div>
                    <div style="font-size:10px;color:#4a7a9a;text-align:right;white-space:nowrap;">NMDC Energy</div>
                  </div>
                  <div style="flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 16px 8px;gap:6px;">
                    <div style="font-size:11px;font-weight:800;color:#1e3a5f;letter-spacing:.5px;align-self:flex-start;">缺失項目分布 / Defect Distribution</div>

                        const EN=['','Exposed Area','Site Entrance','Vehicle Route','Housekeeping','Wastewater/Oil','Contract Specs'];
                        return `<div style="display:flex;align-items:center;gap:5px;">
                          <div style="width:10px;height:10px;border-radius:3px;background:${pieColors[i%pieColors.length]};flex-shrink:0;margin-top:2px;align-self:flex-start;"></div>
                          <div>
                            <div style="font-size:9.5px;color:#1e3a5f;font-weight:700;line-height:1.2;">${k}. ${iopts[k]||''} <span style="font-family:'Courier New',monospace;font-weight:900;color:${pieColors[i%pieColors.length]};">${Math.round(v.total/pieTotal*100)}%</span></div>
                            <div style="font-size:8px;color:#94abbe;font-style:italic;">${EN[k]||''}</div>
                          </div>
                        </div>`;
                      }).join('')}
                    </div>
                  </div>
                </div>
              </div>`;

            requestAnimationFrame(() => {
              const cvs = el.querySelector('#export-pie');
              if (!cvs) return;
              const ctx = cvs.getContext('2d');
              const cx = 220, cy = 220, r = 205, ir = 95;
              let angle = -Math.PI / 2;

              pieEntries.forEach(([k, v], i) => {
                const slice = (v.total / pieTotal) * Math.PI * 2;
                const pct = Math.round(v.total / pieTotal * 100);
                const color = pieColors[i % pieColors.length];

                // 扇形（加 1px 間隙讓每片有分隔感）
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, angle + 0.015, angle + slice - 0.015);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.shadowColor = 'rgba(0,0,0,0.15)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.restore();

                // 切片內文字（% + 縮寫）
                if (pct >= 4) {
                  const mid = angle + slice / 2;
                  const labelR = (r * 0.65);
                  const lx = cx + Math.cos(mid) * labelR;
                  const ly = cy + Math.sin(mid) * labelR;
                  ctx.save();
                  ctx.translate(lx, ly);
                  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                  // 百分比（大）
                  ctx.fillStyle = '#ffffff';
                  ctx.font = 'bold 18px Courier New';
                  ctx.fillText(pct + '%', 0, pct >= 8 ? -8 : 0);
                  // 縮寫名稱（小，只有夠大的切片才顯示）
                  if (pct >= 8) {
                    const name = (iopts[k] || '').replace(/防制措施/,'防制').replace(/廢水廢油/,'廢油').replace(/出入口/,'出入').slice(0, 4);
                    ctx.font = '11px sans-serif';
                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    ctx.fillText(name, 0, 10);
                  }
                  ctx.restore();
                }
                angle += slice;
              });

              // 甜甜圈中心
              ctx.beginPath();
              ctx.arc(cx, cy, ir, 0, Math.PI * 2);
              const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, ir);
              grad.addColorStop(0, '#f8fafc');
              grad.addColorStop(1, '#ffffff');
              ctx.fillStyle = grad;
              ctx.fill();

              // 中心文字
              ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.fillStyle = '#0c1f3d';
              ctx.font = 'bold 38px Courier New';
              ctx.fillText(pieTotal, cx, cy - 12);
              ctx.font = 'bold 13px sans-serif';
              ctx.fillStyle = '#5a7899';
              ctx.fillText('缺失件數', cx, cy + 16);
            });
            document.body.appendChild(el);
            // 強制載入字體後再截圖
            document.fonts.ready.then(() => {
              setTimeout(() => html2canvas(el, {
                scale: 4,
                backgroundColor: '#ffffff',
                useCORS: true,
                logging: false,
                allowTaint: true,
                imageTimeout: 0,
              }).then(canvas => {
              document.body.removeChild(el);
              const a = document.createElement('a');
              a.download = `TPC海管工程_KPI總結_${new Date().toISOString().slice(0,10)}.png`;
              a.href = canvas.toDataURL('image/png');
              a.click();
            }), 300);
            });
          };
          if (window.html2canvas) { doExport(); }
          else {
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            s.onload = doExport;
            document.head.appendChild(s);
          }
        }} />}
        {tab==='stats' && <StatsTab records={records} onFilterClick={filter=>{ setActiveFilter({...filter, _ts:Date.now()}); setTab('records'); }}
          issuerRoles={config.issuerRoles||{}}
          onSaveRoles={async (newRoles)=>{
            const newConfig = {...config, issuerRoles: newRoles};
            await saveConfig(newConfig);
          }} />}
        {tab==='records' && (
          <RecordsTab
            records={records} config={config} saving={saving} gasUrl={gasUrl} connected={connected}
            activeFilter={activeFilter}
            onAdd={addRecord} onEdit={editRecord} onDelete={deleteRecord}
            onRefresh={() => loadFromCloud()}
          />
        )}
        {tab==='settings' && (
          <SettingsTab
            config={config} records={records} gasUrl={gasUrl}
            onSaveConfig={saveConfig} onDisconnect={handleDisconnect}
            onRefresh={() => loadFromCloud()} syncState={syncState}
            lastSync={lastSync} saving={saving}
          />
        )}
      </div>

      <ToastContainer toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
