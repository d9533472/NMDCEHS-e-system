<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NMDC 通霄二期 — 查驗紀錄管理系統</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<!-- xlsx 只有「匯入 Excel」會用到，改成需要時才載入（省下每次開頁約 0.9MB / 0.3 秒） -->
<style>
:root{
  --bg:#1e2430;--bg2:#252c3a;--card:#272f3d;--card2:#2d3645;
  --border:#353f51;--border2:#434e63;
  --fg:#d6dde8;--fg2:#eef2f8;--muted:#9aa7b8;--muted2:#7d8a9d;
  --accent:#5fa8b5;--accent2:#6fb6a7;--accent3:#4d94a3;
  --green:#6cbf9a;--green2:#5aab88;--greenBg:rgba(108,191,154,.13);
  --amber:#d6a55c;--amberBg:rgba(214,165,92,.13);
  --red:#d98282;--redBg:rgba(217,130,130,.13);
  --violet:#9b8fc7;
  --radius:9px;--radius-lg:12px;
  --shadow:0 1px 3px rgba(0,0,0,.22);
  --shadow-lg:0 14px 34px rgba(0,0,0,.34);
}
*{box-sizing:border-box;margin:0;padding:0}html,body,#root{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#556278}
input,select,textarea{background:#222937;color:var(--fg);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 12px;font-size:13px;font-family:inherit;outline:none;width:100%;transition:all .18s}
input::placeholder,textarea::placeholder{color:var(--muted2)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(95,168,181,.15)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7)}
select{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%238194ae'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
select option{background:#272f3d;color:var(--fg)}
button{cursor:pointer;font-size:13px;font-family:inherit;border:none;border-radius:var(--radius);padding:8px 16px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.bp{background:var(--accent3);color:#f4fbfc}
.bp:hover{background:var(--accent)}.bp:disabled{opacity:.45;pointer-events:none}
.bg{background:rgba(255,255,255,.04);color:var(--muted);border:1px solid var(--border2)}.bg:hover{background:rgba(255,255,255,.08);color:var(--fg2);border-color:var(--muted2)}
.bd{background:var(--redBg);color:var(--red);border:1px solid rgba(217,130,130,.28)}.bd:hover{background:rgba(217,130,130,.2)}
table{width:100%;border-collapse:collapse;font-size:12.5px}thead{position:sticky;top:0;z-index:2}
th{background:var(--card2);color:var(--muted);font-weight:600;font-size:10.5px;text-align:left;padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--border2);text-transform:uppercase;letter-spacing:.5px}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;word-break:break-word;white-space:normal}
tbody tr{transition:background .12s}tbody tr:hover{background:rgba(255,255,255,.035)}
.mono{font-family:'JetBrains Mono',monospace;font-size:11.5px}.num{text-align:right;font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',monospace;font-size:12px}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.fi{animation:fadeIn .35s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
.tw{position:fixed;bottom:24px;right:24px;z-index:9999}
.toast{padding:12px 20px;border-radius:var(--radius);font-size:13px;font-weight:600;animation:su .3s ease;border:1px solid;margin-top:8px;box-shadow:var(--shadow-lg);backdrop-filter:blur(8px)}
@keyframes su{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.fl{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}
.pt{height:6px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}.pf{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.ov{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center}
.ob{position:fixed;inset:0;background:rgba(15,19,26,.62);backdrop-filter:blur(3px)}
.md{position:relative;background:var(--card);border-radius:var(--radius-lg);padding:28px;border:1px solid var(--border2);box-shadow:var(--shadow-lg);animation:fadeIn .25s ease}
.cb{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px}
.cok{background:var(--greenBg);color:var(--green);border:1px solid rgba(108,191,154,.28)}
.csy{background:rgba(95,168,181,.14);color:var(--accent);border:1px solid rgba(95,168,181,.3)}
.login-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(95,168,181,.14);color:var(--accent);border:1px solid rgba(95,168,181,.3)}
/* ── 卡片 ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);position:relative;overflow:hidden}
/* ── 達成儀表 ── */
.gauge-num{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:-.5px}
.ring-bg{stroke:rgba(255,255,255,.08)}
.hero-amt{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:-.5px;color:var(--fg2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,.035)}
.dotp{width:7px;height:7px;border-radius:50%}
.navi{padding:10px 14px;border-radius:var(--radius);cursor:pointer;font-size:13px;transition:all .15s;display:flex;align-items:center;gap:9px;border:1px solid transparent}
.navi:hover{background:rgba(255,255,255,.05);color:var(--fg2)}
.navi.on{background:rgba(95,168,181,.14);color:var(--accent);border-color:rgba(95,168,181,.25);font-weight:600}
/* 查驗總表：欄位多，改成水平捲動不擠壓 */
.tbl-wide{min-width:1240px}
.tbl-wide td{white-space:nowrap}
.tbl-wide td:nth-child(3){white-space:normal;min-width:190px}
.tbl-wide th{font-size:10px;line-height:1.35;white-space:normal;max-width:96px}
@media(max-width:900px){.fr{grid-template-columns:1fr}.fr3{grid-template-columns:1fr}.sidebar{display:none!important}.mnav{display:flex!important}}
</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#7c8ba0"><div class="spinner" style="width:24px;height:24px;margin-right:12px"></div>載入雲端資料...</div></div>
<script type="text/babel">
const VER='4.2.0';
/* 三階段流程；stage 3（已提交台電）= 計入「已查驗金額」 */
const STAGES=[
  {n:1,l:'NMDC自檢完成',s:'自檢',c:'#8c96cc',bg:'rgba(140,150,204,.14)'},
  {n:2,l:'POE查驗完成',s:'POE完成',c:'#5fa8b5',bg:'rgba(95,168,181,.14)'},
  {n:3,l:'已提交台電',s:'已提交',c:'#6cbf9a',bg:'rgba(108,191,154,.14)'},
];
const FINAL_STAGE=3;
/* 後端已負責把舊 5 階段換算成 1~3（1,2→1 / 3→2 / 4,5→3），前端只做範圍保護（不可重複換算） */
const mapStage=s=>{const n=parseInt(s)||1;return n<1?1:(n>FINAL_STAGE?FINAL_STAGE:n)};
/* 工區清單（可自行增修） */
const WORK_AREAS=['台中工區','通霄工區','離岸作業','專案'];
/* 項目簡稱 = 預算項目名稱最後一個逗號之後的文字 */
const shortItem=s=>{const t=String(s||'').trim();if(!t)return'';const p=t.split(/[，,]/);return(p[p.length-1]||'').trim()||t};
/* Drive 子資料夾名稱 = 查驗編號 + 工區 + 項目（多項目：第一項＋等N項） */
const itemsLabel=names=>{const a=(Array.isArray(names)?names:[names]).map(shortItem).filter(Boolean);if(!a.length)return'';return a.length===1?a[0]:a[0]+' 等'+a.length+'項'};
const folderName=(no,area,items)=>[String(no||'').trim(),String(area||'').trim(),itemsLabel(items)].filter(Boolean).join(' ');
/* 不可量化項目（LS 一式，6.2.x）：數量以「請款百分比」計 */
const isLS=b=>!!b&&(String(b.unit||'').trim().toUpperCase()==='LS'||String(b.item_no||'').startsWith('6.2'));
/* 查驗表編號：明細列 id 為「表編號-序號」（NMDC-POE-BOQ-E-016-2 → NMDC-POE-BOQ-E-016）；
   本身就是表編號的（NMDC-POE-BOQ-E-001）不可再砍 */
const groupIdOf=id=>{const s=String(id==null?'':id).trim();const m=s.match(/^(.*-\d+)-\d+$/);return m?m[1]:s};
const groupOf=r=>r?.group_id||groupIdOf(r?.id);
/* 附件單檔上限 MB（Apps Script 單次請求上限約 50MB，超過會直接失敗） */
const MAX_FILE_MB=40;
const DEFAULT_API='https://script.google.com/macros/s/AKfycbxJAuZHtubqyArcDCJetUH7Czdffo_vbystwcipZP-rqEG3Uzmv61emQ7fZp-JYM3Bffg/exec';
const{useState,useEffect,useMemo,useCallback,useRef}=React;

const mkApi=u=>({
  get:async(a,p={})=>{const url=new URL(u);url.searchParams.set('action',a);Object.entries(p).forEach(([k,v])=>url.searchParams.set(k,v));const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.error)throw Error(d.error);return d},
  /* wantSummary=true：後端在同一個回應裡順便回傳最新統計，省掉一次 3 秒的 getSummary */
  post:async(a,d={},wantSummary)=>{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:a,data:d,want_summary:!!wantSummary})});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error(j.error);return j},
});

/* 本機快取：開頁先用上次的資料立刻渲染，再於背景更新 */
const CACHE_KEY='nmdc_insp_cache_v1';
const cacheLoad=()=>{try{const c=JSON.parse(localStorage.getItem(CACHE_KEY));return(c&&c.data&&c.ts)?c:null}catch{return null}};
const cacheSave=d=>{try{localStorage.setItem(CACHE_KEY,JSON.stringify({ts:new Date().toISOString(),data:d}))}catch(e){}};

/* xlsx 需要時才載入 */
const loadXLSX=()=>new Promise((res,rej)=>{
  if(window.XLSX)return res(window.XLSX);
  const s=document.createElement('script');
  s.src='https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
  s.onload=()=>res(window.XLSX);s.onerror=()=>rej(Error('無法載入 Excel 解析元件'));
  document.head.appendChild(s);
});

const fmt=n=>(n==null||isNaN(n))?'—':new Intl.NumberFormat('zh-TW').format(Math.round(n));
const fN=n=>(n==null||isNaN(n))?'—':'NT$ '+fmt(n);
const fP=n=>(n==null||isNaN(n))?'—':(n*100).toFixed(1)+'%';
const fD=d=>{if(!d)return'—';try{const x=new Date(d);return isNaN(x)?String(d).slice(0,10):x.toLocaleDateString('zh-TW')}catch{return String(d).slice(0,10)}};
const fT=d=>{if(!d)return'';try{return new Date(d).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}catch{return''}};
const td=()=>new Date().toISOString().slice(0,10);

const Dot=({r})=>{const c=r===0?'#5d6f8a':r<1?'var(--amber)':'var(--green)';return<span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:11,fontWeight:600}}><span style={{width:7,height:7,borderRadius:'50%',background:c}}/>{r===0?'未開始':r<1?'進行中':'已完成'}</span>};
/* ── EditCell: 點擊即編輯，blur/Enter 存雲端 ── */
function EC({val,field,id,onSave,ok,isN,style:st}){
  const[e,sE]=useState(false);const[v,sV]=useState(val);const r=useRef();
  useEffect(()=>{sV(val)},[val]);
  useEffect(()=>{if(e&&r.current){r.current.focus();if(r.current.select)r.current.select()}},[e]);
  const save=()=>{sE(false);const nv=isN?parseFloat(v)||0:v;if(String(nv)!==String(val))onSave(id,{[field]:nv})};
  if(!ok||!e)return<span onClick={ev=>{ev.stopPropagation();if(ok)sE(true)}} style={{...st,cursor:ok?'pointer':'default',borderBottom:ok?'1px dashed #cbd5e1':'none'}} title={ok?'點擊編輯':''}>{isN?fmt(val):(val||'—')}</span>;
  return<input ref={r} type={isN?'number':'text'} step={isN?'any':undefined} value={v} onClick={ev=>ev.stopPropagation()} onChange={ev=>sV(ev.target.value)} onBlur={save} onKeyDown={ev=>{if(ev.key==='Enter')save();if(ev.key==='Escape'){sV(val);sE(false)}}} style={{width:isN?85:'100%',padding:'2px 6px',fontSize:12,fontFamily:isN?"'JetBrains Mono'":"inherit",textAlign:isN?'right':'left',border:'1.5px solid var(--accent)',borderRadius:4,background:'rgba(95,168,181,.14)',outline:'none'}}/>;
}
/* ── StageBadge ── */
function SB({stage,small}){const st=STAGES[mapStage(stage)-1]||STAGES[0];return<span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:small?9:10,fontWeight:600,padding:small?'2px 6px':'3px 10px',borderRadius:20,background:st.bg,color:st.c,whiteSpace:'nowrap',border:'1px solid '+st.c+'22'}}><span style={{width:small?5:6,height:small?5:6,borderRadius:'50%',background:st.c}}/>{small?st.s:st.l}</span>}
const Cloud=({s,t})=>s==='syncing'?<span className="cb csy"><span className="spinner" style={{width:10,height:10,borderWidth:1.5}}/> 同步中</span>:<span className="cb cok">☁ 雲端 {t&&fT(t)}</span>;
const Kpi=({l,v,s,a,i})=><div className="fi card" style={{padding:'17px 20px',flex:'1 1 170px',minWidth:158,borderLeft:'3px solid '+(a||'var(--accent)')}}><div style={{position:'absolute',top:8,right:12,fontSize:30,opacity:.07}}>{i}</div><div style={{fontSize:10.5,color:'var(--muted)',fontWeight:600,textTransform:'uppercase',letterSpacing:.6}}>{l}</div><div style={{fontSize:21,fontWeight:800,color:'var(--fg2)',marginTop:6,fontFamily:"'JetBrains Mono'"}}>{v}</div>{s&&<div style={{fontSize:11,color:a||'var(--muted)',marginTop:3,fontWeight:600}}>{s}</div>}</div>;
/* ── 達成率圓弧儀表 ── */
function Ring({pct,size,label,sub,c1,c2}){
  const gid=useMemo(()=>'rg'+Math.random().toString(36).slice(2,8),[]);
  const S=size||150,W=Math.round(S*.085),r=(S-W)/2,C=2*Math.PI*r;
  const p=Math.max(0,Math.min(parseFloat(pct)||0,1));
  const a=c1||'#5fa8b5',b=c2||'#6fb6a7';
  return<div style={{textAlign:'center',flex:'0 0 auto'}}>
    <div style={{position:'relative',width:S,height:S}}>
      <svg width={S} height={S} style={{transform:'rotate(-90deg)'}}>
        <defs><linearGradient id={gid} x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor={a}/><stop offset="100%" stopColor={b}/></linearGradient></defs>
        <circle className="ring-bg" cx={S/2} cy={S/2} r={r} strokeWidth={W} fill="none"/>
        <circle cx={S/2} cy={S/2} r={r} strokeWidth={W} fill="none" stroke={'url(#'+gid+')'} strokeLinecap="round"
          strokeDasharray={C} strokeDashoffset={C*(1-p)} style={{transition:'stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)'}}/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2}}>
        <div className="gauge-num" style={{fontSize:S*.2,color:'var(--fg2)'}}>{(p*100).toFixed(1)}<span style={{fontSize:S*.1}}>%</span></div>
        {p>=1&&<div style={{fontSize:10,color:'var(--green)',fontWeight:700}}>🏆 達標</div>}
      </div>
    </div>
    <div style={{fontSize:11.5,fontWeight:700,color:'var(--fg2)',marginTop:8}}>{label}</div>
    {sub&&<div style={{fontSize:10,color:'var(--muted)',marginTop:2,fontFamily:"'JetBrains Mono'"}}>{sub}</div>}
  </div>;
}
const Mdl=({open,close,title,wide,children})=>{if(!open)return null;return<div className="ov" onClick={close}><div className="ob"/><div className="md" onClick={e=>e.stopPropagation()} style={{maxWidth:wide?960:640,width:'95vw',maxHeight:'88vh',overflowY:'auto'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20,paddingBottom:14,borderBottom:'1px solid var(--border)'}}><h3 style={{fontSize:17,fontWeight:800,color:'var(--fg2)'}}>{title}</h3><button onClick={close} style={{background:'none',border:'none',fontSize:18,cursor:'pointer',color:'var(--muted)'}}>✕</button></div>{children}</div></div>};

/* ── Form：一張查驗表可含多個預算項目 ── */
function Form({bi,ins,init,fixId,onOk,onNo,ld,api}){
  const ID_PREFIX='NMDC-POE-BOQ-E-';
  const isEdit=!!init;
  const initNo=init?String(init.id).replace(ID_PREFIX,''):'';
  const[autoNo,sAutoNo]=useState('');
  useEffect(()=>{if(!isEdit&&api){api.get('getNextNumber').then(r=>{sAutoNo(String(r.next_number).padStart(3,'0'))}).catch(()=>{})}},[]);
  const[f,sF]=useState({inspection_no:initNo,work_area:init?.work_area||'',inspection_date:init?.inspection_date?String(init.inspection_date).slice(0,10):td(),submit_date:init?.submit_date?String(init.submit_date).slice(0,10):'',note:init?.note||'',stage:init?mapStage(init.stage):1,link_folder_url:''});
  const[rows,sRows]=useState(()=>init?.rows?.length
    ?init.rows.map(r=>({row_id:r.id,budget_item_id:r.budget_item_id,qty:String(r.inspected_qty??''),note:r.note||''}))
    :[{row_id:'',budget_item_id:fixId||'',qty:'',note:''}]);
  const[files,sFiles]=useState([]);const fr=useRef();

  const bItem=id=>bi.find(b=>b.id===id);
  const setRow=(i,patch)=>sRows(p=>p.map((r,j)=>j===i?{...r,...patch}:r));
  const addRow=()=>sRows(p=>[...p,{row_id:'',budget_item_id:'',qty:'',note:''}]);
  const delRow=i=>sRows(p=>p.length>1?p.filter((_,j)=>j!==i):p);

  /* 該項目已被其他紀錄用掉的量（排除本表既有明細）＋本表其他列 */
  const used=(bid,idx)=>{
    if(!bid)return 0;
    const mine=rows.map(r=>r.row_id).filter(Boolean);
    const other=ins.filter(i=>i.budget_item_id===bid&&!mine.includes(i.id)).reduce((s,i)=>s+(parseFloat(i.inspected_qty)||0),0);
    const same=rows.reduce((s,r,j)=>(j!==idx&&r.budget_item_id===bid)?s+(parseFloat(r.qty)||0):s,0);
    return other+same;
  };
  const rowAmt=r=>{const b=bItem(r.budget_item_id);return b?(parseFloat(r.qty)||0)*(parseFloat(b.unit_price)||0):0};
  const total=rows.reduce((s,r)=>s+rowAmt(r),0);
  const names=rows.map(r=>bItem(r.budget_item_id)?.item_name_cn).filter(Boolean);
  const fullNo=ID_PREFIX+(f.inspection_no||autoNo||'XXX');

  const submit=()=>{
    if(isEdit&&!String(f.inspection_no||'').trim())return alert('編輯時必須保留查驗編號');
    if(!f.work_area)return alert('請選擇工區');
    if(!f.inspection_date)return alert('請輸入查驗日期');
    const seen={};
    for(let i=0;i<rows.length;i++){
      const r=rows[i],b=bItem(r.budget_item_id),n='第 '+(i+1)+' 個項目';
      if(!r.budget_item_id)return alert(n+'尚未選擇預算項目');

/* ── ItemDetail ── */
function Detail({item:it,ins,onAdd,onEdit,onDel,auth}){
  const recs=ins.filter(i=>i.budget_item_id===it.id).sort((a,b)=>String(b.id).localeCompare(String(a.id)));
  const price=parseFloat(it.unit_price||0);const amtOf=i=>parseFloat(i.inspected_amount||0)||(parseFloat(i.inspected_qty||0)*price);
  const bq=parseFloat(it.budget_qty||0),bt=parseFloat(it.budget_total||0);
  const okR=recs.filter(i=>mapStage(i.stage)>=FINAL_STAGE);
  const qA=recs.reduce((s,i)=>s+(parseFloat(i.inspected_qty)||0),0),aA=recs.reduce((s,i)=>s+amtOf(i),0);
  const qO=okR.reduce((s,i)=>s+(parseFloat(i.inspected_qty)||0),0),aO=okR.reduce((s,i)=>s+amtOf(i),0);
  return<div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginBottom:18,fontSize:12.5}}><div>類別: <strong>{it.category}</strong></div><div>單位: <strong>{it.unit}</strong></div><div>編碼: <span className="mono" style={{fontSize:11}}>{it.code}</span></div></div>
    <div style={{display:'flex',gap:12,marginBottom:18,flexWrap:'wrap'}}><Kpi l="預算數量" v={fmt(bq)} a="var(--muted)" i="📦"/><Kpi l="已查驗（已提交台電）" v={fmt(qO)} s={fN(aO)} a="var(--green)" i="✅"/>{(qA-qO)>0&&<Kpi l="進行中（自檢／POE）" v={fmt(qA-qO)} s={fN(aA-aO)} a="#0ea5e9" i="⏳"/>}<Kpi l="未查驗" v={fmt(Math.max(bq-qA,0))} s={fN(Math.max(bt-aA,0))} a="var(--amber)" i="📋"/><Kpi l="查驗比例" v={fP(bq>0?qO/bq:0)} a="var(--accent)" i="📊"/></div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}><h4 style={{fontSize:14,fontWeight:700}}>歷次查驗 ({recs.length}筆)</h4>{auth&&<button className="bp" style={{fontSize:12,padding:'5px 14px'}} onClick={onAdd}>＋ 新增</button>}</div>
    {recs.length===0?<div style={{padding:32,textAlign:'center',color:'var(--muted)'}}>尚無查驗紀錄</div>
    :<div style={{overflowX:'auto'}}><table><thead><tr><th>編號</th><th>階段</th><th>工區</th><th>查驗日期</th><th>提交台電日</th><th style={{textAlign:'right'}}>數量</th><th style={{textAlign:'right'}}>金額</th><th>備註</th><th>資料夾／附件</th>{auth&&<th>操作</th>}</tr></thead><tbody>
      {recs.map(r=><tr key={r.id}><td className="mono" style={{color:'var(--accent)',fontSize:11}}>{r.id}</td><td><SB stage={r.stage} small/></td><td style={{fontSize:11,whiteSpace:'nowrap'}}>{r.work_area||'—'}</td><td style={{fontSize:12,whiteSpace:'nowrap'}}>{fD(r.inspection_date)}</td><td style={{fontSize:12,whiteSpace:'nowrap'}}>{fD(r.submit_date)}</td><td className="num">{fmt(r.inspected_qty)}</td><td className="num" style={{color:mapStage(r.stage)>=FINAL_STAGE?'var(--green)':'var(--muted)'}}>{fmt(r.inspected_amount)}</td><td style={{fontSize:11,minWidth:100}}>{r.note||'—'}</td>
      <td style={{whiteSpace:'nowrap'}}>{r.folder_id&&<a href={'https://drive.google.com/drive/folders/'+r.folder_id} target="_blank" rel="noopener" title={r.folder_name||''} style={{fontSize:11,color:'var(--accent)',marginRight:5}}>📁</a>}{r.attachment_ids?.length>0?r.attachment_ids.map((fid,j)=><a key={fid} href={'https://drive.google.com/file/d/'+fid+'/view'} target="_blank" rel="noopener" style={{fontSize:10,color:'var(--accent)',marginRight:4}}>📎{j+1}</a>):(r.folder_id?'':'—')}</td>
      {auth&&<td><div style={{display:'flex',gap:4}}><button className="bg" style={{fontSize:10,padding:'3px 8px'}} onClick={()=>onEdit(r)}>編輯</button><button className="bd" style={{fontSize:10,padding:'3px 8px'}} onClick={()=>onDel(r.id,'此明細 '+r.id+'（'+shortItem(r.item_name_snapshot)+'）')}>刪除</button></div></td>}</tr>)}
    </tbody></table></div>}
  </div>;
}

/* ═══ MAIN APP ═══ */
function App(){
  const[auth,sAuth]=useState(false);
  const doLogin=()=>{sAuth(true);toast('已登入，可進行新增/編輯/刪除')};  const[data,sData]=useState(null);const[ss,sSs]=useState('idle');const[ls,sLs]=useState(null);
  const[pg,sPg]=useState('dash');const[ml,sMl]=useState(null);const[ts,sTs]=useState([]);const[openG,sOpenG]=useState({});
  /* ── 備註 ── */
  const NOTES_KEY='nmdc_insp_notes';
  const[notes,sNotes]=useState(()=>{try{return JSON.parse(localStorage.getItem(NOTES_KEY))||[]}catch{return[]}});
  const saveNotes=ns=>{sNotes(ns);localStorage.setItem(NOTES_KEY,JSON.stringify(ns))};
  const addNote=()=>{const n={id:Date.now(),date:td(),text:'',pinned:false,created:new Date().toISOString()};saveNotes([n,...notes])};
  const updNote=(id,upd)=>saveNotes(notes.map(n=>n.id===id?{...n,...upd}:n));
  const delNote=id=>{if(confirm('刪除此備註？'))saveNotes(notes.filter(n=>n.id!==id))};
  const sortedNotes=useMemo(()=>[...notes].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||b.id-a.id),[notes]);
  const[sub,sSub]=useState(false);const[logs,sLogs]=useState(null);
  const[fC,sFC]=useState('');const[fS,sFS]=useState('');const[fD1,sFD1]=useState('');const[fD2,sFD2]=useState('');
  const api=useRef(null);

  const toast=(m,t='ok')=>{const id=Date.now();sTs(x=>[...x,{id,m,t}]);setTimeout(()=>sTs(x=>x.filter(z=>z.id!==id)),4000)};

  /* 把一份 summary 套用到畫面（含階段正規化與本機快取） */
  const applySummary=useCallback((r,fromCache)=>{
    if(r&&Array.isArray(r.inspections))r.inspections=r.inspections.map(i=>({...i,stage:mapStage(i.stage)}));
    sData(r);sLs(new Date().toISOString());sSs('done');
    if(!fromCache)cacheSave(r);
  },[]);

  /* 開網頁就載入雲端資料（fresh=true 會略過後端快取） */
  const sync=useCallback(async(fresh)=>{
    if(!api.current)api.current=mkApi(DEFAULT_API);
    sSs('syncing');
    try{const r=await api.current.get('getSummary',fresh?{fresh:1}:{});applySummary(r)}
    catch(e){sSs('error');toast('同步失敗: '+e.message,'err')}
  },[applySummary]);

  /* 先吃本機快取立刻渲染，再於背景抓最新 */
  useEffect(()=>{

  },[]);

    const files=d.attachments||[];

    }

    if(r.summary&&files.length===0)applySummary(r.summary);else await sync();
  }catch(e){toast(e.message,'err')}finally{sSub(false)}};

  const updI=async(gid,d)=>{sSub(true);try{
    const files=d.attachments||[];
    const r=await api.current.post('updateInspection',{inspection_id:gid,inspection_no:d.inspection_no,work_area:d.work_area,inspection_date:d.inspection_date,submit_date:d.submit_date,note:d.note,stage:d.stage,link_folder_url:d.link_folder_url,items:d.items},files.length===0);

    if(files.length>0&&fid){
      for(let i=0;i<files.length;i++){
        try{toast('上傳附件 '+(i+1)+'/'+files.length+'...');await api.current.post('uploadToFolder',{folder_id:fid,inspection_id:newId,...files[i]})}
        catch(e){toast('附件'+(i+1)+'上傳失敗: '+e.message,'err')}

  }catch(e){toast(e.message,'err')}finally{sSub(false)}};

  const updStage=async(gid,stage)=>{try{const r=await api.current.post('updateInspection',{inspection_id:gid,stage},true);toast('☁ 階段已更新');if(r.summary)applySummary(r.summary);else await sync()}catch(e){toast(e.message,'err')}};

  const groups=useMemo(()=>Object.values(GR).sort((a,b)=>String(b.id).localeCompare(String(a.id))),[GR]);

  /* ── 依階段計算金額：stage 3（已提交台電）＝已查驗；1-2＝進行中 ── */

  const gS=b=>{const s=ST[b.id]||{qa:0,qo:0,aa:0,ao:0,n:0,no:0};const bt=parseFloat(b.budget_total)||0;const bq=parseFloat(b.budget_qty)||0;

  const okG=groups.filter(g=>g.stage>=FINAL_STAGE);

  const fGr=useMemo(()=>groups.filter(g=>{
    if(fC&&!g.rows.some(r=>bItem(r.budget_item_id)?.category===fC))return false;

    const d=String(g.inspection_date||'').slice(0,10);

  const clr=()=>{sFC('');sFS('');sFD1('');sFD2('')};

  const csv=()=>{if(!data)return;const rows=[['查驗表編號','明細編號','階段','工區','查驗日期','提交台電日','項次','項目','項目簡稱','數量','單價','金額','計入已查驗','資料夾名稱','備註']];

      rows.push([g.id,i.id,g.stage+'. '+STAGES[g.stage-1].l,g.work_area||'',String(i.inspection_date||'').slice(0,10),String(g.submit_date||'').slice(0,10),b?.item_no||'',i.item_name_snapshot,shortItem(i.item_name_snapshot),i.inspected_qty,i.unit_price_snapshot,amtOf(i),g.stage>=FINAL_STAGE?'是':'否',g.folder_name||folderName(g.id,g.work_area,g.items),i.note||''])}));
    const c=rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const bl=new Blob(['﻿'+c],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(bl);

  const TL=<div className="tw">{ts.map(t=><div key={t.id} className="toast" style={{background:t.t==='err'?'var(--redBg)':'var(--greenBg)',color:t.t==='err'?'var(--red)':'var(--green)',borderColor:t.t==='err'?'rgba(248,113,113,.4)':'rgba(52,211,153,.4)'}}>{t.m}</div>)}</div>;

  /* 首次載入中 */
  if(!data&&ss==='syncing')return<div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh'}}>{TL}<div style={{textAlign:'center'}}><div className="spinner" style={{width:28,height:28,marginBottom:16}}/><div style={{fontSize:14,fontWeight:600,color:'var(--fg)'}}>從 Google Sheets 載入資料...</div></div></div>;

  const nav=[{k:'dash',i:'📊',l:'Dashboard'},{k:'sum',i:'📋',l:'查驗總表'},{k:'rec',i:'📝',l:'查驗紀錄'},{k:'log',i:'📜',l:'操作日誌'},{k:'set',i:'⚙️',l:'設定'},{k:'notes',i:'📒',l:'備註'}];
  const SyncBtn=<button className="bg" disabled={ss==='syncing'} onClick={()=>sync(true)} title="略過快取，從 Google Sheets 讀取最新資料">{ss==='syncing'?<span className="spinner"/>:'☁↓'} 從雲端同步</button>;

  return<div style={{display:'flex',minHeight:'100vh'}}>
    {TL}

    <nav className="sidebar" style={{width:228,background:'var(--card)',borderRight:'1px solid var(--border)',padding:'20px 14px',flexShrink:0,display:'flex',flexDirection:'column',gap:2,position:'sticky',top:0,height:'100vh',overflowY:'auto',boxShadow:'1px 0 4px rgba(0,0,0,.03)'}}>
      <div style={{padding:'4px 12px 18px',borderBottom:'1px solid var(--border)',marginBottom:10}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><div style={{width:28,height:28,borderRadius:8,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,color:'#fff',fontWeight:800}}>N</div><div style={{fontSize:14,fontWeight:800,color:'var(--accent)',letterSpacing:.5}}>NMDC EHS</div></div>
        <div style={{fontSize:10,color:'var(--muted)',lineHeight:1.4}}>通霄二期 · 查驗管理</div>
        <div style={{marginTop:8}}><Cloud s={ss==='syncing'?'syncing':'ok'} t={ls}/></div>
      </div>
      {nav.filter(n=>n.k!=='notes').map(n=><div key={n.k} onClick={()=>chP(n.k)} className={'navi'+(pg===n.k?' on':'')}><span style={{fontSize:14}}>{n.i}</span>{n.l}</div>)}
      <div style={{flex:1}}/>
      {/* 備註固定在最下面 */}

      </div>
    </div>}

    {/* ═══ SUMMARY ═══ */}
    {pg==='sum'&&<div className="fi">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}><h1 style={{fontSize:24,fontWeight:800}}>查驗總表</h1><Cloud s={ss==='syncing'?'syncing':'ok'} t={ls}/></div>
        <div style={{display:'flex',gap:8}}>{SyncBtn}{auth&&<button className="bp" onClick={()=>sMl({t:'add'})}>＋ 新增</button>}</div>
      </div>
      <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}><select value={fC} onChange={e=>sFC(e.target.value)} style={{width:150}}><option value="">全部類別</option>{cats.map(c=><option key={c} value={c}>{c}</option>)}</select><input placeholder="搜尋項次/名稱..." value={fS} onChange={e=>sFS(e.target.value)} style={{width:240}}/></div>
      <div style={{overflowX:'auto',background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',boxShadow:'var(--shadow)'}}>
        <table className="tbl-wide"><thead><tr>{['項次','類別','項目名稱','單位'].map(h=><th key={h}>{h}</th>)}{['預算數量','單價','預算總價','已查驗金額 (已提交台電)','進行中金額 (自檢／POE)','未查驗金額'].map(h=><th key={h} style={{textAlign:'right'}}>{h}</th>)}{['進度','狀態',''].map(h=><th key={h}>{h}</th>)}</tr></thead>
        <tbody>{fSm.map(s=>{const g=gS(s);return<tr key={s.id}>
          <td style={{fontWeight:700,color:'var(--accent)',fontSize:12,fontFamily:"'JetBrains Mono'"}}>{s.item_no}</td>
          <td><span className="tag" style={{background:'rgba(95,168,181,.14)',color:'var(--accent)'}}>{s.category}</span></td>
          <td style={{minWidth:180,fontSize:12}}><div style={{fontWeight:600}}><EC val={s.item_name_cn} field="item_name_cn" id={s.id} onSave={updBudget} ok={auth}/></div><div style={{fontSize:10,color:'var(--muted)'}}><EC val={s.item_name_en} field="item_name_en" id={s.id} onSave={updBudget} ok={auth}/></div></td>
          <td style={{fontSize:11}}><EC val={s.unit} field="unit" id={s.id} onSave={updBudget} ok={auth}/></td>
          <td className="num"><EC val={s.budget_qty} field="budget_qty" id={s.id} onSave={(id,d)=>{d.budget_total=parseFloat(d.budget_qty||0)*s.unit_price;updBudget(id,d)}} ok={auth} isN/></td>
          <td className="num"><EC val={s.unit_price} field="unit_price" id={s.id} onSave={(id,d)=>{d.budget_total=s.budget_qty*parseFloat(d.unit_price||0);updBudget(id,d)}} ok={auth} isN/></td>
          <td className="num" style={{fontWeight:600}}>{fmt(s.budget_total)}</td>
          <td className="num" style={{color:'var(--green)',fontWeight:600}}>{fmt(g.ao)}</td>
          <td className="num" style={{color:g.ap>0?'#0ea5e9':'var(--muted)'}}>{g.ap>0?fmt(g.ap):'—'}</td>
          <td className="num" style={{color:'var(--amber)'}}>{fmt(g.ra)}</td>
          <td><div className="pt" style={{width:64}}><div className="pf" style={{width:Math.min(g.ratio*100,100)+'%',background:g.ratio>=1?'var(--green)':g.ratio>0?'var(--accent)':'transparent'}}/></div><div style={{fontSize:10,marginTop:2,fontFamily:"'JetBrains Mono'"}}>{fP(g.ratio)}</div></td>
          <td><Dot r={g.ratio}/></td>
          <td><button className="bg" style={{fontSize:11,padding:'4px 10px'}} onClick={()=>sMl({t:'item',p:s})}>查看</button></td>
        </tr>})}</tbody>
        <tfoot><tr style={{fontWeight:700,background:'var(--bg2)'}}><td colSpan={6} style={{textAlign:'right',color:'var(--muted)'}}>合計</td><td className="num">{fmt(fSm.reduce((s,b)=>s+(parseFloat(b.budget_total)||0),0))}</td><td className="num" style={{color:'var(--green)'}}>{fmt(fSm.reduce((s,b)=>s+gS(b).ao,0))}</td><td className="num" style={{color:'#0ea5e9'}}>{fmt(fSm.reduce((s,b)=>s+gS(b).ap,0))}</td><td className="num" style={{color:'var(--amber)'}}>{fmt(fSm.reduce((s,b)=>s+gS(b).ra,0))}</td><td colSpan={3}/></tr></tfoot></table>
      </div>
    </div>}

    {/* ═══ RECORDS（以查驗表為單位） ═══ */}
    {pg==='rec'&&<div className="fi">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18,flexWrap:'wrap',gap:12}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}><h1 style={{fontSize:24,fontWeight:700,color:'var(--fg2)'}}>查驗紀錄</h1><Cloud s={ss==='syncing'?'syncing':'ok'} t={ls}/></div>
        <div style={{display:'flex',gap:8}}>{SyncBtn}<button className="bg" onClick={csv}>📥 CSV</button>{auth&&<button className="bp" onClick={()=>sMl({t:'add'})}>＋ 新增查驗表</button>}</div>
      </div>
      <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}><select value={fC} onChange={e=>sFC(e.target.value)} style={{width:150}}><option value="">全部類別</option>{cats.map(c=><option key={c} value={c}>{c}</option>)}</select><input placeholder="搜尋編號/項目/工區..." value={fS} onChange={e=>sFS(e.target.value)} style={{width:220}}/><input type="date" value={fD1} onChange={e=>sFD1(e.target.value)} style={{width:150}}/><span style={{alignSelf:'center',color:'var(--muted)',fontSize:12}}>～</span><input type="date" value={fD2} onChange={e=>sFD2(e.target.value)} style={{width:150}}/>{(fC||fS||fD1||fD2)&&<button className="bg" onClick={clr} style={{fontSize:11}}>✕ 清除</button>}</div>

      {fGr.length===0?<div className="card" style={{padding:56,textAlign:'center',color:'var(--muted)'}}>{groups.length===0?'尚無查驗表':'無符合條件'}</div>
      :<div style={{display:'flex',flexDirection:'column',gap:10}}>
        {fGr.map(g=>{
          const open=!!openG[g.id];
          return<div key={g.id} className="card" style={{padding:0}}>
            <div onClick={()=>sOpenG(p=>({...p,[g.id]:!p[g.id]}))} style={{display:'flex',alignItems:'center',gap:14,padding:'14px 18px',cursor:'pointer',flexWrap:'wrap'}}>
              <span style={{color:'var(--muted2)',fontSize:11,width:10}}>{open?'▾':'▸'}</span>
              <div style={{minWidth:180}}>
                <div className="mono" style={{color:'var(--accent)',fontSize:12,fontWeight:600}}>{g.id}</div>
                <div style={{fontSize:10.5,color:'var(--muted2)',marginTop:2}}>{g.work_area||'—'} · {fD(g.inspection_date)}{g.submit_date?' · 提交 '+fD(g.submit_date):''}</div>
              </div>
              <div style={{flex:'1 1 220px',minWidth:180,fontSize:12}}>
                <div style={{color:'var(--fg2)'}}>{itemsLabel(g.items)||'—'}</div>
                <div style={{fontSize:10.5,color:'var(--muted2)',marginTop:2}}>{g.rows.length} 個項目</div>
              </div>
              <div onClick={e=>{e.stopPropagation();if(auth&&g.stage<FINAL_STAGE)updStage(g.id,g.stage+1)}} title={auth&&g.stage<FINAL_STAGE?'點擊推進到下一階段':''} style={{cursor:auth&&g.stage<FINAL_STAGE?'pointer':'default'}}>
                <SB stage={g.stage}/>{auth&&g.stage<FINAL_STAGE&&<span style={{fontSize:10,color:'var(--muted2)',marginLeft:5}}>▶</span>}
              </div>
              <div style={{textAlign:'right',minWidth:130}}>
                <div style={{fontSize:16,fontWeight:800,fontFamily:"'JetBrains Mono'",color:g.stage>=FINAL_STAGE?'var(--green)':'var(--muted)'}}>{fN(g.amount)}</div>
                <div style={{fontSize:9.5,color:'var(--muted2)'}}>{g.stage>=FINAL_STAGE?'已計入已查驗':'尚未計入'}</div>
              </div>
              <div style={{display:'flex',gap:5,alignItems:'center'}} onClick={e=>e.stopPropagation()}>
                {g.folder_id&&<a href={'https://drive.google.com/drive/folders/'+g.folder_id} target="_blank" rel="noopener" title={g.folder_name||''} style={{fontSize:14,textDecoration:'none'}}>📁</a>}
                {g.attachment_ids.length>0&&<span style={{fontSize:10.5,color:'var(--muted)'}}>📎{g.attachment_ids.length}</span>}
                {auth&&<><button className="bg" style={{fontSize:10,padding:'3px 9px'}} onClick={()=>openEdit(g)}>編輯</button>
                <button className="bd" style={{fontSize:10,padding:'3px 9px'}} onClick={()=>delI(g.id,'整張查驗表 '+g.id+'（'+g.rows.length+' 個項目）')}>刪除</button></>}
              </div>
            </div>
            {open&&<div style={{borderTop:'1px solid var(--border)',padding:'4px 18px 12px',overflowX:'auto'}}>
              <table><thead><tr>{['明細編號','項次','項目'].map(h=><th key={h}>{h}</th>)}{['數量','單價','金額'].map(h=><th key={h} style={{textAlign:'right'}}>{h}</th>)}<th>備註</th>{auth&&<th></th>}</tr></thead>
              <tbody>{g.rows.map(r=>{const b=bItem(r.budget_item_id);return<tr key={r.id}>
                <td className="mono" style={{fontSize:10.5,color:'var(--muted)'}}>{r.id}</td>
                <td style={{fontWeight:600,color:'var(--accent)',fontSize:11.5}}>{b?.item_no}</td>
                <td style={{fontSize:12,minWidth:150}}>{r.item_name_snapshot}<div style={{fontSize:10,color:'var(--muted2)'}}>{shortItem(r.item_name_snapshot)}</div></td>
                <td className="num">{isLS(b)?fP(r.inspected_qty):fmt(r.inspected_qty)}</td>
                <td className="num" style={{color:'var(--muted)'}}>{fmt(r.unit_price_snapshot)}</td>
                <td className="num" style={{fontWeight:600,color:g.stage>=FINAL_STAGE?'var(--green)':'var(--muted)'}}>{fmt(amtOf(r))}</td>
                <td style={{fontSize:11,color:'var(--muted)'}}>{r.note||'—'}</td>
                {auth&&<td style={{textAlign:'right'}}>{g.rows.length>1&&<button className="bd" style={{fontSize:9.5,padding:'2px 7px'}} onClick={()=>delI(r.id,'此明細（'+shortItem(r.item_name_snapshot)+'）')}>移除</button>}</td>}
              </tr>})}</tbody>
              <tfoot><tr><td colSpan={5} style={{textAlign:'right',color:'var(--muted)',fontWeight:600}}>本表合計</td><td className="num" style={{fontWeight:800,color:'var(--fg2)'}}>{fmt(g.amount)}</td><td colSpan={auth?2:1}/></tr></tfoot></table>
              {g.attachment_ids.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:10}}>{g.attachment_ids.map((fid,j)=><a key={fid} href={'https://drive.google.com/file/d/'+fid+'/view'} target="_blank" rel="noopener" style={{fontSize:10.5,color:'var(--accent)',textDecoration:'none',background:'rgba(255,255,255,.03)',padding:'3px 9px',borderRadius:5,border:'1px solid var(--border)'}}>📎 {g.attachment_names[j]||fid}</a>)}</div>}
            </div>}
          </div>;
        })}
      </div>}
      <div style={{marginTop:12,fontSize:11,color:'var(--muted)'}}>顯示 {fGr.length} 張查驗表（{fGr.reduce((s,g)=>s+g.rows.length,0)} 個項目） · 合計 {fN(fGr.reduce((s,g)=>s+g.amount,0))} · <span style={{color:'var(--green)',fontWeight:600}}>已查驗 {fN(fGr.filter(g=>g.stage>=FINAL_STAGE).reduce((s,g)=>s+g.amount,0))}</span></div>
    </div>}

    {/* ═══ LOGS ═══ */}
    {pg==='log'&&<div className="fi">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}><h1 style={{fontSize:24,fontWeight:800}}>操作日誌</h1><button className="bg" onClick={ldLogs}>☁↓ 從雲端同步</button></div>
      <div style={{overflowX:'auto',background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',boxShadow:'var(--shadow)'}}>
        <table><thead><tr>{['時間','操作','對象','說明','操作者'].map(h=><th key={h}>{h}</th>)}</tr></thead>
        <tbody>{!logs?<tr><td colSpan={5} style={{textAlign:'center',padding:48,color:'var(--muted)'}}><span className="spinner"/> 載入中</td></tr>
        :logs.length===0?<tr><td colSpan={5} style={{textAlign:'center',padding:48,color:'var(--muted)'}}>尚無日誌</td></tr>
        :logs.map(l=><tr key={l.id}><td style={{fontSize:11,whiteSpace:'nowrap'}}>{fD(l.timestamp)}</td><td><span className="tag" style={{background:l.action==='CREATE'?'var(--greenBg)':l.action==='DELETE'?'var(--redBg)':'#eff6ff',color:l.action==='CREATE'?'var(--green)':l.action==='DELETE'?'var(--red)':'var(--accent)'}}>{l.action}</span></td><td style={{fontSize:11}}>{l.target}</td><td style={{fontSize:12}}>{l.detail}</td><td style={{fontSize:11}}>{l.action_by}</td></tr>)}</tbody></table>
      </div>
    </div>}

    {/* ═══ SETTINGS ═══ */}
    {pg==='set'&&<div className="fi">
      <h1 style={{fontSize:24,fontWeight:800,marginBottom:18}}>系統設定</h1>
      <div style={{display:'grid',gap:18,maxWidth:640}}>
        <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:24,boxShadow:'var(--shadow)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><h3 style={{fontSize:14,fontWeight:700}}>☁ 雲端連線</h3><Cloud s="ok" t={ls}/></div>
          <div style={{fontSize:12,color:'var(--muted)',marginBottom:12,lineHeight:1.8}}>
            <strong>「☁↓ 從雲端同步」</strong> = 從 Google Sheets 讀取最新資料<br/>
            <strong>新增/編輯/刪除操作</strong> = 即時儲存至 Google Sheets（無需手動儲存）
          </div>
          <button className="bg" onClick={()=>sync(true)}>☁↓ 從雲端同步</button>
        </div>
        {data?.drive_folder_id&&<div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:24,boxShadow:'var(--shadow)'}}><h3 style={{fontSize:14,fontWeight:700,marginBottom:14}}>📁 Google Drive 附件</h3><a href={'https://drive.google.com/drive/folders/'+data.drive_folder_id} target="_blank" rel="noopener" style={{color:'var(--accent)',fontSize:13}}>🔗 開啟附件資料夾</a><div style={{fontSize:11,color:'var(--muted)',marginTop:6,lineHeight:1.7}}>子資料夾名稱格式：<strong className="mono">查驗編號 工區 項目</strong><br/>例：<span className="mono">NMDC-POE-BOQ-E-012 A區 水質監測</span><br/>「項目」＝預算項目名稱最後一個「，」之後的文字；同編號的舊資料夾會自動連結，不會重複建立。</div></div>}
        {auth&&<div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:24,boxShadow:'var(--shadow)'}}>
          <h3 style={{fontSize:14,fontWeight:700,marginBottom:14}}>📥 匯入/更新預算項目</h3>
          <div style={{fontSize:12,color:'var(--muted)',marginBottom:12,lineHeight:1.8}}>上傳 Excel (.xlsx) 來更新預算數量、單價、金額。<br/>以 <strong>budget_item_id</strong> 比對：有的更新、沒有的新增。</div>
          <input type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} id="budgetFile" onChange={async e=>{const file=e.target.files[0];if(!file)return;toast('載入 Excel 元件...');try{const XL=await loadXLSX();toast('解析 Excel...');const ab=await file.arrayBuffer();const wb=XL.read(ab);const wsN=wb.SheetNames.find(n=>n.includes('預算'))||wb.SheetNames[0];const rows=XL.utils.sheet_to_json(wb.Sheets[wsN]);if(!rows.length){toast('無資料','err');return}const items=rows.map(r=>({budget_item_id:r.budget_item_id||'',item_no:r.item_no||'',category:r.category||'',category_en:r.category_en||'',item_name_cn:r.item_name_cn||'',item_name_en:r.item_name_en||'',unit:r.unit||'',budget_qty:r.budget_qty||0,unit_price:r.unit_price||0,budget_total:r.budget_total||0,remarks:r.remarks||'',code:r.code||''})).filter(i=>i.budget_item_id);if(!items.length){toast('需要 budget_item_id 欄位','err');return}if(confirm('匯入 '+items.length+' 筆？'))await importBudget(items)}catch(err){toast('失敗: '+err.message,'err')}e.target.value=''}}/>
          <button className="bp" onClick={()=>document.getElementById('budgetFile')?.click()} disabled={sub}>{sub?<><span className="spinner"/> 匯入中...</>:'📥 選擇 Excel 匯入'}</button>
          <div style={{fontSize:10,color:'var(--muted)',marginTop:6}}>支援 .xlsx / .xls / .csv</div>
        </div>}
        <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:24,boxShadow:'var(--shadow)'}}>
          <h3 style={{fontSize:14,fontWeight:700,marginBottom:14}}>系統資訊</h3>
          <div style={{fontSize:12,color:'var(--muted)',lineHeight:2.2,display:'grid',gridTemplateColumns:'100px 1fr',gap:'2px 12px'}}>
            <span>登入狀態:</span><strong style={{color:auth?'var(--green)':'var(--muted)'}}>{auth?'✅ 已登入（可編輯）':'🔒 檢視模式'}</strong>
            <span>資料:</span><strong style={{color:'var(--green)'}}>☁ Google Sheets</strong>
            <span>附件:</span><strong style={{color:'var(--green)'}}>☁ Google Drive</strong>
            <span>預算項目:</span><strong>{sm.length} 項</strong>
            <span>查驗紀錄:</span><strong>{ins.length} 筆</strong>
            <span>總預算:</span><strong>{fN(TT.tb)}</strong>
            <span>已查驗:</span><strong style={{color:'var(--green)'}}>{fN(TT.to)} ({fP(TT.ratio)})</strong>
            <span>版本:</span><strong>v{VER}</strong>
          </div>
        </div>
      </div>
    </div>}
    </main>

    {/* ═══ LOGIN MODAL ═══ */}
    {/* ═══ CRUD MODALS ═══ */}
    <Mdl open={ml?.t==='add'} close={()=>sMl(null)} wide title="新增查驗表"><Form bi={sm} ins={ins} onOk={addI} onNo={()=>sMl(null)} ld={sub} api={api.current}/></Mdl>
    <Mdl open={ml?.t==='addfor'} close={()=>sMl(null)} wide title={'新增查驗表 — '+(ml?.p?.item_no||'')}>{ml?.p&&<Form bi={sm} ins={ins} fixId={ml.p.id} onOk={addI} onNo={()=>sMl(null)} ld={sub} api={api.current}/>}</Mdl>
    <Mdl open={ml?.t==='edit'} close={()=>sMl(null)} wide title={'編輯查驗表 '+(ml?.p?.id||'')}>{ml?.p&&<Form bi={sm} ins={ins} init={ml.p} onOk={d=>updI(ml.p.id,d)} onNo={()=>sMl(null)} ld={sub} api={api.current}/>}</Mdl>
    <Mdl open={ml?.t==='item'} close={()=>sMl(null)} wide title={ml?.p?ml.p.item_no+' — '+ml.p.item_name_cn:''}>{ml?.p&&<Detail item={ml.p} ins={ins} auth={auth} onAdd={()=>sMl({t:'addfor',p:ml.p})} onEdit={i=>{const g=grpOfRow(i);if(g)sMl({t:'edit',p:g})}} onDel={(id,label)=>delI(id,label)}/>}</Mdl>
  </div>;
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
